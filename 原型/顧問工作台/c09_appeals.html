<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申訴覆核｜TLI Hub 管理後台</title>
<style>
:root{
  --primary:#1B4E8C;--primary-light:#e8f0fa;--accent:#E8792B;--accent-light:#fdf0e6;
  --secondary:#0F9B79;--secondary-light:#e6f5f1;--danger:#D92D20;--danger-light:#fdece9;
  --gray-25:#FCFCFD;--gray-50:#F5F7FA;--gray-100:#F0F2F5;--gray-200:#E4E7EC;--gray-300:#D0D5DD;
  --gray-500:#667085;--gray-700:#344054;--gray-900:#101828;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;color:var(--gray-900);background:var(--gray-50);display:flex;flex-direction:column;min-height:100vh;}
a{color:inherit;text-decoration:none;}
.shell{display:flex;flex:1;min-height:0;width:100%;max-width:1440px;margin:0 auto;background:#fff;box-shadow:0 0 0 1px var(--gray-200);}
.icon{display:inline-block;flex-shrink:0;vertical-align:-3px;}
.kicker{font-size:11px;font-weight:700;color:var(--primary);margin-bottom:4px;letter-spacing:.02em;}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
main{flex:1;padding:20px 28px 40px;overflow-y:auto;}
h1.page-title{font-size:20px;margin:0 0 4px;}
.page-sub{font-size:13px;color:var(--gray-500);margin:0 0 18px;}
.card,.panel{background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:18px 20px;margin-bottom:18px;overflow-x:auto;max-width:100%;}
.hidden{display:none!important;}
.card h2{font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.card h2 .cnt{background:var(--gray-100);color:var(--gray-700);font-size:12px;padding:1px 8px;border-radius:999px;font-weight:400;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--gray-500);font-weight:500;font-size:12px;padding:8px 8px;border-bottom:1px solid var(--gray-200);white-space:nowrap;}
td{padding:9px 8px;border-bottom:1px solid var(--gray-100);vertical-align:middle;white-space:nowrap;}
tr.clickable{cursor:pointer;}
tr.clickable:hover{background:var(--gray-50);}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.badge.b{background:#e8f0fa;color:var(--primary);}
.badge.c{background:#fdf0e6;color:var(--accent);}
.badge.warn{background:#fff4e5;color:#b54708;}
.badge.danger{background:var(--danger-light);color:var(--danger);}
.badge.ok{background:var(--secondary-light);color:var(--secondary);}
.badge.muted{background:var(--gray-100);color:var(--gray-500);}
.demo-tag{font-size:10.5px;font-weight:400;color:var(--gray-500);background:var(--gray-50);border:1px solid var(--gray-200);border-radius:999px;padding:1px 8px;margin-left:8px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--gray-300);background:#fff;font-size:12.5px;font-family:inherit;cursor:pointer;color:var(--gray-700);}
.btn:hover{background:var(--gray-50);}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn.primary:hover{background:#163f70;}
.btn.danger{background:#fff;border-color:var(--danger);color:var(--danger);}
.btn.danger:hover{background:var(--danger-light);}
.btn.sm{padding:4px 10px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:default;}
.empty{color:var(--gray-500);font-size:12.5px;padding:20px 0;text-align:center;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--gray-900);color:#fff;padding:10px 18px;border-radius:8px;font-size:12.5px;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:600;opacity:0;pointer-events:none;transition:opacity .2s;white-space:pre-line;max-width:440px;text-align:left;}
.toast.show{opacity:1;}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px;}
.kpi-card{background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:16px 18px;}
.kpi-card .kpi-label{font-size:12px;color:var(--gray-500);margin-bottom:8px;}
.kpi-card .kpi-value{font-size:27px;font-weight:700;color:var(--gray-900);line-height:1;}
.kpi-card .kpi-value.danger{color:var(--danger);}
.kpi-card .kpi-sub{font-size:11px;color:var(--gray-500);margin-top:6px;line-height:1.5;}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px;}
.filters input[type=text]{flex:1;min-width:220px;padding:8px 10px;border:1px solid var(--gray-200);border-radius:8px;font-size:12.5px;font-family:inherit;}
.filters select,.filters input[type=date]{padding:7px 8px;border:1px solid var(--gray-200);border-radius:8px;font-size:12.5px;font-family:inherit;background:#fff;color:var(--gray-900);}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0;}
.chiprow .glabel{font-size:11px;color:var(--gray-500);margin-right:2px;}
.fchip{padding:5px 12px;border-radius:14px;border:1px solid var(--gray-200);background:#fff;font-size:12px;cursor:pointer;font-family:inherit;color:var(--gray-600);}
.fchip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.toolbar-row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-100);}
.batchbar{display:none;align-items:center;gap:10px;background:#EEF3FA;border:1px solid #c7d3e6;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12.5px;flex-wrap:wrap;}
.batchbar.show{display:flex;}
.batchbar .bcount{font-weight:700;color:var(--primary);}
.batchbar select{padding:5px 7px;border:1px solid var(--gray-200);border-radius:6px;font-size:12px;font-family:inherit;}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12.5px;color:var(--gray-600);flex-wrap:wrap;}
.pager .pbtns{display:flex;gap:4px;flex-wrap:wrap;}
.pager button{padding:5px 10px;border:1px solid var(--gray-200);background:#fff;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--gray-700);}
.pager button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.pager button:disabled{opacity:.4;cursor:default;}
td.sla-overdue{color:var(--danger);font-weight:700;}
td.sla-ok{color:var(--gray-700);}
input.rowchk{width:15px;height:15px;cursor:pointer;}

.drawer-mask{display:none;position:fixed;inset:0;background:rgba(16,24,40,.38);z-index:520;}
.drawer-mask.open{display:block;}
.idrawer{position:fixed;top:0;right:0;height:100vh;width:680px;max-width:94vw;background:#fff;box-shadow:-8px 0 24px rgba(16,24,40,.18);z-index:521;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;}
.idrawer.open{transform:translateX(0);}
.drawer-head{padding:18px 24px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0;gap:10px;}
.drawer-head h2{font-size:16px;margin:0 0 6px;}
.drawer-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--gray-500);line-height:1;padding:2px 6px;flex-shrink:0;}
.drawer-close:hover{color:var(--gray-900);}
.drawer-body{flex:1;overflow-y:auto;padding:18px 24px 50px;}
.dsection{margin-bottom:22px;}
.dsection h3{font-size:12px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em;margin:0 0 10px;font-weight:700;}
.dfield{display:flex;gap:6px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--gray-100);}
.dfield .dl{width:112px;flex-shrink:0;color:var(--gray-500);}
.dfield .dv{flex:1;color:var(--gray-900);}
.ai-summary-box{background:#f3e8fd;border:1px solid #d9c2f5;border-radius:8px;padding:11px 13px;font-size:12.5px;line-height:1.65;color:#5b2a99;}
.timeline{list-style:none;margin:0;padding:0;}
.timeline li{position:relative;padding:0 0 16px 20px;border-left:2px solid var(--gray-200);font-size:12.5px;}
.timeline li:last-child{border-color:transparent;padding-bottom:0;}
.timeline li::before{content:'';position:absolute;left:-5px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--primary);}
.timeline .tl-time{color:var(--gray-500);font-size:11px;margin-bottom:2px;}
.actionbar{display:flex;gap:8px;flex-wrap:wrap;}
.inline-form{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:13px;margin-top:10px;display:none;}
.inline-form.open{display:block;}
.inline-form label{display:block;font-size:11.5px;color:var(--gray-500);margin:8px 0 3px;}
.inline-form label:first-child{margin-top:0;}
.inline-form select,.inline-form input,.inline-form textarea{width:100%;padding:7px 9px;border:1px solid var(--gray-300);border-radius:6px;font-size:12.5px;font-family:inherit;}
.inline-form textarea{min-height:64px;resize:vertical;}
.inline-form .iform-btns{display:flex;gap:8px;margin-top:10px;}
.feedback-box textarea{width:100%;min-height:70px;padding:8px 10px;border:1px solid var(--gray-300);border-radius:6px;font-size:12.5px;font-family:inherit;resize:vertical;}
/* ==== v2 新增：共用 modal 樣式 ==== */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:600;align-items:center;justify-content:center;}
.modal-mask.open{display:flex;}
.modal{background:#fff;border-radius:12px;width:460px;max-width:92vw;max-height:85vh;overflow:auto;padding:22px;}
.modal h3{font-size:15px;margin:0 0 4px;}
.modal .modal-sub{font-size:12px;color:var(--gray-500);margin:0 0 16px;}
.modal .field{margin-bottom:12px;}
.modal .field label{display:block;font-size:12px;color:var(--gray-700);margin-bottom:5px;font-weight:500;}
.modal .field .hint{font-size:11.5px;color:var(--gray-500);margin-top:4px;}
.modal input,.modal select,.modal textarea{width:100%;padding:7px 9px;border:1px solid var(--gray-300);border-radius:7px;font-size:12.5px;font-family:inherit;}
.seed-list{display:flex;flex-direction:column;gap:6px;border:1px solid var(--gray-200);border-radius:8px;padding:10px;max-height:150px;overflow-y:auto;}
.seed-list label{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:400;margin:0;}
.badge.b2b{background:#f3e8fd;color:#7a3ed9;}
.badge.trial{background:#fff4e5;color:#b54708;}

.ai-panel{width:340px;flex:0 0 340px;border-left:1px solid var(--gray-200);display:flex;flex-direction:column;background:#fbfbfd;transition:flex-basis .15s,width .15s;}
.ai-panel.collapsed{width:44px;flex:0 0 44px;}
.ai-head{padding:14px 16px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;}
.ai-panel.collapsed .ai-head span,.ai-panel.collapsed .ai-body,.ai-panel.collapsed .ai-quick,.ai-panel.collapsed .ai-input{display:none;}
.ai-head b{font-size:13px;}
.ai-toggle{background:none;border:none;cursor:pointer;font-size:16px;color:var(--gray-500);}
.ai-body{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 16px;overflow-y:auto;gap:10px;}
.ai-msg{font-size:12.5px;line-height:1.6;padding:10px 12px;border-radius:10px;max-width:94%;white-space:normal;}
.ai-msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-radius:10px 10px 2px 10px;}
.ai-msg.bot{align-self:flex-start;background:var(--gray-100);color:var(--gray-900);border-radius:10px 10px 10px 2px;}
.ai-msg .src{margin-top:6px;font-size:11px;color:var(--gray-500);border-top:1px dashed var(--gray-300);padding-top:6px;}
.ai-msg .act{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.ai-quick{display:flex;flex-direction:column;gap:6px;padding:0 16px 10px;min-width:280px;}
.ai-quick button{text-align:left;font-size:11.5px;padding:6px 10px;border:1px solid var(--gray-200);border-radius:8px;background:#fff;cursor:pointer;color:var(--gray-700);}
.ai-quick button:hover{border-color:var(--primary);color:var(--primary);}
.ai-input{display:flex;gap:6px;padding:12px 16px;border-top:1px solid var(--gray-200);min-width:280px;}
.ai-input input{flex:1;padding:8px 10px;border:1px solid var(--gray-300);border-radius:8px;font-size:12.5px;font-family:inherit;}
.ai-fab-btn{display:none;position:relative;background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--gray-600);}
.ai-fab-btn:hover{background:var(--gray-50);}
.ai-fab-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--secondary);border:1.5px solid #fff;}
.ai-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:440;}
.ai-backdrop.open{display:block;}
@media (max-width:1439px){
  .ai-panel{position:fixed;top:56px;right:0;bottom:0;width:360px;flex:0 0 auto;transform:translateX(100%);z-index:450;box-shadow:-8px 0 24px rgba(0,0,0,.14);}
  .ai-panel.collapsed{width:360px;transform:translateX(100%);}
  .ai-panel.open{transform:translateX(0);}
  .ai-fab-btn{display:flex;}
}
@media (max-width:1023px){
  .ai-panel{top:auto;left:0;right:0;bottom:0;width:100%;height:80vh;transform:translateY(100%);box-shadow:0 -8px 24px rgba(0,0,0,.14);border-left:none;border-top:1px solid var(--gray-200);border-radius:14px 14px 0 0;}
  .ai-panel.collapsed{width:100%;transform:translateY(100%);}
  .ai-panel.open{transform:translateY(0);}
  .idrawer{width:100%;max-width:100%;}
}

:root{--navy:#1B4E8C;--orange:#E8792B;--teal:#0F9B79;--g50:#F5F7FA;--g200:#E4E7EC;--g500:#667085;--g900:#101828;}
.shell{display:flex;min-height:100vh;width:100%;background:#fff;}
.sidebar{width:260px;flex-shrink:0;background:#fff;color:var(--g900);padding:18px 0;
border-right:1px solid var(--g200);display:flex;flex-direction:column;transition:width .15s;
position:sticky;top:0;height:100vh;align-self:flex-start;}
.sidebar .brand{padding:0 20px 14px;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:4px;
border-bottom:1px solid var(--g200);margin-bottom:6px;text-decoration:none;color:inherit;cursor:pointer;}
.sidebar .brand-logo{height:28px;width:auto;display:block;}
.sidebar .brand small{display:block;font-weight:400;font-size:12px;color:var(--g500);margin-top:0;text-transform:uppercase;letter-spacing:.04em;}
.sidebar nav{flex:1 1 auto;overflow-y:auto;}
.sidebar nav a,.sidebar nav span.disabled{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13.5px;
color:var(--g900);text-decoration:none;position:relative;}
.sidebar nav a .navicon{flex-shrink:0;color:var(--g500);}
.sidebar nav a:hover{background:var(--g50);}
.sidebar nav a.active{background:#E6EEF8;color:var(--navy);font-weight:600;}
.sidebar nav a.active .navicon{color:var(--navy);}
.sidebar .sec-label{padding:16px 20px 4px;font-size:10.5px;color:var(--g500);letter-spacing:.08em;text-transform:uppercase;font-weight:600;}
.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;display:flex;align-items:center;gap:10px;position:relative;}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.4;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-role{font-size:11px;color:var(--g500);}
.sidebar .su-logout{display:block;margin:6px 20px 4px;font-size:12px;color:var(--navy);text-decoration:none;}
.sidebar .su-logout:hover{text-decoration:underline;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;
border-bottom:1px solid var(--g200);position:sticky;top:0;background:#fff;z-index:40;margin:-26px 0 22px;gap:14px;}
.hamburger{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:var(--g900);padding:4px 6px;margin-right:4px;}
.topbar .tb-title{font-size:15px;font-weight:600;color:var(--g900);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .tb-actions{display:flex;align-items:center;gap:14px;position:relative;flex-shrink:0;}
.tb-search{display:flex;align-items:center;gap:6px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;
padding:6px 10px;width:180px;}
.tb-search input{border:none;background:none;outline:none;font-size:12.5px;font-family:inherit;width:100%;color:var(--g900);}
.tb-searchicon{font-size:12px;color:var(--g500);}
.tb-bellbtn{position:relative;background:none;border:none;cursor:pointer;font-size:17px;padding:4px;line-height:1;}
.tb-dot{position:absolute;top:0;right:0;width:7px;height:7px;background:#C0392B;border-radius:50%;display:none;}
.tb-avatarbtn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;border:none;
cursor:pointer;font-size:13px;font-weight:600;flex-shrink:0;}
.tb-panel{display:none;position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--g200);
border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.16);z-index:50;}
.tb-panel.open{display:block;}
.tb-notifpanel{width:300px;padding:10px;}
.tb-notifpanel .tn-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
padding:4px 6px 8px;border-bottom:1px solid var(--g200);margin-bottom:6px;}
.tb-notifpanel .tn-head a{font-size:11.5px;cursor:pointer;}
.tb-notifitem{padding:8px 6px;border-radius:6px;font-size:12.5px;line-height:1.5;}
.tb-notifitem:hover{background:var(--g50);}
.tb-notifitem.unread{background:#EEF3FA;}
.tb-notifitem .tn-t{color:var(--g500);font-size:11px;margin-top:2px;}
.tb-avatarmenu{width:150px;padding:6px;}
.tb-avatarmenu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.tb-avatarmenu a:hover{background:var(--g50);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:110;}
.su-clickarea{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
.su-info{flex:1;min-width:0;}
.su-name,.su-unit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.su-menu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.su-menu a:hover{background:var(--g50);}
.sidebar-user .su-roletag{font-size:10.5px;background:#E6EEF8;color:var(--navy);padding:0 6px;border-radius:8px;display:inline-block;width:fit-content;white-space:nowrap;}
.sidebar-user .su-unit{font-size:11px;color:var(--g500);}
.su-menu{top:auto;bottom:64px;left:14px;right:14px;}
.su-roleswitch,.su-campusswitch{margin:8px 0 0;font-size:11px;color:var(--g500);}
.su-roleswitch select,.su-campusswitch select{width:100%;margin-top:3px;padding:5px 7px;border:1px solid var(--g200);
border-radius:6px;font-size:12px;font-family:inherit;color:var(--g900);}
@media (max-width:1279px) and (min-width:1024px){
  .sidebar{width:72px;}
  .sidebar .navtext{position:absolute;left:100%;top:50%;transform:translateY(-50%);background:#fff;
    border:1px solid var(--g200);border-radius:6px;padding:6px 10px;font-size:12.5px;white-space:nowrap;
    box-shadow:0 4px 12px rgba(16,24,40,.12);opacity:0;pointer-events:none;transition:opacity .12s;margin-left:6px;color:var(--g900);}
  .sidebar nav a:hover .navtext{opacity:1;}
  .sidebar .brand{align-items:center;overflow:hidden;}
  .sidebar .brand-logo{max-width:100%;width:32px;height:28px;object-fit:cover;object-position:left center;flex-shrink:0;}
  .sidebar .brand-text{display:none;}
  .sidebar .brand small{display:none;}
  .sidebar-user{justify-content:center;}
  .sidebar-user .navtext{display:none;}
  .sidebar .su-logout{text-align:center;}
}
@media (max-width:1023px){
  .hamburger{display:inline-flex;}
  .sidebar{position:fixed;left:-260px;top:0;height:100vh;width:260px;z-index:120;transition:left .2s;}
  .sidebar.open{left:0;}
  .sidebar-backdrop.open{display:block;}
  .shell{width:100%;}
  main{padding:16px 16px 40px;}
  .topbar{padding:0 16px;margin:-16px 0 18px;}
  .tb-search{display:none;}
}
</style>
<style>
/* ==== 側欄改版 20260826f：呼吸感間距／分段收合／底部卡收攏（覆寫舊樣式，回應主管截圖回饋） ==== */
#sidebar{padding:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#sidebar .brand{padding:16px 20px 14px;}
#sidebar .brand-logo{height:28px;width:auto;object-fit:contain;object-position:left center;}
#sidebar .brand small{margin-top:12px;font-size:12px;color:var(--g500);text-transform:none;letter-spacing:0;font-weight:400;}
#sidebar .brand-text{display:none;}
#sidebar nav{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:4px 8px 8px;scrollbar-width:thin;}
#sidebar nav::-webkit-scrollbar{width:6px;}
#sidebar nav::-webkit-scrollbar-thumb{background:var(--g200);border-radius:3px;}
#sidebar nav a,#sidebar nav span.disabled{align-items:center;gap:12px;height:40px;padding:0 14px;margin:2px 0;border-radius:8px;font-size:14px;}
#sidebar .navgroup .sec-label{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px;margin:20px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#98A2B3;font-weight:600;}
#sidebar .navgroup:first-child .sec-label{margin-top:8px;}
#sidebar .sec-toggle{background:none;border:none;padding:2px;margin:0;cursor:pointer;color:var(--g500);display:flex;align-items:center;line-height:1;flex-shrink:0;}
#sidebar .sec-toggle svg{transition:transform .15s;display:block;}
#sidebar .navgroup.collapsed .sec-toggle svg{transform:rotate(-90deg);}
#sidebar .navgroup-items{overflow:hidden;}
#sidebar .navgroup.collapsed .navgroup-items{display:none;}
#sidebar .sidebar-user{display:block;border-top:1px solid var(--g200);padding:10px 12px;margin:0;flex-shrink:0;position:relative;}
#sidebar .su-row{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
#sidebar .su-row .su-avatar{flex-shrink:0;width:36px;height:36px;}
#sidebar .su-row .su-info{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;gap:8px;line-height:1.2;}
#sidebar .su-row .su-name{font-size:14px;font-weight:600;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#sidebar .su-row .su-roletag{font-size:12px;background:#E6EEF8;color:var(--navy);padding:1px 7px;border-radius:8px;white-space:nowrap;flex-shrink:0;}
#sidebar .su-row .su-chevron{color:var(--g500);flex-shrink:0;}
#sidebar .su-menu{top:auto;bottom:60px;left:10px;right:10px;width:auto;padding:8px;}

<script>
function qs(k){return new URLSearchParams(location.search).get(k);}
var NOW=new Date('2026-09-08T10:00:00');
function pad(n,len){n=''+n;while(n.length<len)n='0'+n;return n;}
function fmtDT(d){return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)+' '+pad(d.getHours(),2)+':'+pad(d.getMinutes(),2);}
function T(zh,en){return window.TLI_I18N?TLI_I18N.t(zh,en):zh;}

/* ================= 申訴覆核：資料（示範畫面，資料為模擬數字） ================= */
// 20260928 修正：企業客戶改讀主檔 orgCustomers，不再另造虛構企業名；用關鍵字比對回真實企業，比對不到就退而用主檔既有、尚未被比對到的一般企業
var __orgGeneral9=TLI_MASTERS.orgCustomers.filter(function(o){return o.type==='general';});
function __findOrg9(pattern){return __orgGeneral9.find(function(o){return pattern.test(o.name);});}
var __companyMap9={
  '範例半導體股份有限公司': (__findOrg9(/半導體/)||__orgGeneral9[0]).name,
  '北辰精密工業股份有限公司': (__findOrg9(/北辰|精密/)||__orgGeneral9[1]).name,
  '假設國際貿易股份有限公司': (__findOrg9(/貿易/)||__orgGeneral9[2]).name,
  '範例生醫股份有限公司': (__findOrg9(/生技|生醫/)||__orgGeneral9[3]).name,
  '安泰保經股份有限公司': (__findOrg9(/保經/)||__orgGeneral9[4]).name
};
var COMPANIES=['範例半導體股份有限公司','北辰精密工業股份有限公司','假設國際貿易股份有限公司','範例生醫股份有限公司','安泰保經股份有限公司'].map(function(c){return __companyMap9[c];});
var REASON_OPTS=[
  {v:'produce',label:'產線突發狀況'},
  {v:'uncontrollable',label:'其他不可歸責事由'},
  {v:'system',label:'系統或流程認定有誤'},
  {v:'other',label:'其他'}
];
var REASON_LABELS_EN={'產線突發狀況':'Sudden Production Line Issue','其他不可歸責事由':'Other Non-Attributable Reason','系統或流程認定有誤':'System or Process Misjudgment','其他':'Other'};
function reasonLabel(v){var f=REASON_OPTS.find(function(r){return r.v===v;});return f?T(f.label,REASON_LABELS_EN[f.label]||f.label):v;}
function statusLabel(s){return s==='pending'?T('待覆核','Pending Review'):(s==='advisor_review'?T('顧問覆核中','Advisor Reviewing'):(s==='approved'?T('已通過','Approved'):T('已駁回','Rejected')));}
function statusBadge(s){
  if(s==='pending')return '<span class="badge warn">'+T('待覆核','Pending Review')+'</span>';
  if(s==='advisor_review')return '<span class="badge b">'+T('顧問覆核中','Advisor Reviewing')+'</span>';
  if(s==='approved')return '<span class="badge ok">'+T('已通過','Approved')+'</span>';
  return '<span class="badge danger">'+T('已駁回','Rejected')+'</span>';
}
function isOpenStatus(s){return s==='pending'||s==='advisor_review';}
function sourceLabel(s){return s==='employee'?T('員工直送','Employee Direct'):T('HR 轉來','Forwarded by HR');}
/* 「N / N 次（本月免扣次數已用完）」是固定樣板套數字，用正則抽出數字後翻譯，不是備註類自由文字 */
function exemptUsedDisplay(s){
  if(!s) return s;
  var m=s.match(/^(\d+)\s*\/\s*(\d+)\s*次（本月免扣次數已用完）$/);
  if(m) return T(s, m[1]+' / '+m[2]+' times (this month\'s exemption limit reached)');
  return s;
}
/* 課堂日期「YYYY-MM-DD（星期）HH:MM」的中文星期縮寫，同樣是固定樣板不是自由文字，需翻成英文縮寫 */
var WEEKDAY_EN_C09={'日':'Sun','一':'Mon','二':'Tue','三':'Wed','四':'Thu','五':'Fri','六':'Sat'};
function lessonDateDisplay(s){
  if(!s) return s;
  return s.replace(/（([日一二三四五六])）/, function(m0,d){
    return T(m0,'('+(WEEKDAY_EN_C09[d]||d)+')');
  });
}

  var approved=RECORDS.filter(function(o){return o.status==='approved';}).length;
  var rejected=RECORDS.filter(function(o){return o.status==='rejected';}).length;

}
function filteredRecords(){
  var q=document.getElementById('fq').value.trim().toLowerCase();
  var company=document.getElementById('fCompany').value;
  var source=document.getElementById('fSource').value;
  var status=activeStatusFilter();
  var sort=document.getElementById('fSort').value;
  var list=RECORDS.filter(function(o){
    if(company&&o.company!==company)return false;
    if(source&&o.source!==source)return false;
    if(status&&o.status!==status)return false;
    if(q&&(o.company+o.employee).toLowerCase().indexOf(q)===-1)return false;
    return true;
  });
  list.sort(function(a,b){
    if(sort==='submittedAsc')return a.submittedDateObj-b.submittedDateObj;
    if(sort==='company')return a.company.localeCompare(b.company);
    return b.submittedDateObj-a.submittedDateObj;
  });
  return list;
}
function renderTable(){
  renderKpi();
  renderActiveFilters();
  var list=filteredRecords();
  var body=document.getElementById('apBody');
  document.getElementById('apEmpty').style.display=list.length?'none':'block';
  body.innerHTML=list.map(function(o){
    return '<tr class="clickable" onclick="tliOpenDrawer(\''+o.id+'\')">'+
      '<td>'+o.submittedAt+'</td><td>'+o.company+'</td><td>'+o.employee+'</td><td>'+lessonDateDisplay(o.lessonDate)+'</td>'+
      '<td>'+T('缺席（扣 1 堂時數）','Absence (1 lesson deducted)')+'</td><td>'+reasonLabel(o.reason)+'</td><td>'+sourceLabel(o.source)+'</td><td>'+statusBadge(o.status)+'</td>'+
    '</tr>';
  }).join('');
  document.getElementById('pagerInfo').textContent=T('共 ','')+list.length+T(' 筆',' total');
}

  document.getElementById('drawerMask').classList.remove('open');

function tliToggleForm(id){
  document.querySelectorAll('.inline-form').forEach(function(f){ if(f.id!==id)f.classList.remove('open'); });
  document.getElementById(id).classList.toggle('open');
}
function tliSubmitReview(id,result){
  var o=recordById(id);
  if(!o)return;
  var noteEl=document.getElementById(result==='approved'?'approveNote':'rejectNote');
  var note=noteEl.value.trim();
  if(!note){ tliToast(T('請先填寫覆核意見','Please enter a review comment first')); return; }
  o.status=result;
  o.reviewNote=note;
  o.reviewedBy='王大明';
  o.reviewedAt=fmtDT(NOW);
  tliToast(result==='approved'?T('已通過該筆申訴，結果同步至員工端與企業端','Appeal approved; the result has synced to the employee and company portals'):T('已駁回該筆申訴，結果同步至員工端與企業端','Appeal rejected; the result has synced to the employee and company portals'));
  tliOpenDrawer(id);
  renderTable();
}
function tliToast(msg){toast(msg);}

}

function doLogout(){ location.href = '../公開網站/p07_login_register.html'; }
function toast(msg){
  var el = document.getElementById('toastEl');
  if (!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
renderNotifPanel();
// 通用 ESC 關閉：關掉目前開啟中的抽屜與側欄
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  document.querySelectorAll('.drawer-mask.open, .idrawer.open, .ai-panel.open, .ai-backdrop.open').forEach(function(el){
    el.classList.remove('open');
  });
});
if (window.TLI_I18N) { TLI_I18N.onRefresh(refreshAppealsI18n); TLI_I18N.onRefresh(renderNotifPanel); TLI_I18N.init(); }
</script>
<script>
function toggleNavGroup(ev, gid){
  ev.stopPropagation();
  var g = document.querySelector('#sidebar .navgroup[data-group="'+gid+'"]');
  if (!g) return;
  var collapsed = g.classList.toggle('collapsed');
  try{ localStorage.setItem('tliNavCollapse_'+gid, collapsed ? '1' : '0'); }catch(e){}
}
(function initNavGroups(){
  document.querySelectorAll('#sidebar .navgroup[data-group]').forEach(function(g){
    var gid = g.dataset.group, saved = null;
    try{ saved = localStorage.getItem('tliNavCollapse_'+gid); }catch(e){}
    if (saved === '1') g.classList.add('collapsed');
  });
  /* 20260911r：目前頁所屬群組不可被收合到看不到 active 項目 */
  var activeLink = document.querySelector('#sidebar a.active');
  if (activeLink) {
    var activeGroup = activeLink.closest('.navgroup');
    if (activeGroup) activeGroup.classList.remove('collapsed');
  }
})();
</script>
<script>
/* 20260929 死按鈕修正：側欄使用者選單（姓名／大頭貼）點擊開合；此頁樣板漏帶 toggleSuMenu */
window.toggleSuMenu = window.toggleSuMenu || function(ev){
  if (ev) ev.stopPropagation();
  var m = document.getElementById('suMenu'); if (!m) return;
  ['notifPanel','avatarMenu'].forEach(function(id){ var e = document.getElementById(id); if (e) e.classList.remove('open'); });
  m.classList.toggle('open');
};
document.addEventListener('click', function(ev){
  var m = document.getElementById('suMenu');
  if (m && !m.contains(ev.target)) m.classList.remove('open');
});
</script>
