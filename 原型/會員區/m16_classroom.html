<style>
:root{
  --c-primary:#1B4E8C;--c-primary-dark:#123A68;--c-accent:#E8792B;--c-accent-dark:#CF691F;--c-secondary:#0F9B79;
  --c-bg:#F5F7FA;--c-border:#E4E7EC;--c-muted:#667085;--c-text:#101828;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-lg:0 8px 24px rgba(16,24,40,.16);
  --topbar-h:52px;--bottomnav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;font-size:15px;-webkit-tap-highlight-color:transparent;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;}
button{font-family:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.app{min-height:100vh;position:relative;}
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-logo-wrap{width:26px;height:22px;overflow:hidden;position:relative;flex:none;}
.topbar-logo-wrap img{position:absolute;left:0;top:0;height:22px;width:auto;max-width:none;}
.topbar-title{font-size:16.5px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:6px;position:relative;}
.side-nav{display:none;}
@media(min-width:1024px){
  .side-nav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:310px;background:#fff;border-right:1px solid var(--c-border);padding:18px 12px;z-index:50;overflow-y:auto;}
  .side-brand{display:flex;align-items:center;padding:0 8px 18px;}
  .side-brand img{height:28px;width:auto;}
  .side-identity{padding:0 8px 14px;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--c-text);border-bottom:1px solid var(--c-border);}
  .side-link{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--c-muted);margin-bottom:2px;}
  .side-link svg{width:19px;height:19px;flex:none;}
  .side-link.active{background:#E6EEF8;color:var(--c-primary);}
  .side-link:hover:not(.active){background:var(--c-bg);}
  .app.has-side .topbar{margin-left:310px;}
  .app.has-side .content{margin-left:310px;}
}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--c-border);display:flex;height:var(--bottomnav-h);padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(16,24,40,.06);}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--c-muted);font-weight:600;min-height:44px;}
.bottom-nav a svg{width:20px;height:20px;}
.bottom-nav a.active{color:var(--c-primary);}
@media(min-width:1024px){.bottom-nav{display:none;}}
.content{max-width:640px;margin:0 auto;padding:18px 16px calc(var(--bottomnav-h) + 24px);}
@media(min-width:1024px){.content{padding:26px 32px 40px;}}
.page-h{font-size:19px;font-weight:700;margin:2px 0 4px;line-height:1.4;}
.page-sub{color:var(--c-muted);font-size:13px;margin:0 0 18px;}
.section-title{font-size:15px;font-weight:700;margin:22px 0 12px;}
.section-title.first{margin-top:4px;}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.card + .card{margin-top:12px;}
.muted{color:var(--c-muted);}
.small{font-size:12px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;min-height:44px;}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-accent{background:var(--c-accent);color:#fff;}
.btn-accent:hover{background:var(--c-accent-dark);}
.btn-outline{background:#fff;border:1px solid var(--c-border);color:var(--c-text);}
.btn-outline:hover{background:var(--c-bg);}
.btn-block{width:100%;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-info{background:#E6EEF8;color:var(--c-primary);}
.badge-ok{background:#E4F5F0;color:#0B6B52;}
.badge-muted{background:var(--c-border);color:var(--c-muted);}
.badge-payer-self{background:#E6EEF8;color:var(--c-primary);}
.badge-payer-company{background:#FCEBDC;color:var(--c-accent-dark);}
.badge-payer-school{background:#F3E8FD;color:#6B21A8;}
.badge-type-1on1{background:#E6EEF8;color:var(--c-primary);}
.badge-type-group{background:#E4F5F0;color:#0B6B52;}
.badge-type-chat{background:#F3E8FD;color:#6B21A8;}
.badge-type-event{background:#FCEBDC;color:var(--c-accent-dark);}
.hidden{display:none!important;}
.stack{display:flex;flex-direction:column;gap:8px;}
.badge-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.toast{position:fixed;left:50%;bottom:calc(var(--bottomnav-h) + 18px);transform:translateX(-50%);background:#101828;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:120;box-shadow:var(--shadow-lg);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;}
.toast.hidden{display:none;}
@media(min-width:1024px){.toast{bottom:24px;}}
/* ---------- 示範狀態切換 ---------- */
/* ---------- 課程資訊卡 ---------- */
.class-time-line{font-size:13px;color:var(--c-muted);line-height:1.7;margin-bottom:8px;}
.class-teacher-line{font-size:13.5px;line-height:1.6;margin-bottom:10px;}
.class-plan-line{font-size:12px;color:var(--c-muted);margin-top:2px;}
/* ---------- 狀態列 ---------- */
.countdown-num{font-size:24px;font-weight:700;margin:6px 0 4px;color:var(--c-text);}
/* ---------- 課前準備：教材／裝置檢查／提醒 ---------- */
.prep-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--c-border);}
.prep-row>div:first-child{min-width:0;flex:1 1 0%;}
.prep-row .small{white-space:normal;word-break:break-word;overflow-wrap:anywhere;}
.prep-row:first-child{border-top:none;padding-top:0;}
.dev-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--c-border);}
.dev-row:first-child{border-top:none;padding-top:0;}
.dev-icon{width:38px;height:38px;border-radius:9px;background:var(--c-bg);display:flex;align-items:center;justify-content:center;color:var(--c-muted);flex:none;}
.dev-icon.ok{background:#E4F5F0;color:#0B6B52;}
.dev-icon svg{width:18px;height:18px;}
.dev-body{flex:1;min-width:0;}
.dev-body h4{margin:0;font-size:13.5px;font-weight:700;}
.dev-body p{margin:2px 0 0;font-size:12px;color:var(--c-muted);}
.dev-check{width:18px;height:18px;color:#0B6B52;flex:none;}
.reminder-list{margin:0;padding-left:18px;font-size:13px;line-height:1.9;color:var(--c-text);}
.reminder-list li{margin-bottom:2px;}
/* ---------- Zoom 進入示意視窗（沿用全站 sheet 樣式） ---------- */
.sheet-overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.sheet-overlay.hidden{display:none;}
.sheet{background:#fff;width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0));max-height:86vh;overflow-y:auto;}
.sheet-handle{width:36px;height:4px;background:var(--c-border);border-radius:4px;margin:0 auto 14px;}
@media(min-width:640px){.sheet-overlay{align-items:center;}.sheet{border-radius:16px;}}
.meeting-field{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;background:var(--c-bg);border-radius:8px;font-size:13px;margin-top:8px;}
.meeting-field span{color:var(--c-muted);white-space:nowrap;}
</style>
</head>

<script>
function showToast(msg){
  var t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;
  t.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(function(){t.classList.add('hidden');},2200);
}

/* ---------- 讀取參數：?lesson=<id>&type=1on1|group|chat|event&state=before|open|ended ---------- */
function qs(name){
  var m = new RegExp('[?&]'+name+'=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : null;
}

  { id:'l4', type:'event', title:'華語文化講座：節慶與生活', teacherName:'王淑芬老師（TLI）', teacherIntro:'長年帶領時事與影視討論課程，擅長引導深度對話。',
    planId:'plan-d', planName:'所屬方案：華語會話學期方案', payer:'school', payerLabel:'學校提供・範例州立大學',
    dateLabel:'9/24（四）', timeLabel:'15:00–16:00', tzLabel:null,
    material:'教材：講座簡報（PDF）', countdownMin:180, defaultState:'before', replayEligible:false },
  { id:'l5', type:'1on1', title:'商務華語－會議情境練習', teacherName:'陳美惠老師', teacherIntro:'主授商務與正式情境會話，重視表達邏輯與用詞得體。',
    planId:'plan-c', planName:'所屬方案：商務華語企業培訓', payer:'company', payerLabel:'公司提供・和霖科技股份有限公司',
    dateLabel:'9/12（六）', timeLabel:'10:00–10:50', tzLabel:'美國廠區（美國西部時間，UTC-7）19:00（前一天）',
    material:'教材：會議情境練習教材（PDF）', countdownMin:20, defaultState:'open', replayEligible:false }
];
var TYPE_LABELS = {'1on1':'一對一','group':'團體直播','chat':'團體聊天室','event':'線上活動'};

var LESSON_ID = qs('lesson');
var LESSON = LESSONS.filter(function(l){ return l.id===LESSON_ID; })[0] || LESSONS[0];
var STATE_PARAM = qs('state');
var STATE = (STATE_PARAM==='before'||STATE_PARAM==='open'||STATE_PARAM==='ended') ? STATE_PARAM : LESSON.defaultState;

/* ---------- 頂部課程資訊 ---------- */
function renderHeader(){
  var typeBadge = document.getElementById('typeBadge');
  typeBadge.textContent = TYPE_LABELS[LESSON.type];
  typeBadge.className = 'badge badge-type-'+LESSON.type;
  var planBadge = document.getElementById('planBadge');
  planBadge.textContent = LESSON.payerLabel;
  planBadge.className = 'badge badge-payer-'+LESSON.payer;
  document.getElementById('lessonTitle').textContent = LESSON.title;
  document.getElementById('planNameLine').textContent = LESSON.planName;
  var timeHtml = '台北 '+LESSON.dateLabel+' '+LESSON.timeLabel;
  if (LESSON.tzLabel){ timeHtml += '　<span style="color:#98A2B3;">／ '+LESSON.tzLabel+'</span>'; }
  document.getElementById('timeLine').innerHTML = timeHtml;
  document.getElementById('teacherLine').innerHTML = '<b>帶領老師：</b>'+LESSON.teacherName+'．'+LESSON.teacherIntro;
  document.getElementById('materialLink').textContent = LESSON.material;
  document.getElementById('backToScheduleBtn').setAttribute('onclick', "location.href='m03_schedule.html?class="+LESSON.id+"'");
}

/* ---------- 狀態列：開課前／可進入／已結束三態 ---------- */
function renderStatus(){
  var el = document.getElementById('statusCard');
  var html = '';
  if (STATE==='before'){
    html += '<div class="small muted">尚未開放進入</div>';
    html += '<div class="countdown-num">距開課 '+LESSON.countdownMin+' 分</div>';
    html += '<div class="small muted">開課前 15 分鐘開放進入教室</div>';
  } else if (STATE==='open'){
    html += '<div class="badge badge-ok" style="margin-bottom:12px;">可進入</div>';
    html += '<button type="button" class="btn btn-primary btn-block" onclick="openZoomModal()">開啟 Zoom 教室</button>';
  } else {
    html += '<div style="font-weight:700;margin-bottom:10px;">本堂已結束</div>';
    html += '<div class="stack">';
    html += '<button type="button" class="btn btn-outline btn-block" onclick="location.href=\'m17_feedback.html?lesson='+LESSON.id+'\'">填寫課後回饋</button>';
    if (LESSON.type==='group' && LESSON.replayEligible){
      html += '<button type="button" class="btn btn-outline btn-block" onclick="showToast(\'回放影片將於此開啟\')">觀看回放（開放天數依設定）</button>';
    }
    html += '</div>';
  }
  el.innerHTML = html;
}

/* ---------- 上課提醒：準時、開麥，第三條依方案付費方／型態不同 ---------- */
function renderReminders(){
  var lines = [
    '請準時於開課時間登入，避免錯過課程內容。',
    '上課全程請開啟攝影機與麥克風，以利口說練習與互動。'
  ];
  if (LESSON.payer==='company'){
    lines.push('企業合約：如需請假需經 HR 核准，送出後顯示「等待 HR 核准」，核准前仍請準時出席。');
  } else if (LESSON.payer==='school'){
    lines.push('由學校提供之方案，出缺席規則依授權設定，如需異動請洽學校窗口。');
  } else if (LESSON.type==='group'){
    lines.push('團體直播班單堂請假：需於開課前（依設定）小時內送出，逾提前時限記缺席。');
  } else {
    lines.push('自費方案：開課前 12 小時以上可取消／請假；12 小時內無法取消，未出席將記錄。');
  }
  document.getElementById('reminderList').innerHTML = lines.map(function(t){ return '<li>'+t+'</li>'; }).join('');
}

/* ---------- 裝置檢查：麥克風／攝影機／網路，示範用固定 1 秒後全數通過 ---------- */
var deviceChecking = false;
function runDeviceCheck(){
  if (deviceChecking) return;
  deviceChecking = true;
  ['Mic','Cam','Net'].forEach(function(k){
    document.getElementById('status'+k).textContent = '檢查中…';
    document.getElementById('icon'+k).classList.remove('ok');
    document.getElementById('check'+k).classList.add('hidden');
  });
  document.getElementById('deviceCheckBtn').textContent = '檢查中…';
  setTimeout(function(){
    ['Mic','Cam','Net'].forEach(function(k){
      document.getElementById('status'+k).textContent = '正常';
      document.getElementById('icon'+k).classList.add('ok');
      document.getElementById('check'+k).classList.remove('hidden');
    });
    document.getElementById('deviceCheckBtn').textContent = '重新檢查';
    deviceChecking = false;
  }, 1000);
}

/* ---------- 開啟 Zoom 教室：站內示意視窗，不連外網 ---------- */
function maskEmail(email){
  var p = (email||'').split('@');
  if (p.length!==2 || !p[0]) return email||'';
  return p[0].charAt(0)+'***@'+p[1];
}
function getZoomEmailDemo(){
  try{ var v = localStorage.getItem('tli_zoom_email'); if (v) return v; }catch(e){}
  return 'emma.chen@gmail.com';
}
var MEETING_ID_MAP = {l1:'839 2201 5567', l2:'921 4432 1180', l3:'745 8890 3321', l4:'602 1178 4459', l5:'318 7742 9903'};
function openZoomModal(){
  var email = getZoomEmailDemo();
  document.getElementById('zoomStatusText').textContent = '正在以 Zoom 登入 '+maskEmail(email)+' 進入會議…';
  document.getElementById('zoomMeetingId').textContent = MEETING_ID_MAP[LESSON.id] || '000 0000 0000';
  document.getElementById('zoomOverlay').classList.remove('hidden');
}
function closeZoomModal(){
  document.getElementById('zoomOverlay').classList.add('hidden');
}
function handleZoomOverlayClick(e){
  if (e.target && e.target.id==='zoomOverlay') closeZoomModal();
}

// 全域 ESC 關閉：關閉目前開啟中的 sheet-overlay
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  document.querySelectorAll('.sheet-overlay:not(.hidden)').forEach(function(el){
    el.classList.add('hidden');
  });
});

renderHeader();
renderStatus();
renderReminders();
</script>
