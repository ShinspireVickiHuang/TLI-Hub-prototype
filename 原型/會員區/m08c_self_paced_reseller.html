<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLI Connect 會員區－線上學習（經銷學生）</title>
<style>
:root{
  --c-primary:#1B4E8C;--c-primary-dark:#123A68;--c-accent:#E8792B;--c-accent-dark:#CF691F;--c-secondary:#0F9B79;
  --c-bg:#F5F7FA;--c-border:#E4E7EC;--c-muted:#667085;--c-text:#101828;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-lg:0 8px 24px rgba(16,24,40,.16);
  --topbar-h:52px;--bottomnav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;font-size:15px;-webkit-tap-highlight-color:transparent;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;}
button{font-family:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.app{min-height:100vh;position:relative;}
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-logo-wrap{width:26px;height:22px;overflow:hidden;position:relative;flex:none;}
.topbar-logo-wrap img{position:absolute;left:0;top:0;height:22px;width:auto;max-width:none;}
.topbar-title{font-size:16.5px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:6px;position:relative;}
.bell-btn{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--c-border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-muted);}
.bell-btn svg{width:16px;height:16px;}
.bell-btn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--c-accent);border:1.5px solid #fff;}
.bell-panel{display:none;position:absolute;right:0;top:40px;width:264px;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:6px 0;z-index:90;}
.bell-panel.open{display:block;}
.bell-panel h4{margin:0;padding:8px 14px 6px;font-size:12.5px;color:var(--c-muted);font-weight:700;}
.bell-item{padding:9px 14px;font-size:12.5px;border-top:1px solid var(--c-border);display:flex;gap:8px;}
.bell-item .b-dot{width:6px;height:6px;border-radius:50%;background:var(--c-accent);margin-top:5px;flex:none;}
.bell-item p{margin:0;color:var(--c-text);}
.bell-item span{color:var(--c-muted);font-size:11px;}
.side-nav{display:none;}
@media(min-width:1024px){
  .side-nav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:310px;background:#fff;border-right:1px solid var(--c-border);padding:18px 12px;z-index:50;}
  .side-brand{display:flex;align-items:center;padding:0 8px 18px;}
  .side-brand img{height:28px;width:auto;}
  .side-identity{padding:0 8px 14px;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--c-text);border-bottom:1px solid var(--c-border);}
  .side-link{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--c-muted);margin-bottom:2px;}
  .side-link svg{width:19px;height:19px;flex:none;}
  .side-link.active{background:#E6EEF8;color:var(--c-primary);}
  .side-link:hover:not(.active){background:var(--c-bg);}
  .side-sep{border-top:1px solid var(--c-border);margin:8px 6px;}
  .app.has-side .topbar{margin-left:310px;}
  .app.has-side .content{margin-left:310px;}
}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--c-border);display:flex;height:var(--bottomnav-h);padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(16,24,40,.06);}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--c-muted);font-weight:600;min-height:44px;}
.bottom-nav a svg{width:22px;height:22px;}
.bottom-nav a.active{color:var(--c-primary);}
@media(min-width:1024px){.bottom-nav{display:none;}}
.content{max-width:960px;margin:0 auto;padding:18px 16px calc(var(--bottomnav-h) + 24px);}
@media(min-width:1024px){.content{padding:26px 32px 40px;}}
.page-h{font-size:19px;font-weight:700;margin:2px 0 4px;}
.page-sub{color:var(--c-muted);font-size:13px;margin:0 0 18px;}
.section-title{font-size:15px;font-weight:700;margin:24px 0 12px;}
.section-title.first{margin-top:4px;}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.card + .card{margin-top:12px;}
.muted{color:var(--c-muted);}
.small{font-size:12px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;min-height:44px;}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-outline{background:#fff;border:1px solid var(--c-border);color:var(--c-text);}
.btn-outline:hover{background:var(--c-bg);}
.btn-sm{padding:7px 12px;font-size:12.5px;min-height:36px;}
.btn-block{width:100%;}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--c-border);}
.list-row:first-child{border-top:none;padding-top:0;}
.list-row .icon-box{width:38px;height:38px;border-radius:9px;background:var(--c-bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--c-primary);}
.list-row .icon-box svg{width:18px;height:18px;}
.list-row .body{flex:1;min-width:0;}
.list-row .body h4{margin:0;font-size:13.5px;font-weight:700;}
.list-row .body p{margin:2px 0 0;font-size:12px;color:var(--c-muted);}
.list-row .trail{flex:none;text-align:right;}
.banner{border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:9px;align-items:flex-start;}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px;}
.banner-info{background:#E6EEF8;color:var(--c-primary-dark);border:1px solid #C7DAF0;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-info{background:#E6EEF8;color:var(--c-primary);}
.badge-ok{background:#E4F5F0;color:#0B6B52;}
.badge-muted{background:var(--c-border);color:var(--c-muted);}
.progress{height:8px;border-radius:6px;background:var(--c-border);overflow:hidden;}
.progress > div{height:100%;background:var(--c-primary);border-radius:6px;}
.hidden{display:none!important;}
.toast{position:fixed;left:50%;bottom:calc(var(--bottomnav-h) + 18px);transform:translateX(-50%);background:#101828;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:120;box-shadow:var(--shadow-lg);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;}
.toast.hidden{display:none;}
@media(min-width:1024px){.toast{bottom:24px;}}
/* ---------- 線上學習專用：單元手風琴 ---------- */
.unit-card{padding:14px 16px;}
.unit-head{display:flex;align-items:center;gap:12px;cursor:pointer;}
.unit-head .icon-box{width:38px;height:38px;border-radius:9px;background:var(--c-bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--c-primary);}
.unit-head .icon-box svg{width:18px;height:18px;}
.unit-head .body{flex:1;min-width:0;}
.unit-head .body h4{margin:0;font-size:14px;font-weight:700;}
.unit-head .body p{margin:3px 0 0;font-size:12px;color:var(--c-muted);}
.unit-head .chevron{width:18px;height:18px;color:var(--c-muted);transition:transform .15s;flex:none;}
.unit-head.open .chevron{transform:rotate(180deg);}
.unit-progress{margin-top:8px;}
.unit-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--c-border);}
.unit-body.hidden{display:none;}
.resource-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px dashed var(--c-border);}
.resource-row:first-child{border-top:none;padding-top:0;}
.resource-row .icon-box{width:32px;height:32px;border-radius:8px;background:var(--c-bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--c-primary);}
.resource-row .icon-box svg{width:15px;height:15px;}
.resource-row .body{flex:1;min-width:0;}
.resource-row .body h4{margin:0;font-size:13px;font-weight:700;}
.resource-row .body p{margin:2px 0 0;font-size:11.5px;color:var(--c-muted);}
/* ---------- 測驗 modal（頁內示範，不跳頁） ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:300;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:12px;max-width:440px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--c-border);}
.modal-head h3{font-size:15px;font-weight:800;margin:0;}
.modal-close-btn{background:none;border:none;cursor:pointer;color:var(--c-muted);padding:6px;flex:none;}
.modal-close-btn:hover{color:var(--c-text);}
.modal-body{padding:18px 20px;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--c-border);text-align:right;}
.quiz-q{margin-bottom:16px;}
.quiz-q:last-child{margin-bottom:0;}
.quiz-q p.qt{font-weight:700;font-size:13.5px;margin:0 0 8px;}
.quiz-opt{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13.5px;cursor:pointer;}
.quiz-opt input{margin:0;flex:none;}
</style>
</head>

<script>
function T(zh,en){ return window.TLI_I18N ? TLI_I18N.t(zh,en) : zh; }
function restrictPartnerLocales(){
  if (!window.TLI_I18N || !window.TLI_MASTERS) return;
  var p = TLI_MASTERS.partners.find(function(x){ return x.name.indexOf('環球遊學顧問') >= 0; }) || {};
  var allowed = (p.uiLocales && p.uiLocales.length) ? p.uiLocales : ['zh-TW','zh-CN','en'];
  document.querySelectorAll('.tli-i18n-opt').forEach(function(btn){
    if (allowed.indexOf(btn.getAttribute('data-lang')) === -1) btn.style.display = 'none';
  });
  if (allowed.indexOf(TLI_I18N.currentLang()) === -1) TLI_I18N.apply(allowed[0]);
}
if (window.TLI_I18N) TLI_I18N.init();
restrictPartnerLocales();

function toggleBell(){document.getElementById('bellPanel').classList.toggle('open');}
document.addEventListener('click',function(e){
  if(!e.target.closest('.bell-btn')&&!e.target.closest('.bell-panel'))document.getElementById('bellPanel').classList.remove('open');
});
function showToast(msg){
  var t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;
  t.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(function(){t.classList.add('hidden');},2200);
}

var ICON_PLAY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>';
var ICON_PDF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h6M9 16h6M9 8h6"/><path d="M6 2h9l5 5v15H6z"/></svg>';
var ICON_QUIZ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><polyline points="8 12 11 15 16 9"/></svg>';
var ICON_CHEVRON='<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

/* 教材單元示範資料（6 個單元，對應課表中部分實體課的當日主題；每單元含教學影音／電子書／單元測驗三種資源；resourcesDone 決定進度徽章與按鈕文字） */
var UNITS = [
  {id:'u1', title:'機場與交通用語', dur:'5:40', pagesNum:6, resourcesDone:3},
  {id:'u2', title:'點餐與美食情境會話', dur:'6:05', pagesNum:7, resourcesDone:2},
  {id:'u3', title:'問路與方向指引', dur:'5:20', pagesNum:6, resourcesDone:1},
  {id:'u4', title:'購物與殺價會話', dur:'6:30', pagesNum:8, resourcesDone:0},
  {id:'u5', title:'生活會話總複習', dur:'7:00', pagesNum:9, resourcesDone:0},
  {id:'u6', title:'文化體驗會話：茶道與書法', dur:'6:15', pagesNum:7, resourcesDone:0}
];
var UNIT_MAP = {};
UNITS.forEach(function(u){ UNIT_MAP[u.id] = u; });

function unitStatus(u){
  if(u.resourcesDone>=3) return {label:T('已完成','Completed'), cls:'badge-ok'};
  if(u.resourcesDone>0) return {label:T('進行中','In Progress'), cls:'badge-info'};
  return {label:T('尚未開始','Not Started'), cls:'badge-muted'};
}
function resourceActionLabel(unitDone, idx){
  // idx: 0=影音 1=電子書 2=測驗；依單元已完成資源數決定該項按鈕文字
  if(unitDone>idx) return T('複習','Review');
  if(unitDone===idx) return T('開始','Start');
  return T('開始','Start');
}

function renderUnits(){
  var wrap = document.getElementById('unitList');
  wrap.innerHTML = UNITS.map(function(u){
    var st = unitStatus(u);
    var pct = Math.round(u.resourcesDone/3*100);
    return '' +
      '<div class="card unit-card" id="unitCard-'+u.id+'">' +
        '<div class="unit-head" id="unitHead-'+u.id+'" onclick="toggleUnit(\''+u.id+'\')">' +
          '<div class="icon-box">'+ICON_PLAY+'</div>' +
          '<div class="body"><h4>'+u.title+'</h4><p>'+T('已完成 ','Completed ')+u.resourcesDone+T('／3 項資源','/3 resources')+'</p></div>' +
          '<span class="badge '+st.cls+'">'+st.label+'</span>' +
          ICON_CHEVRON +
        '</div>' +
        '<div class="unit-progress"><div class="progress"><div style="width:'+pct+'%;"></div></div></div>' +
        '<div class="unit-body hidden" id="unitBody-'+u.id+'">' +
          '<div class="resource-row"><div class="icon-box">'+ICON_PLAY+'</div><div class="body"><h4>'+T('教學影音','Instructional Video')+'</h4><p>'+u.dur+'</p></div><div class="trail"><button class="btn btn-outline btn-sm" onclick="event.stopPropagation();playResource(\''+u.id+'\',\'video\')">'+resourceActionLabel(u.resourcesDone,0)+'</button></div></div>' +
          '<div class="resource-row"><div class="icon-box">'+ICON_PDF+'</div><div class="body"><h4>'+T('電子書','E-Book')+'</h4><p>'+T('共 '+u.pagesNum+' 頁', u.pagesNum+' pages')+'</p></div><div class="trail"><button class="btn btn-outline btn-sm" onclick="event.stopPropagation();playResource(\''+u.id+'\',\'ebook\')">'+resourceActionLabel(u.resourcesDone,1)+'</button></div></div>' +
          '<div class="resource-row"><div class="icon-box">'+ICON_QUIZ+'</div><div class="body"><h4>'+T('單元測驗','Unit Quiz')+'</h4><p>'+T('3 題・約 3 分鐘','3 questions · about 3 minutes')+'</p></div><div class="trail"><button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openQuiz(\''+u.id+'\')">'+resourceActionLabel(u.resourcesDone,2)+'</button></div></div>' +
        '</div>' +
      '</div>';
  }).join('');
}

function toggleUnit(id, forceOpen){
  var body = document.getElementById('unitBody-'+id);
  var head = document.getElementById('unitHead-'+id);
  var isHidden = body.classList.contains('hidden');
  var willOpen = (forceOpen===true) ? true : (forceOpen===false ? false : isHidden);
  body.classList.toggle('hidden', !willOpen);
  head.classList.toggle('open', willOpen);
}

function playResource(unitId, type){
  var u = UNIT_MAP[unitId];
  if(type==='video'){
    showToast(T('示範：開始播放《'+u.title+'》教學影音', 'Demo: Starting to play the instructional video for “'+u.title+'”'));
  } else {
    showToast(T('示範：開始開啟《'+u.title+'》電子書', 'Demo: Opening the e-book for “'+u.title+'”'));
  }
}

/* ---------- 單元測驗 modal（示範用共用題庫，不跳頁） ---------- */
var QUIZ_DEMO = [
  {q:'「請問洗手間在哪裡？」是在詢問？', opts:['時間','方向','數量','人物'], correct:1},
  {q:'想在餐廳詢問「這道菜辣不辣？」，最合適的問法是？', opts:['這道菜辣不辣？','多少錢？','幾點開門？','可以退貨嗎？'], correct:0},
  {q:'殺價時常用的「可以算便宜一點嗎？」意思最接近？', opts:['可以退貨嗎','可以打折嗎','可以試穿嗎','可以刷卡嗎'], correct:1}
];
var quizCurrentUnit = null;
function openQuiz(unitId){
  var u = UNIT_MAP[unitId];
  quizCurrentUnit = unitId;
  document.getElementById('quizModalTitle').textContent = u.title+T('・單元測驗','・Unit Quiz');
  var body = document.getElementById('quizModalBody');
  body.innerHTML = QUIZ_DEMO.map(function(item,qi){
    return '' +
      '<div class="quiz-q">' +
        '<p class="qt">Q'+(qi+1)+'. '+item.q+'</p>' +
        item.opts.map(function(opt,oi){
          return '<label class="quiz-opt"><input type="radio" name="quizQ'+qi+'" value="'+oi+'">'+opt+'</label>';
        }).join('') +
      '</div>';
  }).join('');
  document.getElementById('quizModalOverlay').classList.add('show');
}
function closeQuiz(){
  document.getElementById('quizModalOverlay').classList.remove('show');
}
function submitQuiz(){
  var correctCount = 0;
  QUIZ_DEMO.forEach(function(item,qi){
    var checked = document.querySelector('input[name="quizQ'+qi+'"]:checked');
    if(checked && parseInt(checked.value,10)===item.correct) correctCount++;
  });
  closeQuiz();
  showToast(T('測驗完成，答對 ','Quiz complete — you got ')+correctCount+'／'+QUIZ_DEMO.length+T(' 題（示範）',' correct (demo)'));
}

/* 由「首頁」或「課表」帶入 ?unit=<id>，自動展開並捲到該單元；查無此單元代碼則忽略 */
function applyUnitFromQuery(){
  var params = new URLSearchParams(window.location.search);
  var unitId = params.get('unit');
  if(!unitId || !UNIT_MAP[unitId]) return;
  toggleUnit(unitId, true);
  setTimeout(function(){
    var card = document.getElementById('unitCard-'+unitId);
    if(card) card.scrollIntoView({behavior:'smooth', block:'start'});
  }, 50);
}

renderUnits();
applyUnitFromQuery();
if (window.TLI_I18N) TLI_I18N.onRefresh(renderUnits);
</script>
</body>
