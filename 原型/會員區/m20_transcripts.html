<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLI Connect 會員區－成績單</title>
<style>
:root{
  --c-primary:#1B4E8C;--c-primary-dark:#123A68;--c-accent:#E8792B;--c-accent-dark:#CF691F;--c-secondary:#0F9B79;
  --c-bg:#F5F7FA;--c-border:#E4E7EC;--c-muted:#667085;--c-text:#101828;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-lg:0 8px 24px rgba(16,24,40,.16);
  --topbar-h:52px;--bottomnav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;font-size:15px;-webkit-tap-highlight-color:transparent;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;}
button{font-family:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.app{min-height:100vh;position:relative;}
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-logo-wrap{width:26px;height:22px;overflow:hidden;position:relative;flex:none;}
.topbar-logo-wrap img{position:absolute;left:0;top:0;height:22px;width:auto;max-width:none;}
.back-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--c-border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--c-text);flex:none;cursor:pointer;}
.back-btn svg{width:16px;height:16px;}
.topbar-title{font-size:16.5px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:6px;position:relative;}
.mini-select{border:1px solid var(--c-border);border-radius:6px;padding:4px 6px;font-size:11.5px;background:#fff;color:var(--c-muted);font-family:inherit;max-width:96px;}
.bell-btn{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--c-border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-muted);}
.bell-btn svg{width:16px;height:16px;}
.bell-btn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--c-accent);border:1.5px solid #fff;}
.bell-panel{display:none;position:absolute;right:0;top:40px;width:264px;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:6px 0;z-index:90;}
.bell-panel.open{display:block;}
.bell-panel h4{margin:0;padding:8px 14px 6px;font-size:12.5px;color:var(--c-muted);font-weight:700;}
.bell-item{padding:9px 14px;font-size:12.5px;border-top:1px solid var(--c-border);display:flex;gap:8px;}
.bell-item .b-dot{width:6px;height:6px;border-radius:50%;background:var(--c-accent);margin-top:5px;flex:none;}
.bell-item p{margin:0;color:var(--c-text);}
.bell-item span{color:var(--c-muted);font-size:11px;}
.side-nav{display:none;}
@media(min-width:1024px){
  .side-nav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:310px;background:#fff;border-right:1px solid var(--c-border);padding:18px 12px;z-index:50;}
  .side-brand{display:flex;align-items:center;padding:0 8px 18px;}
  .side-brand img{height:28px;width:auto;}
  .side-identity{padding:0 8px 14px;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--c-text);border-bottom:1px solid var(--c-border);}
  .side-link{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--c-muted);margin-bottom:2px;}
  .side-link svg{width:19px;height:19px;flex:none;}
  .side-link.active{background:#E6EEF8;color:var(--c-primary);}
  .side-link:hover:not(.active){background:var(--c-bg);}
  .app.has-side .topbar{margin-left:310px;}
  .app.has-side .content{margin-left:310px;}
}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--c-border);display:flex;height:var(--bottomnav-h);padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(16,24,40,.06);}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--c-muted);font-weight:600;min-height:44px;}
.bottom-nav a svg{width:22px;height:22px;}
.bottom-nav a.active{color:var(--c-primary);}
@media(min-width:1024px){.bottom-nav{display:none;}}
.content{max-width:960px;margin:0 auto;padding:18px 16px calc(var(--bottomnav-h) + 24px);}
@media(min-width:1024px){.content{padding:26px 32px 40px;}}
.page-h{font-size:19px;font-weight:700;margin:2px 0 4px;}
.page-sub{color:var(--c-muted);font-size:13px;margin:0 0 18px;}
.section-title{font-size:15px;font-weight:700;margin:24px 0 12px;}
.section-title.first{margin-top:4px;}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.card + .card{margin-top:12px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.stack{display:flex;flex-direction:column;gap:10px;}
.muted{color:var(--c-muted);}
.small{font-size:12px;}
.divider{border:none;border-top:1px solid var(--c-border);margin:14px 0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;min-height:44px;}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-accent{background:var(--c-accent);color:#fff;}
.btn-accent:hover{background:var(--c-accent-dark);}
.btn-outline{background:#fff;border:1px solid var(--c-border);color:var(--c-text);}
.btn-outline:hover{background:var(--c-bg);}
.btn-ghost{background:none;color:var(--c-muted);}
.btn:disabled{background:var(--c-border)!important;color:#98A2B3!important;cursor:not-allowed;border-color:var(--c-border)!important;}
.btn-sm{padding:7px 12px;font-size:12.5px;min-height:36px;}
.btn-block{width:100%;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-info{background:#E6EEF8;color:var(--c-primary);}
.badge-warn{background:#FCEBDC;color:var(--c-accent-dark);}
.badge-ok{background:#E4F5F0;color:#0B6B52;}
.badge-muted{background:var(--c-border);color:var(--c-muted);}
.badge-full{background:#FBEAEA;color:#B42318;}
.progress{height:8px;border-radius:6px;background:var(--c-border);overflow:hidden;}
.progress > div{height:100%;background:var(--c-primary);border-radius:6px;transition:width .25s;}
.progress.warn > div{background:var(--c-accent);}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--c-border);}
.list-row:first-child{border-top:none;padding-top:0;}
.list-row .icon-box{width:38px;height:38px;border-radius:9px;background:var(--c-bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--c-primary);}
.list-row .icon-box svg{width:18px;height:18px;}
.list-row .body{flex:1;min-width:0;}
.list-row .body h4{margin:0;font-size:13.5px;font-weight:700;}
.list-row .body p{margin:2px 0 0;font-size:12px;color:var(--c-muted);}
.list-row .trail{flex:none;text-align:right;}
.lv-row.selected{background:#F7FAFF;box-shadow:inset 3px 0 0 var(--c-primary);border-radius:var(--radius-sm);}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--c-border);margin:18px 0 14px;overflow-x:auto;}
.tab-btn{padding:9px 14px;border:none;background:none;font-size:13.5px;font-weight:700;color:var(--c-muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit;min-height:40px;}
.tab-btn.active{color:var(--c-primary);border-color:var(--c-primary);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.banner{border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:9px;align-items:flex-start;}
.banner-success{background:#E4F5F0;color:#0B6B52;border:1px solid #BEE6D9;}
.banner-warn{background:#FCEBDC;color:#9A4A0F;border:1px solid #F5CBA1;}
.banner-info{background:#E6EEF8;color:var(--c-primary-dark);border:1px solid #C7DAF0;}
.hidden{display:none!important;}
.toast{position:fixed;left:50%;bottom:calc(var(--bottomnav-h) + 18px);transform:translateX(-50%);background:#101828;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:120;box-shadow:var(--shadow-lg);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;}
.toast.hidden{display:none;}
@media(min-width:1024px){.toast{bottom:24px;}}
.explore-link{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--c-primary);white-space:nowrap;padding:4px 2px;flex:none;}
.explore-link svg{width:15px;height:15px;flex:none;}
@media(max-width:639px){.explore-link-text{display:none;}}
.sheet-overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.sheet-overlay.hidden{display:none;}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0));max-height:86vh;overflow-y:auto;animation:sheetUp .18s ease-out;}
@keyframes sheetUp{from{transform:translateY(16px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--c-border);border-radius:4px;margin:0 auto 14px;}
.sheet h3{margin:0 0 4px;font-size:16px;}
@media(min-width:640px){.sheet-overlay{align-items:center;}.sheet{border-radius:16px;}}
.skill-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
.skill-row .skill-label{width:34px;flex:none;font-size:13px;font-weight:700;}
.skill-row .progress{flex:1;}
.skill-row .skill-score{width:56px;flex:none;text-align:right;font-size:12.5px;color:var(--c-muted);font-weight:700;}

/* ---------- 線上測驗專用 ---------- */
.quiz-card{cursor:default;}
.back-list-btn{margin-bottom:12px;}
.q-topbar{position:sticky;top:var(--topbar-h);z-index:40;background:#F5F7FA;padding:14px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;}
@media(min-width:1024px){.q-topbar{margin:0;padding-left:0;padding-right:0;}}
.q-progress-row{display:flex;align-items:center;gap:10px;}
.q-progress-row .progress{flex:1;}
.q-timer{flex:none;font-size:14px;font-weight:700;color:var(--c-primary);background:#E6EEF8;border-radius:20px;padding:4px 12px;white-space:nowrap;}
.q-timer.low{color:#B42318;background:#FBEAEA;}
.qnav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px;}
.qnav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--c-border);background:#fff;font-size:12.5px;font-weight:700;color:var(--c-muted);cursor:pointer;position:relative;font-family:inherit;}
.qnav button.answered{background:#E4F5F0;border-color:#BEE6D9;color:#0B6B52;}
.qnav button.current{border-color:var(--c-primary);color:var(--c-primary);box-shadow:0 0 0 2px #E6EEF8;}
.qnav button.flagged::after{content:'';position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--c-accent);border:1.5px solid #fff;}
.q-type-badge{margin-bottom:8px;}
.q-text{font-size:15.5px;font-weight:700;margin:6px 0 16px;}
.option-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--c-border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;font-size:13.5px;}
.option-row:hover{border-color:var(--c-primary);}
.option-row.selected{border-color:var(--c-primary);background:#F7FAFF;}
.option-row .opt-mark{width:18px;height:18px;flex:none;border:1.5px solid var(--c-border);display:flex;align-items:center;justify-content:center;color:#fff;}
.option-row.selected .opt-mark{background:var(--c-primary);border-color:var(--c-primary);}
.option-row .opt-mark svg{width:12px;height:12px;}
.opt-mark.circle{border-radius:50%;}
.opt-mark.square{border-radius:4px;}
.fill-input{width:100%;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:11px 12px;font-size:14px;font-family:inherit;}
.fill-input:focus{border-color:var(--c-primary);}
.listen-box{background:var(--c-bg);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.listen-play{width:44px;height:44px;border-radius:50%;background:var(--c-primary);color:#fff;border:none;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;}
.listen-play svg{width:18px;height:18px;}
.listen-box.playing .listen-play{background:var(--c-accent);}
.listen-meta{flex:1;min-width:0;}
.listen-meta .lm-title{font-size:12.5px;font-weight:700;color:var(--c-text);margin-bottom:6px;}
.listen-track{height:5px;border-radius:4px;background:var(--c-border);overflow:hidden;}
.listen-track > div{height:100%;width:0%;background:var(--c-primary);transition:width .1s linear;}
.q-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap;}
.flag-btn{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--c-muted);cursor:pointer;font-family:inherit;min-height:40px;}
.flag-btn svg{width:14px;height:14px;}
.flag-btn.on{color:var(--c-accent-dark);border-color:#F5CBA1;background:#FCEBDC;}
.result-score-wrap{text-align:center;padding:8px 0 4px;}
.result-score{font-size:44px;font-weight:800;color:var(--c-primary);line-height:1;}
.result-score span{font-size:18px;color:var(--c-muted);font-weight:700;}
.review-item{border-top:1px solid var(--c-border);padding:12px 0;}
.review-item:first-child{border-top:none;padding-top:0;}
.review-head{display:flex;align-items:flex-start;gap:10px;cursor:pointer;}
.review-head .icon-box{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;}
.review-head .icon-box.ok{background:#E4F5F0;color:#0B6B52;}
.review-head .icon-box.no{background:#FBEAEA;color:#B42318;}
.review-head .icon-box svg{width:15px;height:15px;}
.review-head p{margin:0;font-size:13.5px;font-weight:600;flex:1;}
.review-detail{display:none;margin:8px 0 0 40px;font-size:12.5px;color:var(--c-muted);background:var(--c-bg);border-radius:var(--radius-sm);padding:10px 12px;}
.review-detail.open{display:block;}
.review-detail p{margin:0 0 4px;color:var(--c-muted);font-size:12.5px;font-weight:400;}
.review-detail strong{color:var(--c-text);}
.empty-state{text-align:center;padding:28px 16px;color:var(--c-muted);}
.empty-state h4{color:var(--c-text);font-size:14px;margin:0 0 4px;}
.empty-state p{font-size:12.5px;margin:0;}
.ww-embed-wrap{position:relative;width:100%;padding-top:56%;border:1px solid var(--c-border);border-radius:var(--radius-sm);overflow:hidden;background:var(--c-bg);}
.ww-embed-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.badge-ww{background:#FCEBDC;color:#9A4A0F;}

/* ---------- 次層切換（segment，跨頁導覽） ---------- */
.list-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.list-tools input,.list-tools select{border:1px solid var(--c-border);border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--c-text);min-height:40px;}
.list-tools input{flex:1;min-width:160px;}
.pl-detail{display:none;margin-top:10px;background:var(--c-bg);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--c-muted);}
.pl-detail.open{display:block;}
.pl-detail b{color:var(--c-text);}
.cd-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.nav-segment{display:flex;gap:4px;border-bottom:1px solid var(--c-border);margin:0 0 16px;overflow-x:auto;}
.nav-segment-link{padding:9px 14px;font-size:13.5px;font-weight:700;color:var(--c-muted);white-space:nowrap;border-bottom:2px solid transparent;flex:none;}
.nav-segment-link.active{color:var(--c-primary);border-color:var(--c-primary);}
.nav-segment-link:hover:not(.active){color:var(--c-text);}
.cert-layout{display:grid;gap:18px;grid-template-columns:1fr;}
@media(min-width:1100px){.cert-layout{grid-template-columns:minmax(300px,380px) 1fr;align-items:start;}}
.list-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.list-tools input,.list-tools select{border:1px solid var(--c-border);border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--c-text);min-height:40px;}
.list-tools input{flex:1;min-width:140px;}
.cert-item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;font-family:inherit;margin-bottom:10px;}
.cert-item.sel{border-color:var(--c-primary);box-shadow:0 0 0 2px #E6EEF8;}
.cert-item h4{margin:6px 0 2px;font-size:14.5px;}
.cert-item p{margin:0;font-size:12px;color:var(--c-muted);}
.cert-paper{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
.cert-frame{border:3px double #B8923A;padding:28px 22px;text-align:center;background:linear-gradient(#FFFEFB,#FBF7EC);display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:300px;}
.cert-frame img{height:30px;width:auto;margin:0 auto 6px;}
.cert-frame .c-en{font-size:11px;letter-spacing:.2em;color:#8A6D2B;text-transform:uppercase;}
.cert-frame .c-title{font-size:26px;font-weight:800;color:#1B4E8C;letter-spacing:.2em;}
.cert-frame .c-line{font-size:12.5px;color:var(--c-muted);}
.cert-frame .c-name{font-size:24px;font-weight:800;border-bottom:1px solid #B8923A;display:inline-block;padding:0 24px 4px;margin:6px auto;}
.cert-frame .c-course{font-size:16px;font-weight:700;}
.cert-frame .c-foot{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--c-muted);margin-top:10px;text-align:left;flex-wrap:wrap;}
.verify-box{margin-top:18px;}
.verify-box ol{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--c-muted);}
.verify-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.verify-row input{flex:1;min-width:180px;border:1px solid var(--c-border);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;}
.dl-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
@media(max-width:480px){.cert-frame{padding:18px 12px;min-height:260px;}.cert-frame .c-title{font-size:21px;}.cert-frame .c-name{font-size:20px;padding:0 10px 4px;}}
@media print{body *{visibility:hidden;}#certPaper,#certPaper *{visibility:visible;}#certPaper{position:absolute;left:0;top:0;width:100%;border:none;box-shadow:none;}}

.tr-paper{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
.tr-sheet{border:1px solid #98A2B3;padding:22px 20px;background:#fff;}
.tr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid #1B4E8C;padding-bottom:10px;flex-wrap:wrap;}
.tr-head img{height:28px;width:auto;}
.tr-head .t1{font-size:19px;font-weight:800;color:#1B4E8C;text-align:right;}
.tr-head .t2{font-size:11px;letter-spacing:.14em;color:var(--c-muted);text-transform:uppercase;text-align:right;}
.tr-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;margin:12px 0;font-size:13px;}
.tr-meta span{display:block;color:var(--c-muted);font-size:11.5px;}
.tr-meta b{font-weight:700;}
.tr-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}

<script>
var TT=function(zh,en){ return TLI_I18N.t(zh,en); };
function $(i){return document.getElementById(i);}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function toggleBell(){$('bellPanel').classList.toggle('open');}
function hashS(s){ var x=7; for(var i=0;i<s.length;i++){ x=(x*31+s.charCodeAt(i))>>>0; } return x; }
var WHO = window.TLI_PL ? TLI_PL.me() : {mode:'general',name:'Emma Johnson',rid:'gen',email:'emma.johnson@example.com'};
var IS_PROJ = WHO.mode==='project';
var CONSULT=new URLSearchParams(location.search).get('consult')?new URLSearchParams(location.search).get('id'):null, CNAME=new URLSearchParams(location.search).get('name');
var NAME_EN = {'發音基礎 20 講':'Pronunciation Basics (20 lectures)','商務華語情境 16 講':'Business Chinese in Context (16 lectures)','中文一對一－會話進階':'Chinese 1-on-1: Advanced Conversation','旅遊華語會話 12 講':'Travel Chinese Conversation (12 lectures)','商務書信寫作 8 講':'Business Letter Writing (8 lectures)','台灣文化與生活 10 講':'Taiwan Culture and Life (10 lectures)','成語與慣用語 12 講':'Idioms and Expressions (12 lectures)','職場面試會話 10 講':'Job Interview Conversation (10 lectures)','中華文化與歷史 8 講':'Chinese Culture and History (8 lectures)'};
function NM(zh){ return TT(zh, NAME_EN[zh]||zh); }

/* ---- 資料：程度測驗（p15 寫入的 localStorage ＋ 既有歷史一筆）---- */
var PL_KEY='tliPlacementResults_v1';
var PL_SEED=[{id:'pt_seed_emma', studentId:'emma01', lang:'zh', langName:'中文', date:'2026-06-12', listening:2, listeningMax:5, reading:1, readingMax:5, total:3, totalMax:10, level:'Lv.3', levelNum:3, rangeName:'初級', cefr:'A1–A2'}];
var LANG_EN={'中文':'Chinese','英文':'English','日文':'Japanese','韓文':'Korean','德文':'German','法文':'French'};
function placementRecords(){
  var all=[]; try{ all=JSON.parse(localStorage.getItem(PL_KEY))||[]; }catch(e){}
  if(CONSULT){ try{ var jr=JSON.parse(new URLSearchParams(location.search).get('rec')||'null'); if(jr&&jr.id===CONSULT){ if(CNAME) WHO={mode:'general',name:CNAME,rid:'gen',email:''}; IS_PROJ=false; return [jr]; } }catch(e){} var one=all.concat(PL_SEED).filter(function(r){ return r.id===CONSULT; }); if(one.length){ if(CNAME) WHO={mode:'general',name:CNAME,rid:'gen',email:''}; IS_PROJ=false; return one; } }
  if(IS_PROJ){ return all.filter(function(r){ return r.email && r.email.toLowerCase()===String(WHO.email||'').toLowerCase(); }).sort(function(a,b){return b.date.localeCompare(a.date);}); }
  var mine=all.filter(function(r){ return r.studentId==='emma01' || r.email==='emma.johnson@example.com'; });
  return mine.concat(PL_SEED).sort(function(a,b){return b.date.localeCompare(a.date);});
}
/* ---- 資料：課程成績（隨堂／單元考）。一般學生取線上測驗頁的已完成紀錄；專案學生由自學單元進度推算 ---- */
var EMMA_DONE=[
 {code:'c1',course:'發音基礎 20 講',unit:'L05 兒化音',title:'兒化音評量',kind:'單元考',date:'2026-08-20',score:88,pass:60},
 {code:'c2',course:'商務華語情境 16 講',unit:'L03 商務會議開場',title:'商務會議開場評量',kind:'單元考',date:'2026-08-15',score:92,pass:60},
 {code:'c3',course:'中文一對一－會話進階',unit:'第一階',title:'第一階複習評量',kind:'單元考',date:'2026-08-06',score:58,pass:60},
 {code:'c4',course:'發音基礎 20 講',unit:'L20 總複習',title:'總複習評量',kind:'單元考',date:'2026-07-30',score:85,pass:60},
 {code:'c6',course:'旅遊華語會話 12 講',unit:'L08 期末情境',title:'期末情境評量',kind:'單元考',date:'2026-02-01',score:80,pass:70},
 {code:'c7',course:'台灣文化與生活 10 講',unit:'L05',title:'期末評量',kind:'單元考',date:'2025-11-10',score:74,pass:70},
 {code:'c8',course:'商務書信寫作 8 講',unit:'L03',title:'單元評量',kind:'單元考',date:'2025-08-18',score:70,pass:60},
 {code:'c9',course:'成語與慣用語 12 講',unit:'L03',title:'單元評量',kind:'單元考',date:'2025-05-12',score:82,pass:60},
 {code:'c10',course:'職場面試會話 10 講',unit:'L03',title:'單元評量',kind:'單元考',date:'2025-03-02',score:78,pass:60},
 {code:'c11',course:'中華文化與歷史 8 講',unit:'L03',title:'單元評量',kind:'單元考',date:'2024-09-18',score:65,pass:60},
 {code:'c12',course:'發音基礎 20 講',unit:'L01 入門',title:'入門單元評量',kind:'單元考',date:'2024-02-10',score:60,pass:60}
];
function courseTranscripts(){
  var rows=[];
  if(!IS_PROJ){
    EMMA_DONE.forEach(function(r){ rows.push({course:r.course,unit:r.unit,kind:r.kind,date:r.date,score:r.score,pass:r.pass,attempts:1+(r.code.charCodeAt(1)%3)}); });
  } else {
    var P=TLI_PL.progress(WHO.rid), cname=TLI_PL.courseName();
    P.units.forEach(function(u,i){
      if(u.done<=0) return;
      var done=u.pct>=100;
      var h=hashS(WHO.rid+':u'+u.id);
      rows.push({course:cname,unit:(TT('單元 ','Unit ')+(i+1)+' '+TT(u.zh,u.en)),kind:'單元考',date:(done?TLI_PL.addDays(TLI_PL.today,-(3+i*5)):TLI_PL.today),score:done?(62+h%34):null,pass:60,attempts:done?(1+h%3):0,partial:!done});
    });
    if(!rows.length) return [];
  }
  var by={}, order=[];
  rows.forEach(function(r){ if(!by[r.course]){ by[r.course]=[]; order.push(r.course);} by[r.course].push(r); });
  return order.map(function(c,i){
    var list=by[c].sort(function(a,b){return a.date.localeCompare(b.date);});
    var sc=list.filter(function(r){return r.score!=null;});
    var avg=sc.length?Math.round(sc.reduce(function(a,r){return a+r.score;},0)/sc.length*10)/10:null;
    var last=list[list.length-1].date;
    return {kind:'course',id:'C'+i,course:c,rows:list,avg:avg,passed:sc.filter(function(r){return r.score>=r.pass;}).length,total:sc.length,date:last,
      no:'TLI-T-'+last.slice(0,7).replace('-','')+'-'+('0'+(1+hashS(WHO.rid+c)%90)).slice(-2).padStart(4,'0')};
  }).sort(function(a,b){return b.date.localeCompare(a.date);});
}
function placementTranscripts(){
  return placementRecords().map(function(r){
    return {kind:'placement',id:r.id,rec:r,date:r.date,no:'TLI-T-'+r.date.slice(0,7).replace('-','')+'-P'+('000'+(hashS(String(r.id))%1000)).slice(-3)};
  });
}
var tab=new URLSearchParams(location.search).get('tab')||'placement';
if(tab!=='course'&&tab!=='placement') tab='placement';
if(!new URLSearchParams(location.search).get('tab') && !placementRecords().length) tab='course';
var wantId=new URLSearchParams(location.search).get('id'), wantCourse=new URLSearchParams(location.search).get('course');
var sel=null, list=[];
function listFor(t){ return t==='course'?courseTranscripts():placementTranscripts(); }
function renderTabs(){
  document.querySelectorAll('#trTabs .tr-tab').forEach(function(b){ b.classList.toggle('active', b.dataset.t===tab); });
}
function render(){
  renderTabs();
  list=listFor(tab);
  if(!list.length){
    $('trLayout').classList.add('hidden'); $('trEmpty').classList.remove('hidden');
    if(tab==='placement'){ $('trEmptyT').textContent=TT('尚無程度測驗成績單','No placement test transcripts yet'); $('trEmptyD').textContent=TT('完成程度測驗後，成績單會顯示在這裡。','Complete a placement test and the transcript appears here.'); $('trEmptyA').textContent=TT('前往程度測驗','Take a placement test'); $('trEmptyA').href='../公開網站/p15_placement_test.html'; }
    else { $('trEmptyT').textContent=TT('尚無課程成績單','No course transcripts yet'); $('trEmptyD').textContent=TT('完成隨堂考或單元考後，課程成績單會顯示在這裡。','Complete a quiz or unit test and the course transcript appears here.'); $('trEmptyA').textContent=TT('前往自學課程','Go to the self-paced course'); $('trEmptyA').href='m08_self_paced.html'; }
    sel=null; return;
  }
  $('trEmpty').classList.add('hidden'); $('trLayout').classList.remove('hidden');
  if(!sel || !list.some(function(x){return x.kind===sel.kind&&x.id===sel.id;})) sel=list[0];
  $('trList').innerHTML=list.map(function(x){
    var on=sel&&x.kind===sel.kind&&x.id===sel.id;
    var h,p;
    if(x.kind==='placement'){ var r=x.rec; h=TT(r.langName+'程度測驗成績單',(LANG_EN[r.langName]||r.langName)+' placement test transcript'); p=TT('測驗日期 ','Test date ')+r.date+' · '+TT('建議等級 ','Suggested level ')+r.level; }
    else { h=NM(x.course)+TT(' 課程成績單',' course transcript'); p=TT('單元考 ','Unit tests ')+x.total+' · '+(x.avg==null?TT('尚無平均','No average yet'):TT('平均 ','Average ')+x.avg); }
    return '<button type="button" class="cert-item'+(on?' sel':'')+'" data-k="'+x.kind+'" data-i="'+esc(x.id)+'"><span class="badge badge-info">'+esc(x.no)+'</span><h4>'+esc(h)+'</h4><p>'+esc(p)+'</p></button>';
  }).join('');
  $('trList').querySelectorAll('.cert-item').forEach(function(b){ b.onclick=function(){ sel=list.filter(function(x){return x.kind===b.dataset.k&&x.id===b.dataset.i;})[0]; render(); if(window.innerWidth<1100) $('trPaper').scrollIntoView({behavior:'smooth',block:'start'}); }; });
  fillSheet();
}
function metaHtml(x,extra){
  var cells=[[TT('學生姓名','Student'),WHO.name],[TT('成績單編號','Transcript no.'),x.no],[TT('發出日期','Issued on'),x.date]].concat(extra||[]);
  if(IS_PROJ) cells.push([TT('所屬','Program'),WHO.partnerName+'・'+WHO.className]);
  return '<div class="tr-meta">'+cells.map(function(c){ return '<div><span>'+esc(c[0])+'</span><b>'+esc(c[1])+'</b></div>'; }).join('')+'</div>';
}
function sheetHead(zh,en){
  return '<div class="tr-head"><img src="../assets/tli-logo.svg" alt="TLI"><div><div class="t1">'+esc(TT(zh,en))+'</div><div class="t2">Official Score Report</div></div></div>';
}
function signHtml(){ return '<div class="tr-sign"><span>'+TT('TLI 中華語文研習所　教務處','TLI Chinese Language Institute, Academic Affairs')+'</span><span class="sg">'+TT('教務處承辦人','Registrar')+'</span></div><div class="tr-note">'+TT('本成績單僅列各項得分，不具證書效力。結業證書於通過結業考後另行核發。','This transcript lists scores only and is not a certificate. A completion certificate is issued separately after a final exam.')+'</div>'; }
function fillSheet(){
  if(!sel) return; var x=sel, h='';
  if(x.kind==='placement'){
    var r=x.rec, pct=function(a,b){ return b?Math.round(a/b*100):0; };
    h=sheetHead('程度測驗成績單','Placement Test Transcript')+metaHtml(x,[[TT('測驗日期','Test date'),r.date],[TT('測驗語言','Language'),TT(r.langName,LANG_EN[r.langName]||r.langName)]])+
      '<table class="tr-tbl"><tr><th>'+TT('項目','Section')+'</th><th class="num">'+TT('得分','Score')+'</th><th class="num">'+TT('滿分','Max')+'</th><th class="num">'+TT('百分比','Percent')+'</th></tr>'+
      '<tr><td>'+TT('聽力','Listening')+'</td><td class="num">'+r.listening+'</td><td class="num">'+r.listeningMax+'</td><td class="num">'+pct(r.listening,r.listeningMax)+'%</td></tr>'+
      '<tr><td>'+TT('閱讀','Reading')+'</td><td class="num">'+r.reading+'</td><td class="num">'+r.readingMax+'</td><td class="num">'+pct(r.reading,r.readingMax)+'%</td></tr>'+
      '<tr><td><b>'+TT('合計','Total')+'</b></td><td class="num"><b>'+r.total+'</b></td><td class="num">'+r.totalMax+'</td><td class="num">'+pct(r.total,r.totalMax)+'%</td></tr></table>'+
      '<div class="tr-sum"><div>'+TT('建議等級','Suggested level')+' <b>'+esc(r.level)+'</b>（'+esc(r.rangeName||'')+'）</div><div>'+TT('對應 CEFR','CEFR')+' <b>'+esc(r.cefr||'－')+'</b></div></div>'+signHtml();
  } else {
    h=sheetHead('課程成績單','Course Transcript')+metaHtml(x,[[TT('課程','Course'),NM(x.course)]])+
      '<table class="tr-tbl"><tr><th>'+TT('單元','Unit')+'</th><th>'+TT('考試','Test')+'</th><th class="num">'+TT('分數','Score')+'</th><th>'+TT('達標','Result')+'</th><th class="num">'+TT('刷題次數','Attempts')+'</th><th>'+TT('日期','Date')+'</th></tr>'+
      x.rows.map(function(r){
        var ok=r.score!=null&&r.score>=r.pass;
        return '<tr><td>'+esc(r.unit)+'</td><td>'+TT(r.kind,'Unit test')+'</td><td class="num">'+(r.score==null?'－':r.score)+'</td><td>'+(r.score==null?TT('進行中','In progress'):(ok?'<span class="tr-ok">'+TT('達標','Passed')+'</span>':'<span class="tr-ng">'+TT('未達標','Not passed')+'</span>'))+' <span class="small muted">('+TT('門檻 ','pass ')+r.pass+')</span></td><td class="num">'+r.attempts+'</td><td>'+r.date+'</td></tr>';
      }).join('')+'</table>'+
      '<div class="tr-sum"><div>'+TT('課程平均','Course average')+' <b>'+(x.avg==null?'－':x.avg)+'</b></div><div>'+TT('達標單元','Units passed')+' <b>'+x.passed+' / '+x.total+'</b></div></div>'+signHtml();
  }
  $('trSheet').innerHTML=h;
}
function downloadPdf(){ if(!sel) return; showToast(TT('已產生 PDF：','PDF generated: ')+sel.no+'.pdf'); setTimeout(function(){ try{ window.print(); }catch(e){} },350); }
function copyNo(){ if(!sel) return; try{ navigator.clipboard.writeText(sel.no).then(function(){showToast(TT('已複製成績單編號','Transcript number copied'));},function(){showToast(TT('成績單編號：','Transcript no.: ')+sel.no);}); }catch(e){ showToast(TT('成績單編號：','Transcript no.: ')+sel.no); } }
document.querySelectorAll('#trTabs .tr-tab').forEach(function(b){
  b.addEventListener('click',function(){
    tab=b.dataset.t; sel=null; render();
  });
});
(function(){
  var l=listFor(tab);
  if(tab==='placement'&&wantId){ sel=l.filter(function(x){return x.id===wantId;})[0]||null; }
  if(tab==='course'&&wantCourse){ sel=l.filter(function(x){return x.course===wantCourse;})[0]||null; }
  render();
})();
document.addEventListener('keydown',function(e){ if(e.key==='Escape') $('bellPanel').classList.remove('open'); });
TLI_I18N.onRefresh(render);
TLI_I18N.init();
if(window.TLI_PL && IS_PROJ) TLI_PL.xl(document);
</script>
</body>
</html>
