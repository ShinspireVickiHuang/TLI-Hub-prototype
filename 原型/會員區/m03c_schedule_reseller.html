<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLI Connect 會員區－課表（經銷學生）</title>
<style>
:root{
  --c-primary:#1B4E8C;--c-primary-dark:#123A68;--c-accent:#E8792B;--c-accent-dark:#CF691F;--c-secondary:#0F9B79;
  --c-bg:#F5F7FA;--c-border:#E4E7EC;--c-muted:#667085;--c-text:#101828;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-lg:0 8px 24px rgba(16,24,40,.16);
  --topbar-h:52px;--bottomnav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;font-size:15px;-webkit-tap-highlight-color:transparent;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;}
button{font-family:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.app{min-height:100vh;position:relative;}
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-logo-wrap{width:26px;height:22px;overflow:hidden;position:relative;flex:none;}
.topbar-logo-wrap img{position:absolute;left:0;top:0;height:22px;width:auto;max-width:none;}
.topbar-title{font-size:16.5px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:6px;position:relative;}
.bell-btn{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--c-border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-muted);}
.bell-btn svg{width:16px;height:16px;}
.bell-btn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--c-accent);border:1.5px solid #fff;}
.bell-panel{display:none;position:absolute;right:0;top:40px;width:264px;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:6px 0;z-index:90;}
.bell-panel.open{display:block;}
.bell-panel h4{margin:0;padding:8px 14px 6px;font-size:12.5px;color:var(--c-muted);font-weight:700;}
.bell-item{padding:9px 14px;font-size:12.5px;border-top:1px solid var(--c-border);display:flex;gap:8px;}
.bell-item .b-dot{width:6px;height:6px;border-radius:50%;background:var(--c-accent);margin-top:5px;flex:none;}
.bell-item p{margin:0;color:var(--c-text);}
.bell-item span{color:var(--c-muted);font-size:11px;}
.side-nav{display:none;}
@media(min-width:1024px){
  .side-nav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:310px;background:#fff;border-right:1px solid var(--c-border);padding:18px 12px;z-index:50;}
  .side-brand{display:flex;align-items:center;padding:0 8px 18px;}
  .side-brand img{height:28px;width:auto;}
  .side-identity{padding:0 8px 14px;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--c-text);border-bottom:1px solid var(--c-border);}
  .side-link{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--c-muted);margin-bottom:2px;}
  .side-link svg{width:19px;height:19px;flex:none;}
  .side-link.active{background:#E6EEF8;color:var(--c-primary);}
  .side-link:hover:not(.active){background:var(--c-bg);}
  .side-sep{border-top:1px solid var(--c-border);margin:8px 6px;}
  .app.has-side .topbar{margin-left:310px;}
  .app.has-side .content{margin-left:310px;}
}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--c-border);display:flex;height:var(--bottomnav-h);padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(16,24,40,.06);}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--c-muted);font-weight:600;min-height:44px;}
.bottom-nav a svg{width:22px;height:22px;}
.bottom-nav a.active{color:var(--c-primary);}
@media(min-width:1024px){.bottom-nav{display:none;}}
.content{max-width:960px;margin:0 auto;padding:18px 16px calc(var(--bottomnav-h) + 24px);}
@media(min-width:1024px){.content{padding:26px 32px 40px;}}
.page-h{font-size:19px;font-weight:700;margin:2px 0 4px;}
.page-sub{color:var(--c-muted);font-size:13px;margin:0 0 18px;}
.section-title{font-size:15px;font-weight:700;margin:24px 0 12px;}
.section-title.first{margin-top:4px;}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.card + .card{margin-top:10px;}
.muted{color:var(--c-muted);}
.small{font-size:12px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;min-height:44px;}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-outline{background:#fff;border:1px solid var(--c-border);color:var(--c-text);}
.btn-outline:hover{background:var(--c-bg);}
.btn-sm{padding:7px 12px;font-size:12.5px;min-height:36px;}
.btn-block{width:100%;}
.banner{border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:9px;align-items:flex-start;}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px;}
.banner-info{background:#E6EEF8;color:var(--c-primary-dark);border:1px solid #C7DAF0;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-info{background:#E6EEF8;color:var(--c-primary);}
.badge-ok{background:#E4F5F0;color:#0B6B52;}
.badge-muted{background:var(--c-border);color:var(--c-muted);}
.badge-accent{background:#FBEADD;color:var(--c-accent-dark);}
.hidden{display:none!important;}
.toast{position:fixed;left:50%;bottom:calc(var(--bottomnav-h) + 18px);transform:translateX(-50%);background:#101828;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:120;box-shadow:var(--shadow-lg);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;}
.toast.hidden{display:none;}
@media(min-width:1024px){.toast{bottom:24px;}}
/* ---------- 課表專用：可展開的日期列 ---------- */
.day-card{padding:14px 16px;}
.day-card.today{border-color:var(--c-primary);box-shadow:0 0 0 1px var(--c-primary),var(--shadow);}
.day-card.weekend{background:var(--c-bg);}
.day-head{display:flex;align-items:center;gap:12px;cursor:pointer;}
.day-head .datebox{min-width:46px;width:auto;flex:none;text-align:center;}
.day-head .datebox .dow{font-size:11px;color:var(--c-muted);}
.day-head .datebox .dnum{font-size:17px;font-weight:800;}
.day-head .body{flex:1;min-width:0;}
.day-head .body h4{margin:0;font-size:14px;font-weight:700;}
.day-head .body p{margin:3px 0 0;font-size:12px;color:var(--c-muted);}
.day-head .chevron{width:18px;height:18px;color:var(--c-muted);transition:transform .15s;flex:none;}
.day-head.open .chevron{transform:rotate(180deg);}
.day-head.no-expand .chevron{visibility:hidden;}
.day-body{margin-top:12px;padding-top:12px;padding-left:58px;border-top:1px solid var(--c-border);}
.day-body.hidden{display:none;}
.day-body p{margin:0 0 8px;font-size:13px;}
.day-body .note{color:var(--c-muted);font-size:12px;margin-bottom:10px;}
.weekgroup-title{font-size:12.5px;font-weight:700;color:var(--c-muted);margin:20px 0 8px;text-transform:uppercase;letter-spacing:.02em;}
.weekgroup-title.first{margin-top:2px;}
</style>
</head>

<script>
function T(zh,en){ return window.TLI_I18N ? TLI_I18N.t(zh,en) : zh; }
/* ===================== 介面語系（20260929 新增）：經銷夥伴「環球遊學顧問」（partners.p11） ===================== */
function restrictPartnerLocales(){
  if (!window.TLI_I18N || !window.TLI_MASTERS) return;
  var p = TLI_MASTERS.partners.find(function(x){ return x.name.indexOf('環球遊學顧問') >= 0; }) || {};
  var allowed = (p.uiLocales && p.uiLocales.length) ? p.uiLocales : ['zh-TW','zh-CN','en'];
  document.querySelectorAll('.tli-i18n-opt').forEach(function(btn){
    if (allowed.indexOf(btn.getAttribute('data-lang')) === -1) btn.style.display = 'none';
  });
  if (allowed.indexOf(TLI_I18N.currentLang()) === -1) TLI_I18N.apply(allowed[0]);
}
if (window.TLI_I18N) TLI_I18N.init();
restrictPartnerLocales();

function toggleBell(){document.getElementById('bellPanel').classList.toggle('open');}
document.addEventListener('click',function(e){
  if(!e.target.closest('.bell-btn')&&!e.target.closest('.bell-panel'))document.getElementById('bellPanel').classList.remove('open');
});
function showToast(msg){
  var t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;
  t.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(function(){t.classList.add('hidden');},2200);
}

var ICON_CHEVRON='<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

/* 示範「今天」＝10/08（四），對齊首頁今日課程卡；10 個實體上課日（含 1 天校外教學），
   4 天週末／賦歸日不屬於 TLI 課程，僅顯示經銷商安排的行程說明。unit 對應 m08c 教材單元代號，
   查無對應 unit 的日子不顯示「前往教材」按鈕。 */
var TODAY_STR = '10/08';
var DAYS = [
  {date:'10/05', dow:'一', type:'class', room:'302 教室', topic:'機場入境與問候・自我介紹', unit:null},
  {date:'10/06', dow:'二', type:'class', room:'302 教室', topic:'數字時間與日常招呼', unit:null},
  {date:'10/07', dow:'三', type:'class', room:'302 教室', topic:'校園環境與教室用語', unit:null},
  {date:'10/08', dow:'四', type:'class', room:'302 教室', topic:'機場與交通用語', unit:'u1'},
  {date:'10/09', dow:'五', type:'class', room:'302 教室', topic:'點餐與美食情境會話', unit:'u2'},
  {date:'10/10', dow:'六', type:'off', note:'經銷商安排行程：九份、十分小旅行', noteEn:'Itinerary arranged by consultant: Jiufen, Shifen day trip'},
  {date:'10/11', dow:'日', type:'off', note:'經銷商安排行程：台北市區自由活動', noteEn:'Itinerary arranged by consultant: Free time in Taipei city'},
  {date:'10/12', dow:'一', type:'outing', room:'校門口集合', topic:'校外教學：迪化街文化走讀（8:30 校門口集合，陳美惠老師帶隊）', topicEn:'Field trip: Dihua Street cultural walk (gather at the school gate 8:30, led by Teacher Chen)', unit:null},
  {date:'10/13', dow:'二', type:'class', room:'302 教室', topic:'購物與殺價會話', unit:'u4'},
  {date:'10/14', dow:'三', type:'class', room:'302 教室', topic:'問路與方向指引', unit:'u3'},
  {date:'10/15', dow:'四', type:'class', room:'302 教室', topic:'生活會話總複習', unit:'u5'},
  {date:'10/16', dow:'五', type:'class', room:'302 教室', topic:'文化體驗會話：茶道與書法', unit:'u6'},
  {date:'10/17', dow:'六', type:'off', note:'經銷商安排行程：陽明山文化走讀', noteEn:'Itinerary arranged by consultant: Yangming Mountain cultural walk'},
  {date:'10/18', dow:'日', type:'off', note:'經銷商安排行程：自由活動、打包行李', noteEn:'Itinerary arranged by consultant: Free time, packing'},
  {date:'10/19', dow:'一', type:'depart', note:'本日無課程安排（賦歸整理與返程）', noteEn:'No class scheduled today (departure preparations and travel home)'}
];
var UNIT_TITLE = {u1:'機場與交通用語', u2:'點餐與美食情境會話', u3:'問路與方向指引', u4:'購物與殺價會話', u5:'生活會話總複習', u6:'文化體驗會話：茶道與書法'};

function dayStatus(d){
  if(d.date===TODAY_STR) return {label:T('今天','Today'), cls:'badge-info'};
  if(d.date<TODAY_STR) return {label:T('已上完','Completed'), cls:'badge-ok'};
  return {label:T('未上','Not Yet'), cls:'badge-muted'};
}
function isExpandable(d){ return d.type==='class' || d.type==='outing' || d.type==='off'; }

function renderDays(){
  var wrap = document.getElementById('dayList');
  var html = '';
  var weekLabels = {0:T('第一週','Week 1'), 7:T('第二週','Week 2')};
  var WEEKDAY_FULL = {'一':T('一','Mon'),'二':T('二','Tue'),'三':T('三','Wed'),'四':T('四','Thu'),'五':T('五','Fri'),'六':T('六','Sat'),'日':T('日','Sun')};
  DAYS.forEach(function(d, idx){
    if(weekLabels[idx]!==undefined){
      html += '<div class="weekgroup-title'+(idx===0?' first':'')+'">'+weekLabels[idx]+'</div>';
    }
    var expandable = isExpandable(d);
    var isWeekend = d.type==='off';
    var isToday = d.date===TODAY_STR;
    var cardCls = 'card day-card'+(isToday?' today':'')+(isWeekend?' weekend':'');
    html += '<div class="'+cardCls+'" id="dayCard-'+idx+'">';
    html += '<div class="day-head'+(expandable?'':' no-expand')+'" id="dayHead-'+idx+'" '+(expandable?('onclick="toggleDay('+idx+')"'):'')+'>';
    html += '<div class="datebox"><div class="dow">'+T('週','')+WEEKDAY_FULL[d.dow]+'</div><div class="dnum">'+d.date+'</div></div>';
    html += '<div class="body">';
    if(d.type==='class'){
      html += '<h4>'+T('09:00－12:00 實體華語課','09:00–12:00 In-Person Chinese Class')+'</h4><p>'+T('羅斯福校區・','Roosevelt Campus・')+T(d.room,'Room 302')+T('・陳美惠老師','・Teacher Chen')+'</p>';
    } else if(d.type==='outing'){
      html += '<h4>'+T('校外教學','Field Trip')+'</h4><p>'+T(d.topic, d.topicEn)+'</p>';
    } else if(d.type==='off'){
      html += '<h4>'+T('週末','Weekend')+'</h4><p>'+T(d.note, d.noteEn)+'</p>';
    } else {
      html += '<h4>'+T('賦歸日','Departure Day')+'</h4><p>'+T(d.note, d.noteEn)+'</p>';
    }
    html += '</div>';
    if(d.type==='class' || d.type==='outing'){
      var st = dayStatus(d);
      html += '<span class="badge '+st.cls+'" style="margin-right:2px;">'+st.label+'</span>';
    } else if(d.type==='off'){
      html += '<span class="badge badge-accent">'+T('經銷商安排','Arranged by Consultant')+'</span>';
    } else {
      html += '<span class="badge badge-muted">'+T('賦歸','Departure')+'</span>';
    }
    if(expandable) html += ICON_CHEVRON;
    html += '</div>'; // day-head

    if(expandable){
      html += '<div class="day-body hidden" id="dayBody-'+idx+'">';
      if(d.type==='off'){
        html += '<p><b>'+T('行程內容：','Itinerary: ')+'</b>'+T(d.note, d.noteEn)+'</p>';
        html += '<p class="note">'+T('此為週末／假日行程，由合作的遊學顧問（經銷商）安排與帶隊，非 TLI 課程時段；如需異動請洽遊學顧問。','This is a weekend/holiday itinerary arranged and led by the partner study-abroad consultant, not a TLI class session; contact your consultant for any changes.')+'</p>';
      } else {
        html += '<p><b>'+T('今日主題：','Today’s Topic: ')+'</b>'+T(d.topic, d.topicEn)+'</p>';
        if(d.unit && UNIT_TITLE[d.unit]){
          html += '<p class="note">'+T('搭配教材單元：','Paired unit: ')+UNIT_TITLE[d.unit]+'</p>';
          html += '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();location.href=\'m08c_self_paced_reseller.html?unit='+d.unit+'\'">'+T('前往教材單元','Go to Unit')+'</button>';
        } else {
          html += '<p class="note">'+T('本堂暫無對應線上教材單元。','No matching online unit for this session yet.')+'</p>';
        }
      }
      html += '</div>';
    }
    html += '</div>'; // day-card
  });
  wrap.innerHTML = html;
}

function toggleDay(idx, forceOpen){
  var body = document.getElementById('dayBody-'+idx);
  var head = document.getElementById('dayHead-'+idx);
  if(!body) return;
  var isHidden = body.classList.contains('hidden');
  var willOpen = (forceOpen===true) ? true : (forceOpen===false ? false : isHidden);
  body.classList.toggle('hidden', !willOpen);
  head.classList.toggle('open', willOpen);
}

renderDays();
if (window.TLI_I18N) TLI_I18N.onRefresh(renderDays);
</script>
