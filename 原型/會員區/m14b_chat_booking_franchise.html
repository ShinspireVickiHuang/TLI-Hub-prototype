<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLI Connect 會員區－聊天室與會話預約（加盟）</title>
<style>
:root{
  --c-primary:#1B4E8C;--c-primary-dark:#123A68;--c-accent:#E8792B;--c-accent-dark:#CF691F;--c-secondary:#0F9B79;
  --c-bg:#F5F7FA;--c-border:#E4E7EC;--c-muted:#667085;--c-text:#101828;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-lg:0 8px 24px rgba(16,24,40,.16);
  --topbar-h:52px;--bottomnav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;font-size:15px;-webkit-tap-highlight-color:transparent;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;}
button{font-family:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.app{min-height:100vh;position:relative;}
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-logo-wrap{width:26px;height:22px;overflow:hidden;position:relative;flex:none;}
.topbar-logo-wrap img{position:absolute;left:0;top:0;height:22px;width:auto;max-width:none;}
.topbar-title{font-size:16.5px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:6px;position:relative;}
.bell-btn{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--c-border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-muted);}
.bell-btn svg{width:16px;height:16px;}
.bell-btn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--c-accent);border:1.5px solid #fff;}
.bell-panel{display:none;position:absolute;right:0;top:40px;width:264px;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:6px 0;z-index:90;}
.bell-panel.open{display:block;}
.bell-panel h4{margin:0;padding:8px 14px 6px;font-size:12.5px;color:var(--c-muted);font-weight:700;}
.bell-item{padding:9px 14px;font-size:12.5px;border-top:1px solid var(--c-border);display:flex;gap:8px;}
.bell-item .b-dot{width:6px;height:6px;border-radius:50%;background:var(--c-accent);margin-top:5px;flex:none;}
.bell-item p{margin:0;color:var(--c-text);}
.bell-item span{color:var(--c-muted);font-size:11px;}
.side-nav{display:none;}
@media(min-width:1024px){
  .side-nav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:310px;background:#fff;border-right:1px solid var(--c-border);padding:18px 12px;z-index:50;overflow-y:auto;}
  .side-brand{display:flex;align-items:center;padding:0 8px 18px;}
  .side-brand img{height:28px;width:auto;}
  .side-identity{padding:0 8px 14px;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--c-text);border-bottom:1px solid var(--c-border);}
  .side-link{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--c-muted);margin-bottom:2px;}
  .side-link svg{width:19px;height:19px;flex:none;}
  .side-link.active{background:#E6EEF8;color:var(--c-primary);}
  .side-link:hover:not(.active){background:var(--c-bg);}
  .app.has-side .topbar{margin-left:310px;}
  .app.has-side .content{margin-left:310px;}
}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--c-border);display:flex;height:var(--bottomnav-h);padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(16,24,40,.06);}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--c-muted);font-weight:600;min-height:44px;}
.bottom-nav a svg{width:20px;height:20px;}
.bottom-nav a.active{color:var(--c-primary);}
@media(min-width:1024px){.bottom-nav{display:none;}}
.content{max-width:840px;margin:0 auto;padding:18px 16px calc(var(--bottomnav-h) + 24px);}
@media(min-width:1024px){.content{padding:26px 32px 40px;}}
.page-h{font-size:19px;font-weight:700;margin:2px 0 4px;}
.page-sub{color:var(--c-muted);font-size:13px;margin:0 0 18px;}
.section-title{font-size:15px;font-weight:700;margin:22px 0 12px;}
.section-title.first{margin-top:4px;}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.card + .card{margin-top:12px;}
.muted{color:var(--c-muted);}
.small{font-size:12px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;min-height:44px;}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-accent{background:var(--c-accent);color:#fff;}
.btn-accent:hover{background:var(--c-accent-dark);}
.btn-outline{background:#fff;border:1px solid var(--c-border);color:var(--c-text);}
.btn-outline:hover{background:var(--c-bg);}
.btn:disabled{background:var(--c-border)!important;color:#98A2B3!important;cursor:not-allowed;}
.btn-sm{padding:7px 12px;font-size:12.5px;min-height:36px;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-info{background:#E6EEF8;color:var(--c-primary);}
.badge-warn{background:#FCEBDC;color:var(--c-accent-dark);}
.badge-ok{background:#E4F5F0;color:#0B6B52;}
.badge-muted{background:var(--c-border);color:var(--c-muted);}
.badge-danger{background:#FBEAEA;color:#B42318;}
.badge-invite{background:#F3E8FD;color:#6B21A8;}
.noshow-line{color:#B42318;margin:0 0 12px;font-size:12.5px;display:flex;gap:6px;align-items:flex-start;}
.noshow-line svg{flex:none;margin-top:1px;}
.hidden{display:none!important;}
.banner{border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:9px;align-items:flex-start;}
.banner-info{background:#E6EEF8;color:var(--c-primary-dark);border:1px solid #C7DAF0;}
.banner svg{flex:none;margin-top:1px;}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--c-border);}
.list-row:first-child{border-top:none;padding-top:0;}
.list-row .icon-box{width:38px;height:38px;border-radius:9px;background:var(--c-bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--c-primary);}
.list-row .icon-box svg{width:18px;height:18px;}
.list-row .body{flex:1;min-width:0;}
.list-row .body h4{margin:0;font-size:13.5px;font-weight:700;}
.list-row .body p{margin:2px 0 0;font-size:12px;color:var(--c-muted);}
.list-row .trail{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.mytab-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.mytab-btn{background:#fff;border:1px solid var(--c-border);border-radius:20px;padding:7px 14px;font-size:12.5px;font-family:inherit;color:var(--c-text);cursor:pointer;}
.mytab-btn.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary);}
.mybucket-label{font-size:11.5px;color:var(--c-muted);font-weight:700;margin:14px 0 6px;}
.mybucket-label:first-child{margin-top:0;}
.toast{position:fixed;left:50%;bottom:calc(var(--bottomnav-h) + 18px);transform:translateX(-50%);background:#101828;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:120;box-shadow:var(--shadow-lg);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;}
.toast.hidden{display:none;}
@media(min-width:1024px){.toast{bottom:24px;}}
/* ---------- 聊天室權益層／示範狀態切換（20260910f 新增） ---------- */
.entgate-icon{width:34px;height:34px;border-radius:9px;background:var(--c-bg);display:flex;align-items:center;justify-content:center;color:var(--c-primary);flex:none;margin-bottom:10px;}
.entgate-icon svg{width:18px;height:18px;}
/* ---------- 時間維度重排（20260910j 新增） ---------- */
.select-sm{font-size:12.5px;padding:7px 10px;border:1px solid var(--c-border);border-radius:8px;background:#fff;color:var(--c-text);font-family:inherit;}
.legend-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 10px;}
.legend-list{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--c-muted);}
.legend-item{display:inline-flex;align-items:center;gap:5px;}
.filter-row2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.period-nav2{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.period-nav-btn2{background:#fff;border:1px solid var(--c-border);border-radius:50%;width:32px;height:32px;cursor:pointer;color:var(--c-muted);flex:none;font-size:16px;line-height:1;}
.period-mid2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;}
.week-grid-desktop{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:14px;}
.week-day2{border:1px solid var(--c-border);border-radius:var(--radius-sm);background:#fff;padding:8px 6px;min-height:170px;display:flex;flex-direction:column;min-width:0;}
.week-day2.today2{border-color:var(--c-primary);}
.wd-label2{font-size:10.5px;color:var(--c-muted);text-align:center;}
.wd-date2{font-size:13px;font-weight:700;text-align:center;margin:2px 0 6px;}
.week-day2.today2 .wd-date2{color:var(--c-primary);}
.wd-chips{display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto;}
.day-chip{display:flex;align-items:center;gap:4px;border:none;border-radius:6px;padding:4px 6px;font-size:10.5px;font-weight:600;text-align:left;cursor:pointer;font-family:inherit;width:100%;line-height:1.35;}
.day-chip.open{background:#E6EEF8;color:var(--c-primary-dark);}
.day-chip.assigned{background:#FCEBDC;color:#9A4A0F;}
.day-chip.invited{background:#F3E8FD;color:#6B21A8;}
.day-chip.record{background:var(--c-bg);color:var(--c-muted);}
.day-chip.full2{opacity:.55;}
.src-dot{width:7px;height:7px;border-radius:50%;flex:none;}
.src-dot.open{background:var(--c-primary);}
.src-dot.assigned{background:var(--c-accent-dark);}
.src-dot.invited{background:#6B21A8;}
.chip-src-label{font-weight:700;margin-right:1px;white-space:nowrap;}
.chip-check{width:11px;height:11px;color:#0B6B52;flex:none;margin-left:auto;}
.chip-pending{font-size:9px;font-weight:700;color:#9A4A0F;margin-left:auto;white-space:nowrap;}
.week-list-mobile{display:none;}
.week-row-mobile{border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:8px 10px;}
.week-row-mobile.today2{border-color:var(--c-primary);}
.wr-date{font-size:12px;font-weight:700;margin-bottom:6px;}
.wr-chips{display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto;}
@media(max-width:640px){
  .week-grid-desktop{display:none;}
  .week-list-mobile{display:flex;flex-direction:column;gap:8px;}
}
.month-weekday-row2{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
.month-weekday-row2 span{text-align:center;font-size:11px;color:var(--c-muted);font-weight:700;}
.month-grid2{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.month-day2{border:1px solid var(--c-border);border-radius:8px;background:#fff;min-height:56px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-family:inherit;}
.month-day-empty2{visibility:hidden;pointer-events:none;border:none;}
.month-day2.today2{border-color:var(--c-primary);border-width:2px;}
.month-day2.selected2{background:#E6EEF8;}
.md-num2{font-size:12px;font-weight:700;}
.md-dots2{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap;justify-content:center;align-items:center;}
.month-dot{width:6px;height:6px;border-radius:50%;}
.month-dot.open{background:var(--c-primary);}
.month-dot.assigned{background:var(--c-accent-dark);}
.month-dot.invited{background:#6B21A8;}
.month-dot.muted2{background:var(--c-border);}
.md-count2{font-size:9px;color:var(--c-muted);margin-left:2px;}
.month-agenda-hint{font-size:12.5px;color:var(--c-muted);padding:10px 2px;}
.drawer-overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:110;display:flex;justify-content:flex-end;}
.drawer-overlay.hidden{display:none;}
.drawer{background:#fff;width:100%;max-width:420px;height:100%;overflow-y:auto;padding:20px;box-shadow:var(--shadow-lg);}
@media(max-width:640px){
  .drawer-overlay{align-items:flex-end;justify-content:center;}
  .drawer{max-width:100%;height:auto;max-height:88vh;border-radius:18px 18px 0 0;}
}
.next-card-tag{font-size:12px;color:var(--c-muted);font-weight:700;margin-bottom:6px;}

/* ---------- 次層切換（segment，跨頁導覽） ---------- */
.nav-segment{display:flex;gap:4px;border-bottom:1px solid var(--c-border);margin:0 0 16px;overflow-x:auto;}
.nav-segment-link{padding:9px 14px;font-size:13.5px;font-weight:700;color:var(--c-muted);white-space:nowrap;border-bottom:2px solid transparent;flex:none;}
.nav-segment-link.active{color:var(--c-primary);border-color:var(--c-primary);}
.nav-segment-link:hover:not(.active){color:var(--c-text);}
</style>
</head>

  <header class="topbar">

/* ---------- 聊天室權益層（20260910f 新增） ----------

   (a) 有權益（無 chat 參數或非 none/whitelist_out）→ 正常顯示可報名場次（既有畫面不變）
   (b) chat=none：方案／合約未含團體聊天室型態 → 不顯示場次清單，改顯示說明卡

function addDays(base, days){ var d=new Date(base); d.setDate(d.getDate()+days); return d; }
function fmtDate(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
function stripTime(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function pad2(n){ return n<10 ? '0'+n : ''+n; }
var TODAY = new Date('2026-09-09T09:00:00');
/* 雙時區顯示：以台北時間為主，示範第二時區為美國廠區（美國西部時間，UTC-7），與台北相差 15 小時（全站慣例，示範用簡化換算） */
function secondZoneLabel(date, time){
  var parts = time.split(':');
  var dt = new Date(date);
  dt.setHours(parseInt(parts[0],10), parseInt(parts[1],10), 0, 0);
  var dt2 = new Date(dt.getTime() - 15*60*60*1000);
  var dayDiff = dt2.getDate() === dt.getDate() ? '' : (dt2 < dt ? '（前一天）' : '（隔天）');
  var hh = String(dt2.getHours()).padStart(2,'0');
  var mm = String(dt2.getMinutes()).padStart(2,'0');
  return hh+':'+mm+dayDiff;
}
function combineDateTime(date, time){
  var parts = time.split(':');
  var dt = new Date(date);
  dt.setHours(parseInt(parts[0],10), parseInt(parts[1],10), 0, 0);
  return dt;
}
function hoursUntil(s){ return (combineDateTime(s.date, s.time).getTime() - TODAY.getTime()) / 3600000; }
function isPast(s){ return combineDateTime(s.date, s.time).getTime() + 30*60000 < TODAY.getTime(); }
function canEnter(s){
  var start = combineDateTime(s.date, s.time).getTime();
  var now = TODAY.getTime();
  return now >= start - 5*60000 && now <= start + 30*60000;
}
function mondayOf(d){
  var dt = new Date(d);
  var day = dt.getDay();
  var diff = (day===0 ? -6 : 1-day);
  dt.setDate(dt.getDate()+diff);
  dt.setHours(0,0,0,0);
  return dt;
}
var WEEK0_MONDAY = mondayOf(TODAY);

/* ---------- 我的紀錄（已完成／已取消），與週／月檢視共用同一份資料以呈現歷史場次 ---------- */
function genMyRecord(){
  var arr = [];
  var doneOffsets = [-1,-2,-3,-4,-5,-6,-8,-10,-14,-20,-28,-35,-40];
  doneOffsets.forEach(function(off,i){
    var topic = TOPICS[i % TOPICS.length];
    var teacher = teacherForTopic(topic);
    arr.push({id:'done'+i, topic:topic, teacherName:teacher.name, date:addDays(TODAY,off), time:TIMES[i % TIMES.length], status:(i%5===0?'noshow':'done')});
  });
  var cancelOffsets = [-1,-2,-3,-5,-6,-9,-12,-15,-19,-22,-27,-33];
  cancelOffsets.forEach(function(off,i){
    var topic = TOPICS[(i+1) % TOPICS.length];
    var teacher = teacherForTopic(topic);
    arr.push({id:'can'+i, topic:topic, teacherName:teacher.name, date:addDays(TODAY,off), time:TIMES[(i+2) % TIMES.length], status:'cancelled'});
  });
  return arr;
}

/* ---------- 依日期取得該天所有場次（僅取 SESSIONS；已完成／已取消歷史紀錄只收在頁尾「我的紀錄」，不佈主畫面） ---------- */
function itemsForDate(d){
  var out = [];
  SESSIONS.forEach(function(s){
    if (stripTime(s.date)===stripTime(d)){
      out.push({kind:'session', id:s.id, time:s.time, topic:s.topic, source:s.source, myState:s.myState, full:s.full});
    }
  });
  out.sort(function(a,b){ return a.time < b.time ? -1 : 1; });
  return out;
}
function filteredItemsForDate(d){
  return itemsForDate(d).filter(function(it){
    if (FILTER_TOPIC!=='all' && it.topic!==FILTER_TOPIC) return false;
    if (FILTER_MINE && it.kind==='session' && !it.myState) return false;
    return true;
  });
}
function chipHTML(it){
  if (it.kind==='record'){
    var label = it.status==='cancelled' ? '已取消' : (it.status==='noshow' ? '未出席' : '已完成');

  }
  var srcLabel = it.source==='assigned' ? '指定' : (it.source==='invited' ? '邀請' : '開放');
  var mark = '';
  if (it.myState==='registered' || it.myState==='invited_accepted'){
    mark = '<svg class="chip-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  } else if (it.myState==='invited_pending'){
    mark = '<span class="chip-pending">待回覆</span>';
  }
  return '<button type="button" class="day-chip '+it.source+(it.full?' full2':'')+'" onclick="openDrawer(\''+it.id+'\',\'session\')" data-session-id="'+it.id+'"><span class="src-dot '+it.source+'"></span><span class="chip-src-label">'+srcLabel+'</span>'+it.time+' '+it.topic+mark+'</button>';
}

/* ---------- 週檢視：桌機 7 欄格線／375 寬垂直日期列（雙容器同資料，避免橫向溢出） ---------- */
var WEEKDAY_NAMES = ['一','二','三','四','五','六','日'];
function renderWeek(){
  var start = addDays(WEEK0_MONDAY, weekOffset*7);
  var deskHtml = '', mobHtml = '';
  for (var i=0; i<7; i++){
    var d = addDays(start, i);
    var items = filteredItemsForDate(d);
    var isToday = stripTime(d)===stripTime(TODAY);
    var chips = items.map(chipHTML).join('') || '<span class="small muted" style="font-size:11px;">－</span>';
    deskHtml += '<div class="week-day2'+(isToday?' today2':'')+'"><span class="wd-label2">'+WEEKDAY_NAMES[i]+'</span><span class="wd-date2">'+fmtDate(d)+'</span><div class="wd-chips">'+chips+'</div></div>';
    mobHtml += '<div class="week-row-mobile'+(isToday?' today2':'')+'"><div class="wr-date">'+WEEKDAY_NAMES[i]+'　'+fmtDate(d)+(isToday?'<span class="badge badge-info" style="margin-left:6px;">今天</span>':'')+'</div><div class="wr-chips">'+chips+'</div></div>';
  }
  document.getElementById('weekGridDesktop').innerHTML = deskHtml;
  document.getElementById('weekListMobile').innerHTML = mobHtml;
}

/* ---------- 月檢視：格子只放色點＋數字，點日期在格線下方展開當日場次 ---------- */
function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function renderMonth(){
  var base = new Date(TODAY.getFullYear(), TODAY.getMonth()+monthOffset, 1);
  var total = daysInMonth(base);
  var firstWeekday = (base.getDay()+6) % 7;
  var html = '';
  for (var e=0; e<firstWeekday; e++){ html += '<div class="month-day2 month-day-empty2"></div>'; }
  for (var day=1; day<=total; day++){
    var d = new Date(base.getFullYear(), base.getMonth(), day);
    var items = filteredItemsForDate(d);
    var isToday = stripTime(d)===stripTime(TODAY);
    var isSelected = selectedDay && stripTime(d)===stripTime(selectedDay);
    var dots = items.slice(0,4).map(function(it){
      var cls = it.kind==='record' ? 'muted2' : it.source;
      return '<span class="month-dot '+cls+'"></span>';
    }).join('');
    html += '<button type="button" class="month-day2'+(isToday?' today2':'')+(isSelected?' selected2':'')+'" onclick="selectMonthDay('+day+')">'+
      '<span class="md-num2">'+day+'</span>'+
      (items.length ? '<span class="md-dots2">'+dots+'<span class="md-count2">'+items.length+'</span></span>' : '')+
      '</button>';
  }
  document.getElementById('monthGrid').innerHTML = html;
  renderMonthAgenda();
}
function selectMonthDay(day){
  var base = new Date(TODAY.getFullYear(), TODAY.getMonth()+monthOffset, 1);
  selectedDay = new Date(base.getFullYear(), base.getMonth(), day);
  renderMonth();
}
function renderMonthAgenda(){
  var el = document.getElementById('monthAgenda');
  if (!selectedDay){
    el.innerHTML = '<div class="month-agenda-hint">點選日期查看當日場次</div>';
    return;
  }
  var items = filteredItemsForDate(selectedDay);
  var head = '<div class="small" style="font-weight:700;margin:10px 2px 6px;">'+fmtDate(selectedDay)+'（'+['日','一','二','三','四','五','六'][selectedDay.getDay()]+'）</div>';
  if (!items.length){
    el.innerHTML = head + '<div class="month-agenda-hint">當天沒有符合篩選條件的場次</div>';
    return;
  }
  el.innerHTML = head + '<div class="wr-chips" style="max-height:none;">'+items.map(chipHTML).join('')+'</div>';
}

/* ---------- 下一場：與我有關（已報名／被指定／受邀）且尚未結束的最近一場 ---------- */
function nextCandidate(){
  var now = TODAY.getTime();
  var list = SESSIONS.filter(function(s){
    return ['registered','assigned','invited_pending','invited_accepted'].indexOf(s.myState)>=0 &&
      combineDateTime(s.date,s.time).getTime()+30*60000 >= now;
  });
  list.sort(function(a,b){ return combineDateTime(a.date,a.time)-combineDateTime(b.date,b.time); });
  return list[0] || null;
}
function renderNextCard(){
  var el = document.getElementById('nextCard');
  var s = nextCandidate();
  if (!s){
    el.innerHTML = '<div class="small muted">目前沒有即將到來、與你有關的場次。</div>';
    return;
  }
  el.innerHTML = '<div class="next-card-tag">你的下一場</div>' + sessionDetailHTML(s);
}

/* ---------- 場次詳情（下一場卡片與抽屜共用） ---------- */
function sessionDetailHTML(s){
  var info = TOPIC_INFO[s.topic];
  var teacher = TEACHERS.find(function(t){ return t.id===s.teacherId; }) || TEACHERS[0];
  var srcLabel = s.source==='assigned' ? '指定' : (s.source==='invited' ? '邀請' : '開放');
  var srcCls = s.source==='assigned' ? 'badge-warn' : (s.source==='invited' ? 'badge-invite' : 'badge-info');
  var statusLabel = s.myState==='registered' ? '已報名' : s.myState==='assigned' ? '公司／學校指定' : s.myState==='invited_pending' ? '受邀・待回覆' : s.myState==='invited_accepted' ? '受邀・已接受' : s.myState==='invited_declined' ? '已婉拒邀請' : '開放報名中';
  var html = '';
  html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;flex-wrap:wrap;"><span class="badge '+srcCls+'">'+srcLabel+'</span><span class="small muted">'+statusLabel+'</span></div>';
  html += '<div style="margin:8px 0 4px;font-size:16.5px;font-weight:700;">'+s.topic+'</div>';
  html += '<div class="small muted" style="margin-bottom:10px;line-height:1.7;">台北 '+fmtDate(s.date)+'（'+['日','一','二','三','四','五','六'][s.date.getDay()]+'）'+s.time+'　<span style="color:#98A2B3;">／ 美國廠區（美國西部時間，UTC-7）'+secondZoneLabel(s.date,s.time)+'</span></div>';
  html += '<div class="small" style="margin-bottom:4px;"><b>帶領老師：</b>'+teacher.name+'．'+teacher.intro+'</div>';
  html += '<div class="small muted" style="margin-bottom:10px;">適合等級：'+info.level+'　語言：'+info.language+'</div>';
  html += '<div style="font-size:13.5px;line-height:1.7;margin-bottom:10px;">'+info.intro+'</div>';
  html += '<div class="small" style="font-weight:700;margin-bottom:4px;">討論題綱</div>';
  html += '<ul style="margin:0 0 10px;padding-left:18px;font-size:13px;line-height:1.8;">'+info.outline.map(function(o){ return '<li>'+o+'</li>'; }).join('')+'</ul>';
  if (info.prep){
    html += '<div class="small muted" style="margin-bottom:10px;"><b>事前準備：</b>'+info.prep+'</div>';
  }
  html += '<div class="small muted" style="margin-bottom:14px;">已報名 '+s.registered+' 人／名額（依型態設定）</div>';
  if (s.restrictedDepts && s.restrictedDepts.length){
    html += '<div class="small muted" style="margin-bottom:14px;">限定科系：'+s.restrictedDepts.join('、')+'</div>';
  }
  html += '<div>'+sessionActionsHTML(s)+'</div>';
  return html;
}
/* 科系限定：場次設定「適用科系」時，示範學生所屬科系（DEMO_STUDENT_DEPT_NAME）不在名單內即不可報名，
   顯示原因文字取代報名按鈕；不影響已報名／被指定／受邀等既有狀態的動作。 */
function deptRestrictionReason(s){
  if (!s.restrictedDepts || !s.restrictedDepts.length) return null;
  if (s.restrictedDepts.indexOf(DEMO_STUDENT_DEPT_NAME) > -1) return null;
  return '此場次限'+s.restrictedDepts.join('、')+'學生報名';
}
function sessionActionsHTML(s){
  if (canEnter(s) && (s.myState==='registered' || s.myState==='invited_accepted' || s.myState==='assigned')){
    return '<button type="button" class="btn btn-primary" style="width:100%;" onclick="enterChatClassroom(\''+s.id+'\')">進教室</button>';
  }
  if (s.myState==='assigned'){
    return '<div class="small muted">由公司／學校指定，如需異動請洽 HR／學校窗口</div>';
  }
  if (s.myState==='invited_pending'){
    return '<button type="button" class="btn btn-accent" style="width:100%;margin-bottom:8px;" onclick="acceptInvite(\''+s.id+'\')">接受</button>'+
      '<button type="button" class="btn btn-outline" style="width:100%;" onclick="declineInvite(\''+s.id+'\')">婉拒</button>';
  }
  if (s.myState==='invited_declined'){
    return '<div class="small muted">已婉拒此邀請</div>';
  }
  if (s.myState==='registered' || s.myState==='invited_accepted'){
    if (hoursUntil(s) >= 12){
      return '<button type="button" class="btn btn-outline" style="width:100%;" onclick="cancelSession(\''+s.id+'\')">取消報名</button>';
    }
    return '<div class="small muted">已在 12 小時內，無法取消；未出席將記錄</div>';
  }
  if (isPast(s)){
    return '<div class="small muted">場次已結束</div>';
  }
  if (s.full){
    return '<div class="small muted">已額滿</div>';
  }
  var deptReason = deptRestrictionReason(s);
  if (deptReason){
    return '<div class="small muted">'+deptReason+'</div>';
  }
  if (WEEKLY_LIMIT_DEMO - usedInWeekOf(s.date) <= 0){
    return '<div class="small muted">已達本週上限</div>';
  }
  return '<button type="button" class="btn btn-accent" style="width:100%;" onclick="registerSession(\''+s.id+'\')">報名</button>';
}

/* ---------- 抽屜（場次詳情／我的紀錄詳情） ---------- */
var currentDrawer = null;
function openDrawer(id, kind){
  currentDrawer = {id:id, kind:kind};
  var body = document.getElementById('drawerBody');
  if (kind==='session'){
    var s = SESSIONS.find(function(x){ return x.id===id; });
    body.innerHTML = s ? sessionDetailHTML(s) : '';
  } else {
    var r = MY_RECORD.find(function(x){ return x.id===id; });
    body.innerHTML = r ? recordDetailHTML(r) : '';
  }
  document.getElementById('drawerOverlay').classList.remove('hidden');
}
function closeDrawer(){
  document.getElementById('drawerOverlay').classList.add('hidden');
  currentDrawer = null;
}
function handleOverlayClick(e){
  if (e.target && e.target.id==='drawerOverlay') closeDrawer();
}
function recordDetailHTML(r){
  var info = TOPIC_INFO[r.topic];
  var label = r.status==='cancelled' ? '已取消' : (r.status==='noshow' ? '未出席' : '已完成');
  var cls = r.status==='noshow' ? 'badge-danger' : (r.status==='cancelled' ? 'badge-muted' : 'badge-ok');
  var html = '';
  html += '<div style="margin-bottom:2px;"><span class="badge '+cls+'">'+label+'</span></div>';
  html += '<div style="margin:8px 0 4px;font-size:16.5px;font-weight:700;">'+r.topic+'</div>';
  html += '<div class="small muted" style="margin-bottom:10px;">台北 '+fmtDate(r.date)+' '+r.time+'</div>';
  html += '<div class="small" style="margin-bottom:10px;"><b>帶領老師：</b>'+r.teacherName+'</div>';
  if (info){ html += '<div style="font-size:13px;line-height:1.7;color:var(--c-muted);">'+info.intro+'</div>'; }
  return html;
}

/* ---------- 動作：報名／取消／接受／婉拒 ---------- */
/* 進教室（加盟版）：教室連結由系統於開課前寄送至學生信箱，本頁不直接導向直營教室頁 m16 */
function enterChatClassroom(id){
  showToast('教室連結已寄送至你的信箱，請於場次開始前開啟');
}
function registerSession(id){
  var s = SESSIONS.find(function(x){ return x.id===id; });
  if (!s || s.myState || s.full || isPast(s) || deptRestrictionReason(s)) return;
  if (WEEKLY_LIMIT_DEMO - usedInWeekOf(s.date) <= 0){ showToast('本週已達可報名場次上限'); return; }
  s.myState = 'registered';
  s.registered++;
  renderAll();
  showToast('已完成報名');
  closeDrawer();
}
function cancelSession(id){
  var s = SESSIONS.find(function(x){ return x.id===id; });
  if (!s || hoursUntil(s) < 12) return;
  if (s.myState==='registered'){
    s.myState = null;
    if (s.registered>0) s.registered--;
  } else if (s.myState==='invited_accepted'){
    s.myState = 'invited_declined';
  } else {
    return;
  }
  renderAll();
  showToast('已取消報名');
  closeDrawer();
}
function acceptInvite(id){
  var s = SESSIONS.find(function(x){ return x.id===id; });
  if (!s) return;
  s.myState = 'invited_accepted';
  renderAll();
  showToast('已接受邀請');
  closeDrawer();
}
function declineInvite(id){
  var s = SESSIONS.find(function(x){ return x.id===id; });
  if (!s) return;
  s.myState = 'invited_declined';
  renderAll();
  showToast('已婉拒邀請');
  closeDrawer();
}

/* ---------- 我的紀錄：已完成／已取消兩分頁，預設收合、10 筆＋載入更多 ---------- */
var MY_TABS = [{key:'done',label:'已完成'},{key:'cancelled',label:'已取消'}];
var myActiveTab = 'done';
var MY_TAB_PAGE_SIZE = 10;
var myVisibleCount = {done:MY_TAB_PAGE_SIZE, cancelled:MY_TAB_PAGE_SIZE};
function myTabItems(key){
  var list = MY_RECORD.filter(function(b){
    if (key==='done') return b.status==='done' || b.status==='noshow';
    return b.status==='cancelled';
  });
  list.sort(function(a,b){ return b.date - a.date; });
  return list;
}
function myBucketLabel(d){
  var diffDays = Math.round((stripTime(d) - stripTime(TODAY)) / 86400000);
  if (diffDays === 0) return '今天';
  if (Math.abs(diffDays) <= 7) return '本週';
  return '更早';
}
function renderMyTabRow(){
  var wrap = document.getElementById('myTabRow');
  wrap.innerHTML = MY_TABS.map(function(t){
    var count = myTabItems(t.key).length;
    return '<button type="button" class="mytab-btn'+(t.key===myActiveTab?' active':'')+'" onclick="selectMyTab(\''+t.key+'\')">'+t.label+'（'+count+'）</button>';
  }).join('');
}
function selectMyTab(key){
  myActiveTab = key;
  renderMyTabRow();
  renderMyBookingList();
}
function loadMoreMyBookings(){
  myVisibleCount[myActiveTab] += MY_TAB_PAGE_SIZE;
  renderMyBookingList();
}
function toggleMyRecord(){
  var body = document.getElementById('myRecordBody');
  var btn = document.getElementById('myRecordToggleBtn');
  var opening = body.classList.contains('hidden');
  body.classList.toggle('hidden');
  btn.textContent = opening ? '收合我的紀錄' : '展開我的紀錄（已完成／已取消）';
}
function renderMyBookingList(){
  var all = myTabItems(myActiveTab);
  var visible = all.slice(0, myVisibleCount[myActiveTab]);
  var wrap = document.getElementById('myBookingList');
  var lastBucket = null;
  var html = '';
  visible.forEach(function(b){
    var bucket = myBucketLabel(b.date);
    if (bucket !== lastBucket){
      html += '<div class="mybucket-label">'+bucket+'</div>';
      lastBucket = bucket;
    }
    var badge = b.status==='cancelled' ? '<span class="badge badge-muted">已取消</span>'
      : b.status==='noshow' ? '<span class="badge badge-danger">未出席</span>'
      : '<span class="badge badge-ok">已完成</span>';
    html += '<div class="list-row" style="cursor:pointer;" onclick="openDrawer(\''+b.id+'\',\'record\')">'+
      '<div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>'+
      '<div class="body"><h4>'+b.topic+'．'+fmtDate(b.date)+' '+b.time+'</h4><p>帶領老師：'+b.teacherName+'</p></div>'+
      '<div class="trail">'+badge+'</div>'+
      '</div>';
  });
  if (!visible.length){
    html = '<div class="small muted" style="padding:16px 0;">此分類目前沒有場次紀錄。</div>';
  }
  wrap.innerHTML = html;
  var moreBtn = document.getElementById('loadMoreBtn');
  if (all.length > visible.length){
    moreBtn.classList.remove('hidden');
    moreBtn.textContent = '載入更多（還有 '+(all.length-visible.length)+' 筆）';
  } else {
    moreBtn.classList.add('hidden');
  }
}

function renderAll(){
  renderQuotaLine();
  renderNextCard();
  renderPeriod();
  renderMyTabRow();
  renderMyBookingList();
}

renderTopicFilterOptions();
renderNoshowBanner();
renderAll();
applyEntitlementGate();

// 全域 ESC 關閉：關閉目前開啟中的 drawer
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if(!document.getElementById('drawerOverlay').classList.contains('hidden')) closeDrawer();
});
</script>
