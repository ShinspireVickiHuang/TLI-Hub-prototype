<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLI Connect 會員區－課堂回饋</title>
<style>
:root{
  --c-primary:#1B4E8C;--c-primary-dark:#123A68;--c-accent:#E8792B;--c-accent-dark:#CF691F;--c-secondary:#0F9B79;
  --c-bg:#F5F7FA;--c-border:#E4E7EC;--c-muted:#667085;--c-text:#101828;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-lg:0 8px 24px rgba(16,24,40,.16);
  --topbar-h:52px;--bottomnav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;font-size:15px;-webkit-tap-highlight-color:transparent;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;}
button{font-family:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.app{min-height:100vh;position:relative;}
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-logo-wrap{width:26px;height:22px;overflow:hidden;position:relative;flex:none;}
.topbar-logo-wrap img{position:absolute;left:0;top:0;height:22px;width:auto;max-width:none;}
.back-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--c-border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--c-text);flex:none;cursor:pointer;}
.back-btn svg{width:16px;height:16px;}
.topbar-title{font-size:16.5px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:6px;position:relative;}
.mini-select{border:1px solid var(--c-border);border-radius:6px;padding:4px 6px;font-size:11.5px;background:#fff;color:var(--c-muted);font-family:inherit;max-width:96px;}
.bell-btn{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--c-border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-muted);}
.bell-btn svg{width:16px;height:16px;}
.bell-btn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--c-accent);border:1.5px solid #fff;}
.bell-panel{display:none;position:absolute;right:0;top:40px;width:264px;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:6px 0;z-index:90;}
.bell-panel.open{display:block;}
.bell-panel h4{margin:0;padding:8px 14px 6px;font-size:12.5px;color:var(--c-muted);font-weight:700;}
.bell-item{padding:9px 14px;font-size:12.5px;border-top:1px solid var(--c-border);display:flex;gap:8px;}
.bell-item .b-dot{width:6px;height:6px;border-radius:50%;background:var(--c-accent);margin-top:5px;flex:none;}
.bell-item p{margin:0;color:var(--c-text);}
.bell-item span{color:var(--c-muted);font-size:11px;}
.side-nav{display:none;}
@media(min-width:1024px){
  .side-nav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:310px;background:#fff;border-right:1px solid var(--c-border);padding:18px 12px;z-index:50;}
  .side-brand{display:flex;align-items:center;padding:0 8px 18px;}
  .side-brand img{height:28px;width:auto;}
  .side-identity{padding:0 8px 14px;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--c-text);border-bottom:1px solid var(--c-border);}
  .side-link{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--c-muted);margin-bottom:2px;}
  .side-link svg{width:19px;height:19px;flex:none;}
  .side-link.active{background:#E6EEF8;color:var(--c-primary);}
  .side-link:hover:not(.active){background:var(--c-bg);}
  .app.has-side .topbar{margin-left:310px;}
  .app.has-side .content{margin-left:310px;}
}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--c-border);display:flex;height:var(--bottomnav-h);padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(16,24,40,.06);}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--c-muted);font-weight:600;min-height:44px;}
.bottom-nav a svg{width:22px;height:22px;}
.bottom-nav a.active{color:var(--c-primary);}
@media(min-width:1024px){.bottom-nav{display:none;}}
.content{max-width:960px;margin:0 auto;padding:18px 16px calc(var(--bottomnav-h) + 24px);}
@media(min-width:1024px){.content{padding:26px 32px 40px;}}
.page-h{font-size:19px;font-weight:700;margin:2px 0 4px;}
.page-sub{color:var(--c-muted);font-size:13px;margin:0 0 18px;}
.section-title{font-size:15px;font-weight:700;margin:24px 0 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.section-title .note{font-size:11.5px;font-weight:400;color:var(--c-muted);}
.section-title.first{margin-top:4px;}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.card + .card{margin-top:12px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.stack{display:flex;flex-direction:column;gap:10px;}
.muted{color:var(--c-muted);}
.small{font-size:12px;}
.divider{border:none;border-top:1px solid var(--c-border);margin:14px 0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;min-height:44px;}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-accent{background:var(--c-accent);color:#fff;}
.btn-accent:hover{background:var(--c-accent-dark);}
.btn-outline{background:#fff;border:1px solid var(--c-border);color:var(--c-text);}
.btn-outline:hover{background:var(--c-bg);}
.btn-ghost{background:none;color:var(--c-muted);}
.btn:disabled{background:var(--c-border)!important;color:#98A2B3!important;cursor:not-allowed;border-color:var(--c-border)!important;}
.btn-sm{padding:7px 12px;font-size:12.5px;min-height:36px;}
.btn-block{width:100%;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-info{background:#E6EEF8;color:var(--c-primary);}
.badge-warn{background:#FCEBDC;color:var(--c-accent-dark);}
.badge-ok{background:#E4F5F0;color:#0B6B52;}
.badge-muted{background:var(--c-border);color:var(--c-muted);}
.badge-full{background:#FBEAEA;color:#B42318;}
.progress{height:8px;border-radius:6px;background:var(--c-border);overflow:hidden;}
.progress > div{height:100%;background:var(--c-primary);border-radius:6px;}
.progress.warn > div{background:var(--c-accent);}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--c-border);}
.list-row:first-child{border-top:none;padding-top:0;}
.list-row .icon-box{width:38px;height:38px;border-radius:9px;background:var(--c-bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--c-primary);}
.list-row .icon-box svg{width:18px;height:18px;}
.list-row .body{flex:1;min-width:0;}
.list-row .body h4{margin:0;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.list-row .body p{margin:2px 0 0;font-size:12px;color:var(--c-muted);}
.list-row .trail{flex:none;text-align:right;}
.banner{border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:9px;align-items:flex-start;}
.banner-success{background:#E4F5F0;color:#0B6B52;border:1px solid #BEE6D9;}
.banner-warn{background:#FCEBDC;color:#9A4A0F;border:1px solid #F5CBA1;}
.banner-info{background:#E6EEF8;color:var(--c-primary-dark);border:1px solid #C7DAF0;}
.hidden{display:none!important;}
.toast{position:fixed;left:50%;bottom:calc(var(--bottomnav-h) + 18px);transform:translateX(-50%);background:#101828;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:120;box-shadow:var(--shadow-lg);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;}
.toast.hidden{display:none;}
@media(min-width:1024px){.toast{bottom:24px;}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.field label{font-size:13px;font-weight:700;}
.field textarea{border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:10px 11px;font-size:14px;font-family:inherit;color:var(--c-text);background:#fff;width:100%;resize:vertical;}
.star-row{display:inline-flex;gap:2px;vertical-align:middle;}
.star-static{color:var(--c-border);}
.star-static svg,.star-static.on svg{width:13px;height:13px;display:block;}
.star-static.on{color:var(--c-accent);}
.star-static.on svg{fill:currentColor;}
.star-pick{display:flex;gap:4px;margin:8px 0;}
.star-pick button{background:none;border:none;color:var(--c-border);cursor:pointer;padding:0;line-height:1;}
.star-pick button svg{width:22px;height:22px;display:block;}
.star-pick button.on{color:var(--c-accent);}
.star-pick button.on svg{fill:currentColor;}
.empty-state{text-align:center;padding:28px 16px;color:var(--c-muted);}
.empty-state h4{color:var(--c-text);font-size:14px;margin:0 0 4px;}
.empty-state p{font-size:12.5px;margin:0;}
.empty-state .e-icon{width:34px;height:34px;margin:0 auto 10px;color:var(--c-muted);}
.demo-note{display:block;margin-top:4px;color:var(--c-muted);}
.sheet-overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.sheet-overlay.hidden{display:none;}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0));max-height:88vh;overflow-y:auto;animation:sheetUp .18s ease-out;}
@keyframes sheetUp{from{transform:translateY(16px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--c-border);border-radius:4px;margin:0 auto 14px;}
.sheet h3{margin:0 0 4px;font-size:16px;}
@media(min-width:640px){.sheet-overlay{align-items:center;}.sheet{border-radius:16px;}}
.chip-row-inline{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.mini-chip{font-size:11px;font-weight:700;color:var(--c-primary);background:#E6EEF8;border-radius:20px;padding:1px 8px;}
/* ---------- 篩選 chips ---------- */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;margin-bottom:14px;}
.chip-row::-webkit-scrollbar{height:0;}
.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--c-border);background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;min-height:36px;font-family:inherit;color:var(--c-muted);}
.chip.selected{border-color:var(--c-primary);background:#E6EEF8;color:var(--c-primary);}
/* ---------- 我的等級卡 ---------- */
.cond-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--c-border);flex-wrap:wrap;}
.cond-row:first-child{border-top:none;padding-top:0;}
.cond-main{flex:1;min-width:180px;}
.cond-title{font-size:13.5px;font-weight:700;}
.cond-status{margin-top:2px;}
/* ---------- 課堂回饋列 ---------- */
.record-card{cursor:pointer;}
.record-card.locate-highlight{outline:2px solid var(--c-primary);outline-offset:2px;}
.record-card .rc-skills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.record-card .rc-comment{margin:8px 0 0;font-size:12.5px;color:var(--c-text);background:var(--c-bg);border-radius:var(--radius-sm);padding:8px 10px;}
.record-card .rc-comment.muted-note{color:var(--c-muted);background:none;padding:0;}
.record-card.no-record{cursor:default;}
.unread-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c-accent);flex:none;}
/* ---------- 回饋對話串 ---------- */
.msg-bubble{border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--c-bg);}
.msg-bubble.msg-student{background:#E6EEF8;margin-left:22px;}
.msg-bubble.msg-teacher{margin-right:22px;}
.msg-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px;}
.msg-head strong{font-size:12.5px;}
.msg-head span{font-size:11px;color:var(--c-muted);white-space:nowrap;}
.msg-text{margin:0;font-size:13px;white-space:pre-wrap;}
.msg-rating{margin-top:6px;font-size:11.5px;color:var(--c-muted);display:flex;align-items:center;gap:4px;}
.explore-link{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--c-primary);white-space:nowrap;padding:4px 2px;flex:none;}
.explore-link svg{width:15px;height:15px;flex:none;}
@media(max-width:639px){.explore-link-text{display:none;}}

/* ---------- 次層切換（segment，跨頁導覽） ---------- */
.nav-segment{display:flex;gap:4px;border-bottom:1px solid var(--c-border);margin:0 0 16px;overflow-x:auto;}
.nav-segment-link{padding:9px 14px;font-size:13.5px;font-weight:700;color:var(--c-muted);white-space:nowrap;border-bottom:2px solid transparent;flex:none;}
.nav-segment-link.active{color:var(--c-primary);border-color:var(--c-primary);}
.nav-segment-link:hover:not(.active){color:var(--c-text);}
</style>
</head>

var TLI_RATES={TWD:{rate:1,symbol:'NT$'},USD:{rate:31.5,symbol:'US$'},JPY:{rate:0.211,symbol:'¥'},CNY:{rate:4.4,symbol:'CN¥'},EUR:{rate:35.5,symbol:'€'}};
/* ================= 五語：星期（括號內單字）翻譯 ================= */
var WD_SHORT={'一':{en:'Mon',ja:'月',de:'Mo'},'二':{en:'Tue',ja:'火',de:'Di'},'三':{en:'Wed',ja:'水',de:'Mi'},'四':{en:'Thu',ja:'木',de:'Do'},'五':{en:'Fri',ja:'金',de:'Fr'},'六':{en:'Sat',ja:'土',de:'Sa'},'日':{en:'Sun',ja:'日',de:'So'}};
function xlateDateStr(s){
  if(!s) return s;
  return s.replace(/（([一二三四五六日])）/g, function(m,d){ var w=WD_SHORT[d]; return w?TLI_I18N.t(m,{en:'('+w.en+')',ja:'（'+w.ja+'）',de:'('+w.de+')'}):m; });
}
function tliFmt(amountTWD,cur){
  var r=TLI_RATES[cur]||TLI_RATES.TWD;
  var v=amountTWD/r.rate;
  var decimals=cur==='TWD'?0:(cur==='JPY'?0:2);
  return r.symbol+v.toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}
function showToast(msg){
  var t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;
  t.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(function(){t.classList.add('hidden');},2200);
}
/* 五語共用模組：幣別跟著介面語言連動（沿用舊 handleLangCurrency 的幣別對照表） */
var LANG_TO_CURRENCY={'zh-TW':'TWD','zh-CN':'CNY','en':'USD','ja':'JPY','de':'EUR'};
function recalcMoney(){
  var cur=LANG_TO_CURRENCY[TLI_I18N.currentLang()]||'TWD';
  document.querySelectorAll('[data-money]').forEach(function(el){
    el.textContent=tliFmt(parseFloat(el.getAttribute('data-money')),cur);
  });
}

function pickStar(groupId,n){
  var btns=document.querySelectorAll('#'+groupId+' button');
  btns.forEach(function(b,i){b.classList.toggle('on',i<n);});

var ICON_STAR_FILL='<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
var ICON_STAR_LINE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
function starsRowHtml(n,max){max=max||5;var s='';for(var i=0;i<max;i++){s+='<span class="star-static'+(i<n?' on':'')+'">'+(i<n?ICON_STAR_FILL:ICON_STAR_LINE)+'</span>';}return s;}
function skillChip(label,n){return '<span class="mini-chip">'+label+' '+n+'／5</span>';}
function skillLabels(skills){
  var t=TLI_I18N.t;
  return skillChip(t('聽',{en:'Listen',ja:'聴解',de:'Hören'}),skills.L)+
    skillChip(t('說',{en:'Speak',ja:'会話',de:'Sprechen'}),skills.S)+
    skillChip(t('讀',{en:'Read',ja:'読解',de:'Lesen'}),skills.R)+
    skillChip(t('寫',{en:'Write',ja:'作文',de:'Schreiben'}),skills.W);
}

var threadFilter='all', activeThreadId=null, THREAD_PAGE_SIZE=10, threadShown=THREAD_PAGE_SIZE;

function threadStatus(t){
  if(t.messages.length===0) return 'none';
  var hasStudentMsg = t.messages.some(function(m){return m.role==='student';});
  return hasStudentMsg ? 'replied' : 'pending';
}
function filteredThreads(){
  return LESSON_THREADS.filter(function(t){
    var s=threadStatus(t);
    if(threadFilter==='pending') return s==='pending';
    if(threadFilter==='replied') return s==='replied';
    return true;
  });
}
function renderThreads(){
  var t2=TLI_I18N.t;
  var list=filteredThreads();
  document.getElementById('threadEmpty').classList.toggle('hidden', list.length>0);
  var shown=list.slice(0,threadShown);
  document.getElementById('threadList').innerHTML = shown.map(function(t){
    var s=threadStatus(t);
    var unreadHtml = t.unread ? '<span class="unread-dot"></span>' : '';
    if(s==='none'){
      return '' +
        '<div class="card record-card no-record" data-record-id="'+t.id+'">' +
          '<div class="small muted">'+xlateDateStr(t.date)+'</div>' +
          '<h4 style="margin:2px 0 2px;font-size:14.5px;">'+t.course+'</h4>' +
          '<div class="small muted">'+t.teacher+'</div>' +
          '<p class="rc-comment muted-note">'+t2('老師尚未留下課堂紀錄。',{en:'The teacher hasn\'t left any lesson notes yet.',ja:'講師はまだ授業記録を残していません。',de:'Die Lehrkraft hat noch keine Notizen hinterlassen.'})+'</p>' +
        '</div>';
    }
    var first = t.messages[0];
    var statusBadge = s==='pending' ? '<span class="badge badge-warn">'+t2('待你回覆',{en:'Awaiting Your Reply',ja:'返信待ち',de:'Antwort ausstehend'})+'</span>' : '<span class="badge badge-ok">'+t2('已回覆',{en:'Replied',ja:'返信済み',de:'Beantwortet'})+'</span>';
    var skillsHtml = first.skills ? ('<div class="rc-skills">'+skillLabels(first.skills)+'</div>') : '';
    return '' +
      '<div class="card record-card" data-record-id="'+t.id+'" onclick="openThreadSheet(\''+t.id+'\')">' +
        '<div class="flex-between" style="align-items:flex-start;">' +
          '<div>' +
            '<div class="small muted">'+xlateDateStr(t.date)+'</div>' +
            '<h4 style="margin:2px 0 2px;font-size:14.5px;">'+t.course+unreadHtml+'</h4>' +
            '<div class="small muted">'+t.teacher+'</div>' +
          '</div>' +
          statusBadge +
        '</div>' +
        skillsHtml +
        '<p class="rc-comment">"'+first.text+'"</p>' +
        '<div class="flex-between" style="margin-top:10px;">' +
          '<span class="small muted">'+t2('共 '+t.messages.length+' 則訊息',{en:t.messages.length+' message(s)',ja:t.messages.length+'件のメッセージ',de:t.messages.length+' Nachricht(en)'})+'</span>' +
          '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openThreadSheet(\''+t.id+'\')">'+t2('查看對話並回覆',{en:'View & Reply',ja:'対話を見て返信',de:'Ansehen & Antworten'})+'</button>' +
        '</div>' +
      '</div>';
  }).join('');
  var remain=list.length-shown.length;
  document.getElementById('threadMoreWrap').classList.toggle('hidden', remain<=0);
  document.getElementById('threadMoreCount').textContent=remain;
}
function setThreadFilter(f,btn){
  threadFilter=f; threadShown=THREAD_PAGE_SIZE;
  document.querySelectorAll('#threadFilterChips .chip').forEach(function(c){c.classList.remove('selected');});
  btn.classList.add('selected');
  renderThreads();
}
function showMoreThreads(){ threadShown+=THREAD_PAGE_SIZE; renderThreads(); }

function findThread(id){ return LESSON_THREADS.filter(function(t){return t.id===id;})[0]; }
function openThreadSheet(id){
  var t=findThread(id);
  if(!t || t.messages.length===0) return;
  activeThreadId=id;
  t.unread=false;
  document.getElementById('threadTitle').textContent = t.course;
  document.getElementById('threadMeta').textContent = xlateDateStr(t.date)+'　'+t.teacher;
  document.getElementById('threadMessages').innerHTML = t.messages.map(function(m){
    var roleLabel = m.role==='teacher' ? t.teacher : TLI_I18N.t('你',{en:'You',ja:'あなた',de:'Sie'});
    var skillsHtml = m.skills ? ('<div class="rc-skills">'+skillLabels(m.skills)+'</div>') : '';
    var ratingHtml = m.rating ? ('<div class="msg-rating">'+TLI_I18N.t('給老師評分：',{en:'Rated the teacher: ',ja:'講師の評価：',de:'Bewertung der Lehrkraft: '})+starsRowHtml(m.rating)+'</div>') : '';
    return '' +
      '<div class="msg-bubble msg-'+m.role+'">' +
        '<div class="msg-head"><strong>'+roleLabel+'</strong><span>'+m.time+'</span></div>' +
        skillsHtml +
        '<p class="msg-text">'+m.text+'</p>' +
        ratingHtml +
      '</div>';
  }).join('');
  pickStar('threadStarTeacher',0);
  document.getElementById('threadReplyText').value='';
  document.getElementById('threadOverlay').classList.remove('hidden');
  renderThreads();
}
function closeThreadSheet(){
  document.getElementById('threadOverlay').classList.add('hidden');
  activeThreadId=null;
}
function submitThreadReply(){
  if(!activeThreadId) return;
  var t=findThread(activeThreadId);
  if(!t) return;
  var text=document.getElementById('threadReplyText').value.trim();
  if(!text){ showToast(TLI_I18N.t('請先輸入回覆內容',{en:'Please enter your reply first',ja:'まず返信内容を入力してください',de:'Bitte zuerst eine Antwort eingeben'})); return; }
  var rating=document.querySelectorAll('#threadStarTeacher button.on').length;
  var msg={role:'student', time:TLI_I18N.t('剛剛',{en:'Just now',ja:'たった今',de:'Gerade eben'}), text:text};
  if(rating>0) msg.rating=rating;
  t.messages.push(msg);
  if(activeThreadId==='r1'){
    try{ localStorage.setItem('tli_todo_feedback_done','1'); }catch(e){}
  }
  closeThreadSheet();
  renderThreads();
  showToast(TLI_I18N.t('回覆已送出，老師會收到通知',{en:'Reply sent — the teacher will be notified',ja:'返信を送信しました。講師に通知されます',de:'Antwort gesendet — die Lehrkraft wird benachrichtigt'}));
}

/* ============ 首頁「填寫回饋」深連結：?lesson=<id> 直接展開該堂對話串並聚焦回覆框 ============ */
function applyLessonDeepLink(){
  var params = new URLSearchParams(window.location.search);
  var lessonId = params.get('lesson');
  if(!lessonId) return;
  var t = findThread(lessonId);
  if(!t) return;
  if(t.messages.length>0){
    openThreadSheet(lessonId);
    setTimeout(function(){
      var ta=document.getElementById('threadReplyText');
      if(ta) ta.focus();
    },60);
  }
  /* renderThreads() 內已重繪列表，須在其後才能抓到對應的 DOM 節點 */
  var card = document.querySelector('.record-card[data-record-id="'+lessonId+'"]');
  if(card){
    card.scrollIntoView({block:'center'});
    card.classList.add('locate-highlight');
  }
}

/* ================= 初始化 ================= */
renderThreads();
applyLessonDeepLink();

TLI_I18N.onRefresh(renderThreads);
TLI_I18N.onRefresh(recalcMoney);
TLI_I18N.init();
recalcMoney();
document.addEventListener('DOMContentLoaded', function(){
  var opts=document.querySelectorAll('.tli-i18n-opt');
  for(var i=0;i<opts.length;i++){
    opts[i].addEventListener('click', function(){
      var name=this.textContent.trim();
      showToast(TLI_I18N.t('顯示語言／幣別已切換為',{en:'Display language/currency switched to',ja:'表示言語と通貨を切り替えました：',de:'Sprache und Währung umgestellt auf'})+' '+name);
    });
  }
});

// 全域 ESC 關閉：關閉目前開啟中的 sheet-overlay
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  document.querySelectorAll('.sheet-overlay:not(.hidden)').forEach(function(el){
    el.classList.add('hidden');
  });
});
</script>
<div class="toast hidden" id="toast">已完成</div>
</body>
