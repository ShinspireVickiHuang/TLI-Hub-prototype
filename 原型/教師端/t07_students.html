<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLI Hub 教師端－我的學生</title>
<style>
:root{
  --c-primary:#1B4E8C;--c-primary-dark:#123A68;--c-accent:#E8792B;--c-accent-dark:#CF691F;--c-secondary:#0F9B79;
  --c-bg:#F5F7FA;--c-border:#E4E7EC;--c-muted:#667085;--c-text:#101828;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-lg:0 8px 24px rgba(16,24,40,.16);
  --topbar-h:52px;--bottomnav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;font-size:15px;-webkit-tap-highlight-color:transparent;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;}
button{font-family:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.app{min-height:100vh;position:relative;}
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-logo-wrap{width:26px;height:22px;overflow:hidden;position:relative;flex:none;}
.topbar-logo-wrap img{position:absolute;left:0;top:0;height:22px;width:auto;max-width:none;}
.topbar-title{font-size:16.5px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:6px;position:relative;}
.bell-btn{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--c-border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-muted);}
.bell-btn svg{width:16px;height:16px;}
.bell-btn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--c-accent);border:1.5px solid #fff;}
.bell-panel{display:none;position:absolute;right:0;top:40px;width:264px;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:6px 0;z-index:90;}
.bell-panel.open{display:block;}
.bell-panel h4{margin:0;padding:8px 14px 6px;font-size:12.5px;color:var(--c-muted);font-weight:700;}
.bell-item{padding:9px 14px;font-size:12.5px;border-top:1px solid var(--c-border);display:flex;gap:8px;}
.bell-item .b-dot{width:6px;height:6px;border-radius:50%;background:var(--c-accent);margin-top:5px;flex:none;}
.bell-item p{margin:0;color:var(--c-text);}
.bell-item span{color:var(--c-muted);font-size:11px;}
.side-nav{display:none;}
@media(min-width:1024px){
  .side-nav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:310px;background:#fff;border-right:1px solid var(--c-border);padding:18px 12px;z-index:50;}
  .side-role{padding:0 10px 14px;margin-bottom:10px;border-bottom:1px solid var(--c-border);}
.side-role strong{display:block;font-size:14px;color:var(--c-primary);font-weight:700;}
.side-role span{display:block;font-size:12px;color:var(--c-muted);margin-top:2px;}
.side-brand{display:flex;align-items:center;padding:0 8px 18px;}
  .side-brand img{height:28px;width:auto;}
  .side-link{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--c-muted);margin-bottom:2px;}
  .side-link svg{width:19px;height:19px;flex:none;}
  .side-link.active{background:#E6EEF8;color:var(--c-primary);}
  .side-link:hover:not(.active){background:var(--c-bg);}
  .app.has-side .topbar{margin-left:310px;}
  .app.has-side .content{margin-left:310px;}
}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--c-border);display:flex;height:var(--bottomnav-h);padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(16,24,40,.06);}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--c-muted);font-weight:600;min-height:44px;}
.bottom-nav a svg{width:22px;height:22px;}
.bottom-nav a.active{color:var(--c-primary);}
@media(min-width:1024px){.bottom-nav{display:none;}}
.content{max-width:960px;margin:0 auto;padding:18px 16px calc(var(--bottomnav-h) + 24px);}
@media(min-width:1024px){.content{padding:26px 32px 40px;}}
.page-sub{color:var(--c-muted);font-size:13px;margin:0 0 18px;}
.section-title{font-size:15px;font-weight:700;margin:24px 0 12px;}
.section-title.first{margin-top:4px;}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.card + .card{margin-top:12px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.stack{display:flex;flex-direction:column;gap:10px;}
.muted{color:var(--c-muted);}
.small{font-size:12px;}
.divider{border:none;border-top:1px solid var(--c-border);margin:14px 0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;min-height:44px;}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-outline{background:#fff;border:1px solid var(--c-border);color:var(--c-text);}
.btn-outline:hover{background:var(--c-bg);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12.5px;min-height:36px;}
.btn:disabled{background:var(--c-border)!important;color:#98A2B3!important;cursor:not-allowed;border-color:var(--c-border)!important;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-info{background:#E6EEF8;color:var(--c-primary);}
.badge-warn{background:#FCEBDC;color:var(--c-accent-dark);}
.badge-ok{background:#E4F5F0;color:#0B6B52;}
.badge-muted{background:var(--c-border);color:var(--c-muted);}
.hidden{display:none!important;}
.sheet-overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.sheet-overlay.hidden{display:none;}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0));max-height:88vh;overflow-y:auto;animation:sheetUp .18s ease-out;}
@keyframes sheetUp{from{transform:translateY(16px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--c-border);border-radius:4px;margin:0 auto 14px;}
.sheet h3{margin:0 0 4px;font-size:16px;}
@media(min-width:640px){.sheet-overlay{align-items:center;}.sheet{border-radius:16px;}}
.sheet-note{font-size:13px;color:var(--c-text);background:var(--c-bg);padding:10px 12px;border-radius:var(--radius-sm);line-height:1.6;}
.sheet-sec{margin-bottom:16px;}
.sheet-sec .lbl{font-size:12px;font-weight:700;color:var(--c-muted);margin-bottom:6px;}
.toast{position:fixed;left:50%;bottom:calc(var(--bottomnav-h) + 18px);transform:translateX(-50%);background:#101828;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:120;box-shadow:var(--shadow-lg);white-space:nowrap;}
.toast.hidden{display:none;}
@media(min-width:1024px){.toast{bottom:24px;}}
/* ---------- 學生列表（教師端專用，沿用 pick-card／badge 樣式） ---------- */
.searchbox{position:relative;margin-bottom:12px;}
.searchbox input{width:100%;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:10px 12px 10px 34px;font-size:14px;font-family:inherit;color:var(--c-text);background:#fff;min-height:44px;}
.searchbox .sicon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--c-muted);font-size:14px;pointer-events:none;}
.fchip-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.fchip{padding:7px 14px;border-radius:20px;border:1px solid var(--c-border);background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--c-muted);}
.fchip.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary);}
.stu-card{border:1.5px solid var(--c-border);border-radius:var(--radius);padding:13px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;background:#fff;position:relative;}
.stu-card + .stu-card{margin-top:10px;}
.stu-card .avatar{width:42px;height:42px;border-radius:50%;background:var(--c-primary);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;position:relative;}
.stu-card .avatar .pending-dot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:var(--c-accent);border:2px solid #fff;}
.stu-card .body{flex:1;min-width:0;}
.stu-card .body h4{margin:0 0 3px;font-size:14.5px;}
.stu-card .body .meta{font-size:12px;color:var(--c-muted);}
.stu-card .trail{flex:none;color:#98A2B3;font-size:16px;}
.stu-empty{text-align:center;padding:30px 16px;color:var(--c-muted);font-size:13px;}
/* ---------- 學生詳情 sheet ---------- */
.skill-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.skill-bar-row .sb-name{width:32px;flex:none;font-size:12.5px;font-weight:700;color:var(--c-muted);}
.skill-bar-track{flex:1;height:8px;border-radius:4px;background:var(--c-border);overflow:hidden;}
.skill-bar-fill{height:100%;background:var(--c-primary);border-radius:4px;}
.skill-bar-row .sb-val{width:22px;flex:none;text-align:right;font-size:12px;font-weight:700;color:var(--c-text);}
.record-row{border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.record-row:last-child{margin-bottom:0;}
.record-row .rr-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;}
.record-row .rr-top span:last-child{color:var(--c-muted);font-weight:400;}
.record-row .rr-detail{font-size:12px;color:var(--c-muted);margin-top:6px;line-height:1.6;display:none;}
.record-row.open .rr-detail{display:block;}
.review-summary{background:var(--c-bg);border-radius:var(--radius-sm);padding:12px 14px;}
.review-summary .rs-score{font-size:26px;font-weight:700;color:var(--c-primary);}
.review-summary .rs-score span{font-size:14px;color:var(--c-accent);}
.tag-stat{display:inline-block;background:#fff;border:1px solid var(--c-border);border-radius:20px;padding:4px 10px;font-size:11.5px;color:var(--c-text);margin:4px 6px 0 0;}
.quote{font-size:12.5px;color:var(--c-text);background:#fff;border-left:3px solid var(--c-primary);padding:8px 10px;margin-top:8px;line-height:1.6;}
/* ---------- B2B 企業合約規則／企業客製教材（v2 新增） ---------- */
.demo-tag{font-size:10.5px;color:#98A2B3;font-weight:400;}
.stu-card .meta .ent-line{color:#0B6B52;font-weight:700;}
.ent-rule-card{background:#EAF6F2;border:1px solid #BEE6D9;border-radius:var(--radius-sm);padding:12px 14px;}
.ent-rule-card .ent-row{display:flex;justify-content:space-between;font-size:12.5px;color:#0B6B52;padding:5px 0;border-top:1px solid #BEE6D9;}
.ent-rule-card .ent-row:first-child{border-top:none;}
.ent-material-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--c-border);font-size:12.5px;}
.ent-material-row:first-child{border-top:none;}
.ent-material-row .m-name{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.mat-lvbadge{display:inline-flex;align-items:center;gap:4px;}
.mat-lvbadge svg{width:11px;height:11px;}
</style>
</head>

      </button>
      <div class="bell-panel" id="bellPanel">

  <main class="content">
    <p class="page-sub" style="margin:0 0 14px;" data-i18n="tstud.pageSub">管理你教過的學生，查看程度趨勢並填寫課後回饋。</p>

<div class="sheet-overlay hidden" id="detailOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="dTitle">學生詳情</h3>
    <p class="muted small" id="dMeta" style="margin:2px 0 14px;">—</p>

    <div class="sheet-sec hidden" id="dEntRuleSec">
      <div class="lbl" data-i18n="tstud.entRuleLabel">企業合約規則</div>
      <div class="ent-rule-card" id="dEntRuleCard"></div>
    </div>

    <div class="sheet-sec hidden" id="dEntMaterialSec">
      <div class="lbl" data-i18n="tstud.entMaterialLabel">企業客製教材</div>
      <div id="dEntMaterialList"></div>
      <p class="small muted" style="margin:8px 0 0;" data-i18n="tstud.entMaterialNote">企業專屬教材只能用於該企業課程。</p>
    </div>

    <div class="sheet-sec">
      <div class="lbl" data-i18n="tstud.skillsTrendLabel">四技能趨勢（近 5 堂平均）</div>
      <div id="dSkills"></div>
    </div>

    <div class="sheet-sec">
      <div class="lbl" data-i18n="tstud.recordsLabel">歷次課後紀錄（點擊展開）</div>
      <div id="dRecords"></div>
    </div>

    <div class="sheet-sec" style="margin-bottom:0;">
      <div class="lbl" data-i18n="tstud.reviewSummaryLabel">學生給我的回饋摘要（匿名彙整）</div>
      <div class="review-summary" id="dReview"></div>
    </div>

/* 結構性中文的翻譯對照表（班型），示範資料（姓名、教材、地點、備註、引言）不在此列 */
var CLASS_TYPE_EN = {'個人班':'Private Class','小組班':'Group Class'};
function trT(zh){ return TLI_I18N.t(zh, CLASS_TYPE_EN[zh] || zh); }
/* s.next 是「相對日期＋時間」組成的示範排課字串（如「今天 15:00」「週三 14:00」），
   相對日期詞本身是結構性文字（不是示範資料），要翻；後面的時間點維持原樣 */
var RELATIVE_DAY_EN = {'今天':'Today','明天':'Tomorrow','後天':'Day After Tomorrow','週一':'Mon','週二':'Tue','週三':'Wed','週四':'Thu','週五':'Fri','週六':'Sat','週日':'Sun'};
function nextClassText(next){
  var sp = next.indexOf(' ');
  var day = sp === -1 ? next : next.slice(0, sp);
  var rest = sp === -1 ? '' : next.slice(sp);
  if (Object.prototype.hasOwnProperty.call(RELATIVE_DAY_EN, day)) {
    return TLI_I18N.t(day, RELATIVE_DAY_EN[day]) + rest;
  }
  return next;
}

var currentFilter = 'all';
function setFilter(f){
  currentFilter = f;
  document.querySelectorAll('.fchip').forEach(function(c){c.classList.toggle('active', c.dataset.filter===f);});
  renderList();
}

function isPending(s){
  return s.recordId && localStorage.getItem('tli_teacher_record_'+s.recordId) !== '1';
}

/* 企業客製教材授權層級標記（v2 新增）：企業專屬教材鎖形圖示／公開通用教材一般徽章 */
function lockSvg(){
  return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="10" height="8" rx="1.5"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9"/></svg>';
}
function materialLevelBadge(level){
  if (level==='企業專屬') return '<span class="badge badge-warn mat-lvbadge">'+lockSvg()+TLI_I18N.t('企業專屬','Exclusive')+'</span>';
  return '<span class="badge badge-ok mat-lvbadge">'+TLI_I18N.t('公開通用','Public')+'</span>';
}

function renderList(){
  var kw = document.getElementById('searchInput').value.trim();
  var listEl = document.getElementById('studentList');
  listEl.innerHTML = '';
  var shown = 0;
  STUDENTS.forEach(function(s){
    if(kw && s.name.indexOf(kw) === -1) return;
    if(currentFilter === 'week' && !s.hasWeek) return;
    if(currentFilter === 'pending' && !isPending(s)) return;
    shown++;
    var pending = isPending(s);
    var card = document.createElement('div');
    card.className = 'stu-card';
    card.onclick = function(){ openDetail(s.id); };
    var entLine = s.enterprise ? ('<div class="meta ent-line">'+TLI_I18N.t('所屬企業：','Company: ')+s.enterprise.company+'・'+TLI_I18N.t('廠區時區 ','Site Timezone ')+s.enterprise.tzLabel+'</div>') : '';
    card.innerHTML =
      '<div class="avatar">'+s.name.charAt(0)+(pending?'<span class="pending-dot"></span>':'')+'</div>'+
      '<div class="body"><h4>'+s.name+' <span class="badge badge-info" style="margin-left:2px;">'+s.level+'</span></h4>'+
      '<div class="meta">'+trT(s.type)+'・'+s.campus+'・'+TLI_I18N.t('下次上課：','Next class: ')+nextClassText(s.next)+(pending?('　<span style="color:var(--c-accent-dark);font-weight:700;">・'+TLI_I18N.t('待寫回饋','Pending Feedback')+'</span>'):'')+'</div>'+entLine+'</div>'+
      '<div class="trail">›</div>';
    listEl.appendChild(card);
  });
  document.getElementById('emptyState').classList.toggle('hidden', shown > 0);
  if (window.TLI_I18N) TLI_I18N.refresh();
}

var currentStudentId = null;
function openDetail(id){
  currentStudentId = id;
  var s = STUDENTS.filter(function(x){return x.id===id;})[0];
  document.getElementById('dTitle').textContent = s.name;
  document.getElementById('dMeta').textContent = s.level+'・'+trT(s.type)+'・'+s.campus+'・'+TLI_I18N.t('下次上課：','Next class: ')+nextClassText(s.next);

  var entRuleSec = document.getElementById('dEntRuleSec');
  var entMaterialSec = document.getElementById('dEntMaterialSec');
  if(s.enterprise){
    var ent = s.enterprise;
    document.getElementById('dEntRuleCard').innerHTML =
      '<div class="ent-row"><span>'+TLI_I18N.t('所屬企業','Company')+'</span><span>'+ent.company+'</span></div>'+
      '<div class="ent-row"><span>'+TLI_I18N.t('廠區時區','Site Timezone')+'</span><span>'+ent.tzLabel+'</span></div>'+
      '<div class="ent-row"><span>'+TLI_I18N.t('取消時限','Cancellation Deadline')+'</span><span>'+ent.cancelDeadlineHours+TLI_I18N.t(' 小時',' hours')+'</span></div>'+
      '<div class="ent-row"><span>'+TLI_I18N.t('本月免扣次數','Free Cancellations This Month')+'</span><span>'+ent.freeCancelRemain+'／'+ent.freeCancelTotal+TLI_I18N.t(' 次',' times')+'</span></div>';
    entRuleSec.classList.remove('hidden');
    document.getElementById('dEntMaterialList').innerHTML = (ent.materials||[]).map(function(m){
      return '<div class="ent-material-row"><span class="m-name">'+m.name+' '+materialLevelBadge(m.level)+'</span><a class="btn btn-outline btn-sm" href="'+m.href+'">'+TLI_I18N.t('查看教材','View Material')+'</a></div>';
    }).join('') || '<p class="small muted">'+TLI_I18N.t('目前尚無企業客製教材。','No enterprise-customized materials yet.')+'</p>';
    entMaterialSec.classList.remove('hidden');
  }else{
    entRuleSec.classList.add('hidden');
    entMaterialSec.classList.add('hidden');
  }

  var skillsEl = document.getElementById('dSkills');
  skillsEl.innerHTML = '';
  [['聽','listen','Listening'],['說','speak','Speaking'],['讀','read','Reading'],['寫','write','Writing']].forEach(function(p){
    var val = s.skills[p[1]];
    var row = document.createElement('div');
    row.className = 'skill-bar-row';
    row.innerHTML = '<div class="sb-name">'+TLI_I18N.t(p[0],p[2])+'</div><div class="skill-bar-track"><div class="skill-bar-fill" style="width:'+(val/5*100)+'%;"></div></div><div class="sb-val">'+val+'</div>';
    skillsEl.appendChild(row);
  });

  var recEl = document.getElementById('dRecords');
  recEl.innerHTML = '';
  s.records.forEach(function(r){
    var row = document.createElement('div');
    row.className = 'record-row';
    row.innerHTML = '<div class="rr-top"><span>'+r.date+'</span><span>'+r.material+'</span></div><div class="rr-detail">'+r.note+'</div>';
    row.onclick = function(){ row.classList.toggle('open'); };
    recEl.appendChild(row);
  });

  var rv = s.review;
  var starSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;display:inline-block;vertical-align:-2px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  document.getElementById('dReview').innerHTML =
    '<div class="rs-score">'+rv.avg.toFixed(1)+'<span>'+starSvg+'</span>　<span style="font-size:12px;color:var(--c-muted);font-weight:400;">'+TLI_I18N.t('本月 ','This month ')+rv.count+TLI_I18N.t(' 則回饋（匿名）',' feedback item(s) (anonymous)')+'</span></div>'+
    '<div style="margin-top:8px;">'+rv.tags.map(function(t){return '<span class="tag-stat">'+t[0]+' × '+t[1]+'</span>';}).join('')+'</div>'+
    rv.quotes.map(function(q){return '<div class="quote">「'+q+'」</div>';}).join('');

  var writeBtn = document.getElementById('dWriteBtn');
  if(s.recordId){
    writeBtn.disabled = false;
    writeBtn.textContent = TLI_I18N.t('寫回饋','Write Feedback');
  }else{
    writeBtn.disabled = true;
    writeBtn.textContent = TLI_I18N.t('尚無已完成課堂可回饋','No completed lesson available for feedback yet');
  }

  document.getElementById('detailOverlay').classList.remove('hidden');
  if (window.TLI_I18N) TLI_I18N.refresh();
}
function closeDetail(){
  document.getElementById('detailOverlay').classList.add('hidden');
}
/* 學生詳情浮層目前開著時，語言切換要用當下語言重新渲染內容（不只是重繪既有 DOM） */
function refreshOpenDetail(){
  var overlay = document.getElementById('detailOverlay');
  if(overlay && !overlay.classList.contains('hidden') && currentStudentId){
    openDetail(currentStudentId);
  }
}
document.getElementById('detailOverlay').addEventListener('click', function(e){
  if(e.target.id === 'detailOverlay') closeDetail();
});
/* ESC 鍵關閉目前開啟中的 sheet-overlay */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.sheet-overlay').forEach(function(el){ el.classList.add('hidden'); });
});
function writeFeedback(){
  var s = STUDENTS.filter(function(x){return x.id===currentStudentId;})[0];
  if(!s || !s.recordId) return;
  location.href = 't03_lesson_record.html?lesson='+s.recordId+'&student='+encodeURIComponent(s.name)+'&from=t07';
}

var toastTimer=null;
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.add('hidden');},2400);
}

/* 先讀取已儲存的語言偏好再首次渲染，避免「英文偏好」重新整理頁面時，學生清單短暫顯示中文 */
if (window.TLI_I18N) TLI_I18N.init();
renderList();
/* 語言切換時：學生清單要重新產生（含結構性文字）；已開啟的學生詳情浮層要重新渲染 */
if (window.TLI_I18N) TLI_I18N.onRefresh(renderList);
if (window.TLI_I18N) TLI_I18N.onRefresh(refreshOpenDetail);
if(new URLSearchParams(location.search).get('done') === '1'){
  showToast(TLI_I18N.t('回饋已送出，學生可於會員區查看','Feedback submitted; the student can view it in the member portal'));
}
if (window.TLI_I18N) TLI_I18N.init();
