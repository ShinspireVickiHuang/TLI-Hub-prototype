<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLI Hub 教師端－我的學生</title>
<style>
:root{
  --c-primary:#1B4E8C;--c-primary-dark:#123A68;--c-accent:#E8792B;--c-accent-dark:#CF691F;--c-secondary:#0F9B79;
  --c-bg:#F5F7FA;--c-border:#E4E7EC;--c-muted:#667085;--c-text:#101828;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-lg:0 8px 24px rgba(16,24,40,.16);
  --topbar-h:52px;--bottomnav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;font-size:15px;-webkit-tap-highlight-color:transparent;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;}
button{font-family:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.app{min-height:100vh;position:relative;}
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-logo-wrap{width:26px;height:22px;overflow:hidden;position:relative;flex:none;}
.topbar-logo-wrap img{position:absolute;left:0;top:0;height:22px;width:auto;max-width:none;}
.topbar-title{font-size:16.5px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:6px;position:relative;}
.bell-btn{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--c-border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-muted);}
.bell-btn svg{width:16px;height:16px;}
.bell-btn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--c-accent);border:1.5px solid #fff;}
.bell-panel{display:none;position:absolute;right:0;top:40px;width:264px;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:6px 0;z-index:90;}
.bell-panel.open{display:block;}
.bell-panel h4{margin:0;padding:8px 14px 6px;font-size:12.5px;color:var(--c-muted);font-weight:700;}
.bell-item{padding:9px 14px;font-size:12.5px;border-top:1px solid var(--c-border);display:flex;gap:8px;}
.bell-item .b-dot{width:6px;height:6px;border-radius:50%;background:var(--c-accent);margin-top:5px;flex:none;}
.bell-item p{margin:0;color:var(--c-text);}
.bell-item span{color:var(--c-muted);font-size:11px;}
.side-nav{display:none;}
@media(min-width:1024px){
  .side-nav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:310px;background:#fff;border-right:1px solid var(--c-border);padding:18px 12px;z-index:50;}
  .side-role{padding:0 10px 14px;margin-bottom:10px;border-bottom:1px solid var(--c-border);}
.side-role strong{display:block;font-size:14px;color:var(--c-primary);font-weight:700;}
.side-role span{display:block;font-size:12px;color:var(--c-muted);margin-top:2px;}
.side-brand{display:flex;align-items:center;padding:0 8px 18px;}
  .side-brand img{height:28px;width:auto;}
  .side-link{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--c-muted);margin-bottom:2px;}
  .side-link svg{width:19px;height:19px;flex:none;}
  .side-link.active{background:#E6EEF8;color:var(--c-primary);}
  .side-link:hover:not(.active){background:var(--c-bg);}
  .app.has-side .topbar{margin-left:310px;}
  .app.has-side .content{margin-left:310px;}
}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--c-border);display:flex;height:var(--bottomnav-h);padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(16,24,40,.06);}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--c-muted);font-weight:600;min-height:44px;}
.bottom-nav a svg{width:20px;height:20px;}
.bottom-nav a.active{color:var(--c-primary);}
@media(min-width:1024px){.bottom-nav{display:none;}}
.content{max-width:960px;margin:0 auto;padding:18px 16px calc(var(--bottomnav-h) + 24px);}
@media(min-width:1024px){.content{padding:26px 32px 40px;}}
.page-sub{color:var(--c-muted);font-size:13px;margin:0 0 14px;}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.card + .card{margin-top:12px;}
.muted{color:var(--c-muted);}
.small{font-size:12px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;min-height:44px;}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-outline{background:#fff;border:1px solid var(--c-border);color:var(--c-text);}
.btn-outline:hover{background:var(--c-bg);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12.5px;min-height:36px;}
.btn:disabled{background:var(--c-border)!important;color:#98A2B3!important;cursor:not-allowed;border-color:var(--c-border)!important;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-info{background:#E6EEF8;color:var(--c-primary);}
.badge-warn{background:#FCEBDC;color:var(--c-accent-dark);}
.badge-ok{background:#E4F5F0;color:#0B6B52;}
.badge-muted{background:var(--c-border);color:var(--c-muted);}
.hidden{display:none!important;}
.fchip-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.fchip{padding:7px 14px;border-radius:20px;border:1px solid var(--c-border);background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--c-muted);}
.fchip.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary);}
.toast{position:fixed;left:50%;bottom:calc(var(--bottomnav-h) + 18px);transform:translateX(-50%);background:#101828;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:120;box-shadow:var(--shadow-lg);}
.toast.hidden{display:none;}
@media(min-width:1024px){.toast{bottom:24px;}}
.content{max-width:1000px;}
.page-sub{color:var(--c-muted);font-size:13px;margin:0 0 14px;}
.fchip-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.fchip{padding:7px 14px;border-radius:20px;border:1px solid var(--c-border);background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--c-muted);}
.fchip.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary);}
.tool-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.tool-bar input[type=search]{flex:1;min-width:160px;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;font-family:inherit;min-height:40px;}
.select-sm{border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;min-height:40px;max-width:100%;}
.skill-bar-track{height:7px;border-radius:4px;background:var(--c-border);overflow:hidden;margin-top:4px;}
.skill-bar-fill{height:100%;background:var(--c-primary);border-radius:4px;}
.skill-bar-fill.warn{background:var(--c-accent);}
.cls-card{border:1.5px solid var(--c-border);border-radius:var(--radius);padding:15px 16px;background:#fff;}
.cls-card+.cls-card{margin-top:12px;}
.cls-card h4{margin:0;font-size:15.5px;}
.cls-meta{font-size:12.5px;color:var(--c-muted);margin-top:4px;}
.cls-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;}
@media(max-width:640px){.cls-stats{grid-template-columns:repeat(2,1fr);}}
.cls-stats div{background:var(--c-bg);border-radius:var(--radius-sm);padding:9px 11px;font-size:12px;color:var(--c-muted);}
.cls-stats b{display:block;font-size:17px;color:var(--c-text);margin-top:2px;}
.cls-foot{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.cls-empty{text-align:center;padding:34px 16px;color:var(--c-muted);font-size:13px;}
.crumb{font-size:13px;margin-bottom:10px;}
.crumb a{color:var(--c-primary);font-weight:700;}
.sum-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
@media(max-width:640px){.sum-row{grid-template-columns:repeat(2,1fr);}}
.sum-row div{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);padding:11px 13px;font-size:12px;color:var(--c-muted);}
.sum-row b{display:block;font-size:20px;color:var(--c-text);}
.srow{display:grid;grid-template-columns:2.4fr .9fr 1.4fr .8fr 1fr .8fr;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--c-border);cursor:pointer;font-size:13px;}
.srow:hover{background:var(--c-bg);}
.srow .lab{display:none;font-size:11px;color:var(--c-muted);}
.srow b{font-weight:700;}
.shead{display:grid;grid-template-columns:2.4fr .9fr 1.4fr .8fr 1fr .8fr;gap:12px;font-size:11.5px;color:var(--c-muted);font-weight:700;padding:0 4px 8px;}
.s-name{min-width:0;overflow-wrap:anywhere;}
@media(max-width:760px){
  .shead{display:none;}
  .srow{grid-template-columns:1fr 1fr;gap:8px 12px;}
  .srow .s-name{grid-column:1/-1;}
  .srow .s-st{grid-column:1/-1;}
  .srow .lab{display:block;}
}
.dw-ov{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:110;display:flex;justify-content:flex-end;}
.dw-ov.hidden{display:none;}
.dw{background:#fff;width:100%;max-width:440px;height:100%;overflow-y:auto;padding:20px;box-shadow:var(--shadow-lg);}
@media(max-width:640px){.dw-ov{align-items:flex-end;}.dw{max-width:100%;height:auto;max-height:88vh;border-radius:18px 18px 0 0;}}
.kgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0;}
.kgrid div{background:var(--c-bg);border-radius:var(--radius-sm);padding:8px 10px;font-size:11.5px;color:var(--c-muted);}
.kgrid b{display:block;font-size:15px;color:var(--c-text);}
.dh{margin:16px 0 8px;font-size:13.5px;}
.urow{display:flex;justify-content:space-between;font-size:12.5px;margin-top:8px;}
.recent-row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:6px 0;border-top:1px solid var(--c-border);}
.recent-row:first-of-type{border-top:none;}
.rr-date{color:var(--c-muted);flex:none;width:48px;}
.rr-unit{flex:1;min-width:0;}
.rr-attend{color:var(--c-muted);flex:none;}
.mx-wrap{overflow-x:auto;}
.mx{border-collapse:collapse;width:100%;min-width:720px;font-size:12.5px;}
.mx th,.mx td{padding:8px 8px;border-top:1px solid var(--c-border);text-align:center;}
.mx th{font-size:11.5px;color:var(--c-muted);font-weight:700;border-top:none;}
.mx td:first-child,.mx th:first-child{text-align:left;position:sticky;left:0;background:#fff;}
.cell{display:inline-block;min-width:44px;padding:3px 6px;border-radius:6px;font-weight:700;}
.c0{background:var(--c-bg);color:#98A2B3;}.c1{background:#FCEBDC;color:#9A4A0F;}.c2{background:#E6EEF8;color:var(--c-primary);}.c3{background:#E4F5F0;color:#0B6B52;}
@media print{.side-nav,.topbar,.bottom-nav,.tool-bar,.fchip-bar,.no-print{display:none!important;}.app.has-side .content,.app.has-side .topbar{margin-left:0!important;}}
</style>

<script>
var PL = TC.PL, T = TC.T, $ = TC.$;
TC.init();
var ids = TC.myClasses().map(function(c){ return c.id; });
var st = {c:'all', f:'all', sort:'name', q:'', n:15};
function render(){
  $('cSel').innerHTML = '<option value="all">'+T('全部班級','All classes')+'</option>'+TC.myClasses().map(function(c){ return '<option value="'+c.id+'"'+(st.c===c.id?' selected':'')+'>'+PL.esc(c.name)+'</option>'; }).join('');
  $('fSel').innerHTML = [['all',T('全部學生','All students')],['behind',T('需關心','Needs follow-up')],['inactive',T('尚未開通','Not activated')],['active',T('已開通','Activated')]].map(function(o){ return '<option value="'+o[0]+'"'+(st.f===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('');
  $('sSel').innerHTML = [['name',T('依姓名','By name')],['pct',T('完成率高到低','Completion high to low')],['pctAsc',T('完成率低到高','Completion low to high')],['hours',T('自學時數','Study hours')],['last',T('最後學習時間','Last study')],['lounge',T('Lounge 使用','Lounge use')]].map(function(o){ return '<option value="'+o[0]+'"'+(st.sort===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('');
  var q = st.q.toLowerCase();
  var rows = TC.rows(st.c==='all' ? ids : [st.c]).filter(function(x){
    if(q && (x.r.name+' '+x.r.email).toLowerCase().indexOf(q)<0) return false;
    if(st.f==='behind') return x.flag==='behind'; if(st.f==='inactive') return x.flag==='inactive'; if(st.f==='active') return x.r.status==='已啟用';
    return true; });
  TC.sortRows(rows, st.sort); window._rows = rows;
  $('cnt').textContent = T('共 ','Total ')+rows.length+T(' 位學生',' students');
  $('stuList').innerHTML = rows.slice(0,st.n).map(function(x){ return TC.rowHtml(x,true); }).join('');
  $('stuEmpty').classList.toggle('hidden', rows.length>0);
  $('moreBtn').classList.toggle('hidden', rows.length<=st.n);
}
$('q').addEventListener('input', function(){ st.q=this.value.trim(); st.n=15; render(); });
