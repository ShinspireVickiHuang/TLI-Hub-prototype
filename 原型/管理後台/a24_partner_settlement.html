<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>結算與對帳｜TLI Hub 管理後台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--navy:#1B4E8C;--navy-dark:#123a68;--orange:#E8792B;--teal:#0F9B79;
--g50:#F5F7FA;--g200:#E4E7EC;--g500:#667085;--g900:#101828;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
background:var(--g50);color:var(--g900);}
a{color:var(--navy);}
.app{display:flex;min-height:100vh;width:100%;background:#fff;}
.sidebar{width:260px;flex-shrink:0;background:#fff;color:var(--g900);padding:18px 0;
border-right:1px solid var(--g200);display:flex;flex-direction:column;transition:width .15s;
position:sticky;top:0;height:100vh;align-self:flex-start;}
.sidebar .brand{padding:0 20px 14px;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:4px;
border-bottom:1px solid var(--g200);margin-bottom:6px;text-decoration:none;color:inherit;cursor:pointer;}
.sidebar .brand-logo{height:28px;width:auto;display:block;}
.sidebar .brand small{display:block;font-weight:400;font-size:12px;color:var(--g500);margin-top:0;text-transform:uppercase;letter-spacing:.04em;}
.sidebar nav{flex:1 1 auto;overflow-y:auto;}
.sidebar nav a,.sidebar nav span.disabled{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13.5px;
color:var(--g900);text-decoration:none;position:relative;}
.sidebar nav a .navicon{flex-shrink:0;color:var(--g500);}
.sidebar nav a:hover{background:var(--g50);}
.sidebar nav a.active{background:#E6EEF8;color:var(--navy);font-weight:600;}
.sidebar nav a.active .navicon{color:var(--navy);}
.sidebar .sec-label{padding:16px 20px 4px;font-size:10.5px;color:var(--g500);letter-spacing:.08em;text-transform:uppercase;font-weight:600;}
.main{flex:1;padding:26px 32px 60px;min-width:0;}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:16px;}
.pagehead h1{font-size:20px;margin:0;}
.pagehead .desc{font-size:12.5px;color:var(--g500);margin-top:5px;line-height:1.6;}
.btn{display:inline-block;background:var(--navy);color:#fff;border:none;padding:8px 14px;
border-radius:6px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit;}
.btn.orange{background:var(--orange);}
.btn.teal{background:var(--teal);}
.btn.danger{background:#C0392B;}
.btn.ghost{background:#fff;border:1px solid var(--g200);color:var(--g900);}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled,.btn.isdisabled{background:var(--g200)!important;color:var(--g500)!important;
cursor:not-allowed!important;}
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
/* 20260928ux 新增：篩選列與表格分開包裝（同 a01 寫法），避免篩選用的下拉被誤判為「表格前設定卡」 */
.filterpanel{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
.tablebox{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
.card h2{font-size:15px;margin:0 0 12px;}
.tablewrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;background:var(--g50);color:var(--g500);font-weight:600;padding:10px 12px;
border-bottom:1px solid var(--g200);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--g200);white-space:nowrap;}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover{background:#F8FAFD;}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.badge.blue{background:#E7EEF8;color:var(--navy);}
.badge.green{background:#E4F5EE;color:var(--teal);}
.badge.orange{background:#FCE9DA;color:var(--orange);}
.badge.grey{background:var(--g200);color:var(--g500);}
.badge.red{background:#FBE7E7;color:#C0392B;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--g200);margin-bottom:16px;flex-wrap:wrap;}
.tabs button{background:none;border:none;padding:10px 12px;font-size:13px;color:var(--g500);
cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;}
.tabs button.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600;}
.tabpanel{display:none;}
.tabpanel.active{display:block;}
.modal-mask{display:none;position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:100;
align-items:center;justify-content:center;}
.modal-mask.open{display:flex;}
.modal{background:#fff;border-radius:10px;width:460px;max-width:90vw;max-height:85vh;
overflow:auto;padding:22px;}
.modal.wide{width:640px;}
.modal h3{margin-top:0;font-size:16px;}
.formrow{margin-bottom:13px;}
.formrow label{display:block;font-size:12.5px;color:var(--g500);margin-bottom:4px;}
.formrow input,.formrow select,.formrow textarea{width:100%;padding:7px 10px;border:1px solid var(--g200);
border-radius:6px;font-size:13px;box-sizing:border-box;font-family:inherit;}
.formrow textarea{resize:vertical;min-height:70px;}
.formrow .static{padding:7px 0;font-size:13.5px;}
/* 20260927j 新增：必填欄位星號與錯誤狀態（樣式對齊 a20 合作夥伴管理既有寫法） */
.req{color:#C00000;margin-left:2px;}
.rowerr{display:none;}
.formrow.req-error textarea,.formrow.req-error input,.formrow.req-error select{border-color:#C0392B;background:#FBE7E7;}
.formrow.req-error .rowerr{display:block;color:#C0392B;font-size:11.5px;margin-top:3px;}
.note{font-size:12px;color:#7a5b1f;background:#FFF8EE;border:1px solid #F3DFB8;padding:9px 11px;
border-radius:6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--g200);font-size:13px;}
.kv span:first-child{color:var(--g500);}
.small{font-size:12px;color:var(--g500);}
.hint{font-size:11.5px;color:var(--g500);margin-top:3px;}
.manage-link{font-size:11.5px;color:var(--navy);margin-left:8px;white-space:nowrap;text-decoration:underline;}
/* ---- 訂單列表專用 ---- */
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.searchbox{flex:1;min-width:220px;max-width:360px;position:relative;}
.searchbox input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--g200);border-radius:6px;
font-size:13px;font-family:inherit;box-sizing:border-box;}
.searchbox .sicon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--g500);font-size:13px;}
.toolbtns{display:flex;gap:8px;flex-wrap:wrap;}
.chipbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:12px;
background:var(--g50);border:1px solid var(--g200);border-radius:8px;}
.chipgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.chipgroup .glabel{font-size:11.5px;color:var(--g500);margin-right:2px;}
.fchip{padding:5px 12px;border-radius:14px;border:1px solid var(--g200);background:#fff;font-size:12.5px;
cursor:pointer;font-family:inherit;color:var(--g900);}
.fchip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.daterange{display:flex;align-items:center;gap:6px;}
.daterange input{padding:5px 7px;border:1px solid var(--g200);border-radius:6px;font-size:12px;font-family:inherit;}
.clearlink{font-size:12px;color:var(--navy);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;padding:0;}
.sortable{cursor:pointer;user-select:none;}
.sortable .sarrow{font-size:10px;color:var(--g200);margin-left:3px;}
.sortable.sorted .sarrow{color:var(--navy);}
.batchbar{display:none;align-items:center;gap:10px;background:#EEF3FA;border:1px solid #c7d3e6;
border-radius:8px;padding:9px 14px;margin-bottom:10px;font-size:13px;flex-wrap:wrap;}
.batchbar.show{display:flex;}
.batchbar .bcount{font-weight:600;color:var(--navy);}
.pagerbar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px;
color:var(--g500);flex-wrap:wrap;gap:10px;}
.pagerbtns{display:flex;gap:6px;align-items:center;}
.pagerbtns button{padding:5px 10px;border:1px solid var(--g200);background:#fff;border-radius:6px;
font-size:12.5px;cursor:pointer;font-family:inherit;}
.pagerbtns button:disabled{color:var(--g200);cursor:not-allowed;}
.pagerbtns select{padding:5px 8px;border:1px solid var(--g200);border-radius:6px;font-size:12.5px;font-family:inherit;}
/* ---- 右側訂單詳情抽屜（較寬，容納分頁表格） ---- */
.drawer-mask{display:none;position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:150;}
.drawer-mask.open{display:block;}
.drawer{position:fixed;top:0;right:0;height:100vh;width:680px;max-width:94vw;background:#fff;
box-shadow:-8px 0 24px rgba(16,24,40,.18);z-index:151;transform:translateX(100%);transition:transform .2s;
display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:18px 24px;border-bottom:1px solid var(--g200);display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0;}
.drawer-head h2{font-size:16px;margin:0 0 4px;}
.drawer-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--g500);line-height:1;padding:2px 6px;}
.drawer-close:hover{color:var(--g900);}
.drawer-body{flex:1;overflow-y:auto;padding:16px 24px 40px;}
/* ---- 批次匯入訂單精靈 ---- */
.wizsteps{display:flex;gap:6px;margin-bottom:18px;}
.wizsteps span{flex:1;text-align:center;padding:6px 4px;font-size:11.5px;border-bottom:3px solid var(--g200);color:var(--g500);}
.wizsteps span.active{border-color:var(--navy);color:var(--navy);font-weight:600;}
.wizsteps span.done{border-color:var(--teal);color:var(--teal);}
.dropzone{border:2px dashed var(--g200);border-radius:8px;padding:34px 16px;text-align:center;cursor:pointer;color:var(--g500);font-size:13px;}
.dropzone:hover{border-color:var(--navy);color:var(--navy);}
.dropzone.filled{border-color:var(--teal);color:var(--teal);background:#F5FBF9;}
.maprow{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;}
.maprow .mlbl{width:120px;flex-shrink:0;color:var(--g500);}
.maprow select{flex:1;padding:6px 8px;border:1px solid var(--g200);border-radius:6px;font-size:12.5px;font-family:inherit;}
.previewrow-err{background:#FBE7E7;}
.wizfoot{display:flex;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--g200);}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0;}
.statbox{border:1px solid var(--g200);border-radius:8px;padding:14px;text-align:center;}
.statbox .num{font-size:22px;font-weight:700;color:var(--navy);}
.statbox .lbl{font-size:11.5px;color:var(--g500);margin-top:4px;}
.pickrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--g200);font-size:13px;cursor:pointer;}
.pickrow:hover{background:var(--g50);}
.pickrow.selected{background:#EEF3FA;}
.pickrow .pname{font-weight:600;}
.pickrow .pmeta{color:var(--g500);font-size:12px;}
.planbox{border:1px solid var(--g200);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.planbox.selected{border-color:var(--navy);background:#EEF3FA;}
.planbox .pn{font-weight:600;font-size:13.5px;}
.planbox .pd{font-size:12px;color:var(--g500);margin-top:2px;}
/* ---- v2 新增：企業訂單（示範畫面，資料為模擬數字） ---- */
.sectiontitle{font-size:13px;font-weight:600;margin:16px 0 8px;color:var(--g900);}
.sectiontitle:first-child{margin-top:0;}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;}
.switch{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--g200);border-radius:21px;transition:.15s;}
.switch .slider:before{position:absolute;content:"";height:15px;width:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
.switch input:checked + .slider{background:var(--teal);}
.switch input:checked + .slider:before{transform:translateX(17px);}
.statcard{border:1px solid var(--g200);border-radius:8px;padding:12px 14px;}
.statcard .lbl{font-size:11.5px;color:var(--g500);}
.statcard .val{font-size:18px;font-weight:700;color:var(--navy);margin-top:2px;}
.demopick{border:1px solid var(--g200);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.demopick.selected{border-color:var(--navy);background:#EEF3FA;}
.demopick .dn{font-weight:600;font-size:13.5px;}
.demopick .dd{font-size:12px;color:var(--g500);margin-top:2px;}
/* v2 修正：抽屜（.drawer z-index:151）開啟時會蓋住 modal，modal 一律提高到抽屜之上 */
.modal-mask{z-index:210;}
.modal{position:relative;z-index:211;}
/* ---- 共用：頂欄與側欄使用者卡 ---- */
.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;position:relative;}
.su-clickarea{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
.su-info{flex:1;min-width:0;}
.su-name,.su-unit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.su-menu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.su-menu a:hover{background:var(--g50);}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.5;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-roletag{font-size:10.5px;background:#E6EEF8;color:var(--navy);padding:0 6px;border-radius:8px;display:inline-block;width:fit-content;white-space:nowrap;}
.sidebar-user .su-unit{font-size:11px;color:var(--g500);}
.su-menu{top:auto;bottom:64px;left:14px;right:14px;position:absolute;background:#fff;border:1px solid var(--g200);border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.16);z-index:50;display:none;}
.su-menu.open{display:block;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;
border-bottom:1px solid var(--g200);position:sticky;top:0;background:#fff;z-index:40;margin:-26px -32px 22px;gap:14px;}
.hamburger{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:var(--g900);padding:4px 6px;margin-right:4px;}
.topbar .tb-title{font-size:15px;font-weight:600;color:var(--g900);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .tb-actions{display:flex;align-items:center;gap:14px;position:relative;flex-shrink:0;}
.tb-search{display:flex;align-items:center;gap:6px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;
padding:6px 10px;width:180px;}
.tb-search input{border:none;background:none;outline:none;font-size:12.5px;font-family:inherit;width:100%;color:var(--g900);}
.tb-bellbtn{position:relative;background:none;border:none;cursor:pointer;font-size:17px;padding:4px;line-height:1;}
.tb-dot{position:absolute;top:0;right:0;width:7px;height:7px;background:#C0392B;border-radius:50%;display:none;}
.tb-avatarbtn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;border:none;
cursor:pointer;font-size:13px;font-weight:600;flex-shrink:0;}
.tb-panel{display:none;position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--g200);
border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.16);z-index:50;}
.tb-panel.open{display:block;}
.tb-notifpanel{width:300px;padding:10px;}
.tb-notifpanel .tn-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
padding:4px 6px 8px;border-bottom:1px solid var(--g200);margin-bottom:6px;}
.tb-notifpanel .tn-head a{font-size:11.5px;cursor:pointer;}
.tb-notifitem{padding:8px 6px;border-radius:6px;font-size:12.5px;line-height:1.5;}
.tb-notifitem:hover{background:var(--g50);}
.tb-notifitem.unread{background:#EEF3FA;}
.tb-notifitem .tn-t{color:var(--g500);font-size:11px;margin-top:2px;}
.tb-avatarmenu{width:150px;padding:6px;}
.tb-avatarmenu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.tb-avatarmenu a:hover{background:var(--g50);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
background:#101828;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
opacity:0;pointer-events:none;transition:.2s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:110;}
/* ---- RWD ---- */
@media (max-width:1279px) and (min-width:1024px){
  .sidebar{width:72px;}
  .sidebar .navtext{position:absolute;left:100%;top:50%;transform:translateY(-50%);background:#fff;
    border:1px solid var(--g200);border-radius:6px;padding:6px 10px;font-size:12.5px;white-space:nowrap;
    box-shadow:0 4px 12px rgba(16,24,40,.12);opacity:0;pointer-events:none;transition:opacity .12s;margin-left:6px;color:var(--g900);}
  .sidebar nav a:hover .navtext{opacity:1;}
  .sidebar .brand{align-items:center;overflow:hidden;}
  .sidebar .brand-logo{max-width:100%;width:32px;height:28px;object-fit:cover;object-position:left center;flex-shrink:0;}
  .sidebar .brand-text{display:none;}
  .sidebar .brand small{display:none;}
  .sidebar-user{justify-content:center;}
  .sidebar-user .navtext{display:none;}
}
@media (max-width:1023px){
  .hamburger{display:inline-flex;}
  .sidebar{position:fixed;left:-260px;top:0;height:100vh;width:260px;z-index:120;transition:left .2s;}
  .sidebar.open{left:0;}
  .sidebar-backdrop.open{display:block;}
  .app{width:100%;}
  .main{padding:16px 16px 40px;}
  .topbar{padding:0 16px;margin:-16px -16px 18px;}
  .tb-search{display:none;}
  .drawer{width:100%;max-width:100%;}
}
</style>
<style>
/* ==== 側欄改版 20260826f：呼吸感間距／分段收合／底部卡收攏（覆寫舊樣式，回應主管截圖回饋） ==== */
#sidebar{padding:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#sidebar .brand{padding:16px 20px 14px;}
#sidebar .brand-logo{height:28px;width:auto;object-fit:contain;object-position:left center;}
#sidebar .brand small{margin-top:12px;font-size:12px;color:var(--g500);text-transform:none;letter-spacing:0;font-weight:400;}
#sidebar .brand-text{display:none;}
#sidebar nav{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:4px 8px 8px;scrollbar-width:thin;}
#sidebar nav::-webkit-scrollbar{width:6px;}
#sidebar nav::-webkit-scrollbar-thumb{background:var(--g200);border-radius:3px;}
#sidebar nav a,#sidebar nav span.disabled{align-items:center;gap:12px;height:40px;padding:0 14px;margin:2px 0;border-radius:8px;font-size:14px;}
#sidebar .navgroup .sec-label{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px;margin:20px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#98A2B3;font-weight:600;}
#sidebar .navgroup:first-child .sec-label{margin-top:8px;}
#sidebar .sec-toggle{background:none;border:none;padding:2px;margin:0;cursor:pointer;color:var(--g500);display:flex;align-items:center;line-height:1;flex-shrink:0;}
#sidebar .sec-toggle svg{transition:transform .15s;display:block;}
#sidebar .navgroup.collapsed .sec-toggle svg{transform:rotate(-90deg);}
#sidebar .navgroup-items{overflow:hidden;}
#sidebar .navgroup.collapsed .navgroup-items{display:none;}
#sidebar .sidebar-user{display:block;border-top:1px solid var(--g200);padding:10px 12px;margin:0;flex-shrink:0;position:relative;}

function money(n){ if (typeof n !== 'number') return n; return 'NT$'+n.toLocaleString('zh-Hant-TW'); }

function franchiseCalc(revenue, royaltyRate, materialFee, retrainFee){
  var royalty = Math.round(revenue * royaltyRate / 100);
  return {kind:'franchise', revenue:revenue, royaltyRate:royaltyRate, royalty:royalty, materialFee:materialFee, retrainFee:retrainFee, total:royalty+materialFee+retrainFee};
}
function distributorCalc(depositRate, orderTotal, depositAmount, headcount, unitPrice, balanceAmount){
  return {kind:'distributor', depositRate:depositRate, orderTotal:orderTotal, depositAmount:depositAmount, headcount:headcount, unitPrice:unitPrice, balanceAmount:balanceAmount, total:depositAmount+balanceAmount};
}
function rebateCalc(annualRevenue, tierLabel, rebateRate){
  var amt = Math.round(annualRevenue * rebateRate / 100);
  return {kind:'rebate', annualRevenue:annualRevenue, tierLabel:tierLabel, rebateRate:rebateRate, total:amt};
}
function agentCalc(dealAmount, commRate){
  var commission = Math.round(dealAmount * commRate / 100);
  return {kind:'agent', dealAmount:dealAmount, commRate:commRate, commission:commission, total:commission};
}
function enterpriseCalc(hoursUsed, unitPrice, poolDeduction){
  var amount = poolDeduction ? 0 : hoursUsed*unitPrice;
  return {kind:'enterprise', hoursUsed:hoursUsed, unitPrice:unitPrice, poolDeduction:poolDeduction, total:amount};
}

function psAmount(row){ return row.calc.total; }
function psRealized(row){ return row.payments.reduce(function(s,p){ return s+p.amount; }, 0); }
function psDiff(row){ return psAmount(row) - psRealized(row); }

function psTypeBadge(t){
  if (t==='加盟') return '<span class="badge blue">加盟</span>';
  if (t==='經銷') return '<span class="badge orange">經銷</span>';
  if (t==='代理') return '<span class="badge green">代理</span>';
  return '<span class="badge grey" style="background:#EAF0FF;color:var(--navy)">企業合約</span>';
}
function psStatusBadge(s){
  if (s==='已收款' || s==='已付款') return '<span class="badge green">'+s+'</span>';
  if (s==='有差異') return '<span class="badge red">有差異</span>';
  if (s==='已開發票') return '<span class="badge blue">已開發票</span>';
  if (s==='已寄結算單') return '<span class="badge orange">已寄結算單</span>';
  return '<span class="badge grey">待產出</span>';
}
function psDirectionLabel(row){ return row.direction==='receivable' ? '應收' : '應付'; }

var psFilters = {type:'', status:'', period:''};
var psSearchTerm = '';
var PS_FILTER_LABELS = {type:'型態', status:'狀態', period:'結算期'};

function getPsFiltered(){
  var term = psSearchTerm.trim().toLowerCase();
  return PARTNER_SETTLEMENTS.filter(function(r){
    if (term && r.subject.toLowerCase().indexOf(term)===-1 && r.period.toLowerCase().indexOf(term)===-1) return false;
    if (psFilters.type && r.typeLabel!==psFilters.type) return false;
    if (psFilters.status && r.status!==psFilters.status) return false;
    if (psFilters.period && r.period!==psFilters.period) return false;
    return true;
  });
}
function onPsSearchInput(el){ psSearchTerm=el.value; renderPsTable(); }
function onPsFilterChange(kind, val){ psFilters[kind]=val; renderPsActiveTags(); renderPsTable(); }
function clearPsFilters(){
  psFilters={type:'',status:'',period:''}; psSearchTerm='';
  document.getElementById('psSearchInput').value='';
  document.getElementById('ps_f_type').value='';
  document.getElementById('ps_f_status').value='';
  document.getElementById('ps_f_period').value='';
  renderPsActiveTags(); renderPsTable();
}
function renderPsActiveTags(){
  var wrap = document.getElementById('psActiveTags'); if (!wrap) return;
  var tags = [];
  Object.keys(PS_FILTER_LABELS).forEach(function(k){
    if (psFilters[k]) tags.push({k:k, label:PS_FILTER_LABELS[k]+'：'+psFilters[k]});
  });
  wrap.innerHTML = tags.map(function(t){
    return '<span class="fchip active" style="cursor:pointer" onclick="removePsTag(\''+t.k+'\')">'+t.label+' ×</span>';
  }).join('');
}
function removePsTag(k){
  psFilters[k]='';
  var sel = document.getElementById('ps_f_'+(k==='type'?'type':k));
  if (sel) sel.value='';
  renderPsActiveTags(); renderPsTable();
}
function initPsPeriodOptions(){
  var periods = PARTNER_SETTLEMENTS.map(function(r){return r.period;});
  var uniq = periods.filter(function(p,i){return periods.indexOf(p)===i;});
  document.getElementById('ps_f_period').innerHTML = '<option value="">全部結算期</option>' + uniq.map(function(p){return '<option>'+p+'</option>';}).join('');
}

var PS_COLS = [
  {key:'subject', label:'夥伴／企業'},
  {key:'typeLabel', label:'型態'},
  {key:'period', label:'結算期'},
  {key:'amount', label:'應收／應付金額'},
  {key:'status', label:'狀態'}
];
function psCell(col, r){
  switch(col.key){
    case 'subject': return r.subject;
    case 'typeLabel': return psTypeBadge(r.typeLabel);
    case 'period': return r.period;
    case 'amount': return psDirectionLabel(r)+'　'+money(psAmount(r));
    case 'status': return psStatusBadge(r.status);
  }
  return '';
}
function renderPsTable(){
  var list = getPsFiltered();
  var t = document.getElementById('psTable');
  t.innerHTML = '<tr>'+PS_COLS.map(function(c){return '<th>'+c.label+'</th>';}).join('')+'<th></th></tr>' +
    list.map(function(r){
      return '<tr class="rowlink" onclick="openPsDrawer(\''+r.id+'\')">' + PS_COLS.map(function(c){return '<td>'+psCell(c,r)+'</td>';}).join('') +
        '<td><span class="linklike">查看</span></td></tr>';
    }).join('');
  document.getElementById('psEmpty').style.display = list.length ? 'none' : '';
}

var LS_FRANCHISE_DISPUTE_KEY = 'tliDemoOrgRoyaltyDisputes';
function loadFranchiseDisputes(){
  try{ var raw = localStorage.getItem(LS_FRANCHISE_DISPUTE_KEY); if (raw) return JSON.parse(raw); }catch(err){}
  return {};
}
function franchiseDisputesHtml(row){
  if (row.subject !== '範例大學語言中心') return '';
  var disputes = loadFranchiseDisputes();
  var periods = Object.keys(disputes);
  if (!periods.length) return '';
  var rows = periods.map(function(p){
    var d = disputes[p];
    return '<div class="kv"><span>'+p+'</span><span>'+escapeHtmlPs(d.note)+'（'+d.submittedAt+'）</span></div>';
  }).join('');
  return '<div class="hint" style="margin-top:10px;font-weight:600;color:var(--g900)">加盟主提出的疑義（待 TLI 覆核）</div>' + rows;
}
function escapeHtmlPs(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

    }
    return '<div class="kv"><span>本期使用時數</span><span>'+c.hoursUsed+' 小時</span></div>' +
      '<div class="kv"><span>單價</span><span>'+money(c.unitPrice)+'</span></div>' +
      '<div class="kv" style="font-weight:600"><span>合計（應收）</span><span>'+money(c.total)+'</span></div>' +
      '<div class="hint">使用時數 × 單價；使用時數來源：企業月結用量記錄。</div>';
  }
  return '';
}
function renderPsPayTable(row){
  var t = document.getElementById('ps_payTable');
  if (!row.payments.length){ t.innerHTML = '<tr><th>日期</th><th>金額</th><th>發票／憑證號碼</th><th>備註</th></tr><tr><td colspan="4" class="small" style="text-align:center;padding:10px 0">尚無付款紀錄</td></tr>'; return; }
  t.innerHTML = '<tr><th>日期</th><th>金額</th><th>發票／憑證號碼</th><th>備註</th></tr>' +
    row.payments.map(function(p){
      return '<tr><td>'+p.date+'</td><td>'+money(p.amount)+'</td><td>'+(p.invoiceNo||'－')+'</td><td class="small">'+(p.note||'－')+'</td></tr>';
    }).join('');
}
function renderPsRecon(row){
  var amt = psAmount(row), realized = psRealized(row), diff = psDiff(row);
  var el = document.getElementById('ps_recon');
  var label = row.direction==='receivable' ? '實收' : '實付';
  var html = '<div class="kv"><span>'+psDirectionLabel(row)+'金額</span><span>'+money(amt)+'</span></div>' +
    '<div class="kv"><span>'+label+'金額（依付款紀錄加總）</span><span>'+money(realized)+'</span></div>' +
    '<div class="kv" style="font-weight:600"><span>差額</span><span'+(diff!==0?' style="color:#C0392B"':'')+'>'+money(diff)+'</span></div>';
  if (diff !== 0){
    html += '<div class="formrow" style="margin-top:8px"><label>差異原因</label><textarea id="ps_diffReason" oninput="onDiffReasonInput(\''+row.id+'\', this.value)">'+(row.diffReason||'')+'</textarea></div>';
  } else {
    html += '<div class="hint">目前無差異。</div>';
  }
  el.innerHTML = html;
}
function onDiffReasonInput(id, val){ var row = findPs(id); if (row) row.diffReason = val; }

function openPsDrawer(id){
  currentPsId = id;
  var row = findPs(id);
  document.getElementById('ps_title').textContent = row.subject;
  document.getElementById('ps_sub').textContent = row.typeLabel+'｜結算期：'+row.period+'｜'+psDirectionLabel(row);
  document.getElementById('ps_statusrow').innerHTML = psTypeBadge(row.typeLabel)+' '+psStatusBadge(row.status);
  document.getElementById('ps_calc').innerHTML = calcRowsHtml(row);
  renderPsPayTable(row);
  renderPsRecon(row);
  document.getElementById('ps_markPaidBtn').textContent = '標記'+psDirectionLabel(row)+'已'+(row.direction==='receivable'?'收款':'付款');
  document.getElementById('psDrawerMask').classList.add('open');
  document.getElementById('psDrawer').classList.add('open');
}
function closePsDrawer(){
  document.getElementById('psDrawerMask').classList.remove('open');
  document.getElementById('psDrawer').classList.remove('open');
}
function issuePsStatement(){
  var row = findPs(currentPsId); if (!row) return;
  if (row.status==='待產出') row.status='已寄結算單';
  toast('已產出「'+row.subject+'／'+row.period+'」結算單 PDF（示範，不會實際下載檔案）');
  psRefreshAfterChange(row);
}
function markPsPaid(){
  var row = findPs(currentPsId); if (!row) return;
  row.status = row.direction==='receivable' ? '已收款' : '已付款';
  toast('已標記「'+row.subject+'／'+row.period+'」'+psStatusBadge(row.status).replace(/<[^>]+>/g,''));
  psRefreshAfterChange(row);
}
function psRefreshAfterChange(row){
  document.getElementById('ps_statusrow').innerHTML = psTypeBadge(row.typeLabel)+' '+psStatusBadge(row.status);
  document.getElementById('ps_markPaidBtn').textContent = '標記'+psDirectionLabel(row)+'已'+(row.direction==='receivable'?'收款':'付款');
  renderPsTable();
}

/* ---- 新增付款紀錄 ---- */
function openAddPsPayment(){
  document.getElementById('pp_date').value = new Date().toISOString().slice(0,10);
  document.getElementById('pp_amount').value = '';
  document.getElementById('pp_invoice').value = '';
  document.getElementById('pp_note').value = '';
  document.getElementById('psPayModal').classList.add('open');
}
function savePsPayment(){
  var row = findPs(currentPsId); if (!row) return;
  var date = document.getElementById('pp_date').value;
  var amount = Number(document.getElementById('pp_amount').value) || 0;
  var invoiceNo = document.getElementById('pp_invoice').value;
  var note = document.getElementById('pp_note').value;
  if (!date || !amount){ toast('請填寫日期與金額'); return; }
  row.payments.push({date:date, amount:amount, invoiceNo:invoiceNo, note:note});
  closeModal('psPayModal');
  renderPsPayTable(row);
  renderPsRecon(row);
  toast('已新增付款紀錄');
  /* 對帳後金額相符則自動結清狀態 */
  if (psDiff(row)===0 && (row.status==='已寄結算單' || row.status==='已開發票' || row.status==='有差異')){
    row.status = row.direction==='receivable' ? '已收款' : '已付款';
  } else if (psDiff(row)!==0){
    row.status = '有差異';
  }
  psRefreshAfterChange(row);
}

/* ================= 產生結算單 modal ================= */
function subjectOptionsForType(type){
  if (type==='加盟') return TLI_MASTERS.partners.filter(function(p){return p.type==='franchise';}).map(function(p){return p.name;});
  if (type==='經銷') return TLI_MASTERS.partners.filter(function(p){return p.type==='distributor';}).map(function(p){return p.name;});
  if (type==='代理') return TLI_MASTERS.partners.filter(function(p){return p.type==='agent';}).map(function(p){return p.name;});
  if (type==='企業合約') return TLI_MASTERS.orgCustomers.filter(function(o){return o.type==='general';}).map(function(o){return o.name;});
  return [];
}
/* ===== 結算期選項依「型態」連動：加盟／代理為半年結算；經銷同時有年度（Rebate）與梯次（訂金尾款）
   兩種結算週期，用 optgroup 分組讓人看得懂差別；企業合約為月結。顯示文字附期間說明，
   value 維持與既有 PARTNER_SETTLEMENTS 示範資料相同的代號格式，供期別篩選下拉比對一致。 ===== */
function periodOptionsForType(type){
  var HALF = [
    {value:'2026 H1', label:'2026 H1（2026-01-01～06-30）'},
    {value:'2026 H2', label:'2026 H2（2026-07-01～12-31）'},
    {value:'2027 H1', label:'2027 H1（2027-01-01～06-30）'}
  ];
  var ANNUAL = [
    {value:'2025 年度', label:'2025 年度（年度結算）'},
    {value:'2026 年度', label:'2026 年度（年度結算）'}
  ];
  var BATCH = [
    {value:'2026-09 梯次', label:'2026-09 梯次（訂金與尾款）'},
    {value:'2026-11 梯次', label:'2026-11 梯次（訂金與尾款）'}
  ];
  var MONTHLY = [
    {value:'2026-09', label:'2026-09（月結）'},
    {value:'2026-10', label:'2026-10（月結）'}
  ];
  if (type==='加盟' || type==='代理') return {flat: HALF};
  if (type==='經銷') return {groups:[{label:'年度結算', items:ANNUAL}, {label:'梯次結算', items:BATCH}]};
  if (type==='企業合約') return {flat: MONTHLY};
  return {flat: []};
}
function periodOptionsHtml(type){
  var opt = periodOptionsForType(type);
  if (opt.groups){
    return opt.groups.map(function(g){
      return '<optgroup label="'+g.label+'">' + g.items.map(function(o){return '<option value="'+o.value+'">'+o.label+'</option>';}).join('') + '</optgroup>';
    }).join('');
  }
  if (!opt.flat.length) return '<option value="">（無可選期別）</option>';
  return opt.flat.map(function(o){return '<option value="'+o.value+'">'+o.label+'</option>';}).join('');
}
function onSettleTypeChange(type){
  var sel = document.getElementById('settle_subject');
  var names = subjectOptionsForType(type);
  sel.innerHTML = names.length ? names.map(function(n){return '<option>'+n+'</option>';}).join('') : '<option value="">（無可選對象）</option>';
  var psel = document.getElementById('settle_period');
  psel.innerHTML = type ? periodOptionsHtml(type) : '<option value="">請先選擇型態</option>';
}
function openSettleModal(){
  document.getElementById('settle_type').value = '';
  document.getElementById('settle_subject').innerHTML = '<option value="">請先選擇型態</option>';
  document.getElementById('settle_period').innerHTML = '<option value="">請先選擇型態</option>';
  document.getElementById('settleModal').classList.add('open');
}
function closeSettleModal(){ document.getElementById('settleModal').classList.remove('open'); }
function submitSettleStatement(){
  var type = document.getElementById('settle_type').value;
  var subject = document.getElementById('settle_subject').value;
  var period = document.getElementById('settle_period').value;
  if (!type || !subject || !period){ toast('請選擇型態、夥伴／企業與結算期'); return; }
  var direction = type==='代理' ? 'payable' : 'receivable';
  var calc = type==='企業合約' ? enterpriseCalc(0,380,false) :
    type==='加盟' ? franchiseCalc(0,0,0,0) :
    type==='經銷' ? distributorCalc(0,0,0,0,0,0) : agentCalc(0,0);
  var id = 'PS-'+String(1000+PARTNER_SETTLEMENTS.length);
  PARTNER_SETTLEMENTS.unshift({id:id, subject:subject, typeLabel:type, period:period, direction:direction, status:'待產出', calc:calc, payments:[], diffReason:''});
  closeSettleModal();
  initPsPeriodOptions();
  renderPsTable();
  toast('結算單已建立：'+subject+'／'+period+'（金額待申報／對帳資料到齊後試算）');
}

initPsPeriodOptions();
renderPsTable();

/* ================= ESC 鍵關閉目前開啟中的 modal／drawer ================= */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  ['settleModal','psPayModal'].forEach(function(id){
    var el = document.getElementById(id);
    if (el && el.classList.contains('open')) closeModal(id);
  });
  if (document.getElementById('psDrawerMask').classList.contains('open')) closePsDrawer();
});
</script>
