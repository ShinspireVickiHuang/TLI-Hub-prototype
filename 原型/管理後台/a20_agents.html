<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>合作夥伴管理｜TLI Hub 管理後台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--navy:#1B4E8C;--navy-dark:#123a68;--orange:#E8792B;--teal:#0F9B79;
--g50:#F5F7FA;--g200:#E4E7EC;--g500:#667085;--g900:#101828;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
background:var(--g50);color:var(--g900);}
a{color:var(--navy);}
.app{display:flex;min-height:100vh;width:100%;background:#fff;}
.sidebar{width:260px;flex-shrink:0;background:#fff;color:var(--g900);padding:18px 0;
border-right:1px solid var(--g200);display:flex;flex-direction:column;transition:width .15s;
position:sticky;top:0;height:100vh;align-self:flex-start;}
.sidebar .brand{padding:0 20px 14px;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:4px;
border-bottom:1px solid var(--g200);margin-bottom:6px;text-decoration:none;color:inherit;cursor:pointer;}
.sidebar .brand-logo{height:28px;width:auto;display:block;}
.sidebar .brand small{display:block;font-weight:400;font-size:12px;color:var(--g500);margin-top:0;text-transform:uppercase;letter-spacing:.04em;}
.sidebar nav{flex:1 1 auto;overflow-y:auto;}
.sidebar nav a,.sidebar nav span.disabled{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13.5px;
color:var(--g900);text-decoration:none;position:relative;}
.sidebar nav a .navicon{flex-shrink:0;color:var(--g500);}
.sidebar nav a:hover{background:var(--g50);}
.sidebar nav a.active{background:#E6EEF8;color:var(--navy);font-weight:600;}
.sidebar nav a.active .navicon{color:var(--navy);}
.sidebar .sec-label{padding:16px 20px 4px;font-size:10.5px;color:var(--g500);letter-spacing:.08em;text-transform:uppercase;font-weight:600;}
.main{flex:1;padding:26px 32px 60px;min-width:0;}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:16px;}
.pagehead h1{font-size:20px;margin:0;}
.pagehead .desc{font-size:12.5px;color:var(--g500);margin-top:5px;line-height:1.6;}
.btn{display:inline-block;background:var(--navy);color:#fff;border:none;padding:8px 14px;
border-radius:6px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit;}
.btn.orange{background:var(--orange);}
.btn.teal{background:var(--teal);}
.btn.ghost{background:#fff;border:1px solid var(--g200);color:var(--g900);}
.btn.danger{background:#fff;border:1px solid #F0B7B7;color:#C0392B;}
.btn:disabled,.btn.isdisabled{background:var(--g200)!important;color:var(--g500)!important;
cursor:not-allowed!important;}
.linkbtn{background:none;border:none;color:var(--navy);font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;font-family:inherit;}
.disputecard{border:1px solid #F3DFB8;background:#FFFBF3;}
.disputecard h2{color:#7a5b1f;}
.disputerow{border:1px solid var(--g200);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#fff;}
.disputerow .dr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.disputerow .dr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.footrow td{font-weight:700;border-top:2px solid var(--g200);}
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
/* 20260928ux 新增：篩選列與表格分開包裝（同 a01 寫法），避免篩選用的下拉被誤判為「表格前設定卡」 */
.filterpanel{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
.tablebox{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
.card h2{font-size:15px;margin:0 0 12px;}
.tablewrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;background:var(--g50);color:var(--g500);font-weight:600;padding:10px 12px;
border-bottom:1px solid var(--g200);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--g200);white-space:nowrap;}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover{background:#F8FAFD;}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.badge.blue{background:#E7EEF8;color:var(--navy);}
.badge.amber{background:#FDEDD9;color:#B35309;}
.badge.green{background:#E4F5EE;color:var(--teal);}
.badge.orange{background:#FCE9DA;color:var(--orange);}
.badge.grey{background:var(--g200);color:var(--g500);}
.badge.red{background:#FBE7E7;color:#C0392B;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--g200);margin-bottom:16px;flex-wrap:wrap;}
.tabs button{background:none;border:none;padding:10px 12px;font-size:13px;color:var(--g500);
cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;}
.tabs button.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600;}
.tabpanel{display:none;}
.tabpanel.active{display:block;}
.modal-mask{display:none;position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:160;
align-items:center;justify-content:center;}
.modal-mask.open{display:flex;}
.modal{background:#fff;border-radius:10px;width:460px;max-width:90vw;max-height:85vh;
overflow:auto;padding:22px;}
.modal.wide{width:640px;}
.modal h3{margin-top:0;font-size:16px;}
.formrow{margin-bottom:13px;}
.formrow label{display:block;font-size:12.5px;color:var(--g500);margin-bottom:4px;}
.formrow input,.formrow select,.formrow textarea{width:100%;padding:7px 10px;border:1px solid var(--g200);
border-radius:6px;font-size:13px;box-sizing:border-box;font-family:inherit;}
.formrow textarea{resize:vertical;min-height:60px;}
/* 20260929fix2：radio／checkbox 群組不套用文字輸入框樣式（原本 width:100%+padding+border 會把選項擠成跑版的長條），
   label 本身用 flex 同一行左對齊包住輸入框，讓整列可點 */
.formrow input.pe-radiocheck{width:15px;height:15px;padding:0;margin:0;border:none;border-radius:0;
box-sizing:content-box;flex-shrink:0;accent-color:var(--navy);}
.formrow label:has(> input.pe-radiocheck){display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;
margin-bottom:6px;cursor:pointer;text-align:left;}
.formrow .static{padding:7px 0;font-size:13.5px;}
.req{color:#C00000;margin-left:2px;}
.formrow.req-error input,.formrow.req-error select{border-color:#C0392B;background:#FBE7E7;}
.formrow.req-error .rowerr{display:block;color:#C0392B;font-size:11.5px;margin-top:3px;}
.note{font-size:12px;color:#7a5b1f;background:#FFF8EE;border:1px solid #F3DFB8;padding:9px 11px;
border-radius:6px;}
.crosslink{display:block;font-size:11.5px;color:var(--g500);margin:6px 0 10px;}
.crosslink a{color:var(--navy);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--g200);font-size:13px;}
.kv span:first-child{color:var(--g500);}
.small{font-size:12px;color:var(--g500);}
.hint{font-size:11.5px;color:var(--g500);margin-top:3px;}
/* ---- 列表共用 ---- */
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.filterbar select{padding:7px 10px;border:1px solid var(--g200);border-radius:6px;font-size:13px;font-family:inherit;background:#fff;color:var(--g900);}
.searchbox{flex:1;min-width:220px;max-width:360px;position:relative;}
.searchbox input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--g200);border-radius:6px;
font-size:13px;font-family:inherit;box-sizing:border-box;}
.searchbox .sicon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--g500);font-size:13px;}
.chipbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:12px;
background:var(--g50);border:1px solid var(--g200);border-radius:8px;}
.chipgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.chipgroup .glabel{font-size:11.5px;color:var(--g500);margin-right:2px;}
.fchip{padding:5px 12px;border-radius:14px;border:1px solid var(--g200);background:#fff;font-size:12.5px;
cursor:pointer;font-family:inherit;color:var(--g900);}
.fchip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.clearlink{font-size:12px;color:var(--navy);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;padding:0;}
.sortable{cursor:pointer;user-select:none;}
.sortable .sarrow{font-size:10px;color:var(--g200);margin-left:3px;}
.sortable.sorted .sarrow{color:var(--navy);}
.pagerbar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px;
color:var(--g500);flex-wrap:wrap;gap:10px;}
.pagerbtns{display:flex;gap:6px;align-items:center;}
.pagerbtns button{padding:5px 10px;border:1px solid var(--g200);background:#fff;border-radius:6px;
font-size:12.5px;cursor:pointer;font-family:inherit;}
.pagerbtns button:disabled{color:var(--g200);cursor:not-allowed;}
.pagerbtns select{padding:5px 8px;border:1px solid var(--g200);border-radius:6px;font-size:12.5px;font-family:inherit;}
/* ---- 右側詳情抽屜 ---- */
.drawer-mask{display:none;position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:150;}
.drawer-mask.open{display:block;}
.drawer{position:fixed;top:0;right:0;height:100vh;width:520px;max-width:94vw;background:#fff;
box-shadow:-8px 0 24px rgba(16,24,40,.18);z-index:151;transform:translateX(100%);transition:transform .2s;
display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--g200);display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0;}
.drawer-head h2{font-size:16px;margin:0 0 4px;}
.drawer-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--g500);line-height:1;padding:2px 6px;}
.drawer-close:hover{color:var(--g900);}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px 40px;}
/* ---- 統計卡 ---- */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0;}
.statbox{border:1px solid var(--g200);border-radius:8px;padding:14px;text-align:center;}
.statbox .num{font-size:22px;font-weight:700;color:var(--navy);}
.statbox .lbl{font-size:11.5px;color:var(--g500);margin-top:4px;}
.sectiontitle{font-size:13px;font-weight:600;margin:16px 0 8px;color:var(--g900);}
.sectiontitle:first-child{margin-top:0;}
.demo-tag{display:block;font-size:10px;font-weight:400;color:#98A2B3;text-transform:none;letter-spacing:0;white-space:normal;}
/* ---- 組織樹 ---- */
.orgtree{border:1px solid var(--g200);border-radius:8px;padding:4px 0;}
.orgdept{padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--g500);background:var(--g50);border-bottom:1px solid var(--g200);}
.orgdept:first-child{border-top:none;}
.orgemp{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 20px;font-size:13px;border-bottom:1px dashed var(--g200);}
.orgemp:last-child{border-bottom:none;}
.orgemp .oe-actions{display:flex;gap:8px;}
.orgemp .oe-actions button{background:none;border:none;color:var(--navy);font-size:12px;cursor:pointer;padding:0;text-decoration:underline;font-family:inherit;}
/* ---- 開關 ---- */
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;}
.switch{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--g200);border-radius:21px;transition:.15s;}
.switch .slider:before{position:absolute;content:"";height:15px;width:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
.switch input:checked + .slider{background:var(--teal);}
.switch input:checked + .slider:before{transform:translateX(17px);}
/* ---- 共用：頂欄與側欄使用者卡 ---- */
.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;display:flex;align-items:center;gap:10px;position:relative;}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.4;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-role{font-size:11px;color:var(--g500);}
.sidebar .su-logout{display:block;margin:6px 20px 4px;font-size:12px;color:var(--navy);text-decoration:none;}
.sidebar .su-logout:hover{text-decoration:underline;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;
border-bottom:1px solid var(--g200);position:sticky;top:0;background:#fff;z-index:40;margin:-26px -32px 22px;gap:14px;}
.hamburger{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:var(--g900);padding:4px 6px;margin-right:4px;}
.topbar .tb-title{font-size:15px;font-weight:600;color:var(--g900);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .tb-actions{display:flex;align-items:center;gap:14px;position:relative;flex-shrink:0;}
.tb-search{display:flex;align-items:center;gap:6px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;
padding:6px 10px;width:180px;}
.tb-search input{border:none;background:none;outline:none;font-size:12.5px;font-family:inherit;width:100%;color:var(--g900);}
.tb-searchicon{font-size:12px;color:var(--g500);}
.tb-bellbtn{position:relative;background:none;border:none;cursor:pointer;font-size:17px;padding:4px;line-height:1;}
.tb-dot{position:absolute;top:0;right:0;width:7px;height:7px;background:#C0392B;border-radius:50%;display:none;}
.tb-avatarbtn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;border:none;
cursor:pointer;font-size:13px;font-weight:600;flex-shrink:0;}
.tb-panel{display:none;position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--g200);
border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.16);z-index:50;}
.tb-panel.open{display:block;}
.tb-notifpanel{width:300px;padding:10px;}
.tb-notifpanel .tn-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
padding:4px 6px 8px;border-bottom:1px solid var(--g200);margin-bottom:6px;}
.tb-notifpanel .tn-head a{font-size:11.5px;cursor:pointer;}
.tb-notifitem{padding:8px 6px;border-radius:6px;font-size:12.5px;line-height:1.5;}
.tb-notifitem:hover{background:var(--g50);}
.tb-notifitem.unread{background:#EEF3FA;}
.tb-notifitem .tn-t{color:var(--g500);font-size:11px;margin-top:2px;}
.tb-avatarmenu{width:150px;padding:6px;}
.tb-avatarmenu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.tb-avatarmenu a:hover{background:var(--g50);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
background:#101828;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
opacity:0;pointer-events:none;transition:.2s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:110;}
.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;position:relative;}
.su-clickarea{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
.su-info{flex:1;min-width:0;}
.su-name,.su-unit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.su-menu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.su-menu a:hover{background:var(--g50);}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.5;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-roletag{font-size:10.5px;background:#E6EEF8;color:var(--navy);padding:0 6px;border-radius:8px;display:inline-block;width:fit-content;white-space:nowrap;}
.sidebar-user .su-unit{font-size:11px;color:var(--g500);}
.su-menu{top:auto;bottom:64px;left:14px;right:14px;}
.su-roleswitch,.su-campusswitch{margin:8px 0 0;font-size:11px;color:var(--g500);}
.su-roleswitch select,.su-campusswitch select{width:100%;margin-top:3px;padding:5px 7px;border:1px solid var(--g200);
border-radius:6px;font-size:12px;font-family:inherit;color:var(--g900);}
/* ---- RWD ---- */
@media (max-width:1279px) and (min-width:1024px){
  .sidebar{width:72px;}
  .sidebar .navtext{position:absolute;left:100%;top:50%;transform:translateY(-50%);background:#fff;
    border:1px solid var(--g200);border-radius:6px;padding:6px 10px;font-size:12.5px;white-space:nowrap;
    box-shadow:0 4px 12px rgba(16,24,40,.12);opacity:0;pointer-events:none;transition:opacity .12s;margin-left:6px;color:var(--g900);}
  .sidebar nav a:hover .navtext{opacity:1;}
  .sidebar .brand{align-items:center;overflow:hidden;}
  .sidebar .brand-logo{max-width:100%;width:32px;height:28px;object-fit:cover;object-position:left center;flex-shrink:0;}
  .sidebar .brand-text{display:none;}
  .sidebar .brand small{display:none;}
  .sidebar-user{justify-content:center;}
  .sidebar-user .navtext{display:none;}
  .sidebar .su-logout{text-align:center;}
}
@media (max-width:1023px){
  .hamburger{display:inline-flex;}
  .sidebar{position:fixed;left:-260px;top:0;height:100vh;width:260px;z-index:120;transition:left .2s;}
  .sidebar.open{left:0;}
  .sidebar-backdrop.open{display:block;}
  .app{width:100%;}
  .main{padding:16px 16px 40px;}
  .topbar{padding:0 16px;margin:-16px -16px 18px;}
  .tb-search{display:none;}
  .drawer{width:100%;max-width:100%;}
  .statgrid{grid-template-columns:1fr;}
}
</style>
<style>
/* ==== 側欄改版 20260826f：呼吸感間距／分段收合／底部卡收攏（覆寫舊樣式，回應主管截圖回饋） ==== */
#sidebar{padding:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#sidebar .brand{padding:16px 20px 14px;}
#sidebar .brand-logo{height:28px;width:auto;object-fit:contain;object-position:left center;}
#sidebar .brand small{margin-top:12px;font-size:12px;color:var(--g500);text-transform:none;letter-spacing:0;font-weight:400;}
#sidebar .brand-text{display:none;}
#sidebar nav{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:4px 8px 8px;scrollbar-width:thin;}
#sidebar nav::-webkit-scrollbar{width:6px;}
#sidebar nav::-webkit-scrollbar-thumb{background:var(--g200);border-radius:3px;}
#sidebar nav a,#sidebar nav span.disabled{align-items:center;gap:12px;height:40px;padding:0 14px;margin:2px 0;border-radius:8px;font-size:14px;}
#sidebar .navgroup .sec-label{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px;margin:20px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#98A2B3;font-weight:600;}
#sidebar .navgroup:first-child .sec-label{margin-top:8px;}
#sidebar .sec-toggle{background:none;border:none;padding:2px;margin:0;cursor:pointer;color:var(--g500);display:flex;align-items:center;line-height:1;flex-shrink:0;}
#sidebar .sec-toggle svg{transition:transform .15s;display:block;}
#sidebar .navgroup.collapsed .sec-toggle svg{transform:rotate(-90deg);}
#sidebar .navgroup-items{overflow:hidden;}
#sidebar .navgroup.collapsed .navgroup-items{display:none;}
#sidebar .sidebar-user{display:block;border-top:1px solid var(--g200);padding:10px 12px;margin:0;flex-shrink:0;position:relative;}
#sidebar .su-row{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}

function slugify(s){ return String(s||'partner').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'partner'; }
function applyGenericFrontendDefaults(o){
  var slug = o.slug || (o.id ? (PARTNER_SLUG[o.id] || o.id) : slugify(o.name));
  if (!o.frontUrls){
    o.frontUrls = {
      home: 'https://' + slug + '.tliconnect.com/',
      courses: 'https://' + slug + '.tliconnect.com/courses',
      login: 'https://' + slug + '.tliconnect.com/login'
    };
  }
  if (!o.brandMode){
    o.brandMode = (o.type === 'franchise') ? 'tli_co' : (o.coMarketing ? 'tli_badge' : 'none');
  }
  if (!o.customDomain){
    o.customDomain = {domain:'', dnsStatus:'unset'};
  }
  if (!o.mailSignature){
    o.mailSignature = {
      fromName: o.name || '',
      replyTo: 'service@' + slug + '.tliconnect.com',
      footerText: '本信件由「' + (o.name || '') + '」透過 TLI Connect 系統發送'
    };
  }
  if (o.videoLicenseTool === undefined){
    o.videoLicenseTool = (o.videoLicense === 'own') ? {name:''} : null;
  }
}
/* 既有資料的補值（含 20260927 定案的 12 家）：套一次性預設，之後同一物件不重算 */
function ensurePartnerDefaults(p){
  if (!p || p._fdApplied) return p;
  p._fdApplied = true;
  if (p.type !== 'agent'){
    applyGenericFrontendDefaults(p);
    if (PARTNER_CUSTOM_DOMAIN_DEFAULT[p.id] && !p.customDomain.domain){
      p.customDomain = Object.assign({domain:'', dnsStatus:'unset'}, PARTNER_CUSTOM_DOMAIN_DEFAULT[p.id]);
    }
    if (PARTNER_OWN_VIDEO_DEFAULT[p.id] && p.videoLicense === 'own' && (!p.videoLicenseTool || !p.videoLicenseTool.name)){
      p.videoLicenseTool = PARTNER_OWN_VIDEO_DEFAULT[p.id];
    }
  }
  if (!p.uiLocales) p.uiLocales = [];
  if (!p.sellableProjects) p.sellableProjects = (PARTNER_SELLABLE_PROJECTS_SEED[p.id] || []).slice();
  if (!p.createdAt) p.createdAt = p.from;
  if (!p.updatedAt) p.updatedAt = p.createdAt;
  if (!p.updatedBy) p.updatedBy = currentEditorName();
  return p;
}

function seedFromId(id){ var h=0; var s=String(id); for (var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; } return h; }
function demoStudentStats(p){
  var h = seedFromId(p.id);
  var total = 20 + (h % 280);
  var activeRatio = 40 + (h % 56);
  var logins = Math.round(total * (0.1 + (h % 40) / 100));
  return {total:total, activeRatio:activeRatio, logins:logins};
}

/* ================= 檢視／編輯共用欄位渲染：view 模式輸出 kv 唯讀列，edit 模式輸出可輸入的 formrow ================= */
function fieldRow(mode, label, viewHtml, editHtml, opts){
  var lbl = TT(label);
  if (mode === 'view'){
    return '<div class="kv"><span>' + lbl + '</span><span>' + viewHtml + '</span></div>';
  }
  opts = opts || {};
  var idAttr = opts.id ? ' id="' + opts.id + '"' : '';
  var req = opts.required ? '<span class="req">*</span>' : '';
  var err = opts.required ? '<div class="rowerr" style="display:none">' + TT(opts.errMsg || '必填') + '</div>' : '';
  return '<div class="formrow"' + idAttr + '><label>' + lbl + req + '</label>' + editHtml + err + '</div>';
}
function countryOptionsHtml(selected){
  return COUNTRIES.map(function(c){ return '<option value="' + c + '"' + (c === selected ? ' selected' : '') + '>' + countryLabel(c) + '</option>'; }).join('');
}
function distSettleOptions(selected){
  var opts = [['每月','每月與 TLI 結算'],['每季','每季與 TLI 結算'],['每年','每年與 TLI 結算（年度返佣）']];
  var html = opts.map(function(o){ return '<option value="' + o[0] + '"' + (o[0] === selected ? ' selected' : '') + '>' + TT(o[1]) + '</option>'; }).join('');
  if (selected && !opts.some(function(o){ return o[0] === selected; })){
    html += '<option value="' + escHtml(selected) + '" selected>' + escHtml(selected) + TLI_I18N.t('（沿用既有設定）',' (kept from existing setting)') + '</option>';
  }
  return html;
}

function renderDrawerHeader(){
  var titleEl = document.getElementById('pdTitle');

  var saveBtn = document.getElementById('pdSaveBtn');

    metaEl.innerHTML = pdIsNew ? TT('請先選擇合作型態，其餘欄位依型態顯示') : TT('編輯中');

function renderDrawerBody(){

function pdAssignTenantCode(o){

function applyTypeDefaults(o){

function pdClearReqErrors(){
  ['pf_brandFee','pf_royaltyRate','pf_depositRate','pf_rebateTiers','pf_commRate','pf_validDays','pf_locales'].forEach(function(id){
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('req-error');
    var e = el.querySelector('.rowerr'); if (e) e.style.display = 'none';
  });
}
function pdMarkReqError(id){
  var el = document.getElementById(id);
  if (!el) return;
  el.classList.add('req-error');
  var e = el.querySelector('.rowerr'); if (e) e.style.display = '';
}
function validatePartnerDraft(){
  pdClearReqErrors();
  var ok = true;
  var type = pdDraft.type;
  if (type === 'franchise'){
    if (!String(pdDraft.brandFee == null ? '' : pdDraft.brandFee).trim()){ pdMarkReqError('pf_brandFee'); ok = false; }
    if (!String(pdDraft.royaltyRate == null ? '' : pdDraft.royaltyRate).trim()){ pdMarkReqError('pf_royaltyRate'); ok = false; }
  } else if (type === 'distributor'){
    if (!String(pdDraft.depositRate == null ? '' : pdDraft.depositRate).trim()){ pdMarkReqError('pf_depositRate'); ok = false; }
    var validTier = (pdDraft.rebateTiers || []).some(function(t){ return String(t.min).trim() && String(t.rate).trim(); });
    if (!validTier){ pdMarkReqError('pf_rebateTiers'); ok = false; }
  } else if (type === 'agent'){
    if (!String(pdDraft.commRate == null ? '' : pdDraft.commRate).trim()){ pdMarkReqError('pf_commRate'); ok = false; }
    if (!String(pdDraft.validDays == null ? '' : pdDraft.validDays).trim()){ pdMarkReqError('pf_validDays'); ok = false; }
  }
  if (type !== 'agent' && !(pdDraft.uiLocales || []).length){ pdMarkReqError('pf_locales'); ok = false; }
  return ok;
}
function pdNormalizeNumbers(o){
  ['brandFee','setupFee','teacherTrainFee','retrainFee'].forEach(function(k){
    var v = o[k];
    o[k] = (v !== undefined && v !== null && String(v).trim() !== '') ? (Number(v) || null) : null;
  });
}
function savePartnerEdit(){
  var name = (pdDraft.name || '').trim();
  var contact = (pdDraft.contact || '').trim();
  if (!name || !contact){
    toast(TT('請填寫合作夥伴名稱與聯絡人'));
    return;
  }
  if (!validatePartnerDraft()){
    toast(TT('商業條件有必填欄位未填，請檢查標紅處'));
    return;
  }
  pdDraft.name = name;
  pdDraft.contact = contact;
  pdNormalizeNumbers(pdDraft);
  var nowDate = nowStr().slice(0, 10);
  if (pdIsNew){
    partnerSeq++;
    pdDraft.id = 'p' + partnerSeq;
    pdDraft.createdAt = nowDate;
    pdDraft.updatedAt = nowDate;
    pdDraft.updatedBy = currentEditorName();
    pdDraft._fdApplied = true;
    PARTNERS.push(pdDraft);
    PARTNER_LOG.unshift({time:nowStr(), name:name, fields:TT('新增合作夥伴'), editor:currentEditorName()});
    toast(TLI_I18N.t('已建立合作夥伴「' + name + '」（' + TYPE_LABEL[pdDraft.type] + '）', 'Partner "' + name + '" (' + TT(TYPE_LABEL[pdDraft.type]) + ') has been created'));
    renderPartnerTable();
    renderPartnerLog();
    closePartnerDetailForce();
    return;
  }
  var real = partnerById(pdCurrentId);
  if (!real) return;
  pdDraft.updatedAt = nowDate;
  pdDraft.updatedBy = currentEditorName();
  Object.assign(real, pdDraft);
  PARTNER_LOG.unshift({time:nowStr(), name:name, fields:TT('商業條件與基本資料'), editor:currentEditorName()});
  toast(TLI_I18N.t('已更新「' + name + '」的資料', 'The data for "' + name + '" has been updated'));
  pdMode = 'view';
  pdDraft = null;
  renderPartnerTable();
  renderPartnerLog();
  renderPartnerDrawer();
}
function closePartnerDetailForce(){
  var mask = document.getElementById('pdMask');
  var drawer = document.getElementById('pdDrawer');
  if (mask) mask.classList.remove('open');
  if (drawer) drawer.classList.remove('open');
  pdCurrentId = null;
  pdIsNew = false;
  pdMode = 'view';
  pdDraft = null;
}
function tryClosePartnerDrawer(){

function partnerFiltered(){
  var q = (document.getElementById('partnerSearch').value || '').trim().toLowerCase();
  var ty = document.getElementById('f_type').value;
  var co = document.getElementById('f_country').value;
  var st = document.getElementById('f_status').value;
  return PARTNERS.filter(function(p){
    if (q && (p.name + p.contact + (p.tenant||'')).toLowerCase().indexOf(q) < 0) return false;
    if (ty && p.type !== ty) return false;
    if (co && p.country !== co) return false;
    if (st && p.status !== st) return false;
    return true;
  });
}

  ev.stopPropagation();
  closePanel('notifPanel');
  document.getElementById('avatarMenu').classList.toggle('open');
}
function closePanel(id){
  var el = document.getElementById(id);
  if (el) el.classList.remove('open');
}
document.addEventListener('click', function(){ closePanel('notifPanel'); closePanel('avatarMenu'); });
function doLogout(){ location.href = '../公開網站/p07_login_register.html'; }
function toast(msg){
  var el = document.getElementById('toastEl');
  if (!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
renderNotifPanel();
</script>
<script>
function toggleNavGroup(ev, gid){
  ev.stopPropagation();
  var g = document.querySelector('#sidebar .navgroup[data-group="'+gid+'"]');
  if (!g) return;
  var collapsed = g.classList.toggle('collapsed');
  try{ localStorage.setItem('tliNavCollapse_'+gid, collapsed ? '1' : '0'); }catch(e){}
}
(function initNavGroups(){
  var activeLink = document.querySelector('#sidebar a.active');
  var activeGroup = activeLink ? activeLink.closest('.navgroup') : null;
  /* 20260927f：預設只展開目前頁面所在的群，其他群收合；若使用者手動展開/收合過某群，之後照該紀錄 */
  document.querySelectorAll('#sidebar .navgroup[data-group]').forEach(function(g){
    var gid = g.dataset.group, saved = null;
    try{ saved = localStorage.getItem('tliNavCollapse_'+gid); }catch(e){}
    if (saved === '1') g.classList.add('collapsed');
    else if (saved === '0') g.classList.remove('collapsed');
    else if (g !== activeGroup) g.classList.add('collapsed');
  });
  /* 目前頁所屬群組不可被收合到看不到 active 項目 */
  if (activeGroup) activeGroup.classList.remove('collapsed');
})();
</script>
