<div class="modal-mask" id="catModal" onclick="if(event.target===this) closeCatModal()"><div class="modal">
<h3 id="catModalTitle">新增分類</h3>
<div class="hint" style="margin-bottom:10px"><span class="req">*</span> <span data-i18n="common.required">為必填</span></div>
<div class="formrow"><label data-i18n="label.categoryCode">分類代碼</label><span class="req">*</span><input type="text" id="cat_code" placeholder="例：VIP" data-i18n-placeholder="ph.categoryCode"></div>
<div class="formrow"><label data-i18n="label.categoryName">分類名稱</label><span class="req">*</span><input type="text" id="cat_name" placeholder="例：高階企業會員" data-i18n-placeholder="ph.categoryName"></div>
<div class="formrow"><label data-i18n="label.description">說明</label><input type="text" id="cat_desc" placeholder="這個分類代表哪一群會員" data-i18n-placeholder="ph.categoryDesc"></div>
<div class="formrow"><label data-i18n="label.usageNoteLong">適用說明（顯示於銷售方案「適用對象」勾選頁）</label><textarea id="cat_usage" rows="2" placeholder="例：企業補助員工進修方案，個人不可直接購買" data-i18n-placeholder="ph.categoryUsage"></textarea></div>
<div class="formrow"><label data-i18n="label.enabled">啟用</label><label class="switch"><input type="checkbox" id="cat_enabled" checked><span class="slider"></span></label></div>

<button class="btn ghost" onclick="closeCatModal()" data-i18n="common.cancel">取消</button>

<script>

var CATEGORIES = [
 {code:'B', name:'機構／企業', desc:'機構或企業出資之會員，通常對應合約單位', usage:'企業補助員工進修方案，個人不可直接購買', memberCount:974, enabled:true},
 {code:'G', name:'團體／機構', desc:'團體班或機構委訓對應之會員分類', usage:'機構委訓、團體班報名，通常走月結請款', memberCount:2273, enabled:true},
 {code:'C', name:'一般會員', desc:'個人自費報名之一般會員', usage:'開放所有一般銷售方案購買，最主要的會員分類', memberCount:10879, enabled:true},
 {code:'BIP', name:'特定方案會員', desc:'特定活動或試聽方案導入之會員分類', usage:'限定促銷方案、試聽轉換導入使用', memberCount:2111, enabled:true}
];
var editingCode = null;
var dragSrcIndex = null;
function i18nT(zh, en){ return window.TLI_I18N ? TLI_I18N.t(zh, en) : zh; }

function renderCatTable(){
  var t = document.getElementById('catTable');
  t.innerHTML = '<tr><th style="width:30px"></th><th data-i18n="col.code">代碼</th><th data-i18n="col.name">名稱</th><th data-i18n="col.description">說明</th><th data-i18n="col.usageNote">適用說明</th><th data-i18n="col.memberCount">會員數</th><th data-i18n="col.enabled">啟用</th><th></th></tr>';
  CATEGORIES.forEach(function(c, idx){
    var tr = document.createElement('tr');
    tr.className = 'draggable-row';
    tr.draggable = true;
    tr.dataset.idx = idx;
    tr.innerHTML =
      '<td><span class="draghandle">≡</span></td>' +
      '<td><span class="badge '+((c.code==='B'||c.code==='G')?'blue':'orange')+'">'+c.code+'</span></td>' +
      '<td>'+c.name+'</td>' +
      '<td class="small">'+c.desc+'</td>' +
      '<td class="small">'+c.usage+'</td>' +
      '<td>'+i18nT(c.memberCount.toLocaleString()+' 人', c.memberCount.toLocaleString())+'</td>' +
      '<td><label class="switch"><input type="checkbox" '+(c.enabled?'checked':'')+' onchange="toggleCatEnabled('+idx+',this)"><span class="slider"></span></label></td>' +
      '<td><a href="javascript:void(0)" onclick="openCatModal(\''+c.code+'\')" data-i18n="btn.edit">編輯</a></td>';
    attachDragHandlers(tr);
    t.appendChild(tr);
  });
  if (window.TLI_I18N) TLI_I18N.refresh();
}
function toggleCatEnabled(idx, el){
  CATEGORIES[idx].enabled = el.checked;
  var nm = CATEGORIES[idx].name;
  toast(el.checked ? i18nT(nm+' 已啟用', nm+' enabled') : i18nT(nm+' 已停用', nm+' disabled'));
}
function openCatModal(code){
  editingCode = code;
  if (code){
    var c = CATEGORIES.find(function(x){return x.code===code;});
    document.getElementById('cat_code').value = c.code;
    document.getElementById('cat_name').value = c.name;
    document.getElementById('cat_desc').value = c.desc;
    document.getElementById('cat_usage').value = c.usage;
    document.getElementById('cat_enabled').checked = c.enabled;
  } else {
    document.getElementById('cat_code').value = '';
    document.getElementById('cat_name').value = '';
    document.getElementById('cat_desc').value = '';
    document.getElementById('cat_usage').value = '';
    document.getElementById('cat_enabled').checked = true;
  }
  resetCatModalTitle();
  document.getElementById('catModal').classList.add('open');
}
function closeCatModal(){ document.getElementById('catModal').classList.remove('open'); }
function saveCat(){
  var code = document.getElementById('cat_code').value.trim();
  var name = document.getElementById('cat_name').value.trim();
  if (!code || !name){ toast(i18nT('請輸入分類代碼與名稱','Please enter category code and name')); return; }
  var desc = document.getElementById('cat_desc').value.trim();
  var usage = document.getElementById('cat_usage').value.trim();
  var enabled = document.getElementById('cat_enabled').checked;
  if (editingCode){
    var c = CATEGORIES.find(function(x){return x.code===editingCode;});
    c.code = code; c.name = name; c.desc = desc; c.usage = usage; c.enabled = enabled;
    toast(i18nT('已更新分類「'+name+'」','Category “'+name+'” updated'));
  } else {
    if (CATEGORIES.some(function(x){return x.code===code;})){ toast(i18nT('分類代碼已存在','Category code already exists')); return; }
    CATEGORIES.push({code:code, name:name, desc:desc, usage:usage, memberCount:0, enabled:enabled});
    toast(i18nT('已新增分類「'+name+'」','Category “'+name+'” added'));
  }
  closeCatModal();
  renderCatTable();
}

/* 排序拖曳（HTML5 native drag & drop，真的可重新排序） */
function attachDragHandlers(tr){
  tr.addEventListener('dragstart', function(e){
    dragSrcIndex = Number(tr.dataset.idx);
    tr.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  tr.addEventListener('dragend', function(){ tr.classList.remove('dragging'); renderCatTable(); });
  tr.addEventListener('dragover', function(e){ e.preventDefault(); tr.classList.add('dragover'); });
  tr.addEventListener('dragleave', function(){ tr.classList.remove('dragover'); });
  tr.addEventListener('drop', function(e){
    e.preventDefault();
    tr.classList.remove('dragover');
    var destIdx = Number(tr.dataset.idx);
    if (dragSrcIndex === null || dragSrcIndex === destIdx) return;
    var moved = CATEGORIES.splice(dragSrcIndex, 1)[0];
    CATEGORIES.splice(destIdx, 0, moved);
    dragSrcIndex = null;
    renderCatTable();
    toast(i18nT('已調整分類排序','Category order updated'));
  });
}

/* ---- 共用：頂欄通知／使用者選單／登出／toast（全站同一段） ---- */
var NOTIFS = [
  {t:'訂單 ORD-2026-0102 已逾期 5 天未收款', time:'10 分鐘前', unread:true},
  {t:'銷售方案「學期班 Lv.5–8 一期方案」即將於 1/31 下架', time:'1 小時前', unread:true},
  {t:'內容管理：首頁 Hero 文案已由校區主管發佈', time:'今天 09:12', unread:false},
  {t:'老師黃志遠已切換為留職停薪', time:'昨天', unread:false}
];
function renderNotifPanel(){
  var panel = document.getElementById('notifPanel');
  if (!panel) return;
  var unread = NOTIFS.filter(function(n){return n.unread;}).length;
  var dot = document.getElementById('tbDot');
  if (dot) dot.style.display = unread ? 'block' : 'none';
  panel.innerHTML = '<div class="tn-head"><span>通知（'+unread+' 則未讀）</span><a href="javascript:void(0)" onclick="markAllRead(event)">全部標為已讀</a></div>' +
    NOTIFS.map(function(n){ return '<div class="tb-notifitem'+(n.unread?' unread':'')+'">'+n.t+'<div class="tn-t">'+n.time+'</div></div>'; }).join('');
}
function markAllRead(ev){
  if (ev) ev.stopPropagation();
  NOTIFS.forEach(function(n){ n.unread = false; });
  renderNotifPanel();
}
function toggleNotif(ev){
  ev.stopPropagation();
  closePanel('avatarMenu');
  var p = document.getElementById('notifPanel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) renderNotifPanel();
}
function toggleAvatarMenu(ev){
  ev.stopPropagation();
  closePanel('notifPanel');
  document.getElementById('avatarMenu').classList.toggle('open');
}
function closePanel(id){
  var el = document.getElementById(id);
  if (el) el.classList.remove('open');
}
document.addEventListener('click', function(){ closePanel('notifPanel'); closePanel('avatarMenu'); });
function doLogout(){ location.href = '../公開網站/p07_login_register.html'; }
function toast(msg){
  var el = document.getElementById('toastEl');
  if (!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
renderNotifPanel();

</script>
<script>
function toggleNavGroup(ev, gid){
  ev.stopPropagation();
  var g = document.querySelector('#sidebar .navgroup[data-group="'+gid+'"]');
  if (!g) return;
  var collapsed = g.classList.toggle('collapsed');
  try{ localStorage.setItem('tliNavCollapse_'+gid, collapsed ? '1' : '0'); }catch(e){}
}
(function initNavGroups(){
  var activeLink = document.querySelector('#sidebar a.active');
  var activeGroup = activeLink ? activeLink.closest('.navgroup') : null;
  /* 20260927f：預設只展開目前頁面所在的群，其他群收合；若使用者手動展開/收合過某群，之後照該紀錄 */
  document.querySelectorAll('#sidebar .navgroup[data-group]').forEach(function(g){
    var gid = g.dataset.group, saved = null;
    try{ saved = localStorage.getItem('tliNavCollapse_'+gid); }catch(e){}
    if (saved === '1') g.classList.add('collapsed');
    else if (saved === '0') g.classList.remove('collapsed');
    else if (g !== activeGroup) g.classList.add('collapsed');
  });
  /* 目前頁所屬群組不可被收合到看不到 active 項目 */
  if (activeGroup) activeGroup.classList.remove('collapsed');
})();

/* ================= ESC 鍵關閉目前開啟中的 modal ================= */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (document.getElementById('catModal').classList.contains('open')) closeCatModal();
});
</script>
