.sidebar nav{flex:1 0 auto;padding:10px 0;overflow-y:auto;}
.sidebar nav a{display:flex;align-items:center;gap:11px;padding:9px 18px;font-size:13.5px;
color:var(--g500);text-decoration:none;border-radius:0 20px 20px 0;margin:1px 10px 1px 0;}
.sidebar nav a svg{flex-shrink:0;}

.sidebar nav a.active{background:#E6EEF8;color:var(--navy);font-weight:600;}
.sidebar .sec-label{padding:14px 20px 4px;font-size:11px;color:#9aa4b2;letter-spacing:.05em;font-weight:600;}
.sidebar .usercard{margin:0;padding:14px 18px 18px;border-top:1px solid var(--g200);flex-shrink:0;}
.sidebar .usercard .u-row{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.sidebar .usercard .u-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;
display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.sidebar .usercard .u-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar .usercard .u-role{font-size:11px;color:var(--g500);}
.sidebar .usercard .u-logout{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--g500);
text-decoration:none;padding:7px;border:1px solid var(--g200);border-radius:6px;cursor:pointer;
background:none;width:100%;font-family:inherit;}
.sidebar .usercard .u-logout:hover{background:var(--g50);color:var(--g900);}
.sidebar-veil{display:none;}
.content-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{height:56px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--g200);

.hamburger{display:none;background:none;border:none;cursor:pointer;padding:4px;color:var(--g900);}
.topbar .topbar-title{font-size:13.5px;color:var(--g500);}
.main{flex:1;padding:26px 32px 60px;min-width:0;background:var(--g50);}
@media (max-width:1279px){

.sidebar .brand{align-items:center;padding:16px 8px;}
.sidebar .brand img{height:24px;}
.sidebar nav a{justify-content:center;padding:11px 0;margin:1px 8px;border-radius:8px;}
.sidebar .usercard{padding:12px 8px;}

.content-col{width:100%;}
.drawer{width:100%;max-width:100%;}
.modal.wide{width:94vw;}
.grid4{grid-template-columns:1fr 1fr;}
.grid3{grid-template-columns:1fr 1fr;}
}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:16px;}
.pagehead h1{font-size:20px;margin:0;}

.btn{display:inline-block;background:var(--navy);color:#fff;border:none;padding:8px 14px;
border-radius:6px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit;}
.btn.orange{background:var(--orange);}
.btn.teal{background:var(--teal);}

.btn:disabled,.btn.isdisabled{background:var(--g200)!important;color:var(--g500)!important;
cursor:not-allowed!important;}
.card,.listpanel{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:16px;}
.card h2,.listpanel h2{font-size:15px;margin:0 0 12px;}

table{width:100%;border-collapse:collapse;font-size:13px;}

tr.rowlink{cursor:pointer;}

.badge.blue{background:#E7EEF8;color:var(--navy);}

.badge.red{background:#FBE7E7;color:#C0392B;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--g200);margin-bottom:16px;flex-wrap:wrap;}
.tabs button{background:none;border:none;padding:10px 16px;font-size:13.5px;color:var(--g500);

    '<button class="'+(evFilters.status===''?'active':'')+'" onclick="setEvStatusFilter(\'\')">全部狀態</button>' +
    sts.map(function(s){ return '<button class="'+(evFilters.status===s?'active':'')+'" onclick="setEvStatusFilter(\''+s+'\')">'+s+'</button>'; }).join('');
}
function setEvFormatFilter(v){ evFilters.format = v; evCurrentPage=1; renderChipRows(); renderEventTable(); }
function setEvStatusFilter(v){ evFilters.status = v; evCurrentPage=1; renderChipRows(); renderEventTable(); }
function onEvSearch(el){ evSearchTerm = el.value; evCurrentPage=1; renderEventTable(); }
function clearEvFilters(){
  evSearchTerm=''; document.getElementById('evSearch').value='';
  evFilters = {format:'', status:''};
  evCurrentPage = 1;
  renderChipRows();
  renderEventTable();
}
function getFilteredEvents(){
  var term = evSearchTerm.trim().toLowerCase();
  return EVENTS.filter(function(e){
    if (term && e.name.toLowerCase().indexOf(term)===-1) return false;
    if (evFilters.format && e.format !== evFilters.format) return false;
    if (evFilters.status && e.status !== evFilters.status) return false;
    return true;
  });
}

function renderEventTable(){
  var filtered = getFilteredEvents();
  var total = filtered.length;
  var maxPage = Math.max(1, Math.ceil(total/evPageSize));
  if (evCurrentPage > maxPage) evCurrentPage = maxPage;
  var start = (evCurrentPage-1)*evPageSize;
  var pageRows = filtered.slice(start, start+evPageSize);

  var t = document.getElementById('eventTable');
  t.innerHTML = '<tr><th>名稱</th><th>形式</th><th>日期</th><th>費用</th><th>名額／已報名</th><th>取消截止</th><th>狀態</th></tr>';
  pageRows.forEach(function(ev){
    var tr = document.createElement('tr');
    tr.className = 'rowlink';
    tr.onclick = function(){ openEvDetail(ev.id); };
    tr.innerHTML = '<td>'+ev.name+'</td><td>'+evFormatBadge(ev.format)+'</td><td class="small">'+ev.date+' '+ev.time+'</td>' +
      '<td>'+evFeeLabel(ev)+'</td><td>'+ev.capacity+' 人／已報名 '+ev.attendees.length+'</td><td class="small">'+evCancelCutoffLabel(ev)+'</td><td>'+evStatusBadge(ev.status)+'</td>';
    t.appendChild(tr);
  });

  var startLabel = total===0 ? 0 : start+1;
  var endLabel = Math.min(start+evPageSize, total);
  document.getElementById('eventPager').innerHTML =
    '<span>第 '+startLabel+'–'+endLabel+' 筆／共 '+total+' 筆</span>' +
    '<div class="pages">' +
    '<button onclick="gotoEvPage(1)" '+(evCurrentPage<=1?'disabled':'')+'>« 第一頁</button>' +
    '<button onclick="gotoEvPage(evCurrentPage-1)" '+(evCurrentPage<=1?'disabled':'')+'>‹ 上一頁</button>' +
    '<span class="small" style="padding:5px 8px">第 '+evCurrentPage+' / '+maxPage+' 頁</span>' +
    '<button onclick="gotoEvPage(evCurrentPage+1)" '+(evCurrentPage>=maxPage?'disabled':'')+'>下一頁 ›</button>' +
    '<button onclick="gotoEvPage('+maxPage+')" '+(evCurrentPage>=maxPage?'disabled':'')+'>最後一頁 »</button>' +
    '</div>';
}
function gotoEvPage(p){
  var maxPage = Math.max(1, Math.ceil(getFilteredEvents().length/evPageSize));
  if (p<1) p=1; if (p>maxPage) p=maxPage;
  evCurrentPage = p;
  renderEventTable();
}

function saveNewEvent(){
  var name = document.getElementById('ne_name').value.trim();
  if (!name){ toast('請輸入活動名稱'); return; }
  var format = document.getElementById('ne_format').value;
  var feeEl = document.querySelector('input[name=ne_fee]:checked');
  var fee = feeEl ? feeEl.value : '免費';
  var skuId = fee === '付費' ? document.getElementById('ne_sku').value : '';
  var campusId = format === '實體' ? (document.getElementById('ne_campus')?document.getElementById('ne_campus').value:'') : '';
  var locationDetail = format === '實體' ? (document.getElementById('ne_locationDetail')?document.getElementById('ne_locationDetail').value:'') : '';
  var speakerTypeEl = document.getElementById('ne_speakerType');
  var speakerType = speakerTypeEl ? speakerTypeEl.value : 'teacher';
  var speakerTeacherId = speakerType==='teacher' && document.getElementById('ne_speakerTeacher') ? document.getElementById('ne_speakerTeacher').value : '';
  var speakerCustom = speakerType==='custom' && document.getElementById('ne_speakerCustom') ? document.getElementById('ne_speakerCustom').value : '';
  var teachLangId = document.getElementById('ne_teachLang') ? document.getElementById('ne_teachLang').value : '';
  var audBoxes = document.querySelectorAll('#ev_body input[type=checkbox].chk');
  var audiencesChecked = Array.from(audBoxes).filter(function(c){return c.checked;}).map(function(c){return c.value;});
  var publish = document.getElementById('ne_publish').checked;
  var regCloseVal = document.getElementById('ne_regCloseHours').value;
  var cancelCloseVal = document.getElementById('ne_cancelCloseHours').value;
  var refundPolicyVal = document.getElementById('ne_refundPolicy').value;
  var refundNoteVal = refundPolicyVal==='自訂說明' && document.getElementById('ne_refundNote') ? document.getElementById('ne_refundNote').value : '';

  var ev = {
    id: 'ev'+nextEventSeq, name: name,
    intro: document.getElementById('ne_intro').value,
    speakerType: speakerType, speakerTeacherId: speakerTeacherId, speakerCustom: speakerCustom,
    format: format,
    date: document.getElementById('ne_date').value || '2026-09-01',
    time: document.getElementById('ne_time').value || '19:00',
    campusId: campusId, locationDetail: locationDetail,
    fee: fee, skuId: skuId, teachLangId: teachLangId,
    capacity: Number(document.getElementById('ne_capacity').value) || 20,
    audiences: audiencesChecked,
    regDeadline: document.getElementById('ne_deadline').value || '',
    status: publish ? '已發佈' : '草稿',
    regCloseHours: regCloseVal===''?'':Number(regCloseVal),
    cancelCloseHours: cancelCloseVal===''?'':Number(cancelCloseVal),
    waitlistEnabled: document.getElementById('ne_waitlist').checked,
    noShowTrack: document.getElementById('ne_noshow').checked,
    refundPolicy: refundPolicyVal,
    refundNote: refundNoteVal,
    zoom: format === '線上' ? {password:'TLI-'+Math.floor(1000+Math.random()*8999), beforeMin:15, afterMin:50, waitingRoom:true, autoAttendance:true} : null,
    attendees: []
  };
  nextEventSeq++;
  EVENTS.unshift(ev);
  closeEvDrawer();
  renderEventTable();
  toast('已新增活動「'+name+'」，狀態：'+ev.status);
}

function onEcSpeakerTypeChange(el){
  var wrap = document.getElementById('ec_speakerFields');
  if (!wrap) return;
  var ev = eventById(evDrawerId);
  if (el && el.value === 'custom'){
    wrap.innerHTML = '<div class="formrow"><label>講者／主持人名稱</label><input type="text" id="ec_speakerCustom" value="'+(ev&&ev.speakerType==='custom'&&ev.speakerCustom?ev.speakerCustom:'')+'"></div>';
  } else {
    wrap.innerHTML = '<div class="formrow"><label>選擇教師</label><select id="ec_speakerTeacher">'+speakerTeacherOptionsHtml(ev&&ev.speakerType==='teacher'?ev.speakerTeacherId:'')+'</select></div>';
  }
}
function onEcFormatChange(el){
  var wrap = document.getElementById('ec_formatFields');
  if (!wrap) return;
  var ev = eventById(evDrawerId);
  if (el.value === '實體'){
    wrap.innerHTML = '<div class="formrow"><label>校區 '+TLI_MASTERS.manageLink('campuses')+'</label><select id="ec_campus">'+campusOptionsHtml(ev&&ev.format==='實體'?ev.campusId:'')+'</select></div>' +
      '<div class="formrow"><label>地點詳細位置</label><input type="text" id="ec_locationDetail" value="'+(ev&&ev.format==='實體'?(ev.locationDetail||''):'')+'"></div>';
  } else {
    wrap.innerHTML = '<div class="hint">此活動為線上形式，教室設定請至「線上教室設定」分頁。</div>';
  }
}
function onEcRefundChange(el){
  var wrap = document.getElementById('ec_refundNoteWrap');
  if (!wrap) return;
  if (el && el.value === '自訂說明'){
    var ev = eventById(evDrawerId);
    wrap.innerHTML = '<div class="formrow"><label>自訂退費說明</label><textarea id="ec_refundNote" rows="2">'+(ev&&ev.refundNote?ev.refundNote:'')+'</textarea></div>';
  } else {
    wrap.innerHTML = '';
  }
}
function saveEventContent(){
  var ev = eventById(evDrawerId);
  ev.name = document.getElementById('ec_name').value.trim() || ev.name;
  ev.intro = document.getElementById('ec_intro').value;
  var speakerTypeEl = document.getElementById('ec_speakerType');
  ev.speakerType = speakerTypeEl ? speakerTypeEl.value : ev.speakerType;
  if (ev.speakerType === 'teacher'){
    ev.speakerTeacherId = document.getElementById('ec_speakerTeacher') ? document.getElementById('ec_speakerTeacher').value : ev.speakerTeacherId;
    ev.speakerCustom = '';
  } else {
    ev.speakerCustom = document.getElementById('ec_speakerCustom') ? document.getElementById('ec_speakerCustom').value : ev.speakerCustom;
    ev.speakerTeacherId = '';
  }
  ev.date = document.getElementById('ec_date').value;
  ev.time = document.getElementById('ec_time').value;
  var ecFormatEl = document.getElementById('ec_format');
  ev.format = ecFormatEl ? ecFormatEl.value : ev.format;
  if (ev.format==='實體'){
    if (document.getElementById('ec_campus')) ev.campusId = document.getElementById('ec_campus').value;
    if (document.getElementById('ec_locationDetail')) ev.locationDetail = document.getElementById('ec_locationDetail').value;
  } else {
    ev.campusId = '';
    ev.locationDetail = '';
    if (!ev.zoom) ev.zoom = {password:'TLI-'+Math.floor(1000+Math.random()*8999), beforeMin:15, afterMin:50, waitingRoom:true, autoAttendance:true};
  }
  if (document.getElementById('ec_teachLang')) ev.teachLangId = document.getElementById('ec_teachLang').value;
  if (ev.fee==='付費' && document.getElementById('ec_sku')) ev.skuId = document.getElementById('ec_sku').value;
  ev.capacity = Number(document.getElementById('ec_capacity').value) || ev.capacity;
  ev.audiences = Array.from(document.querySelectorAll('.ec-aud:checked')).map(function(c){return c.value;});
  var ecRegClose = document.getElementById('ec_regCloseHours').value;
  var ecCancelClose = document.getElementById('ec_cancelCloseHours').value;
  ev.regCloseHours = ecRegClose===''? '': Number(ecRegClose);
  ev.cancelCloseHours = ecCancelClose===''? '': Number(ecCancelClose);
  ev.waitlistEnabled = document.getElementById('ec_waitlist').checked;
  ev.noShowTrack = document.getElementById('ec_noshow').checked;
  ev.refundPolicy = document.getElementById('ec_refundPolicy').value;
  ev.refundNote = ev.refundPolicy==='自訂說明' && document.getElementById('ec_refundNote') ? document.getElementById('ec_refundNote').value : '';
  ev.regDeadline = document.getElementById('ec_deadline').value;
  ev.status = document.getElementById('ec_status').value;
  renderEventTable();
  evDetailTab = 'content';
  renderEvDetailBody();
  toast('活動內容已儲存');
}

    '<div class="zoomrow"><div><div class="zlbl">等候室</div><div class="zdesc">學生進入後先進等候室，由授課老師／主持人於開始前放行。</div></div><label class="switch"><input type="checkbox" '+(z.waitingRoom?'checked':'')+' onchange="onZoomField(\'waitingRoom\',this.checked)"><span class="slider"></span></label></div>' +
    '<div class="zoomrow"><div><div class="zlbl">連結有效時間</div><div class="zdesc">開始前 <input type="number" style="width:56px;padding:4px 6px;border:1px solid var(--g200);border-radius:5px" value="'+z.beforeMin+'" onchange="onZoomField(\'beforeMin\',Number(this.value)||0)"> 分鐘 ～ 結束後 <input type="number" style="width:56px;padding:4px 6px;border:1px solid var(--g200);border-radius:5px" value="'+z.afterMin+'" onchange="onZoomField(\'afterMin\',Number(this.value)||0)"> 分鐘內可進入</div></div></div>' +
    '<div class="zoomrow"><div><div class="zlbl">出席自動寫回</div><div class="zdesc">學生進入教室時系統自動記錄出席，同步回寫至「報名名單」出席欄。</div></div><label class="switch"><input type="checkbox" '+(z.autoAttendance?'checked':'')+' onchange="onZoomField(\'autoAttendance\',this.checked)"><span class="slider"></span></label></div>';
  window._zoomPw = z.password || 'TLI-0000';
}
function toggleZoomPw(btn){
  var el = document.getElementById('zoomPwDisplay');
  if (btn.textContent === '顯示'){
    el.textContent = window._zoomPw;
    btn.textContent = '隱藏';
  } else {
    el.textContent = '••••••••';
    btn.textContent = '顯示';
  }
}
function onZoomField(field, val){
  var ev = eventById(evDrawerId);
  if (!ev.zoom) ev.zoom = {password:'TLI-0000', beforeMin:15, afterMin:50, waitingRoom:true, autoAttendance:true};
  ev.zoom[field] = val;
  toast('線上教室設定已更新');
}

/* ================= 共用：頂欄通知／使用者選單／登出／toast（全站同一段） ================= */
var NOTIFS = [
  {t:'訂單 ORD-2026-0102 已逾期 5 天未收款', time:'10 分鐘前', unread:true},
  {t:'銷售方案「學期班 Lv.5–8 一期方案」即將於 1/31 下架', time:'1 小時前', unread:true},
  {t:'內容管理：首頁 Hero 文案已由校區主管發佈', time:'今天 09:12', unread:false},
  {t:'老師黃志遠已切換為留職停薪', time:'昨天', unread:false}
];
function renderNotifPanel(){
  var panel = document.getElementById('notifPanel');
  if (!panel) return;
  var unread = NOTIFS.filter(function(n){return n.unread;}).length;
  var dot = document.getElementById('tbDot');
  if (dot) dot.style.display = unread ? 'block' : 'none';
  panel.innerHTML = '<div class="tn-head"><span>通知（'+unread+' 則未讀）</span><a href="javascript:void(0)" onclick="markAllRead(event)">全部標為已讀</a></div>' +
    NOTIFS.map(function(n){ return '<div class="tb-notifitem'+(n.unread?' unread':'')+'">'+n.t+'<div class="tn-t">'+n.time+'</div></div>'; }).join('');
}
function markAllRead(ev){
  if (ev) ev.stopPropagation();
  NOTIFS.forEach(function(n){ n.unread = false; });
  renderNotifPanel();
}
function toggleNotif(ev){
  ev.stopPropagation();
  closePanel('avatarMenu');
  var p = document.getElementById('notifPanel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) renderNotifPanel();
}
function toggleAvatarMenu(ev){
  ev.stopPropagation();
  closePanel('notifPanel');
  document.getElementById('avatarMenu').classList.toggle('open');
}
function closePanel(id){
  var el = document.getElementById(id);
  if (el) el.classList.remove('open');
}
document.addEventListener('click', function(){ closePanel('notifPanel'); closePanel('avatarMenu'); });
function doLogout(){ location.href = '../公開網站/p07_login_register.html'; }
function toast(msg){
  var el = document.getElementById('toastEl');
  if (!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
renderNotifPanel();

<script>
function toggleNavGroup(ev, gid){
  ev.stopPropagation();
  var g = document.querySelector('#sidebar .navgroup[data-group="'+gid+'"]');
  if (!g) return;
  var collapsed = g.classList.toggle('collapsed');
  try{ localStorage.setItem('tliNavCollapse_'+gid, collapsed ? '1' : '0'); }catch(e){}
}
(function initNavGroups(){
  var activeLink = document.querySelector('#sidebar a.active');
  var activeGroup = activeLink ? activeLink.closest('.navgroup') : null;
  /* 20260927f：預設只展開目前頁面所在的群，其他群收合；若使用者手動展開/收合過某群，之後照該紀錄 */
  document.querySelectorAll('#sidebar .navgroup[data-group]').forEach(function(g){
    var gid = g.dataset.group, saved = null;
    try{ saved = localStorage.getItem('tliNavCollapse_'+gid); }catch(e){}
    if (saved === '1') g.classList.add('collapsed');
    else if (saved === '0') g.classList.remove('collapsed');
    else if (g !== activeGroup) g.classList.add('collapsed');
  });
  /* 目前頁所屬群組不可被收合到看不到 active 項目 */
  if (activeGroup) activeGroup.classList.remove('collapsed');
})();
</script>
<script>
/* 20260929 死按鈕修正：側欄使用者選單（姓名／大頭貼）點擊開合；此頁樣板漏帶 toggleSuMenu */
window.toggleSuMenu = window.toggleSuMenu || function(ev){
  if (ev) ev.stopPropagation();
  var m = document.getElementById('suMenu'); if (!m) return;
  ['notifPanel','avatarMenu'].forEach(function(id){ var e = document.getElementById(id); if (e) e.classList.remove('open'); });
  m.classList.toggle('open');
};
document.addEventListener('click', function(ev){
  var m = document.getElementById('suMenu');
  if (m && !m.contains(ev.target)) m.classList.remove('open');
});
</script>
