<style>
:root{--navy:#1B4E8C;--navy-dark:#123a68;--orange:#E8792B;--teal:#0F9B79;
--g50:#F5F7FA;--g200:#E4E7EC;--g500:#667085;--g900:#101828;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
background:var(--g50);color:var(--g900);}
a{color:var(--navy);}
.app{display:flex;min-height:100vh;width:100%;background:#fff;}
.sidebar{width:260px;flex-shrink:0;background:#fff;color:var(--g900);padding:18px 0;
border-right:1px solid var(--g200);display:flex;flex-direction:column;transition:width .15s;
position:sticky;top:0;height:100vh;align-self:flex-start;}
.sidebar .brand{padding:0 20px 14px;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:4px;
border-bottom:1px solid var(--g200);margin-bottom:6px;text-decoration:none;color:inherit;cursor:pointer;}
.sidebar .brand-logo{height:28px;width:auto;display:block;}
.sidebar .brand small{display:block;font-weight:400;font-size:12px;color:var(--g500);margin-top:0;text-transform:uppercase;letter-spacing:.04em;}
.sidebar nav{flex:1 1 auto;overflow-y:auto;}
.sidebar nav a,.sidebar nav span.disabled{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13.5px;
color:var(--g900);text-decoration:none;position:relative;}
.sidebar nav a .navicon{flex-shrink:0;color:var(--g500);}
.sidebar nav a:hover{background:var(--g50);}
.sidebar nav a.active{background:#E6EEF8;color:var(--navy);font-weight:600;}
.sidebar nav a.active .navicon{color:var(--navy);}
.sidebar .sec-label{padding:16px 20px 4px;font-size:10.5px;color:var(--g500);letter-spacing:.08em;text-transform:uppercase;font-weight:600;}
.main{flex:1;padding:26px 32px 60px;min-width:0;}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:16px;}
.pagehead h1{font-size:20px;margin:0;}
.pagehead .desc{font-size:12.5px;color:var(--g500);margin-top:5px;line-height:1.6;}
.btn{display:inline-block;background:var(--navy);color:#fff;border:none;padding:8px 14px;
border-radius:6px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit;}
.btn.orange{background:var(--orange);}
.btn.ghost{background:#fff;border:1px solid var(--g200);color:var(--g900);}
.btn.teal{background:var(--teal);}
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
.card h2{font-size:15px;margin:0 0 12px;}
.tablewrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;background:var(--g50);color:var(--g500);font-weight:600;padding:10px 12px;
border-bottom:1px solid var(--g200);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--g200);white-space:nowrap;}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.badge.blue{background:#E7EEF8;color:var(--navy);}
.badge.green{background:#E4F5EE;color:var(--teal);}
.badge.grey{background:var(--g200);color:var(--g500);}
.formrow{margin-bottom:13px;}
.formrow label{display:block;font-size:12.5px;color:var(--g500);margin-bottom:4px;}
.formrow input,.formrow select,.formrow textarea{width:100%;padding:7px 10px;border:1px solid var(--g200);
border-radius:6px;font-size:13px;box-sizing:border-box;font-family:inherit;}
.small{font-size:12px;color:var(--g500);}
.hint{font-size:11.5px;color:var(--g500);margin-top:3px;}
.layout2{display:flex;gap:20px;align-items:flex-start;}
.layout2 .maincol{flex:1;min-width:0;}
.layout2 .sidecol{width:280px;flex-shrink:0;}
.tmpllist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.tmplrow{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--g200);
border-radius:8px;padding:10px 14px;cursor:pointer;font-size:13px;}
.tmplrow:hover{background:#F8FAFD;}
.tmplrow.active{border-color:var(--navy);background:#EEF3FA;}
.tmplrow .tname{font-weight:600;}
.switch{position:relative;display:inline-block;width:38px;height:22px;vertical-align:middle;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .slider{position:absolute;inset:0;background:var(--g200);border-radius:22px;cursor:pointer;transition:.15s;}
.switch .slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
.switch input:checked+.slider{background:var(--teal);}
.switch input:checked+.slider:before{transform:translateX(16px);}
.chanchk{display:inline-flex;align-items:center;gap:5px;margin-right:16px;font-size:13px;}
.lang3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;}
.lang3 .langcol label{font-size:11px;color:var(--g500);display:block;margin-bottom:4px;}
.lang3 .langcol textarea{width:100%;padding:7px 9px;border:1px solid var(--g200);border-radius:6px;
font-size:12.5px;font-family:inherit;box-sizing:border-box;min-height:70px;resize:vertical;}
.varbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px;}
.varbtns button{padding:4px 10px;border-radius:6px;border:1px solid var(--g200);background:var(--g50);
font-size:12px;cursor:pointer;font-family:inherit;}
.varbtns button:hover{background:#EEF3FA;border-color:var(--navy);color:var(--navy);}
.editorhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.editorhead h3{margin:0;font-size:15px;}
.savedhint{font-size:12px;color:var(--teal);margin-left:10px;display:none;}
.savedhint.show{display:inline;}
.paramrow{margin-bottom:14px;}
.paramrow label{display:block;font-size:12.5px;color:var(--g500);margin-bottom:4px;}
.paramrow input,.paramrow select{width:100%;padding:7px 9px;border:1px solid var(--g200);border-radius:6px;
font-size:13px;box-sizing:border-box;font-family:inherit;}
/* ==== 事件通知設定（20260910b 新增） ==== */
.pagetabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.pagetabs button{background:#fff;border:1px solid var(--g200);border-radius:20px;padding:7px 16px;
font-size:12.5px;font-family:inherit;color:var(--g900);cursor:pointer;}
.pagetabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.demo-tag{display:inline-block;background:#E1F3EE;color:var(--teal);font-size:11px;padding:2px 8px;border-radius:8px;margin-left:8px;font-weight:600;vertical-align:middle;}
.trigger-note{font-size:12px;color:var(--g500);margin-bottom:12px;}
.chip{display:inline-block;padding:3px 10px;margin:2px 3px 2px 0;border-radius:14px;font-size:11.5px;
border:1px solid var(--g200);background:#fff;cursor:pointer;font-family:inherit;color:var(--g900);white-space:nowrap;}
.chip.active{background:#E6EEF8;color:var(--navy);border-color:var(--navy);font-weight:600;}
#eventTable td{white-space:normal;vertical-align:top;min-width:150px;}
#eventTable td:first-child{min-width:170px;font-weight:600;white-space:normal;}
.chipcell{max-width:220px;}
.event-timing{padding:6px 8px;border:1px solid var(--g200);border-radius:6px;font-size:12px;font-family:inherit;}
.modal-mask{display:none;position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:160;
align-items:center;justify-content:center;}
.modal-mask.open{display:flex;}
.modal{background:#fff;border-radius:10px;width:460px;max-width:90vw;max-height:85vh;
overflow:auto;padding:22px;}
.modal h3{margin-top:0;font-size:16px;}
.preview-body{background:var(--g50);border:1px solid var(--g200);border-radius:8px;padding:14px;font-size:13px;line-height:1.8;white-space:pre-wrap;}
.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;position:relative;}
.su-clickarea{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
.su-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.5;}
.su-name,.su-unit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.su-menu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.su-menu a:hover{background:var(--g50);}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-roletag{font-size:10.5px;background:#E6EEF8;color:var(--navy);padding:0 6px;border-radius:8px;display:inline-block;width:fit-content;white-space:nowrap;}
.sidebar-user .su-unit{font-size:11px;color:var(--g500);}
.su-menu{top:auto;bottom:64px;left:14px;right:14px;position:absolute;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;
border-bottom:1px solid var(--g200);position:sticky;top:0;background:#fff;z-index:40;margin:-26px -32px 22px;gap:14px;}
.hamburger{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:var(--g900);padding:4px 6px;margin-right:4px;}
.topbar .tb-title{font-size:15px;font-weight:600;color:var(--g900);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .tb-actions{display:flex;align-items:center;gap:14px;position:relative;flex-shrink:0;}
.tb-search{display:flex;align-items:center;gap:6px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;
padding:6px 10px;width:180px;}
.tb-search input{border:none;background:none;outline:none;font-size:12.5px;font-family:inherit;width:100%;color:var(--g900);}
.tb-bellbtn{position:relative;background:none;border:none;cursor:pointer;font-size:17px;padding:4px;line-height:1;}
.tb-dot{position:absolute;top:0;right:0;width:7px;height:7px;background:#C0392B;border-radius:50%;display:none;}
.tb-avatarbtn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;border:none;
cursor:pointer;font-size:13px;font-weight:600;flex-shrink:0;}
.tb-panel{display:none;position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--g200);
border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.16);z-index:50;}
.tb-panel.open{display:block;}
.tb-notifpanel{width:300px;padding:10px;}
.tb-notifpanel .tn-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
padding:4px 6px 8px;border-bottom:1px solid var(--g200);margin-bottom:6px;}
.tb-notifpanel .tn-head a{font-size:11.5px;cursor:pointer;}
.tb-notifitem{padding:8px 6px;border-radius:6px;font-size:12.5px;line-height:1.5;}
.tb-notifitem:hover{background:var(--g50);}
.tb-notifitem.unread{background:#EEF3FA;}
.tb-notifitem .tn-t{color:var(--g500);font-size:11px;margin-top:2px;}
.tb-avatarmenu{width:150px;padding:6px;}
.tb-avatarmenu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.tb-avatarmenu a:hover{background:var(--g50);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
background:#101828;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
opacity:0;pointer-events:none;transition:.2s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:110;}
@media (max-width:1279px) and (min-width:1024px){
  .sidebar{width:72px;}

    box-shadow:0 4px 12px rgba(16,24,40,.12);opacity:0;pointer-events:none;transition:opacity .12s;margin-left:6px;color:var(--g900);}
  .sidebar nav a:hover .navtext{opacity:1;}
  .sidebar .brand{align-items:center;overflow:hidden;}
  .sidebar .brand-logo{max-width:100%;width:32px;height:28px;object-fit:cover;object-position:left center;flex-shrink:0;}
  .sidebar .brand-text{display:none;}
  .sidebar .brand small{display:none;}
  .sidebar-user{justify-content:center;}
  .sidebar-user .navtext{display:none;}
}
@media (max-width:1023px){

  .sidebar-backdrop.open{display:block;}
  .app{width:100%;}
  .main{padding:16px 16px 40px;}
  .topbar{padding:0 16px;margin:-16px -16px 18px;}
  .tb-search{display:none;}
  .layout2{flex-direction:column;}
  .layout2 .sidecol{width:100%;}
}
</style>

function notifNameLabel(zh){ return i18nT(zh, NOTIF_NAME_EN[zh]||zh); }
function renderChipCell(evKey, field, options){
  var ev = eventByKey(evKey);
  return '<div class="chipcell">'+options.map(function(o){
    var active = ev[field].indexOf(o) > -1;
    var lbl = field==='recipients' ? recipientLabel(o) : channelLabel(o);
    return '<span class="chip'+(active?' active':'')+'" onclick="toggleEventChip(\''+evKey+'\',\''+field+'\',\''+o+'\')">'+lbl+'</span>';
  }).join('')+'</div>';
}
function renderEventTable(){
  var tbl = document.getElementById('eventTable');
  if (!tbl) return;
  var head = '<tr><th data-i18n="col.event">事件</th><th data-i18n="col.recipient">收件人</th><th data-i18n="col.channel">管道</th><th data-i18n="col.sendTiming">發送時機</th><th data-i18n="label.enabled">啟用</th></tr>';
  tbl.innerHTML = head + EVENT_NOTIFS.map(function(ev){
    var timingOpts = TIMING_OPTIONS.map(function(o){ return '<option value="'+o.v+'"'+(o.v===ev.timing?' selected':'')+'>'+timingLabel(o.l)+'</option>'; }).join('');
    return '<tr><td>'+notifNameLabel(ev.name)+'</td>' +
      '<td>'+renderChipCell(ev.key,'recipients',RECIPIENT_OPTIONS)+'</td>' +
      '<td>'+renderChipCell(ev.key,'channels',CHANNEL_OPTIONS2)+'</td>' +
      '<td><select class="event-timing" onchange="onEventTimingChange(\''+ev.key+'\',this.value)">'+timingOpts+'</select></td>' +
      '<td><label class="switch"><input type="checkbox" '+(ev.enabled?'checked':'')+' onchange="onEventEnabledToggle(\''+ev.key+'\',this)"><span class="slider"></span></label></td></tr>';
  }).join('');
  if (window.TLI_I18N) TLI_I18N.refresh();
}
function toggleEventChip(evKey, field, val){
  var ev = eventByKey(evKey);
  var idx = ev[field].indexOf(val);
  if (idx > -1){
    if (ev[field].length === 1){ toast(field==='recipients' ? i18nT('至少需保留一個收件人','At least one recipient must remain') : i18nT('至少需保留一個管道','At least one channel must remain')); return; }
    ev[field].splice(idx,1);
  } else {
    ev[field].push(val);
  }
  renderEventTable();
  toast(field==='recipients' ? i18nT('已更新「'+ev.name+'」的收件人設定','Recipient settings for “'+ev.name+'” updated') : i18nT('已更新「'+ev.name+'」的管道設定','Channel settings for “'+ev.name+'” updated'));
}
function onEventTimingChange(evKey, val){
  eventByKey(evKey).timing = val;
  toast(i18nT('已更新「'+eventByKey(evKey).name+'」的發送時機','Send timing for “'+eventByKey(evKey).name+'” updated'));
}
function onEventEnabledToggle(evKey, el){
  var ev = eventByKey(evKey);
  ev.enabled = el.checked;
  toast(el.checked ? i18nT('「'+ev.name+'」通知已啟用','Notification “'+ev.name+'” enabled') : i18nT('「'+ev.name+'」通知已停用','Notification “'+ev.name+'” disabled'));
}

var currentTmplId = null;

function tmplById(id){ return TEMPLATES.find(function(t){ return t.id===id; }); }

function renderTmplList(){
  var wrap = document.getElementById('tmplList');
  wrap.innerHTML = TEMPLATES.map(function(t){
    return '<div class="tmplrow'+(t.id===currentTmplId?' active':'')+'" onclick="selectTmpl(\''+t.id+'\')">' +
      '<span class="tname">'+notifNameLabel(t.name)+'</span>' +
      '<span>'+t.channels.map(function(c){return '<span class="badge blue" style="margin-right:4px">'+channelLabel(c)+'</span>';}).join('') +
      (t.enabled ? '<span class="badge green">'+i18nT('啟用中','Enabled')+'</span>' : '<span class="badge grey">'+i18nT('已停用','Disabled')+'</span>') + '</span></div>';
  }).join('');
}
function selectTmpl(id){
  currentTmplId = id;
  renderTmplList();
  renderTmplEditor();
}
function renderTmplEditor(){
  var wrap = document.getElementById('tmplEditor');
  if (!currentTmplId){
    wrap.innerHTML = '<div class="hint">'+i18nT('請於上方點選要編輯的通知範本。','Select a notification template above to edit it.')+'</div>';
    return;
  }
  var t = tmplById(currentTmplId);
  if (!t.sender) t.sender = 'TLI Connect';
  var chBoxes = CHANNEL_ALL.map(function(c){
    var checked = t.channels.indexOf(c) > -1 ? 'checked' : '';
    return '<label class="chanchk"><input type="checkbox" class="chk" value="'+c+'" '+checked+' onchange="onTmplChannelToggle(this)"> '+channelLabel(c)+'</label>';
  }).join('');
  var varBtns = (t.vars || VARS).map(function(v){ return '<button type="button" onclick="insertVar(\''+v+'\')">'+v+'</button>'; }).join('');
  /* 注意：以下 tc／en／jp 三欄是「通知範本內容」本身的多語版本（業務功能），非介面語言，維持原樣不可誤譯 */
  var langCols = [{k:'tc',l:'繁體中文'},{k:'en',l:'English'},{k:'jp',l:'日本語'}].map(function(x){
    return '<div class="langcol"><label>'+x.l+'</label><textarea data-lang="'+x.k+'" id="tmplText_'+x.k+'" oninput="onTmplContentInput(this)">'+t.content[x.k]+'</textarea></div>';
  }).join('');
  wrap.innerHTML =
    '<div class="editorhead"><h3>'+notifNameLabel(t.name)+'</h3>' +
    '<label class="small">'+i18nT('啟用','Enabled')+' <label class="switch" style="margin-left:6px"><input type="checkbox" '+(t.enabled?'checked':'')+' onchange="onTmplEnableToggle(this)"><span class="slider"></span></label></label></div>' +
    '<div class="formrow"><label>'+i18nT('發送渠道','Delivery Channel')+'</label>'+chBoxes+'</div>' +
    '<div class="formrow" style="max-width:280px"><label>'+i18nT('寄件署名','Sender Name')+'</label><select id="tmplSenderSel" onchange="onTmplSenderChange(this)"><option value="TLI Connect"'+(t.sender==='TLI Connect'?' selected':'')+'>TLI Connect</option><option value="依專案品牌設定"'+(t.sender==='依專案品牌設定'?' selected':'')+'>'+i18nT('依專案品牌設定','Per-Project Brand Setting')+'</option></select><div class="hint">'+i18nT('選「依專案品牌設定」時，實際寄件署名會依該專案（如經銷據點）於「基礎資料設定」設定的品牌名稱代入。','When set to “Per-Project Brand Setting”, the actual sender name is taken from the brand name configured for that project (e.g. a distributor site) under “Master Data Settings”.')+'</div></div>' +
    '<div class="formrow"><label>'+i18nT('可插入變數（點擊插入到目前聚焦的欄位，預設插入繁中欄）','Insertable variables (click to insert into the currently focused field; defaults to the Traditional Chinese column)')+'</label><div class="varbtns">'+varBtns+'</div></div>' +
    '<div class="lang3">'+langCols+'</div>' +
    '<div style="margin-top:14px"><button class="btn" onclick="saveTmpl()">'+i18nT('儲存範本','Save Template')+'</button> <button class="btn ghost" onclick="previewTmpl()">'+i18nT('預覽','Preview')+'</button><span class="savedhint" id="tmplSavedHint">'+i18nT('已儲存','Saved')+'</span></div>';
  lastFocusedLang = 'tc';
  document.querySelectorAll('#tmplEditor textarea').forEach(function(ta){
    ta.addEventListener('focus', function(){ lastFocusedLang = ta.dataset.lang; });
  });
  if (window.TLI_I18N) TLI_I18N.refresh();
}
var lastFocusedLang = 'tc';
function onTmplChannelToggle(el){
  var t = tmplById(currentTmplId);
  if (el.checked){ if (t.channels.indexOf(el.value)===-1) t.channels.push(el.value); }
  else { t.channels = t.channels.filter(function(c){ return c !== el.value; }); }
}
function onTmplEnableToggle(el){
  tmplById(currentTmplId).enabled = el.checked;
  renderTmplList();
}
function onTmplSenderChange(el){
  tmplById(currentTmplId).sender = el.value;
}
function onTmplContentInput(el){
  tmplById(currentTmplId).content[el.dataset.lang] = el.value;
}
function insertVar(v){
  var ta = document.getElementById('tmplText_'+lastFocusedLang);
  if (!ta) return;
  var start = ta.selectionStart, end = ta.selectionEnd;
  ta.value = ta.value.slice(0,start) + v + ta.value.slice(end);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = start + v.length;
  tmplById(currentTmplId).content[lastFocusedLang] = ta.value;
}
function saveTmpl(){
  renderTmplList();
  var hint = document.getElementById('tmplSavedHint');
  hint.classList.add('show');
  setTimeout(function(){ hint.classList.remove('show'); }, 2000);
}
/* 範本預覽（20260910b 新增）：以暫定值替換變數，顯示三語內容 */
var PREVIEW_SAMPLE_VALUES = {'{學生姓名}':'王小明','{課程}':'中級會話班','{時間}':'2026-09-15 19:00',
  '{員工}':'林佳蓉','{課堂}':'企業英文小組班','{規則判定}':'距上課 18 小時，符合企業合約取消時限，不計入免扣次數',
  '{收件人姓名}':'王小明','{姓名}':'Maria Lopez','{Name}':'Maria Lopez','{開通連結}':'https://gateway.tli.com.tw/activate/k1','{Activation Link}':'https://gateway.tli.com.tw/activate/k1','{到期日}':'2027-03-19','{Expiry Date}':'2027-03-19'};
function fillPreviewVars(text){
  var out = text;
  Object.keys(PREVIEW_SAMPLE_VALUES).forEach(function(k){
    out = out.split(k).join(PREVIEW_SAMPLE_VALUES[k]);
  });
  return out;
}
function previewTmpl(){
  var t = tmplById(currentTmplId);
  if (!t) return;
  document.getElementById('previewModalTitle').textContent = i18nT('範本預覽：','Template Preview: ')+t.name;
  var langLabels = {tc:'繁體中文', en:'English', jp:'日本語'};
  var body = ['tc','en','jp'].map(function(k){
    return '【'+langLabels[k]+'】\n'+fillPreviewVars(t.content[k]);
  }).join('\n\n');
  document.getElementById('previewModalBody').textContent = body;
  document.getElementById('previewModal').classList.add('open');
}
function closePreviewModal(){
  document.getElementById('previewModal').classList.remove('open');
}

// ESC 鍵可關閉所有開啟中的 modal
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.modal-mask.open').forEach(function(el){ el.classList.remove('open'); });
});

currentTmplId = 't1';
function resetPreviewModalTitle(){ document.getElementById('previewModalTitle').textContent = i18nT('範本預覽','Template Preview'); }
function refreshAllNotifViews(){
  renderPageTabs();
  renderTmplList();
  renderTmplEditor();
  if (currentView === 'events') renderEventTable();
  resetPreviewModalTitle();
}


function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}
/* ---- 共用：頂欄通知／使用者選單／登出／toast（全站同一段） ---- */
var NOTIFS = [
  {t:'訂單 ORD-2026-0102 已逾期 5 天未收款', en:'Order ORD-2026-0102 is 5 days overdue for payment', time:'10 分鐘前', timeEn:'10 minutes ago', unread:true},
  {t:'銷售方案「學期班 Lv.5–8 一期方案」即將於 1/31 下架', en:'Sales plan \u201c學期班 Lv.5\u20138 一期方案\u201d will be delisted on 1/31', time:'1 小時前', timeEn:'1 hour ago', unread:true},
  {t:'內容管理：首頁 Hero 文案已由校區主管發佈', en:'Content Management: homepage hero copy has been published by the campus manager', time:'今天 09:12', timeEn:'Today 09:12', unread:false},
  {t:'老師黃志遠已切換為留職停薪', en:'Teacher 黃志遠 has switched to unpaid leave', time:'昨天', timeEn:'Yesterday', unread:false}
];
function renderNotifPanel(){
  var panel = document.getElementById('notifPanel');
  if (!panel) return;
  var unread = NOTIFS.filter(function(n){return n.unread;}).length;
  var dot = document.getElementById('tbDot');
  if (dot) dot.style.display = unread ? 'block' : 'none';
  panel.innerHTML = '<div class="tn-head"><span>'+(window.TLI_I18N?TLI_I18N.t('通知（'+unread+' 則未讀）','Notifications ('+unread+' unread)'):('通知（'+unread+' 則未讀）'))+'</span><a href="javascript:void(0)" onclick="markAllRead(event)">'+(window.TLI_I18N?TLI_I18N.t('全部標為已讀','Mark All as Read'):'全部標為已讀')+'</a></div>' +
    NOTIFS.map(function(n){ return '<div class="tb-notifitem'+(n.unread?' unread':'')+'">'+(window.TLI_I18N?TLI_I18N.t(n.t,n.en):n.t)+'<div class="tn-t">'+(window.TLI_I18N?TLI_I18N.t(n.time,n.timeEn):n.time)+'</div></div>'; }).join('');
}
function markAllRead(ev){
  if (ev) ev.stopPropagation();
  NOTIFS.forEach(function(n){ n.unread = false; });
  renderNotifPanel();
}
function toggleNotif(ev){
  ev.stopPropagation();
  closePanel('avatarMenu');
  var p = document.getElementById('notifPanel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) renderNotifPanel();
}
function toggleAvatarMenu(ev){
  ev.stopPropagation();
  closePanel('notifPanel');
  document.getElementById('avatarMenu').classList.toggle('open');
}
function closePanel(id){
  var el = document.getElementById(id);
  if (el) el.classList.remove('open');
}
document.addEventListener('click', function(){ closePanel('notifPanel'); closePanel('avatarMenu'); });
function doLogout(){ location.href = '../公開網站/p07_login_register.html'; }
function toast(msg){
  var el = document.getElementById('toastEl');
  if (!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
renderNotifPanel();
</script>
<script>
function toggleNavGroup(ev, gid){
  ev.stopPropagation();
  var g = document.querySelector('#sidebar .navgroup[data-group="'+gid+'"]');
  if (!g) return;
  var collapsed = g.classList.toggle('collapsed');
  try{ localStorage.setItem('tliNavCollapse_'+gid, collapsed ? '1' : '0'); }catch(e){}
}
(function initNavGroups(){
  var activeLink = document.querySelector('#sidebar a.active');
  var activeGroup = activeLink ? activeLink.closest('.navgroup') : null;
  /* 20260927f：預設只展開目前頁面所在的群，其他群收合；若使用者手動展開/收合過某群，之後照該紀錄 */
  document.querySelectorAll('#sidebar .navgroup[data-group]').forEach(function(g){
    var gid = g.dataset.group, saved = null;
    try{ saved = localStorage.getItem('tliNavCollapse_'+gid); }catch(e){}
    if (saved === '1') g.classList.add('collapsed');
    else if (saved === '0') g.classList.remove('collapsed');
    else if (g !== activeGroup) g.classList.add('collapsed');
  });
  /* 目前頁所屬群組不可被收合到看不到 active 項目 */
  if (activeGroup) activeGroup.classList.remove('collapsed');
})();
</script>
<script>
/* 20260929 死按鈕修正：側欄使用者選單（姓名／大頭貼）點擊開合；此頁樣板漏帶 toggleSuMenu */
window.toggleSuMenu = window.toggleSuMenu || function(ev){
  if (ev) ev.stopPropagation();
  var m = document.getElementById('suMenu'); if (!m) return;
  ['notifPanel','avatarMenu'].forEach(function(id){ var e = document.getElementById(id); if (e) e.classList.remove('open'); });
  m.classList.toggle('open');
};
document.addEventListener('click', function(ev){
  var m = document.getElementById('suMenu');
  if (m && !m.contains(ev.target)) m.classList.remove('open');
});
if (window.TLI_I18N) { TLI_I18N.onRefresh(refreshAllNotifViews); TLI_I18N.onRefresh(renderNotifPanel); TLI_I18N.init(); }
refreshAllNotifViews();
</script>
