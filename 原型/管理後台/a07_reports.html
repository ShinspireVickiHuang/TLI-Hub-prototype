<style>

body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;

position:sticky;top:0;height:100vh;align-self:flex-start;}
.sidebar .brand{padding:0 20px 14px;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:4px;

border-radius:6px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit;}
.btn.orange{background:var(--orange);}

tr.rowlink{cursor:pointer;}

.badge.green{background:#E4F5EE;color:var(--teal);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--g200);margin-bottom:16px;flex-wrap:wrap;}
.tabs button{background:none;border:none;padding:10px 16px;font-size:13.5px;color:var(--g500);

.tabs button.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600;}
.tabpanel{display:none;}
.tabpanel.active{display:block;}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.filterbar select,.filterbar input{padding:7px 10px;border:1px solid var(--g200);border-radius:6px;

.modal-mask{display:none;position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:100;
align-items:center;justify-content:center;}

.modal h3{margin-top:0;font-size:16px;}
.formrow{margin-bottom:13px;}
.formrow label{display:block;font-size:12.5px;color:var(--g500);margin-bottom:4px;}
.formrow input,.formrow select{width:100%;padding:7px 10px;border:1px solid var(--g200);

.formrow .static{padding:7px 0;font-size:13.5px;}
.note{font-size:12px;color:#7a5b1f;background:#FFF8EE;border:1px solid #F3DFB8;padding:9px 11px;
border-radius:6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--g200);font-size:13px;}
.kv span:first-child{color:var(--g500);}
.matrix td,.matrix th{text-align:center;}
.matrix td:first-child,.matrix th:first-child{text-align:left;}
.chk{transform:scale(1.15);cursor:pointer;}
.small{font-size:12px;color:var(--g500);}
.hint{font-size:11.5px;color:var(--g500);margin-top:3px;}
.manage-link{font-size:11.5px;color:var(--navy);margin-left:6px;white-space:nowrap;text-decoration:underline;}

.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;display:flex;align-items:center;gap:10px;position:relative;}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.4;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-role{font-size:11px;color:var(--g500);}
.sidebar .su-logout{display:block;margin:6px 20px 4px;font-size:12px;color:var(--navy);text-decoration:none;}
.sidebar .su-logout:hover{text-decoration:underline;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;
border-bottom:1px solid var(--g200);position:sticky;top:0;background:#fff;z-index:40;margin:-26px -32px 22px;gap:14px;}
.hamburger{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:var(--g900);padding:4px 6px;margin-right:4px;}
.topbar .tb-title{font-size:15px;font-weight:600;color:var(--g900);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .tb-actions{display:flex;align-items:center;gap:14px;position:relative;flex-shrink:0;}
.tb-search{display:flex;align-items:center;gap:6px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;
padding:6px 10px;width:180px;}
.tb-search input{border:none;background:none;outline:none;font-size:12.5px;font-family:inherit;width:100%;color:var(--g900);}
.tb-searchicon{font-size:12px;color:var(--g500);}
.tb-bellbtn{position:relative;background:none;border:none;cursor:pointer;font-size:17px;padding:4px;line-height:1;}
.tb-dot{position:absolute;top:0;right:0;width:7px;height:7px;background:#C0392B;border-radius:50%;display:none;}
.tb-avatarbtn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;border:none;
cursor:pointer;font-size:13px;font-weight:600;flex-shrink:0;}
.tb-panel{display:none;position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--g200);
border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.16);z-index:50;}
.tb-panel.open{display:block;}
.tb-notifpanel{width:300px;padding:10px;}
.tb-notifpanel .tn-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
padding:4px 6px 8px;border-bottom:1px solid var(--g200);margin-bottom:6px;}
.tb-notifpanel .tn-head a{font-size:11.5px;cursor:pointer;}
.tb-notifitem{padding:8px 6px;border-radius:6px;font-size:12.5px;line-height:1.5;}
.tb-notifitem:hover{background:var(--g50);}
.tb-notifitem.unread{background:#EEF3FA;}
.tb-notifitem .tn-t{color:var(--g500);font-size:11px;margin-top:2px;}
.tb-avatarmenu{width:150px;padding:6px;}
.tb-avatarmenu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.tb-avatarmenu a:hover{background:var(--g50);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
background:#101828;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
opacity:0;pointer-events:none;transition:.2s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:110;}
.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;position:relative;}
.su-clickarea{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
.su-info{flex:1;min-width:0;}
.su-name,.su-unit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.su-menu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.su-menu a:hover{background:var(--g50);}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.5;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-roletag{font-size:10.5px;background:#E6EEF8;color:var(--navy);padding:0 6px;border-radius:8px;display:inline-block;width:fit-content;white-space:nowrap;}
.sidebar-user .su-unit{font-size:11px;color:var(--g500);}
.su-menu{top:auto;bottom:64px;left:14px;right:14px;}
/* ---- RWD ---- */
@media (max-width:1279px) and (min-width:1024px){
  .sidebar{width:72px;}
  .sidebar .navtext{position:absolute;left:100%;top:50%;transform:translateY(-50%);background:#fff;
    border:1px solid var(--g200);border-radius:6px;padding:6px 10px;font-size:12.5px;white-space:nowrap;
    box-shadow:0 4px 12px rgba(16,24,40,.12);opacity:0;pointer-events:none;transition:opacity .12s;margin-left:6px;color:var(--g900);}
  .sidebar nav a:hover .navtext{opacity:1;}
  .sidebar .brand{align-items:center;overflow:hidden;}
  .sidebar .brand-logo{max-width:100%;width:32px;height:28px;object-fit:cover;object-position:left center;flex-shrink:0;}
  .sidebar .brand-text{display:none;}
  .sidebar .brand small{display:none;}
  .sidebar-user{justify-content:center;}
  .sidebar-user .navtext{display:none;}
  .sidebar .su-logout{text-align:center;}
}
@media (max-width:1023px){
  .hamburger{display:inline-flex;}
  .sidebar{position:fixed;left:-260px;top:0;height:100vh;width:260px;z-index:120;transition:left .2s;}
  .sidebar.open{left:0;}
  .sidebar-backdrop.open{display:block;}
  .app{width:100%;}
  .main{padding:16px 16px 40px;}
  .topbar{padding:0 16px;margin:-16px -16px 18px;}
  .tb-search{display:none;}
  .drawer{width:100%;max-width:100%;}
}
</style>
<style>

}

function toast(msg){
  var el = document.getElementById('toastEl');
  if (!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');

<script>
function toggleNavGroup(ev, gid){
  ev.stopPropagation();
  var g = document.querySelector('#sidebar .navgroup[data-group="'+gid+'"]');
  if (!g) return;
  var collapsed = g.classList.toggle('collapsed');
  try{ localStorage.setItem('tliNavCollapse_'+gid, collapsed ? '1' : '0'); }catch(e){}
}
(function initNavGroups(){
  var activeLink = document.querySelector('#sidebar a.active');
  var activeGroup = activeLink ? activeLink.closest('.navgroup') : null;
  /* 20260927f：預設只展開目前頁面所在的群，其他群收合；若使用者手動展開/收合過某群，之後照該紀錄 */
  document.querySelectorAll('#sidebar .navgroup[data-group]').forEach(function(g){
    var gid = g.dataset.group, saved = null;
    try{ saved = localStorage.getItem('tliNavCollapse_'+gid); }catch(e){}
    if (saved === '1') g.classList.add('collapsed');
    else if (saved === '0') g.classList.remove('collapsed');
    else if (g !== activeGroup) g.classList.add('collapsed');
  });
  /* 目前頁所屬群組不可被收合到看不到 active 項目 */
  if (activeGroup) activeGroup.classList.remove('collapsed');
})();

<script>
/* ================================================================

function seededRand(seed){
  var x = Math.sin(seed*9301+49297)*233280;
  return x - Math.floor(x);
}
function fmtNT(n){ return 'NT$ '+Math.round(n).toLocaleString(); }
/* i18n 小工具：批次翻譯表頭／固定標籤用，pairs 為 [[中文,英文], ...] */

function tableHtml(headers, rows, footRow){

  var b = rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('');
  var f = footRow ? '<tr>'+footRow.map(function(c){return '<td><b>'+c+'</b></td>';}).join('')+'</tr>' : '';

/* 報表名稱中文常數固定當內部索引用（onclick 參數／篩選比對），顯示與 toast 一律另外經 TLI_I18N.t() 轉語言 */
var REPORT_NAME_EN = {

/* ================= 對齊資料源：專案／夥伴／產品分類一律改讀共用主檔 TLI_MASTERS，不再各自寫死 =================
   PROJECT_STATS／SALES_BY_MODE／SALES_BY_CATEGORY 等業績數字是報表示範用的模擬數字，主檔沒有財務欄位，
   仍留在本頁；但名稱／代號／市場／型態一律反查主檔，確保跟 a21／a20／a02 是同一份名單。 */
var PROJECT_STATS = {

function projectModeLabel(pr){
  var ch = pr.channels || {};

var PROJECTS = TLI_MASTERS.projects.map(function(pr){

});
var MARKETS = TLI_MASTERS.projects.map(function(p){return p.market;}).filter(function(v,i,a){return a.indexOf(v)===i;});

var MODE_EN = {'直營':'Direct','加盟':'Franchise','經銷':'Distributor','代理':'Agent'};
var PARTNER_TYPE_LABEL = {franchise:'加盟', distributor:'經銷', agent:'代理'};
var PARTNERS = TLI_MASTERS.partners.map(function(p){ return {id:p.id, name:p.name, type:p.type, country:p.country}; });
var CATEGORIES = TLI_MASTERS.productCategories.map(function(c){ return {id:c.id, name:c.name}; });

/* ================= 銷售群 ================= */

    rows.map(function(p){

var SALES_BY_MODE = [
 {mode:'直營', revenue:3980000},
 {mode:'加盟', revenue:1450000},
 {mode:'經銷', revenue:980000},

var SALES_BY_MARKET = [
 {market:'台灣', modeLabel:'直營', orders:482, revenue:3120000},
 {market:'日本', modeLabel:'直營／代理', orders:36, revenue:2860000},
 {market:'東南亞', modeLabel:'經銷', orders:64, revenue:980000},
 {market:'美國', modeLabel:'加盟', orders:158, revenue:1450000}
];
/* 台灣市場（直營）校區拆分：校區清單改讀共用主檔 TLI_MASTERS.campuses；權重與金額為示範數字，非實際數字，
   合計會對到「依市場」表台灣列的成交金額，供校區維度的示範拆解 */

/* ================= 合作夥伴群 ================= */
function partnerAmountLabel(type){
  return type==='agent' ? TLI_I18N.t('應付佣金','Commission Payable') : (type==='franchise' ? TLI_I18N.t('應收權利金','Royalty Receivable') : TLI_I18N.t('應收貨款','Payment Receivable'));
}
function partnerPerfStats(idx){
  var r1=seededRand(idx*31+7), r2=seededRand(idx*37+11), r3=seededRand(idx*41+13);
  return {
    revenue: 300000 + Math.floor(r1*1200000),
    students: 20 + Math.floor(r2*180),
    amount: 20000 + Math.floor(r3*220000)
  };
}
function render_partner_performance(){
  var typeSel = document.getElementById('f_ptype');
  var mode = typeSel ? typeSel.value : '';
  var typeMap = {'直營':'', '加盟':'franchise','經銷':'distributor','代理':'agent'};
  var rows = !mode ? PARTNERS.slice() : PARTNERS.filter(function(p){ return p.type===typeMap[mode]; });
  var html = '<div class="filterbar">'+periodFilterHtml('f_pp','2026-07-01','2026-09-30')+modeSelectHtml('f_ptype','render_partner_performance',mode)+
    '<button class="btn ghost" onclick="reportRequery(\'夥伴業績總表\')">'+TLI_I18N.t('重新取數','Refresh')+'</button>'+
    '<button class="btn ghost" onclick="reportExport(\'夥伴業績總表\')">'+TLI_I18N.t('匯出 CSV','Export CSV')+'</button></div>';
  html += '<div class="subhint">'+TLI_I18N.t('對齊合作夥伴管理（a20）目前 10 家夥伴：4 加盟／3 經銷／3 代理；直營由 TLI 自營，不列於本表。','Aligned with Partner Management (a20): currently 10 partners — 4 Franchise / 3 Distributor / 3 Agent; Direct is operated by TLI itself and not listed here.')+' <a class="manage-link" href="a20_agents.html">'+TLI_I18N.t('前往設定 →','Go to Settings →')+'</a></div>';
  if (mode==='直營'){
    html += '<div class="note">'+TLI_I18N.t('直營是 TLI 自己經營，不是合作夥伴，本表不列示。','Direct is operated by TLI itself, not a partner, so it is not listed in this table.')+'</div>';
  } else {
    html += tableHtml(trH([['夥伴','Partner'],['型態','Type'],['本期成交','Deals This Period'],['學員數','Students'],['應收／應付','Receivable/Payable']]), rows.map(function(p){

    }));
  }
  document.getElementById('reportContent').innerHTML = html;
}
function royaltyStats(idx){
  var r1=seededRand(idx*53+3), r2=seededRand(idx*59+5), r3=seededRand(idx*61+7);
  var reportedRevenue = 800000 + Math.floor(r1*3000000);
  var rate = 6;
  var royalty = Math.round(reportedRevenue*rate/100);
  return {
    reportedRevenue: reportedRevenue, rate: rate, royalty: royalty,
    students: 40 + Math.floor(r2*260), classes: 3 + Math.floor(r3*18),
    status: ['已繳款','待對帳','已開立待收款'][idx%3]
  };
}
function royaltyStatusBadge(s){

function deptStats(entIdx, deptIdx){
  var r1 = seededRand(entIdx*41+deptIdx*3+7), r2 = seededRand(entIdx*43+deptIdx*5+11),
      r3 = seededRand(entIdx*47+deptIdx*7+13), r4 = seededRand(entIdx*53+deptIdx*11+17);
  var attendTotal = 40 + Math.floor(r1*60);
  var attendActual = Math.round(attendTotal * (0.72 + r2*0.26));
  var poolTotal = 200 + Math.floor(r3*400);
  var poolUsed = Math.round(poolTotal * (0.35 + r4*0.5));
  return {attendActual: attendActual, attendTotal: attendTotal, poolUsed: poolUsed, poolTotal: poolTotal};
}

function renderEnterpriseTable(){
  var ent = RPT_ENTERPRISES.find(function(e){return e.id===document.getElementById('ent_select').value;}) || RPT_ENTERPRISES[0];
  var entIdx = RPT_ENTERPRISES.indexOf(ent);

  var rows = depts.map(function(d){

    '<div class="statcard"><div class="lbl">'+TLI_I18N.t('時數池消耗','Hour Pool Usage')+'</div><div class="val">'+poolPct+'%</div><div class="sub">'+sumPoolUsed+' ／ '+sumPoolTotal+' '+TLI_I18N.t('小時','hours')+'</div></div>' +
    '<div class="statcard"><div class="lbl">'+TLI_I18N.t('部門數（部門分布）','Departments (Distribution)')+'</div><div class="val">'+rows.length+'</div><div class="sub">'+TLI_I18N.t('個部門','depts')+'</div></div>' +
    '<div class="statcard"><div class="lbl">'+TLI_I18N.t('企業客戶','Enterprise Customer')+'</div><div class="val" style="font-size:15px">'+ent.name+'</div></div>';
  var t = document.getElementById('entTable');
  t.innerHTML = '<tr>'+trH([['部門','Department'],['出勤率（實到／應到）','Attendance Rate (Actual/Due)'],['時數池消耗','Hour Pool Usage']]).map(function(h){return '<th>'+h+'</th>';}).join('') + '</tr>' +
    rows.map(function(s){
      var pct = s.attendTotal ? Math.round(s.attendActual/s.attendTotal*1000)/10 : 0;
      var pp = s.poolTotal ? Math.round(s.poolUsed/s.poolTotal*100) : 0;
      return '<tr><td>'+s.dept+'</td><td>'+pct+'%（'+s.attendActual+'／'+s.attendTotal+'）</td><td>'+pp+'%（'+s.poolUsed+'／'+s.poolTotal+'）</td></tr>';
    }).join('') +
    (rows.length>1 ? '<tr><td><b>'+TLI_I18N.t('合計／均值','Total/Average')+'</b></td><td><b>'+avgAttend+'%</b></td><td><b>'+poolPct+'%</b></td></tr>' : '');
}

function attendTab(btn, key){
  attendKey = key;

function renderAttendBody(){

function billTab(btn, key){
  billingCurrentKey = key;
  if (btn){
    btn.parentNode.querySelectorAll('button').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
  } else {
    var chips = document.querySelectorAll('#billChips button');
    chips.forEach(function(b,i){ b.classList.toggle('active', (key==='tw'&&i===0)||(key==='os'&&i===1)); });
  }
  var area = document.getElementById('billingArea');
  if (key==='tw'){
    var total = INVOICE_TW.reduce(function(s,c){return s+c.revenue;},0);
    var totalOrders = INVOICE_TW.reduce(function(s,c){return s+c.orders;},0);
    area.innerHTML = tableHtml(trH([['產品分類','Product Category'],['訂單數','Orders'],['營收（NT$）','Revenue (NT$)'],['','']]), INVOICE_TW.map(function(c){
      return [c.name, c.orders, fmtNT(c.revenue), '<span class="linklike" onclick=\'showDetailModal("'+c.name+'",[["'+TLI_I18N.t('開票主體','Billing Entity')+'","'+TLI_I18N.t('TLI 台灣總部','TLI Taiwan HQ')+'"],["'+TLI_I18N.t('幣別','Currency')+'","'+TLI_I18N.t('新台幣（TWD）','New Taiwan Dollar (TWD)')+'"],["'+TLI_I18N.t('營收','Revenue')+'","'+fmtNT(c.revenue)+'"]])\'>'+TLI_I18N.t('看明細','View Details')+'</span>'];
    }), [TLI_I18N.t('合計','Total'), totalOrders, fmtNT(total), '']) +
    '<div class="hint">'+TLI_I18N.t('開票主體：TLI 台灣總部，幣別：新台幣（TWD）。','Billing entity: TLI Taiwan HQ, currency: New Taiwan Dollar (TWD).')+'</div>';
  } else {
    area.innerHTML = tableHtml(trH([['幣別','Currency'],['企業客戶','Enterprise Customer'],['訂單數','Orders'],['原幣金額','Original Amount'],['換算金額（NT$）','Converted Amount (NT$)'],['','']]), INVOICE_OS.map(function(o){
      return [o.currency, o.entity, o.orders, o.currency+' '+o.amount.toLocaleString(), TLI_I18N.t('依月結匯率','Pending Month-End FX'),
        '<span class="linklike" onclick=\'showDetailModal("'+o.entity+'",[["'+TLI_I18N.t('開票主體','Billing Entity')+'","'+TLI_I18N.t('海外公司（登記國待定）','Overseas Entity (Country TBD)')+'"],["'+TLI_I18N.t('幣別','Currency')+'","'+o.currency+'"],["'+TLI_I18N.t('原幣金額','Original Amount')+'","'+o.currency+' '+o.amount.toLocaleString()+'"]])\'>'+TLI_I18N.t('看明細','View Details')+'</span>'];
    })) +
    '<div class="hint">'+TLI_I18N.t('開票主體：海外公司（登記國待定）。換算金額待月結匯率結算後產出。','Billing entity: Overseas Entity (country TBD). The converted amount is produced after month-end FX settlement.')+'</div>';
  }
}

var currentGroup = 'sales';
var currentReportId = 'sales_by_project';
function selectReportGroup(key){
  currentGroup = key;
  document.querySelectorAll('#reportGroupNav .rg-item').forEach(function(b){
    b.classList.toggle('active', b.dataset.group===key);
  });
  currentReportId = REPORT_GROUPS[key].reports[0].id;
  renderReportListNav();
  renderCurrentReport();
}
function renderReportListNav(){
  var reports = REPORT_GROUPS[currentGroup].reports;
  document.getElementById('reportListNav').innerHTML = reports.map(function(r){
    return '<button class="replist-item'+(r.id===currentReportId?' active':'')+'" onclick="selectReport(\''+r.id+'\')">'+reportLabelT(r.name)+'</button>';
  }).join('');
}
function selectReport(id){
  currentReportId = id;
  renderReportListNav();
  renderCurrentReport();
}
function renderCurrentReport(){
  var report = REPORT_GROUPS[currentGroup].reports.find(function(r){return r.id===currentReportId;});
  if (report) report.render();
}
renderReportListNav();
renderCurrentReport();

/* ================= ESC 鍵關閉目前開啟中的 modal ================= */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  var el = document.getElementById('detailModal');
  if (el && el.classList.contains('open')) el.classList.remove('open');
});
</script>
<script>
/* 20260929 死按鈕修正：側欄使用者選單（姓名／大頭貼）點擊開合；此頁樣板漏帶 toggleSuMenu */
window.toggleSuMenu = window.toggleSuMenu || function(ev){
  if (ev) ev.stopPropagation();
  var m = document.getElementById('suMenu'); if (!m) return;
  ['notifPanel','avatarMenu'].forEach(function(id){ var e = document.getElementById(id); if (e) e.classList.remove('open'); });
  m.classList.toggle('open');
};
document.addEventListener('click', function(ev){
  var m = document.getElementById('suMenu');
  if (m && !m.contains(ev.target)) m.classList.remove('open');
});
</script>
