<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>資源庫｜TLI Hub 管理後台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--navy:#1B4E8C;--navy-dark:#123a68;--orange:#E8792B;--teal:#0F9B79;
--g50:#F5F7FA;--g200:#E4E7EC;--g500:#667085;--g900:#101828;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
background:var(--g50);color:var(--g900);}
a{color:var(--navy);}
.app{display:flex;min-height:100vh;width:100%;background:#fff;}
.sidebar{width:260px;flex-shrink:0;background:#fff;color:var(--g900);padding:18px 0;
border-right:1px solid var(--g200);display:flex;flex-direction:column;transition:width .15s;
position:sticky;top:0;height:100vh;align-self:flex-start;}
.sidebar .brand{padding:0 20px 14px;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:4px;
border-bottom:1px solid var(--g200);margin-bottom:6px;text-decoration:none;color:inherit;cursor:pointer;}
.sidebar .brand-logo{height:28px;width:auto;display:block;}
.sidebar .brand small{display:block;font-weight:400;font-size:12px;color:var(--g500);margin-top:0;text-transform:uppercase;letter-spacing:.04em;}
.sidebar nav{flex:1 1 auto;overflow-y:auto;}
.sidebar nav a,.sidebar nav span.disabled{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13.5px;
color:var(--g900);text-decoration:none;position:relative;}
.sidebar nav a .navicon{flex-shrink:0;color:var(--g500);}
.sidebar nav a:hover{background:var(--g50);}
.sidebar nav a.active{background:#E6EEF8;color:var(--navy);font-weight:600;}
.sidebar nav a.active .navicon{color:var(--navy);}
.sidebar .sec-label{padding:16px 20px 4px;font-size:10.5px;color:var(--g500);letter-spacing:.08em;text-transform:uppercase;font-weight:600;}
.main{flex:1;padding:26px 32px 60px;min-width:0;}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:16px;}
.pagehead h1{font-size:20px;margin:0;}
.pagehead .desc{font-size:12.5px;color:var(--g500);margin-top:5px;line-height:1.6;}
.btn{display:inline-block;background:var(--navy);color:#fff;border:none;padding:8px 14px;
border-radius:6px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit;}
.btn.orange{background:var(--orange);}
.btn.teal{background:var(--teal);}
.btn.ghost{background:#fff;border:1px solid var(--g200);color:var(--g900);}
.btn:disabled,.btn.isdisabled{background:var(--g200)!important;color:var(--g500)!important;
cursor:not-allowed!important;}
.card,.listpanel{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
.card h2,.listpanel h2{font-size:15px;margin:0 0 12px;}
.tablewrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;background:var(--g50);color:var(--g500);font-weight:600;padding:10px 12px;
border-bottom:1px solid var(--g200);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--g200);white-space:nowrap;}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover{background:#F8FAFD;}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.badge.blue{background:#E7EEF8;color:var(--navy);}
.badge.green{background:#E4F5EE;color:var(--teal);}
.badge.orange{background:#FCE9DA;color:var(--orange);}
.badge.grey{background:var(--g200);color:var(--g500);}
.badge.red{background:#FBE7E7;color:#C0392B;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--g200);margin-bottom:16px;flex-wrap:wrap;}
.tabs button{background:none;border:none;padding:10px 12px;font-size:13px;color:var(--g500);
cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;}
.tabs button.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600;}
.tabpanel{display:none;}
.tabpanel.active{display:block;}
.modal-mask{display:none;position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:100;
align-items:center;justify-content:center;}
.modal-mask.open{display:flex;}
.modal{background:#fff;border-radius:10px;width:460px;max-width:90vw;max-height:85vh;
overflow:auto;padding:22px;}
.modal.wide{width:640px;}
.modal h3{margin-top:0;font-size:16px;}
.formrow{margin-bottom:13px;}
.formrow label{display:block;font-size:12.5px;color:var(--g500);margin-bottom:4px;}
.formrow input,.formrow select,.formrow textarea{width:100%;padding:7px 10px;border:1px solid var(--g200);
border-radius:6px;font-size:13px;box-sizing:border-box;font-family:inherit;}
.formrow textarea{resize:vertical;min-height:60px;}
.formrow .static{padding:7px 0;font-size:13.5px;}
.note{font-size:12px;color:#7a5b1f;background:#FFF8EE;border:1px solid #F3DFB8;padding:9px 11px;
border-radius:6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--g200);font-size:13px;}
.kv span:first-child{color:var(--g500);}
.small{font-size:12px;color:var(--g500);}
.hint{font-size:11.5px;color:var(--g500);margin-top:3px;}
.manage-link{font-size:12px;color:#6b7280;text-decoration:none;margin-left:8px;}
.manage-link:hover{text-decoration:underline;}
/* ---- 列表共用 ---- */
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.searchbox{flex:1;min-width:220px;max-width:360px;position:relative;}
.searchbox input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--g200);border-radius:6px;
font-size:13px;font-family:inherit;box-sizing:border-box;}
.searchbox .sicon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--g500);font-size:13px;}
.chipbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:12px;
background:var(--g50);border:1px solid var(--g200);border-radius:8px;}
.chipgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.chipgroup .glabel{font-size:11.5px;color:var(--g500);margin-right:2px;}
.fchip{padding:5px 12px;border-radius:14px;border:1px solid var(--g200);background:#fff;font-size:12.5px;
cursor:pointer;font-family:inherit;color:var(--g900);}
.fchip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.clearlink{font-size:12px;color:var(--navy);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;padding:0;}
.sortable{cursor:pointer;user-select:none;}
.sortable .sarrow{font-size:10px;color:var(--g200);margin-left:3px;}
.sortable.sorted .sarrow{color:var(--navy);}
.batchbar{display:none;align-items:center;gap:10px;background:#EEF3FA;border:1px solid #c7d3e6;
border-radius:8px;padding:9px 14px;margin-bottom:10px;font-size:13px;flex-wrap:wrap;}
.batchbar.show{display:flex;}
.batchbar .bcount{font-weight:600;color:var(--navy);}
.pagerbar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px;
color:var(--g500);flex-wrap:wrap;gap:10px;}
.pagerbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.pagerbtns button{padding:5px 10px;border:1px solid var(--g200);background:#fff;border-radius:6px;
font-size:12.5px;cursor:pointer;font-family:inherit;}
.pagerbtns button:disabled{color:var(--g200);cursor:not-allowed;}
.pagerbtns select{padding:5px 8px;border:1px solid var(--g200);border-radius:6px;font-size:12.5px;font-family:inherit;}
.tagchip{display:inline-block;background:#FCE9DA;color:var(--orange);border-radius:10px;padding:1px 8px;
font-size:11px;margin-right:3px;}
/* ---- 右側詳情抽屜 ---- */
.drawer-mask{display:none;position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:150;}
.drawer-mask.open{display:block;}
.drawer{position:fixed;top:0;right:0;height:100vh;width:460px;max-width:92vw;background:#fff;
box-shadow:-8px 0 24px rgba(16,24,40,.18);z-index:151;transform:translateX(100%);transition:transform .2s;
display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--g200);display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0;}
.drawer-head h2{font-size:16px;margin:0 0 4px;}
.drawer-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--g500);line-height:1;padding:2px 6px;}
.drawer-close:hover{color:var(--g900);}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px 40px;}
/* ---- 批次上傳精靈 ---- */
.wizsteps{display:flex;gap:6px;margin-bottom:18px;}
.wizsteps span{flex:1;text-align:center;padding:6px 4px;font-size:11.5px;border-bottom:3px solid var(--g200);color:var(--g500);}
.wizsteps span.active{border-color:var(--navy);color:var(--navy);font-weight:600;}
.wizsteps span.done{border-color:var(--teal);color:var(--teal);}
.dropzone{border:2px dashed var(--g200);border-radius:8px;padding:34px 16px;text-align:center;cursor:pointer;color:var(--g500);font-size:13px;}
.dropzone:hover{border-color:var(--navy);color:var(--navy);}
.dropzone.filled{border-color:var(--teal);color:var(--teal);background:#F5FBF9;}
.wizfoot{display:flex;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--g200);}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0;}
.statbox{border:1px solid var(--g200);border-radius:8px;padding:14px;text-align:center;}
.statbox .num{font-size:22px;font-weight:700;color:var(--navy);}
.statbox .lbl{font-size:11.5px;color:var(--g500);margin-top:4px;}
.typegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.typecard{border:1px solid var(--g200);border-radius:8px;padding:12px;text-align:center;cursor:pointer;font-size:13px;}
.typecard:hover{border-color:var(--navy);}
.typecard.active{border-color:var(--navy);background:#EEF3FA;color:var(--navy);font-weight:600;}
/* ---- 課程搜尋勾選清單 ---- */
.pickSearch{margin-bottom:10px;}
.pickSearch input{width:100%;padding:8px 12px;border:1px solid var(--g200);border-radius:6px;font-size:13px;font-family:inherit;}
.pickListWrap{max-height:260px;overflow-y:auto;border:1px solid var(--g200);border-radius:8px;padding:2px 10px;}
.pickrow{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px dashed var(--g200);font-size:13px;}
.pickrow:last-child{border-bottom:none;}
.pickrow .pname{flex:1;}
.pickPinned{display:none;background:var(--g50);border:1px solid var(--g200);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
.pickChips{display:flex;flex-wrap:wrap;gap:6px;}
.pickChip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--g200);border-radius:16px;padding:3px 6px 3px 10px;font-size:12px;color:var(--g900);}
.pickChip button{background:var(--g200);border:none;border-radius:50%;width:16px;height:16px;line-height:1;cursor:pointer;color:var(--g500);font-size:11px;padding:0;}
.pickChip button:hover{background:#C0392B;color:#fff;}
/* ---- 媒體預覽區 ---- */
.previewbox{background:var(--g50);border:1px solid var(--g200);border-radius:8px;height:150px;display:flex;
align-items:center;justify-content:center;color:var(--g500);margin-bottom:14px;flex-direction:column;gap:6px;}
.previewbox .pv-icon{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--g200);
display:flex;align-items:center;justify-content:center;color:var(--navy);}
.sectiontitle{font-size:13px;font-weight:600;margin:16px 0 8px;color:var(--g900);}
.sectiontitle:first-child{margin-top:0;}
.optrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.optrow input[type=text]{flex:1;}
.optrow button{flex-shrink:0;background:var(--g200);border:none;border-radius:6px;width:26px;height:26px;cursor:pointer;color:var(--g500);font-size:13px;}
.optrow button:hover{background:#C0392B;color:#fff;}
/* ---- 共用：頂欄與側欄使用者卡 ---- */
.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;display:flex;align-items:center;gap:10px;position:relative;}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.4;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-role{font-size:11px;color:var(--g500);}
.sidebar .su-logout{display:block;margin:6px 20px 4px;font-size:12px;color:var(--navy);text-decoration:none;}
.sidebar .su-logout:hover{text-decoration:underline;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;
border-bottom:1px solid var(--g200);position:sticky;top:0;background:#fff;z-index:40;margin:-26px -32px 22px;gap:14px;}
.hamburger{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:var(--g900);padding:4px 6px;margin-right:4px;}
.topbar .tb-title{font-size:15px;font-weight:600;color:var(--g900);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .tb-actions{display:flex;align-items:center;gap:14px;position:relative;flex-shrink:0;}
.tb-search{display:flex;align-items:center;gap:6px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;
padding:6px 10px;width:180px;}
.tb-search input{border:none;background:none;outline:none;font-size:12.5px;font-family:inherit;width:100%;color:var(--g900);}
.tb-searchicon{font-size:12px;color:var(--g500);}
.tb-bellbtn{position:relative;background:none;border:none;cursor:pointer;font-size:17px;padding:4px;line-height:1;}
.tb-dot{position:absolute;top:0;right:0;width:7px;height:7px;background:#C0392B;border-radius:50%;display:none;}
.tb-avatarbtn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;border:none;
cursor:pointer;font-size:13px;font-weight:600;flex-shrink:0;}
.tb-panel{display:none;position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--g200);
border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.16);z-index:50;}
.tb-panel.open{display:block;}
.tb-notifpanel{width:300px;padding:10px;}
.tb-notifpanel .tn-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
padding:4px 6px 8px;border-bottom:1px solid var(--g200);margin-bottom:6px;}
.tb-notifpanel .tn-head a{font-size:11.5px;cursor:pointer;}
.tb-notifitem{padding:8px 6px;border-radius:6px;font-size:12.5px;line-height:1.5;}
.tb-notifitem:hover{background:var(--g50);}
.tb-notifitem.unread{background:#EEF3FA;}
.tb-notifitem .tn-t{color:var(--g500);font-size:11px;margin-top:2px;}
.tb-avatarmenu{width:150px;padding:6px;}
.tb-avatarmenu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.tb-avatarmenu a:hover{background:var(--g50);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
background:#101828;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
opacity:0;pointer-events:none;transition:.2s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:110;}
.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;position:relative;}
.su-clickarea{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
.su-info{flex:1;min-width:0;}
.su-name,.su-unit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.su-menu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.su-menu a:hover{background:var(--g50);}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.5;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-roletag{font-size:10.5px;background:#E6EEF8;color:var(--navy);padding:0 6px;border-radius:8px;display:inline-block;width:fit-content;white-space:nowrap;}
.sidebar-user .su-unit{font-size:11px;color:var(--g500);}
.su-menu{top:auto;bottom:64px;left:14px;right:14px;}
/* ---- RWD ---- */
@media (max-width:1279px) and (min-width:1024px){
  .sidebar{width:72px;}
  .sidebar .navtext{position:absolute;left:100%;top:50%;transform:translateY(-50%);background:#fff;
    border:1px solid var(--g200);border-radius:6px;padding:6px 10px;font-size:12.5px;white-space:nowrap;
    box-shadow:0 4px 12px rgba(16,24,40,.12);opacity:0;pointer-events:none;transition:opacity .12s;margin-left:6px;color:var(--g900);}
  .sidebar nav a:hover .navtext{opacity:1;}
  .sidebar .brand{align-items:center;overflow:hidden;}
  .sidebar .brand-logo{max-width:100%;width:32px;height:28px;object-fit:cover;object-position:left center;flex-shrink:0;}
  .sidebar .brand-text{display:none;}
  .sidebar .brand small{display:none;}
  .sidebar-user{justify-content:center;}
  .sidebar-user .navtext{display:none;}
  .sidebar .su-logout{text-align:center;}
}
@media (max-width:1023px){
  .hamburger{display:inline-flex;}
  .sidebar{position:fixed;left:-260px;top:0;height:100vh;width:260px;z-index:120;transition:left .2s;}
  .sidebar.open{left:0;}
  .sidebar-backdrop.open{display:block;}
  .app{width:100%;}
  .main{padding:16px 16px 40px;}
  .topbar{padding:0 16px;margin:-16px -16px 18px;}
  .tb-search{display:none;}
  .drawer{width:100%;max-width:100%;}
  .typegrid{grid-template-columns:1fr;}
}
</style>
<style>
/* ==== 側欄改版 20260826f：呼吸感間距／分段收合／底部卡收攏（覆寫舊樣式，回應主管截圖回饋） ==== */
#sidebar{padding:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#sidebar .brand{padding:16px 20px 14px;}
#sidebar .brand-logo{height:28px;width:auto;object-fit:contain;object-position:left center;}
#sidebar .brand small{margin-top:12px;font-size:12px;color:var(--g500);text-transform:none;letter-spacing:0;font-weight:400;}
#sidebar .brand-text{display:none;}
#sidebar nav{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:4px 8px 8px;scrollbar-width:thin;}
#sidebar nav::-webkit-scrollbar{width:6px;}
#sidebar nav::-webkit-scrollbar-thumb{background:var(--g200);border-radius:3px;}
#sidebar nav a,#sidebar nav span.disabled{align-items:center;gap:12px;height:40px;padding:0 14px;margin:2px 0;border-radius:8px;font-size:14px;}
#sidebar .navgroup .sec-label{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px;margin:20px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#98A2B3;font-weight:600;}
#sidebar .navgroup:first-child .sec-label{margin-top:8px;}
#sidebar .sec-toggle{background:none;border:none;padding:2px;margin:0;cursor:pointer;color:var(--g500);display:flex;align-items:center;line-height:1;flex-shrink:0;}
#sidebar .sec-toggle svg{transition:transform .15s;display:block;}
#sidebar .navgroup.collapsed .sec-toggle svg{transform:rotate(-90deg);}
#sidebar .navgroup-items{overflow:hidden;}
#sidebar .navgroup.collapsed .navgroup-items{display:none;}
#sidebar .sidebar-user{display:block;border-top:1px solid var(--g200);padding:10px 12px;margin:0;flex-shrink:0;position:relative;}
#sidebar .su-row{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
#sidebar .su-row .su-avatar{flex-shrink:0;width:36px;height:36px;}
#sidebar .su-row .su-info{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;gap:8px;line-height:1.2;}
#sidebar .su-row .su-name{font-size:14px;font-weight:600;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#sidebar .su-row .su-roletag{font-size:12px;background:#E6EEF8;color:var(--navy);padding:1px 7px;border-radius:8px;white-space:nowrap;flex-shrink:0;}
#sidebar .su-row .su-chevron{color:var(--g500);flex-shrink:0;}
#sidebar .su-menu{top:auto;bottom:60px;left:10px;right:10px;width:auto;padding:8px;}
@media (max-width:1279px) and (min-width:1024px){

  var x = Math.sin(seed*9301+49297)*233280;
  return x - Math.floor(x);
}
function addDays(baseStr, days){
  var d = new Date(baseStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function padNum(n, len){ var s=String(n); while(s.length<len) s='0'+s; return s; }
function fmtMinSec(totalSec){
  var m = Math.floor(totalSec/60), s = totalSec%60;

}

  var cfg = LIST_CFG[prefix], st = LIST_STATE[prefix];

function toggleListFilter(prefix, key, val){
  var st = LIST_STATE[prefix];
  if (!st.filters[key]) st.filters[key] = [];
  var idx = st.filters[key].indexOf(val);
  if (idx>-1) st.filters[key].splice(idx,1); else st.filters[key].push(val);
  st.page = 1;
  renderChipGroups(prefix);
  renderList(prefix);
}

  var st = LIST_STATE[prefix];

  renderList(prefix);
}
function listGotoPageRel(prefix, delta){ listGotoPage(prefix, LIST_STATE[prefix].page + delta); }
function listFiltered(prefix){
  var cfg = LIST_CFG[prefix], st = LIST_STATE[prefix];
  var term = st.search.trim().toLowerCase();
  return cfg.data.filter(function(r){
    if (term && cfg.searchText(r).toLowerCase().indexOf(term)===-1) return false;
    for (var key in st.filters){
      var arr = st.filters[key];
      if (arr && arr.length && arr.indexOf(cfg.filterVal(r,key))===-1) return false;
    }
    return true;
  });
}
function listSorted(prefix, list){
  var st = LIST_STATE[prefix];
  if (!st.sortKey) return list;
  var copy = list.slice();
  copy.sort(function(a,b){
    var va = a[st.sortKey], vb = b[st.sortKey];
    if (va < vb) return st.sortDir==='asc' ? -1 : 1;
    if (va > vb) return st.sortDir==='asc' ? 1 : -1;
    return 0;
  });
  return copy;
}
function listSelectedCount(prefix){ return Object.keys(LIST_STATE[prefix].selected).length; }
function renderListBatchBar(prefix){
  var st = LIST_STATE[prefix];
  var bar = document.getElementById(prefix+'_batchBar');
  var n = listSelectedCount(prefix);
  bar.classList.toggle('show', n>0);
  document.getElementById(prefix+'_batchCount').textContent = TLI_I18N.t('已選 '+n+' 筆', n+' selected');
}
function onListRowCheck(prefix, el){
  var id = el.dataset.id, st = LIST_STATE[prefix];
  if (el.checked) st.selected[id] = true; else delete st.selected[id];
  renderListBatchBar(prefix);
  var selChk = document.getElementById(prefix+'_selectAllChk');
  var pageIds = Array.from(document.querySelectorAll('#'+prefix+'_table .rowchk')).map(function(c){return c.dataset.id;});
  if (selChk) selChk.checked = pageIds.length>0 && pageIds.every(function(id){ return st.selected[id]; });
}
function onListSelectAll(prefix, el){
  var chks = document.querySelectorAll('#'+prefix+'_table .rowchk');
  var st = LIST_STATE[prefix];
  chks.forEach(function(c){
    c.checked = el.checked;
    if (el.checked) st.selected[c.dataset.id] = true; else delete st.selected[c.dataset.id];
  });
  renderListBatchBar(prefix);
}
function listExport(prefix){ var n=listSelectedCount(prefix); toast(TLI_I18N.t('已產生匯出檔案，共 '+n+' 筆，請至下載中心取得', 'Export file generated ('+n+' records); retrieve it from the Download Center')); }
function listBatchDisable(prefix){
  var st = LIST_STATE[prefix], cfg = LIST_CFG[prefix];
  var n = listSelectedCount(prefix);
  Object.keys(st.selected).forEach(function(id){
    var row = cfg.data.find(function(r){return r.id===id;});
    if (row) row.status = '停用';
  });
  renderList(prefix);
  toast(TLI_I18N.t('已將 '+n+' 筆資源設為停用', 'Disabled '+n+' resource(s)'));
}
function renderList(prefix){
  var cfg = LIST_CFG[prefix], st = LIST_STATE[prefix];
  var filtered = listFiltered(prefix);
  var sorted = listSorted(prefix, filtered);
  var total = sorted.length;
  var maxPage = Math.max(1, Math.ceil(total/st.pageSize));
  if (st.page > maxPage) st.page = maxPage;
  var startIdx = (st.page-1)*st.pageSize;
  var pageRows = sorted.slice(startIdx, startIdx+st.pageSize);

  var visCols = cfg.cols.filter(function(c){ return !c.optional || st.visibleCols[c.key]; });

  var t = document.getElementById(prefix+'_table');
  var headCells = '<th style="width:34px"><input type="checkbox" id="'+prefix+'_selectAllChk" onchange="onListSelectAll(\''+prefix+'\',this)"></th>' +
    visCols.map(function(c){
      if (!c.sortable) return '<th>'+TT(c.label)+'</th>';
      var arrow = st.sortKey===c.key ? (st.sortDir==='asc'?'▲':'▼') : '↕';
      return '<th class="sortable'+(st.sortKey===c.key?' sorted':'')+'" onclick="onSortClickList(\''+prefix+'\',\''+c.key+'\')">'+TT(c.label)+' <span class="sarrow">'+arrow+'</span></th>';
    }).join('');
  t.innerHTML = '<tr>'+headCells+'</tr>';

  pageRows.forEach(function(r){
    var tr = document.createElement('tr');
    tr.className = 'rowlink';
    var cellsHtml = '<td onclick="event.stopPropagation()"><input type="checkbox" class="rowchk" data-id="'+r.id+'" '+(st.selected[r.id]?'checked':'')+' onchange="onListRowCheck(\''+prefix+'\',this)"></td>' +
      visCols.map(function(c){ return '<td>'+c.render(r)+'</td>'; }).join('');
    tr.innerHTML = cellsHtml;
    tr.addEventListener('click', function(){ cfg.onRowClick(r); });
    t.appendChild(tr);
  });

  var selChk = document.getElementById(prefix+'_selectAllChk');
  var pageIds = pageRows.map(function(r){return r.id;});
  selChk.checked = pageIds.length>0 && pageIds.every(function(id){ return st.selected[id]; });

  var startLabel = total===0 ? 0 : startIdx+1;
  var endLabel = Math.min(startIdx+st.pageSize, total);
  document.getElementById(prefix+'_pagerLabel').textContent = TLI_I18N.t('第 '+startLabel+'–'+endLabel+' 筆／共 '+total+' 筆', startLabel+'\u2013'+endLabel+' of '+total);
  document.getElementById(prefix+'_pageIndicator').textContent = TLI_I18N.t('第 '+st.page+' / '+maxPage+' 頁', 'Page '+st.page+' / '+maxPage);
  document.getElementById(prefix+'_btnFirst').disabled = st.page<=1;
  document.getElementById(prefix+'_btnPrev').disabled = st.page<=1;
  document.getElementById(prefix+'_btnNext').disabled = st.page>=maxPage;
  document.getElementById(prefix+'_btnLast').disabled = st.page>=maxPage;
  document.getElementById(prefix+'_pageSizeSel').value = String(st.pageSize);

  renderListBatchBar(prefix);
}

function isValidStreamRef(platform, ref){
  ref = (ref||'').trim();
  if (!ref) return false;
  if (platform==='Vimeo') return /^\d{6,15}$/.test(ref) || /^https?:\/\/([\w-]+\.)?vimeo\.com\/\d+/i.test(ref);
  if (platform==='CloudFront') return /^https?:\/\/([\w-]+\.)?cloudfront\.net\/.+/i.test(ref);
  return /^https?:\/\/.+/i.test(ref); /* 其他串流平台：至少須為合法網址 */
}

  var r = VIDEOS.find(function(x){return x.id===id;});

function saveMaterial(id){
  var r = MATERIALS.find(function(x){return x.id===id;});
  var versions = [];
  if (document.getElementById('mat_ver_zh').checked) versions.push('繁');
  if (document.getElementById('mat_ver_ss').checked) versions.push('簡');
  r.versions = versions.length ? versions : r.versions;
  r.abilityType = document.getElementById('mat_ability').value;
  r.level = document.getElementById('mat_level').value;
  r.examMapping = document.getElementById('mat_exammap').value.trim();
  r.vocabCount = Number(document.getElementById('mat_vocab').value) || r.vocabCount;
  r.status = document.getElementById('mat_status').value;
  r.updated = new Date().toISOString().slice(0,10);
  matDrawerEditing = false;
  renderMaterialDrawer(id);
  renderList('materials');
  toast(TLI_I18N.t('已儲存教材資料','Material data saved'));
}

/* ================= 題目庫：新增／編輯抽屜 ================= */
var qFormOptions = [];
function openQuestionDrawer(id){
  var r = id ? QUESTIONS.find(function(x){return x.id===id;}) : null;
  document.getElementById('drw_title').textContent = r ? TT('編輯題目') : TT('新增題目');
  document.getElementById('drw_sub').textContent = r ? r.id : TT('填寫題目內容後儲存，將加入題目庫');
  qFormOptions = r ? r.options.slice() : ['選項 A 內容','選項 B 內容'];
  renderQuestionForm(r);
  document.getElementById('drawerMask').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function renderQuestionForm(r){
  var qtype = r ? r.qtype : '單選';
  var lessonOpts = LESSONS.map(function(l){ return '<option value="'+l.id+'"'+(r && r.lessonId===l.id?' selected':'')+'>'+l.label+'</option>'; }).join('');
  var audioOpts = AUDIOS.map(function(a){ return '<option value="'+a.id+'"'+(r && r.audioId===a.id?' selected':'')+'>'+a.name+'</option>'; }).join('');
  var body =
    '<div class="formrow"><label>'+TT('題型')+'</label><select id="q_type" onchange="onQTypeChange(this)">' +
    QTYPES.map(function(t){ return '<option value="'+t+'"'+(t===qtype?' selected':'')+'>'+TT(t)+'</option>'; }).join('') + '</select></div>' +
    '<div class="formrow"><label>'+TT('題幹')+'</label><textarea id="q_stem">'+(r?r.stem:'')+'</textarea></div>' +
    '<div id="q_optionsWrap"></div>' +
    '<div class="formrow"><label>'+TT('解析')+'</label><textarea id="q_explanation">'+(r?r.explanation:'')+'</textarea></div>' +
    '<div class="formrow"><label>'+TT('等級')+' '+TLI_MASTERS.manageLink('levelSystems')+'</label><select id="q_level">' + Q_LEVELS.map(function(l){ return '<option'+(r && r.level===l?' selected':'')+'>'+l+'</option>'; }).join('') + '</select></div>' +
    '<div class="formrow"><label>'+TT('綁定 Lesson')+'</label><select id="q_lesson">'+lessonOpts+'</select></div>' +
    '<div class="formrow" id="q_audioRow" style="display:none"><label>'+TT('聽力題附音頻')+'</label><select id="q_audio">'+audioOpts+'</select></div>' +
    '<button class="btn" style="margin-top:6px" onclick="saveQuestion(\''+(r?r.id:'')+'\')">'+TT('儲存')+'</button>';
  document.getElementById('drw_body').innerHTML = body;
  renderQOptions(qtype, r);
  onQTypeChange(document.getElementById('q_type'));
}
function renderQOptions(qtype, r){
  var wrap = document.getElementById('q_optionsWrap');
  if (qtype==='填空'){
    wrap.innerHTML = '<div class="formrow"><label>'+TT('正解')+'</label><input type="text" id="q_fillAnswer" value="'+(r&&r.qtype==='填空'?r.correctAnswer:'')+'"></div>';
    return;
  }
  var correctArr = (r && r.qtype!=='填空') ? (Array.isArray(r.correctAnswer)?r.correctAnswer:[r.correctAnswer]) : [0];
  var html = '<label style="display:block;font-size:12.5px;color:var(--g500);margin-bottom:6px">'+TT('選項與正解')+'</label>';
  html += qFormOptions.map(function(opt, i){
    var inputType = qtype==='多選' ? 'checkbox' : 'radio';
    var checked = correctArr.indexOf(i)>-1 ? 'checked' : '';
    return '<div class="optrow"><input type="'+inputType+'" name="q_correct" value="'+i+'" '+checked+'>' +
      '<input type="text" class="qOptInput" data-idx="'+i+'" value="'+opt+'">' +
      '<button type="button" onclick="removeQOption(this,'+i+')" aria-label="'+TLI_I18N.t('移除選項','Remove Option')+'">×</button></div>';
  }).join('');
  html += '<button type="button" class="btn ghost" style="margin-top:4px" onclick="addQOption()">'+TLI_I18N.t('＋ 新增選項','＋ Add Option')+'</button>';
  wrap.innerHTML = html;
}
function addQOption(){
  qFormOptions.push('新選項內容');
  renderQOptions(document.getElementById('q_type').value, null);
}
function removeQOption(btn, idx){
  qFormOptions.splice(idx,1);
  renderQOptions(document.getElementById('q_type').value, null);
}
function onQTypeChange(el){
  var qtype = el.value;
  renderQOptions(qtype, null);
  document.getElementById('q_audioRow').style.display = (qtype==='聽力') ? '' : 'none';
}
function saveQuestion(id){
  var qtype = document.getElementById('q_type').value;
  var stem = document.getElementById('q_stem').value.trim();
  if (!stem){ toast(TLI_I18N.t('請輸入題幹','Please enter the question stem')); return; }
  var level = document.getElementById('q_level').value;
  var lessonId = document.getElementById('q_lesson').value;
  var explanation = document.getElementById('q_explanation').value;
  var audioId = qtype==='聽力' ? document.getElementById('q_audio').value : '';
  var options = [], correctAnswer;
  if (qtype==='填空'){
    correctAnswer = document.getElementById('q_fillAnswer').value.trim();
  } else {
    Array.prototype.forEach.call(document.querySelectorAll('.qOptInput'), function(inp){ options.push(inp.value); });
    var checkedEls = document.querySelectorAll('input[name="q_correct"]:checked');
    var idxArr = Array.prototype.map.call(checkedEls, function(c){ return Number(c.value); });
    correctAnswer = qtype==='多選' ? idxArr : (idxArr.length ? idxArr[0] : 0);
  }
  if (id){
    var r = QUESTIONS.find(function(x){return x.id===id;});
    r.qtype=qtype; r.stem=stem; r.summary=stem; r.explanation=explanation; r.level=level; r.lessonId=lessonId;
    r.audioId=audioId; r.options=options; r.correctAnswer=correctAnswer;
  } else {
    QUESTIONS.unshift({
      id:'qnew'+(Date.now()), qtype:qtype, stem:stem, summary:stem, explanation:explanation, level:level,
      lessonId:lessonId, audioId:audioId, options:options, correctAnswer:correctAnswer, useCount:0, status:'啟用'
    });
  }
  closeDrawer();
  LIST_STATE.questions.page = 1;
  renderList('questions');
  toast(id ? TLI_I18N.t('已儲存題目','Question saved') : TLI_I18N.t('已新增題目','Question added'));
}

var uwStep = 1, uwType = 'images', uwFile = null;
var uwVidPlatform = 'Vimeo', uwVidRef = '';
var UW_TYPE_LABELS = {images:'圖片', videos:'影片', audio:'音頻', materials:'教材'};
function openUploadWizard(type){
  uwStep = 1; uwType = type; uwFile = null; uwVidPlatform = 'Vimeo'; uwVidRef = '';
  document.getElementById('uploadModal').classList.add('open');
  renderUploadWizard();
}
function vidRefPlaceholder(platform){
  if (platform==='Vimeo') return '例：987654321 或 https://vimeo.com/987654321';
  if (platform==='CloudFront') return '例：https://d1234.cloudfront.net/videos/xxx.m3u8';
  return '請輸入完整串流連結 https://...';
}
function onUwVidPlatformChange(el){ uwVidPlatform = el.value; uwVidRef=''; renderUploadWizard(); }
function onUwVidRefInput(el){
  uwVidRef = el.value;
  var hint = document.getElementById('uw_vidRefHint');
  if (!hint) return;
  if (!uwVidRef.trim()){ hint.textContent = TLI_I18N.t('請貼上串流連結或影片 ID','Please paste the streaming link or video ID'); hint.style.color=''; return; }
  var ok = isValidStreamRef(uwVidPlatform, uwVidRef);
  hint.textContent = ok ? TLI_I18N.t('格式正確','Format valid') : TLI_I18N.t('格式不符，請確認後再繼續','Invalid format; please check and try again');
  hint.style.color = ok ? 'var(--teal)' : '#C0392B';
}
function closeUploadWizard(){ document.getElementById('uploadModal').classList.remove('open'); }
function renderUWSteps(){
  var labels = [TT('選類型'), (uwType==='videos' ? TT('貼上串流連結') : TT('拖放上傳')), TT('填寫 Metadata'),TT('完成')];
  document.getElementById('uwSteps').innerHTML = labels.map(function(l,i){
    var n=i+1;
    var cls = n===uwStep ? 'active' : (n<uwStep ? 'done' : '');
    return '<span class="'+cls+'">'+n+'. '+l+'</span>';
  }).join('');
}
function renderUploadWizard(){
  renderUWSteps();
  var body = document.getElementById('uwBody');
  if (uwStep===1){
    body.innerHTML = '<div class="typegrid">' + Object.keys(UW_TYPE_LABELS).map(function(k){
      return '<div class="typecard'+(k===uwType?' active':'')+'" onclick="onUwTypeSelect(\''+k+'\')">'+TT(UW_TYPE_LABELS[k])+'</div>';
    }).join('') + '</div>' + uwFoot(false,true);
  } else if (uwStep===2){
    if (uwType==='videos'){
      body.innerHTML =
        '<div class="note" style="margin-bottom:12px">'+TT('影片一律放在外部串流服務，這裡只登記連結；不提供本機檔案上傳。')+'</div>' +
        '<div class="formrow"><label>'+TT('串流平台')+'</label><select id="uw_vidPlatform" onchange="onUwVidPlatformChange(this)">' +
          VIDEO_PLATFORMS.map(function(p){ return '<option'+(p===uwVidPlatform?' selected':'')+'>'+p+'</option>'; }).join('') +
        '</select></div>' +
        '<div class="formrow"><label>'+TT('影片 ID 或 URL')+'</label><input type="text" id="uw_vidRef" value="'+uwVidRef+'" oninput="onUwVidRefInput(this)" placeholder="'+vidRefPlaceholder(uwVidPlatform)+'"></div>' +
        '<div class="hint" id="uw_vidRefHint">'+(uwVidRef.trim() ? (isValidStreamRef(uwVidPlatform,uwVidRef)?TLI_I18N.t('格式正確','Format valid'):TLI_I18N.t('格式不符，請確認後再繼續','Invalid format; please check and try again')) : TLI_I18N.t('請貼上串流連結或影片 ID','Please paste the streaming link or video ID'))+'</div>' +
        uwFoot(true,true);
    } else {
      body.innerHTML = '<div class="dropzone'+(uwFile?' filled':'')+'" onclick="document.getElementById(\'uwFileInput\').click()">' +
        (uwFile ? TLI_I18N.t('已選擇檔案：'+uwFile+'（點擊可重新選擇）','Selected file: '+uwFile+' (click to reselect)') : TLI_I18N.t('點擊選擇檔案，或將檔案拖放至此','Click to choose a file, or drag and drop here')) + '</div>' +
        '<input type="file" id="uwFileInput" style="display:none" onchange="onUwFileChosen(this)">' +
        uwFoot(true,true);
    }
  } else if (uwStep===3){
    body.innerHTML =
      '<div class="formrow"><label>'+TT('名稱')+'</label><input type="text" id="uw_name" value="'+(uwFile||TLI_I18N.t('新資源','New Resource'))+'"></div>' +
      '<div class="formrow"><label>'+TT('標籤（逗號分隔）')+'</label><input type="text" id="uw_tags" placeholder="例：情境圖,初級"></div>' +
      uwFoot(true,false,true);
  } else if (uwStep===4){
    body.innerHTML =
      '<div class="statgrid"><div class="statbox"><div class="num" style="color:var(--teal)">1</div><div class="lbl">'+TT('成功上傳')+'</div></div>' +
      '<div class="statbox"><div class="num">'+TT(UW_TYPE_LABELS[uwType])+'</div><div class="lbl">'+TT('資源類型')+'</div></div>' +
      '<div class="statbox"><div class="num">'+TT('審核中')+'</div><div class="lbl">'+TT('狀態')+'</div></div></div>' +
      '<div class="hint">'+TLI_I18N.t('已加入'+UW_TYPE_LABELS[uwType]+'庫最前面'+(uwType==='videos'?'；影片要放進課程，請到該課程的「課程內容」編排單元。':'。'), 'Added to the top of the '+TT(UW_TYPE_LABELS[uwType])+' library'+(uwType==='videos'?'; to add this video to a course, arrange it under that course\'s "Course Content" tab.':'.'))+'</div>' +
      '<div style="text-align:right;margin-top:16px"><button class="btn" onclick="finishUploadWizard()">'+TT('完成')+'</button></div>';
  }
}
function uwFoot(showPrev, showNext, showFinish){
  // 左側固定放「取消」，有上一步時併排顯示；右側維持下一步／完成上傳
  var html = '<div class="wizfoot">';
  html += '<div style="display:flex;gap:8px">';
  html += '<button class="btn ghost" onclick="closeUploadWizard()">'+TT('取消')+'</button>';
  if (showPrev) html += '<button class="btn ghost" onclick="uwPrev()">'+TT('上一步')+'</button>';
  html += '</div>';
  html += '<div>';
  if (showFinish) html += '<button class="btn orange" onclick="uwDoUpload()">'+TT('完成上傳')+'</button>';
  else if (showNext) html += '<button class="btn" onclick="uwNext()">'+TT('下一步')+'</button>';
  html += '</div>';
  html += '</div>';
  return html;
}
function onUwTypeSelect(k){ uwType = k; uwFile = null; uwVidPlatform = 'Vimeo'; uwVidRef = ''; renderUploadWizard(); }
function onUwFileChosen(el){ uwFile = el.files && el.files[0] ? el.files[0].name : (TT(UW_TYPE_LABELS[uwType])+'_upload'); renderUploadWizard(); }
function uwNext(){
  if (uwStep===2){
    if (uwType==='videos'){
      if (!isValidStreamRef(uwVidPlatform, uwVidRef)){ toast(TLI_I18N.t('請輸入正確格式的串流連結或影片 ID','Please enter a correctly formatted streaming link or video ID')); return; }
    } else if (!uwFile){
      uwFile = TT(UW_TYPE_LABELS[uwType])+'_upload';
    }
  }
  uwStep++; renderUploadWizard();
}
function uwPrev(){ uwStep--; renderUploadWizard(); }
function uwDoUpload(){ uwStep = 4; renderUploadWizard(); }
function finishUploadWizard(){
  var name = (document.getElementById('uw_name') && document.getElementById('uw_name').value) || (uwFile||'新資源');
  var newId = uwType+'new'+Date.now();
  if (uwType==='images'){
    IMAGES.unshift({id:newId, name:name, format:'JPG', dim:'1200×800px', sizeKB:420, tags:['新上傳'], status:'審核中', updated:new Date().toISOString().slice(0,10), modifiedBy:'王大明'});
  } else if (uwType==='videos'){
    VIDEOS.unshift({id:newId, name:name, platform:uwVidPlatform, videoRef:uwVidRef.trim(), thumbnailUrl:'', duration:'2:00', sourceNote:'新上傳', tags:['新上傳'], status:'審核中', updated:new Date().toISOString().slice(0,10), modifiedBy:'王大明'});
  } else if (uwType==='audio'){
    AUDIOS.unshift({id:newId, name:name, format:'MP3', duration:'1:30', sizeKB:900, tags:['新上傳'], status:'審核中', updated:new Date().toISOString().slice(0,10), modifiedBy:'王大明'});
  } else if (uwType==='materials'){
    MATERIALS.unshift({id:newId, name:name, versions:['繁'], abilityType:'綜合', level:'初級', examMapping:'TOCFL 入門級 A1', vocabCount:500, status:'已上架',
      usedByProducts:[], usedInPlans:[],
      maintainer:'TLI 教研', updated:new Date().toISOString().slice(0,10), modifiedBy:'王大明', boundCourseIds:[]});
  }
  closeUploadWizard();
  LIST_STATE[uwType].page = 1;
  renderList(uwType);
  toast(TLI_I18N.t('已上傳「'+name+'」至'+UW_TYPE_LABELS[uwType]+'庫', 'Uploaded \u201c'+name+'\u201d to the '+TT(UW_TYPE_LABELS[uwType])+' library'));
}

  var el = document.getElementById('toastEl');
  if (!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
renderNotifPanel();

/* ================= 初始化 ================= */
(function initTabFromUrl(){
  try{
    var qs = new URLSearchParams(location.search);
    var tab = qs.get('tab');
    if (tab && LIB_TABS.some(function(t){return t.key===tab;})) currentLibTab = tab;
  }catch(e){}
})();
switchLibTab(currentLibTab);
initAllLists();

/* 20260929 i18n：語言切換時重繪 tab／篩選 chip／清單，但不重置使用者已選的搜尋與篩選狀態 */
function i18nRefreshLibrary(){
  renderLibTabs();
  renderPageheadActions();
  ['images','videos','audio','materials','questions'].forEach(function(prefix){
    document.getElementById(prefix+'_card').innerHTML = cardShellHtml(prefix, LIST_CFG[prefix].filterGroups);
    renderChipGroups(prefix);
    renderList(prefix);
  });
}
if (window.TLI_I18N) { TLI_I18N.onRefresh(i18nRefreshLibrary); TLI_I18N.onRefresh(renderNotifPanel); TLI_I18N.init(); }

</script>
<script>
function toggleNavGroup(ev, gid){
  ev.stopPropagation();
  var g = document.querySelector('#sidebar .navgroup[data-group="'+gid+'"]');
  if (!g) return;
  var collapsed = g.classList.toggle('collapsed');
  try{ localStorage.setItem('tliNavCollapse_'+gid, collapsed ? '1' : '0'); }catch(e){}
}
(function initNavGroups(){
  var activeLink = document.querySelector('#sidebar a.active');
  var activeGroup = activeLink ? activeLink.closest('.navgroup') : null;
  /* 20260927f：預設只展開目前頁面所在的群，其他群收合；若使用者手動展開/收合過某群，之後照該紀錄 */
  document.querySelectorAll('#sidebar .navgroup[data-group]').forEach(function(g){
    var gid = g.dataset.group, saved = null;
    try{ saved = localStorage.getItem('tliNavCollapse_'+gid); }catch(e){}
    if (saved === '1') g.classList.add('collapsed');
    else if (saved === '0') g.classList.remove('collapsed');
    else if (g !== activeGroup) g.classList.add('collapsed');
  });
  /* 目前頁所屬群組不可被收合到看不到 active 項目 */
  if (activeGroup) activeGroup.classList.remove('collapsed');
})();
</script>
<script>
/* 20260929 死按鈕修正：側欄使用者選單（姓名／大頭貼）點擊開合；此頁樣板漏帶 toggleSuMenu */
window.toggleSuMenu = window.toggleSuMenu || function(ev){
  if (ev) ev.stopPropagation();
  var m = document.getElementById('suMenu'); if (!m) return;
  ['notifPanel','avatarMenu'].forEach(function(id){ var e = document.getElementById(id); if (e) e.classList.remove('open'); });
  m.classList.toggle('open');
};
document.addEventListener('click', function(ev){
  var m = document.getElementById('suMenu');
  if (m && !m.contains(ev.target)) m.classList.remove('open');
});
</script>
