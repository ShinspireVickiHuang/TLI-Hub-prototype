<title>員工管理｜TLI Hub 組織端</title>

<style>
:root{--navy:#1B4E8C;--navy-dark:#123a68;--orange:#E8792B;--teal:#0F9B79;
--g50:#F5F7FA;--g200:#E4E7EC;--g500:#667085;--g900:#101828;}
*{box-sizing:border-box;}
html,body{overflow-x:hidden;}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
background:var(--g50);color:var(--g900);}
a{color:var(--navy);}
.app{display:flex;min-height:100vh;width:100%;background:#fff;}
.sidebar{width:260px;flex-shrink:0;background:#fff;padding:0;display:flex;flex-direction:column;height:100vh;
overflow:hidden;border-right:1px solid var(--g200);position:sticky;top:0;align-self:flex-start;transition:left .2s;}
.sidebar .brand{padding:16px 20px 14px;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:4px;
border-bottom:1px solid var(--g200);margin-bottom:6px;text-decoration:none;color:inherit;cursor:pointer;flex-shrink:0;}
.sidebar .brand-logo{height:28px;width:auto;object-fit:contain;object-position:left center;display:block;}
.sidebar .brand small{display:block;font-weight:400;font-size:12px;color:var(--g500);margin-top:12px;}
.sidebar nav{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 8px 8px;}
.sidebar .sec-label{padding:0 12px;margin:12px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#98A2B3;font-weight:600;}
.sidebar .sec-label:first-child{margin-top:4px;}
.sidebar nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 14px;margin:2px 0;border-radius:8px;
font-size:14px;color:var(--g900);text-decoration:none;}
.sidebar nav a .navicon{flex-shrink:0;color:var(--g500);}
.sidebar nav a:hover{background:var(--g50);}
.sidebar nav a.active{background:#E6EEF8;color:var(--navy);font-weight:600;}
.sidebar nav a.active .navicon{color:var(--navy);}
.sidebar-user{display:block;border-top:1px solid var(--g200);padding:10px 12px;margin:0;flex-shrink:0;position:relative;}
.su-row{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
.su-avatar{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.su-info{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;gap:8px;line-height:1.2;}
.su-name{font-size:14px;font-weight:600;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.su-roletag{font-size:12px;background:#E6EEF8;color:var(--navy);padding:1px 7px;border-radius:8px;white-space:nowrap;flex-shrink:0;}
.su-chevron{color:var(--g500);flex-shrink:0;}
.su-menu{top:auto;bottom:60px;left:10px;right:10px;width:auto;padding:8px;}
.su-menu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.su-menu a:hover{background:var(--g50);}
.main{flex:1;padding:26px 32px 60px;min-width:0;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;
border-bottom:1px solid var(--g200);position:sticky;top:0;background:#fff;z-index:40;margin:-26px -32px 22px;gap:14px;}
.hamburger{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:var(--g900);padding:4px 6px;margin-right:4px;}
.topbar .tb-title{font-size:15px;font-weight:600;color:var(--g900);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .tb-actions{display:flex;align-items:center;gap:14px;position:relative;flex-shrink:0;}
.tb-search{display:flex;align-items:center;gap:6px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;
padding:6px 10px;width:180px;}
.tb-search input{border:none;background:none;outline:none;font-size:12.5px;font-family:inherit;width:100%;color:var(--g900);}
.tb-bellbtn{position:relative;background:none;border:none;cursor:pointer;font-size:17px;padding:4px;line-height:1;}
.tb-dot{position:absolute;top:0;right:0;width:7px;height:7px;background:#C0392B;border-radius:50%;display:none;}
.tb-avatarbtn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;border:none;
cursor:pointer;font-size:13px;font-weight:600;flex-shrink:0;}
.tb-panel{display:none;position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--g200);
border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.16);z-index:50;}
.tb-panel.open{display:block;}
.tb-notifpanel{width:300px;padding:10px;}
.tb-notifpanel .tn-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
padding:4px 6px 8px;border-bottom:1px solid var(--g200);margin-bottom:6px;}
.tb-notifpanel .tn-head a{font-size:11.5px;cursor:pointer;}
.tb-notifitem{padding:8px 6px;border-radius:6px;font-size:12.5px;line-height:1.5;}
.tb-notifitem:hover{background:var(--g50);}
.tb-notifitem.unread{background:#EEF3FA;}
.tb-notifitem .tn-t{color:var(--g500);font-size:11px;margin-top:2px;}
.tb-avatarmenu{width:150px;padding:6px;}
.tb-avatarmenu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.tb-avatarmenu a:hover{background:var(--g50);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:110;}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:16px;flex-wrap:wrap;}
.pagehead h1{font-size:20px;margin:0;}
.pagehead .desc{font-size:12.5px;color:var(--g500);margin-top:5px;line-height:1.6;}
.btn{display:inline-block;background:var(--navy);color:#fff;border:none;padding:8px 14px;
border-radius:6px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit;}
.btn.orange{background:var(--orange);}
.btn.teal{background:var(--teal);}
.btn.ghost{background:#fff;border:1px solid var(--g200);color:var(--g900);}
.btn.danger{background:#fff;border:1px solid #F0B4B4;color:#C0392B;}
.btn:disabled{background:var(--g200)!important;color:var(--g500)!important;cursor:not-allowed!important;}
.card,.filterband{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
.card h2{font-size:15px;margin:0 0 12px;}
.tablewrap{overflow-x:auto;max-width:100%;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;background:var(--g50);color:var(--g500);font-weight:600;padding:10px 12px;
border-bottom:1px solid var(--g200);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--g200);white-space:nowrap;}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.badge.blue{background:#E7EEF8;color:var(--navy);}
.badge.green{background:#E4F5EE;color:var(--teal);}
.badge.orange{background:#FCE9DA;color:var(--orange);}
.badge.grey{background:var(--g200);color:var(--g500);}
.badge.red{background:#FBE7E7;color:#C0392B;}
.note{font-size:12px;color:#7a5b1f;background:#FFF8EE;border:1px solid #F3DFB8;padding:9px 11px;border-radius:6px;}
.formrow{margin-bottom:13px;}
.formrow label{display:block;font-size:12.5px;color:var(--g500);margin-bottom:4px;}
.formrow input,.formrow select,.formrow textarea{width:100%;padding:7px 10px;border:1px solid var(--g200);
border-radius:6px;font-size:13px;box-sizing:border-box;font-family:inherit;}
.formrow textarea{resize:vertical;min-height:60px;}
.small{font-size:12px;color:var(--g500);}
.hint{font-size:11.5px;color:var(--g500);margin-top:3px;}
.modal-mask{display:none;position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:160;align-items:center;justify-content:center;}
.modal-mask.open{display:flex;}
.modal{background:#fff;border-radius:10px;width:460px;max-width:90vw;max-height:85vh;overflow:auto;padding:22px;}
.modal.wide{width:640px;}
.modal h3{margin-top:0;font-size:16px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
background:#101828;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:80vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* ---- 員工管理專用 ---- */
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.toolrow .tr-left{display:flex;gap:10px;flex-wrap:wrap;align-items:center;flex:1;}
.toolrow .tr-right{display:flex;gap:8px;flex-wrap:wrap;}
.searchbox{flex:1;min-width:200px;max-width:320px;position:relative;}
.searchbox input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--g200);border-radius:6px;font-size:13px;font-family:inherit;box-sizing:border-box;}
.searchbox .sicon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--g500);}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.fchip{padding:5px 12px;border-radius:14px;border:1px solid var(--g200);background:#fff;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--g900);}
.fchip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.pagerbar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px;color:var(--g500);flex-wrap:wrap;gap:10px;}
.emptylist{padding:16px 4px;font-size:12.5px;color:var(--g500);text-align:center;}
.pagerbtns{display:flex;gap:6px;align-items:center;}
.pagerbtns button{padding:5px 10px;border:1px solid var(--g200);background:#fff;border-radius:6px;font-size:12.5px;cursor:pointer;font-family:inherit;}
.pagerbtns button:disabled{color:var(--g200);cursor:not-allowed;}
.csvpanel{display:none;background:var(--g50);border:1px solid var(--g200);border-radius:8px;padding:14px;margin-top:10px;font-size:12.5px;line-height:1.8;}
.csvpanel.open{display:block;}
.csvpanel code{background:#fff;border:1px solid var(--g200);border-radius:4px;padding:1px 5px;font-size:11.5px;}
/* ---- Mandarin Lounge 報名設定（20260910f 新增） ---- */
.modewrap{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:10px;}
.modewrap label{font-size:13.5px;display:flex;align-items:center;gap:6px;cursor:pointer;}
.wl-toolrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap;}
.wl-list{max-height:280px;overflow-y:auto;border:1px solid var(--g200);border-radius:8px;padding:4px 10px;}
.wl-row{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px dashed var(--g200);font-size:13px;}
.wl-row:last-child{border-bottom:none;}
/* ---- 20261013 啟用流程 ---- */
.orgcode{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#fff;border:1px solid var(--g200);border-radius:12px;padding:14px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
.orgcode .oc-code{display:flex;align-items:center;gap:10px;padding-right:18px;border-right:1px solid var(--g200);}
.orgcode .oc-ico{width:34px;height:34px;border-radius:8px;background:#E6EEF8;color:var(--navy);display:flex;align-items:center;justify-content:center;}
.orgcode .oc-val{font-size:18px;font-weight:700;letter-spacing:.08em;color:var(--navy);}
.orgcode .oc-text{flex:1;min-width:260px;font-size:12.5px;line-height:1.7;color:var(--g500);}
.orgcode .oc-stat{display:flex;gap:6px;flex-wrap:wrap;}
td .small{white-space:nowrap;}
.toolrow select{padding:8px 10px;border:1px solid var(--g200);border-radius:6px;font-size:13px;font-family:inherit;background:#fff;color:var(--g900);}
.filterband{padding-bottom:6px;}
#empTable td,#empTable th{padding-left:8px;padding-right:8px;}
#empTable td .btn{padding:6px 10px;font-size:12.5px;}
input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--navy);}
input[type=checkbox]:disabled{cursor:not-allowed;}
.modal.xl{width:760px;}
.wl-row .wl-name{flex:1;}
@media (max-width:1023px){
.hamburger{display:inline-flex;}
.sidebar{position:fixed;left:-260px;top:0;height:100vh;width:260px;z-index:120;}
.sidebar.open{left:0;}
.sidebar-backdrop.open{display:block;}
.app{width:100%;}
.main{padding:16px 16px 40px;}
.topbar{padding:0 16px;margin:-16px -16px 18px;}
.tb-search{display:none;}
}

</style>
</head>

<script>
function seededRand(seed){ var x=Math.sin(seed*9301+49297)*233280; return x-Math.floor(x); }
function addDays(baseStr, days){ var d=new Date(baseStr+'T00:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function T(zh, en){ return window.TLI_I18N ? TLI_I18N.t(zh, en) : zh; }

/* ===== 部門與廠區清單：與 h05「合約與時數池 → 部門管理／廠區與時區」共用同一組常數對齊。
   若同瀏覽器已在 h05 儲存過異動，會讀到 localStorage 最新清單；否則使用下方預設值。
   正式環境應改為讀取後端企業組織主檔，而非瀏覽器端儲存。 ===== */
var LS_DEPT_KEY = 'tliDemoOrgDepts';
var LS_SITE_KEY = 'tliDemoOrgSites';
function defaultOrgDepts(){
  return [
    {id:'d0', name:'業務部', quotaLimit:1200, used:860, status:'啟用'},
    {id:'d1', name:'研發部', quotaLimit:1400, used:1055, status:'啟用'},
    {id:'d2', name:'廠務部', quotaLimit:900, used:410, status:'啟用'},
    {id:'d3', name:'人資部', quotaLimit:600, used:198, status:'啟用'},
    {id:'d4', name:'製造部', quotaLimit:1900, used:1717, status:'啟用'}
  ];
}
function defaultOrgSites(){
  return [
    {id:'s0', name:'台灣總部', tz:'Asia/Taipei', tzLabel:'台灣時間（UTC+8）', status:'啟用', isBasis:true},
    {id:'s1', name:'美國廠區', tz:'America/Los_Angeles', tzLabel:'美國太平洋時間（UTC-7，夏令）', status:'啟用', isBasis:false},
    {id:'s2', name:'日本廠區', tz:'Asia/Tokyo', tzLabel:'日本標準時間（UTC+9）', status:'啟用', isBasis:false}
  ];
}
function loadOrgDepts(){
  try{ var raw = localStorage.getItem(LS_DEPT_KEY); if (raw){ var arr = JSON.parse(raw); if (arr && arr.length) return arr; } }catch(err){}
  return defaultOrgDepts();
}
function loadOrgSites(){
  try{ var raw = localStorage.getItem(LS_SITE_KEY); if (raw){ var arr = JSON.parse(raw); if (arr && arr.length) return arr; } }catch(err){}
  return defaultOrgSites();
}
var DEPTS_ALL = loadOrgDepts();
var SITE_LIST_ALL = loadOrgSites();
/* 員工指派用「全部」部門／廠區（含已停用，既有員工仍可能屬於已停用者）；
   下拉選單只列「啟用」中的項目，供新增／編輯員工與批次匯入使用。 */
var DEPTS = DEPTS_ALL.map(function(d){ return d.name; });
var SITE_LIST = SITE_LIST_ALL.map(function(s){ return {id:s.id, name:s.name, tz:s.tzLabel, status:s.status}; });
function activeDepts(){ return DEPTS_ALL.filter(function(d){ return d.status==='啟用'; }).map(function(d){ return d.name; }); }
function activeSites(){ return SITE_LIST.filter(function(s){ return s.status==='啟用'; }); }
/* 姓名池與 h01、h03、h05、h07 使用同一份字面常數（不含「陳雅婷」，避免與登入中的 HR 本人撞名），
   同一組演算法＋同一份常數，確保同一個 emp id 在各頁顯示同一個姓名 */
var TW_NAMES = ['王建宏','林佳蓉','陳志明','張淑芬','李俊傑','黃詩涵','吳承翰','劉美玲','蔡文彬','許雅婷','郭柏翰','楊佩珊'];
var US_NAMES = ['John Miller','Emily Tran','David Park','Rachel Kim','Michael Brown','Sophia Garcia','Kevin Lee','Laura Chen','Daniel Wright','Olivia Martinez','Brian Wu','Natalie Scott'];
var JP_NAMES = ['田中 涼子','佐藤 健一','鈴木 美咲','高橋 大輔','伊藤 由美','渡辺 翔太','中村 直樹','小林 愛','加藤 拓也','山本 麻衣','斉藤 亮','松本 恵'];
var NAME_POOL_BY_SITE = {s0:TW_NAMES, s1:US_NAMES, s2:JP_NAMES};
function namePoolForSite(siteId){ return NAME_POOL_BY_SITE[siteId] || TW_NAMES; }
var FEEDBACK_POOL = [
  '口語表達進步明顯，能主動用中文提問。',
  '聽力理解穩定，建議加強生產線相關詞彙的口說練習。',
  '出席穩定，作業按時繳交，發音仍需加強聲調。',
  '本月因出差請假兩次，仍保持課前預習習慣。',
  '閱讀理解進步快，寫作部分句型變化可以再豐富。',
  '課堂互動積極，建議加強書面表達的用詞精準度。'
];
function makeEmployee(i){
  var siteIdx = i % SITE_LIST.length;
  var site = SITE_LIST[siteIdx];
  var pool = namePoolForSite(site.id);
  var name = pool[Math.floor(i/SITE_LIST.length) % pool.length];
  var r1=seededRand(i*7+11), r2=seededRand(i*11+13), r3=seededRand(i*13+17), r4=seededRand(i*17+19);
  var dept = DEPTS[i % DEPTS.length];
  var status = r1 < 0.92 ? '在學' : '停用';
  var attendance = 55 + Math.floor(r2*45);
  var hours = 20 + Math.floor(r3*140);
  var emailName = name.toLowerCase().replace(/[^a-z]/g,'').slice(0,10);
  var email = (emailName ? emailName : 'emp'+i) + '@example-semi.com';
  return {
    id:'emp'+i, name:name, email:email, dept:dept, site:site.name, tz:site.tz,
    status:status, activation:'active', hours:hours, attendance:attendance,
    joined: addDays('2026-01-01', Math.floor(r4*200)),
    skills:{ listen:30+Math.floor(seededRand(i*3+2)*65), speak:30+Math.floor(seededRand(i*5+4)*65),
             read:30+Math.floor(seededRand(i*9+6)*65), write:30+Math.floor(seededRand(i*15+8)*65) },
    score:55+Math.floor(seededRand(i*19+10)*45),
    feedback: FEEDBACK_POOL[i % FEEDBACK_POOL.length],
    feedbackDate: addDays('2026-09-08', -Math.floor(seededRand(i*31+21)*21))
  };
}
var EMP_COUNT = 26;
var EMPLOYEES = []; for (var ii=0; ii<EMP_COUNT; ii++) EMPLOYEES.push(makeEmployee(ii));
var nextEmpSeq = EMP_COUNT;

/* ==================================================================
   20261013 員工白名單匯入與啟用（契約：原型2 根目錄 _契約_會員結構與啟用_20261013.md）
   資料來源：TLI_MASTERS.memberAccounts（orgId = 本企業），匯入與寄送結果用 saveMemberData() 寫回，a01 讀同一份。
   本頁示範租戶＝範例半導體（ent12，企業代碼 FANLI）；員編重複只在本企業內檢查；Email 全系統唯一，已被其他帳號用過的列不建立。
   ================================================================== */
var MM = window.TLI_MASTERS;
var ORG_ID = 'ent12';
var ORG = (MM.orgCustomers.filter(function(o){ return o.id===ORG_ID; })[0]) || {id:ORG_ID, name:'範例半導體股份有限公司', code:'FANLI', sourceType:'direct', sourceUnitId:'tli'};
function pad(n,l){ var s=String(n); while(s.length<l) s='0'+s; return s; }
function nowStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)+' '+pad(d.getHours(),2)+':'+pad(d.getMinutes(),2); }
function todayStr(){ return nowStr().slice(0,10); }
function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nextAccSeq(){
  var mx = 0;
  MM.memberAccounts.forEach(function(a){ var n = parseInt(String(a.id).replace(/\D/g,''),10); if (n>mx) mx=n; });
  return mx+1;
}
function makeAccount(o){
  var n = nextAccSeq();
  var a = {id:'ma'+n, memberNo:'MA-'+pad(n,6), name:'', email:'', phone:'', sourceType:ORG.sourceType, sourceUnitId:ORG.sourceUnitId,
    orgId:ORG_ID, employeeNo:'', department:'', activationStatus:'未啟用', activationMethod:'Email 通知', activationCode:'',
    sentAt:'', activatedAt:'', orderId:'', createdAt:todayStr(), plans:[]};
  for (var k in o) a[k] = o[k];
  if (!a.email) a.activationMethod = '啟用碼';
  if (a.activationMethod==='啟用碼' && !a.activationCode) a.activationCode = MM.newActivationCode();
  return a;
}
function orgAccounts(){ return MM.memberAccounts.filter(function(a){ return a.orgId===ORG_ID; }); }

/* 既有 26 位示範員工：對應到主檔帳號（找不到就補一筆）。啟用狀態：在學者少數未啟用／已寄通知，部分無 Email 走啟用碼 */
function syncLegacyToMasters(){
  var added = false;
  EMPLOYEES.forEach(function(e, i){
    var empNo = 'FL-'+(1001+i);
    var acct = orgAccounts().filter(function(a){ return a.employeeNo===empNo; })[0];
    if (!acct){
      var act = '已啟用';
      if (e.status==='在學'){ if (i%8===2) act='已寄通知'; else if (i%8===5) act='未啟用'; }
      var noEmail = (e.status==='在學' && i%9===4);
      acct = makeAccount({name:e.name, email:noEmail?'':e.email, employeeNo:empNo, department:e.dept, activationStatus:act,
        createdAt:e.joined, activationMethod:noEmail?'啟用碼':'Email 通知'});
      if (act==='已啟用'){ acct.sentAt = e.joined+' 09:30'; acct.activatedAt = e.joined+' 10:00'; }
      else if (act==='已寄通知'){ acct.sentAt = e.joined+' 09:30'; }
      MM.memberAccounts.push(acct); added = true;
    }
    e.ma = acct; e.empNo = empNo;
    e.name = acct.name; e.email = acct.email; e.dept = acct.department || e.dept;
  });
  /* 先前匯入、存在主檔但不屬於這 26 位的帳號 */
  var known = {}; EMPLOYEES.forEach(function(e){ known[e.ma.id] = true; });
  orgAccounts().forEach(function(a){ if (!known[a.id]) EMPLOYEES.unshift(rowFromAccount(a)); });
  if (added) MM.saveMemberData();
}
function rowFromAccount(a){
  var site = SITE_LIST[0];
  return {id:'emp'+(nextEmpSeq++), name:a.name, email:a.email, dept:a.department, site:site.name, tz:site.tz,
    status:'在學', activation:'', hours:0, attendance:0, joined:a.createdAt,
    skills:{listen:0,speak:0,read:0,write:0}, score:0, feedback:'', empNo:a.employeeNo, ma:a};
}
syncLegacyToMasters();

/* ===== 啟用狀態：標籤、篩選、選取 ===== */
var ACT_EN = {}; MM.activationStates.forEach(function(s){ ACT_EN[s.id] = s.en; });
function actText(id){ return T(id, ACT_EN[id] || id); }
function actBadge(e){
  var cls = {'未啟用':'grey','已寄通知':'orange','已啟用':'green'}[e.ma.activationStatus] || 'grey';
  return '<span class="badge '+cls+'">'+actText(e.ma.activationStatus)+'</span>';
}
var selected = {};
function selectedRows(){ return EMPLOYEES.filter(function(e){ return selected[e.id]; }); }
function toggleSel(id, on){ if (on) selected[id]=true; else delete selected[id]; renderActBar(); syncSelAll(); }
function syncSelAll(){
  var box = document.getElementById('selAll'); if (!box) return;
  var rows = pageRowsNow().filter(function(e){ return e.ma.activationStatus!=='已啟用'; });
  box.checked = rows.length>0 && rows.every(function(e){ return selected[e.id]; });
}
function toggleSelAll(on){
  pageRowsNow().forEach(function(e){ if (e.ma.activationStatus!=='已啟用'){ if (on) selected[e.id]=true; else delete selected[e.id]; } });
  renderEmpTable(); renderActBar();
}
function pageRowsNow(){
  var f = empFiltered(), s = (empState.page-1)*empState.pageSize;
  return f.slice(s, s+empState.pageSize);
}
function onActFilterSelect(v){ empState.act = v; empState.page = 1; renderEmpTable(); }
function renderActFilter(){
  var sel = document.getElementById('actFilterSel');
  sel.innerHTML = '<option value="">'+T('全部啟用狀態','All Activation Statuses')+'</option>' + MM.activationStates.map(function(s){
    return '<option value="'+s.id+'">'+actText(s.id)+'</option>'; }).join('');
  sel.value = empState.act;
}

/* ===== 上方資訊列：企業代碼、啟用進度、批次動作 ===== */
var ICO = {
  upload:'<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px"><path d="M10 13V3"/><polyline points="6 7 10 3 14 7"/><path d="M3 13v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3"/></svg>',
  mail:'<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px"><rect x="2.5" y="4.5" width="15" height="11" rx="1.5"/><polyline points="3 6 10 11 17 6"/></svg>',
  down:'<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px"><path d="M10 3v10"/><polyline points="6 9 10 13 14 9"/><path d="M3 13v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3"/></svg>',
  key:'<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="12" r="3.5"/><path d="M9.5 9.5 16 3"/><path d="M13.5 5.5 16 8"/></svg>'
};
function actCounts(){
  var c = {'未啟用':0,'已寄通知':0,'已啟用':0};
  EMPLOYEES.forEach(function(e){ if (e.status==='在學') c[e.ma.activationStatus]++; });
  return c;
}
function renderActBar(){
  var c = actCounts(), n = selectedRows().length;
  var box = document.getElementById('orgCodeBox');
  box.innerHTML =
    '<div class="oc-code"><span class="oc-ico">'+ICO.key+'</span><div><div class="small">'+T('企業代碼','Organization Code')+'</div><div class="oc-val">'+esc(ORG.code)+'</div></div></div>'+
    '<div class="oc-text">'+T('沒有 Email 的員工：匯出「名單＋啟用碼」自行發給員工，員工用「企業代碼＋員工編號」與啟用碼首次登入，設定密碼後即可使用。有 Email 的員工：寄啟用通知，由信中連結啟用。','Employees without an Email: export the “list + activation codes” and hand them out yourself. They sign in the first time with “Organization Code + Employee No.” and the activation code, then set a password. Employees with an Email: send the activation notice and they activate from the link.')+'</div>'+
    '<div class="oc-stat"><span class="badge green">'+actText('已啟用')+' '+c['已啟用']+'</span> <span class="badge orange">'+actText('已寄通知')+' '+c['已寄通知']+'</span> <span class="badge grey">'+actText('未啟用')+' '+c['未啟用']+'</span></div>';
  var right = document.getElementById('toolRight');
  right.innerHTML =
    '<button class="btn ghost" onclick="openImportModal()">'+ICO.upload+T('匯入員工名單','Import Employee List')+'</button>'+
    '<button class="btn ghost" id="btnBatchSend" onclick="openBatchSend()"'+(n?'':' disabled')+'>'+ICO.mail+T('批次寄啟用通知','Send Activation Notices')+(n?'（'+n+'）':'')+'</button>'+
    '<button class="btn ghost" onclick="openExportCodes()">'+ICO.down+T('匯出名單＋啟用碼','Export List + Codes')+'</button>'+
    '<button class="btn" onclick="openInviteModal()">'+T('＋ 邀請員工','+ Invite Employee')+'</button>';
}

/* ===== 寄啟用通知（示範：不真的寄信，只寫回狀態與時間） ===== */
function sendNoticeTo(e){
  var a = e.ma;
  a.activationMethod = 'Email 通知';
  a.activationStatus = '已寄通知';
  a.sentAt = nowStr();
  MM.ensureActivationCode(a);
}
function sendOne(id){
  var e = EMPLOYEES.find(function(x){ return x.id===id; });
  if (!e || !e.email) return;
  var resend = e.ma.activationStatus==='已寄通知';
  sendNoticeTo(e);
  MM.saveMemberData();
  renderEmpTable(); renderActBar();
  toast((resend ? T('已重寄啟用通知至 ','Activation notice resent to ') : T('已寄出啟用通知至 ','Activation notice sent to '))+e.email);
}
function eligibleForMail(rows){ return rows.filter(function(e){ return e.email && e.ma.activationStatus!=='已啟用'; }); }
var actConfirmFn = null;
function openActModal(title, bodyHtml, confirmLabel, fn){
  document.getElementById('actModalTitle').textContent = title;
  document.getElementById('actModalBody').innerHTML = bodyHtml;
  var b = document.getElementById('actModalOk'); b.textContent = confirmLabel; b.disabled = !fn;
  actConfirmFn = fn;
  document.getElementById('actModalCancel').textContent = T('取消','Cancel');
  document.getElementById('actModal').classList.add('open');
}
function doActConfirm(){ var f = actConfirmFn; closeModal('actModal'); if (f) f(); }
function openBatchSend(){
  var rows = selectedRows(), ok = eligibleForMail(rows);
  var noMail = rows.filter(function(e){ return !e.email; }).length;
  var done = rows.filter(function(e){ return e.ma.activationStatus==='已啟用'; }).length;
  var again = ok.filter(function(e){ return e.ma.activationStatus==='已寄通知'; }).length;
  var html = '<p style="margin:0 0 8px">'+T('將寄出啟用通知給 ','Activation notices will be sent to ')+'<strong>'+ok.length+'</strong>'+T(' 位員工（其中 ',' employees (')+again+T(' 位為重寄）。',' of them are resends).')+'</p>'+
    ((noMail||done) ? '<p class="small" style="margin:0">'+T('略過：','Skipped: ')+(noMail?noMail+T(' 位沒有 Email（請改用「匯出名單＋啟用碼」）',' without an Email (use “Export List + Codes” instead)'):'')+(noMail&&done?'；':'')+(done?done+T(' 位已啟用',' already activated'):'')+'</p>' : '');
  openActModal(T('批次寄啟用通知','Send Activation Notices'), html, T('確認寄出','Send'), ok.length ? function(){
    ok.forEach(sendNoticeTo); selected = {};
    MM.saveMemberData(); renderEmpTable(); renderActBar();
    toast(T('已寄出啟用通知 ','Activation notices sent: ')+ok.length+T(' 封',''));
  } : null);
}

/* ===== 匯出名單＋啟用碼（無 Email 員工） ===== */
function csvCell(v){ v = String(v==null?'':v); return /[",\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCsv(filename, rows){
  var text = '﻿' + rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
  var blob = new Blob([text], {type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

function parseCsv(text){
  text = text.replace(/^﻿/, '');
  var rows = [], row = [], cur = '', q = false;
  for (var i=0;i<text.length;i++){
    var ch = text.charAt(i);
    if (q){
      if (ch==='"'){ if (text.charAt(i+1)==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch;
    } else if (ch==='"') q = true;
    else if (ch===','){ row.push(cur); cur=''; }
    else if (ch==='\n' || ch==='\r'){ if (ch==='\r' && text.charAt(i+1)==='\n') i++; row.push(cur); cur=''; if (row.some(function(x){return x.trim()!=='';})) rows.push(row); row=[]; }
    else cur+=ch;
  }
  row.push(cur); if (row.some(function(x){return x.trim()!=='';})) rows.push(row);
  return rows;
}
function mapCsvRows(rows){
  var idx = {no:0, name:1, email:2, dept:3}, start = 0;
  if (rows.length){
    var h = rows[0].map(function(x){ return x.trim().toLowerCase(); });
    var isHead = h.some(function(x){ return /員工編號|員編|employee|姓名|name|email/.test(x); });
    if (isHead){
      start = 1;
      h.forEach(function(x,i){
        if (/員工編號|員編|employee/.test(x)) idx.no = i;
        else if (/姓名|^name/.test(x)) idx.name = i;
        else if (/email|e-mail|信箱/.test(x)) idx.email = i;
        else if (/部門|dept/.test(x)) idx.dept = i;
      });
    }
  }
  return rows.slice(start).map(function(r){
    return {no:(r[idx.no]||'').trim(), name:(r[idx.name]||'').trim(), email:(r[idx.email]||'').trim(), dept:(r[idx.dept]||'').trim()};
  });
}
function checkImportRows(list){
  var seenNo = {}, seenMail = {};
  EMPLOYEES.forEach(function(e){ seenNo[e.empNo.toLowerCase()] = 'exist'; if (e.email) seenMail[e.email.toLowerCase()] = 'exist'; });
  var deptNames = DEPTS_ALL.map(function(d){ return d.name; });
  return list.slice(0,500).map(function(r){
    var res = {r:r, ok:true, msg:T('可匯入','Ready'), cls:'green', note:''};
    var no = r.no.toLowerCase(), mail = r.email.toLowerCase();
    if (!r.no || !r.name){ res.ok=false; res.msg=T('略過：缺員工編號或姓名','Skipped: missing employee no. or name'); }
    else if (r.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email)){ res.ok=false; res.msg=T('略過：Email 格式不符','Skipped: invalid Email'); }
    else if (seenNo[no]){ res.ok=false; res.msg = seenNo[no]==='exist' ? T('略過：員工編號已在名單中','Skipped: employee no. already on the list') : T('略過：檔內員工編號重複','Skipped: duplicate employee no. in file'); }
    else if (mail && seenMail[mail]){ res.ok=false; res.msg = seenMail[mail]==='exist' ? T('略過：Email 已在名單中','Skipped: Email already on the list') : T('略過：檔內 Email 重複','Skipped: duplicate Email in file'); }
    else if (mail && !seenMail[mail] && MM.accountsByEmail(r.email).length){
      /* Email 全系統唯一：已被其他帳號（任何來源）用過，這一列不建立 */
      res.ok=false; res.msg=T('略過：Email 已被其他帳號使用，這一列不會建立','Skipped: Email already used by another account; this row will not be created');
      res.note=T('可把這位員工的 Email 留空，改用員工編號加啟用碼，修正後再匯入。','Leave this employee’s Email blank and use employee no. plus an activation code, then import again.');
    }
    if (res.ok){
      seenNo[no] = 'file'; if (mail) seenMail[mail] = 'file';
      if (!r.email) res.note = T('無 Email，將產生啟用碼','No Email; an activation code will be generated');
      if (r.dept && deptNames.indexOf(r.dept)===-1) res.note += (res.note?'；':'')+T('部門不在現有清單','Department not in current list');
    } else res.cls = 'red';
    return res;
  });
}

function onImportFile(input){
  var f = input.files && input.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    var list = mapCsvRows(parseCsv(String(rd.result||'')));
    imp = {rows:checkImportRows(list), fname:f.name};
    if (list.length>500) toast(T('超過 500 筆，只處理前 500 筆','Over 500 rows; only the first 500 are processed'));
    renderImportModal();
  };
  rd.readAsText(f, 'utf-8');
}

    if (empState.status && e.status!==empState.status) return false;
    return true;
  });

var LS_INVITE_KEY = 'tliDemoEmployeeInvites';
function pushEmployeeInviteRecord(emp, sentAt){
  try{
    var raw = localStorage.getItem(LS_INVITE_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(arr)) arr = [];
    arr.unshift({ name:emp.name, email:emp.email, dept:emp.dept, sentAt:sentAt, status:'已寄通知' });
    localStorage.setItem(LS_INVITE_KEY, JSON.stringify(arr));
  }catch(err){}
}

function dupInOrg(empNo, email, exceptId){
  var no = String(empNo||'').trim().toLowerCase(), mail = String(email||'').trim().toLowerCase();
  var hit = EMPLOYEES.filter(function(x){ return x.id!==exceptId && ((no && x.empNo.toLowerCase()===no) || (mail && x.email && x.email.toLowerCase()===mail)); })[0];
  if (hit) return (no && hit.empNo.toLowerCase()===no) ? 'no' : 'mail';
  /* Email 全系統唯一：其他來源或其他企業已用過的 Email 也算重複（編輯自己時排除自己的帳號） */
  var self = exceptId ? EMPLOYEES.filter(function(x){ return x.id===exceptId; })[0] : null;
  if (mail && MM.accountsByEmail(mail).filter(function(a){ return !(self && self.ma && self.ma.id===a.id); }).length) return 'mail';
  return '';
}

  var site = SITE_LIST.find(function(s){ return s.id===sel.value; });

function doInviteEmployee(){
  var no = document.getElementById('inviteNo').value.trim();
  var email = document.getElementById('inviteEmail').value.trim();
  var name = document.getElementById('inviteName').value.trim();
  if (!no || !name){ toast(T('請填寫員工編號與姓名','Please fill in employee number and name')); return; }
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast(T('Email 格式不正確','The Email format is invalid')); return; }
  var dup = dupInOrg(no, email, '');
  if (dup==='no'){ toast(T('這個員工編號已在名單中','This employee number is already on the list')); return; }
  if (dup==='mail'){ toast(T('這個 Email 已被其他帳號使用，請改用其他 Email；沒有專屬 Email 的員工可留空，改用員編加啟用碼','This Email is already used by another account. Use a different Email, or leave it blank and use employee no. plus an activation code')); return; }
  var dept = document.getElementById('inviteDept').value;
  var siteId = document.getElementById('inviteSite').value;
  var site = SITE_LIST.find(function(s){ return s.id===siteId; });
  var acct = makeAccount({name:name, email:email, employeeNo:no, department:dept});
  MM.memberAccounts.push(acct);
  var row = rowFromAccount(acct); row.site = site.name; row.tz = site.tz;
  EMPLOYEES.unshift(row);
  if (email){ sendNoticeTo(row); pushEmployeeInviteRecord(row, new Date().toISOString()); }
  MM.saveMemberData();
  empState.page = 1;
  renderEmpTable(); renderActBar();
  closeModal('inviteModal');
  toast(email ? T('已加入「','Added “')+name+T('」並寄出啟用通知至 ','” and sent the activation notice to ')+email
              : T('已加入「','Added “')+name+T('」，沒有 Email，請匯出名單＋啟用碼發給員工','” without an Email; export the list + codes and hand the code over'));
}

/* ===== 編輯員工資料 =====
   可改：員工編號、姓名、Email（可空）、部門、所屬廠區；員編重複只在本企業內檢查，Email 全系統唯一。
   不可改：狀態、累計時數、出勤率——由上課紀錄產生。 */
var pendingEditId = null;
function openEditModal(id){
  var e = EMPLOYEES.find(function(x){ return x.id===id; });
  if (!e) return;
  pendingEditId = id;
  var deptOpts = activeDepts().slice();
  if (deptOpts.indexOf(e.dept) === -1) deptOpts.unshift(e.dept); /* 原部門已停用時仍要列出 */
  var siteOpts = activeSites().slice();
  if (!siteOpts.some(function(s){ return s.name===e.site; })){
    var own = SITE_LIST.find(function(s){ return s.name===e.site; });
    if (own) siteOpts.unshift(own);
  }
  var act = e.ma.activationStatus;
  document.getElementById('editBody').innerHTML = '<h3>'+T('編輯員工資料','Edit Employee')+'</h3>'+
    '<div class="formrow"><label>'+T('員工編號','Employee No.')+'</label><input type="text" id="editNo" value="'+esc(e.empNo)+'"></div>'+
    '<div class="formrow"><label>'+T('姓名','Name')+'</label><input type="text" id="editName" value="'+esc(e.name)+'"></div>'+
    '<div class="formrow"><label>'+T('員工 Email（可空）','Employee Email (optional)')+'</label><input type="email" id="editEmail" value="'+esc(e.email)+'"><div class="hint" style="margin-top:4px">'+
      (act==='已啟用' ? T('此員工已啟用；改 Email 後，下次請用新 Email 登入。','This employee has activated; after changing the Email they sign in with the new one.')
                      : T('此員工尚未啟用；改 Email 後請重新寄啟用通知。','This employee has not activated yet; resend the activation notice after changing the Email.'))+'</div></div>'+
    '<div class="formrow"><label>'+T('部門','Department')+'</label><select id="editDept">'+deptOpts.map(function(d){ return '<option'+(d===e.dept?' selected':'')+'>'+esc(d)+'</option>'; }).join('')+'</select></div>'+
    '<div class="formrow"><label>'+T('所屬廠區','Site')+'</label><select id="editSite" onchange="onEditSiteChange(this)">'+siteOpts.map(function(s){ return '<option value="'+s.id+'"'+(s.name===e.site?' selected':'')+'>'+esc(s.name)+'</option>'; }).join('')+'</select><div class="hint" id="editSiteTz" style="margin-top:4px"></div></div>'+
    '<div class="hint"><a href="h05_contract.html#org" target="_blank" rel="noopener">'+T('管理部門與廠區','Manage departments and sites')+'</a></div>'+
    '<div class="hint">'+T('狀態、累計時數與出勤率由系統依上課紀錄產生，不在此編輯；停用帳號請用列表上的「停用」。','Status, accrued hours and attendance come from class records and are not edited here; use “Deactivate” on the list to disable an account.')+'</div>'+
    '<div style="text-align:right;margin-top:14px"><button class="btn ghost" onclick="closeModal(\'editModal\')">'+T('取消','Cancel')+'</button> <button class="btn" onclick="doSaveEmployee()">'+T('儲存','Save')+'</button></div>';
  document.getElementById('editModal').classList.add('open');
  onEditSiteChange(document.getElementById('editSite'));
}
function onEditSiteChange(sel){
  var site = SITE_LIST.find(function(s){ return s.id===sel.value; });
  document.getElementById('editSiteTz').textContent = site ? T('時區：','Time Zone: ')+site.tz+T('（依廠區自動帶出，不可編輯）',' (auto-filled by site, not editable)') : '';
}
function doSaveEmployee(){
  var e = EMPLOYEES.find(function(x){ return x.id===pendingEditId; });
  if (!e) return;
  var no = document.getElementById('editNo').value.trim();
  var name = document.getElementById('editName').value.trim();
  var email = document.getElementById('editEmail').value.trim();
  if (!no || !name){ toast(T('請填寫員工編號與姓名','Please fill in employee number and name')); return; }
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast(T('Email 格式不正確','The Email format is invalid')); return; }
  var dup = dupInOrg(no, email, e.id);
  if (dup==='no'){ toast(T('這個員工編號已被其他員工使用','This employee number is used by another employee')); return; }
  if (dup==='mail'){ toast(T('這個 Email 已被其他帳號使用，請改用其他 Email；也可清空，改用員編加啟用碼','This Email is already used by another account. Use a different Email, or clear it and use employee no. plus an activation code')); return; }
  var siteId = document.getElementById('editSite').value;
  var site = SITE_LIST.find(function(s){ return s.id===siteId; });
  var emailChanged = (email.toLowerCase() !== (e.email||'').toLowerCase());
  var siteChanged = (site && site.name !== e.site);
  e.name = name; e.email = email; e.empNo = no;
  e.dept = document.getElementById('editDept').value;
  if (site){ e.site = site.name; e.tz = site.tz; }
  var a = e.ma;
  a.name = e.name; a.email = email; a.employeeNo = no; a.department = e.dept;
  if (a.activationStatus!=='已啟用'){
    a.activationMethod = email ? 'Email 通知' : '啟用碼';
    if (!email && !a.activationCode) a.activationCode = MM.newActivationCode();
    if (emailChanged && a.activationStatus==='已寄通知' && email) a.activationStatus = '未啟用';
  }
  MM.saveMemberData();
  renderEmpTable(); renderActBar();
  closeModal('editModal');
  var extra = '';
  if (emailChanged && a.activationStatus!=='已啟用') extra = T('；Email 已變更，記得重寄啟用通知','; the Email has changed — remember to resend the activation notice');
  else if (emailChanged) extra = T('；Email 已變更，該員工下次請用新 Email 登入','; the Email has changed — this employee should log in with the new Email next time');
  if (siteChanged) extra += T('；時區已改為 ','; time zone changed to ')+e.tz;
  toast(T('已更新「','Updated “')+e.name+T('」的資料','”')+extra);
}

function toast(msg){
  var el = document.getElementById('toastEl');

}
