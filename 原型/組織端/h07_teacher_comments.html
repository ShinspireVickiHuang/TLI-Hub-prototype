<style>
:root{--navy:#1B4E8C;--navy-dark:#123a68;--orange:#E8792B;--teal:#0F9B79;
--g50:#F5F7FA;--g200:#E4E7EC;--g500:#667085;--g900:#101828;}
*{box-sizing:border-box;}
html,body{overflow-x:hidden;}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
background:var(--g50);color:var(--g900);}
a{color:var(--navy);}
.app{display:flex;min-height:100vh;width:100%;background:#fff;}
.sidebar{width:260px;flex-shrink:0;background:#fff;padding:0;display:flex;flex-direction:column;height:100vh;
overflow:hidden;border-right:1px solid var(--g200);position:sticky;top:0;align-self:flex-start;transition:left .2s;}
.sidebar .brand{padding:16px 20px 14px;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:4px;
border-bottom:1px solid var(--g200);margin-bottom:6px;text-decoration:none;color:inherit;cursor:pointer;flex-shrink:0;}
.sidebar .brand-logo{height:28px;width:auto;object-fit:contain;object-position:left center;display:block;}
.sidebar .brand small{display:block;font-weight:400;font-size:12px;color:var(--g500);margin-top:12px;}
.sidebar nav{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 8px 8px;}
.sidebar .sec-label{padding:0 12px;margin:12px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#98A2B3;font-weight:600;}
.sidebar .sec-label:first-child{margin-top:4px;}
.sidebar nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 14px;margin:2px 0;border-radius:8px;
font-size:14px;color:var(--g900);text-decoration:none;}
.sidebar nav a .navicon{flex-shrink:0;color:var(--g500);}
.sidebar nav a:hover{background:var(--g50);}
.sidebar nav a.active{background:#E6EEF8;color:var(--navy);font-weight:600;}
.sidebar nav a.active .navicon{color:var(--navy);}
.sidebar-user{display:block;border-top:1px solid var(--g200);padding:10px 12px;margin:0;flex-shrink:0;position:relative;}
.su-row{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
.su-avatar{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.su-info{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;gap:8px;line-height:1.2;}
.su-name{font-size:14px;font-weight:600;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.su-roletag{font-size:12px;background:#E6EEF8;color:var(--navy);padding:1px 7px;border-radius:8px;white-space:nowrap;flex-shrink:0;}
.su-chevron{color:var(--g500);flex-shrink:0;}
.su-menu{top:auto;bottom:60px;left:10px;right:10px;width:auto;padding:8px;}
.su-menu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.su-menu a:hover{background:var(--g50);}
.main{flex:1;padding:26px 32px 60px;min-width:0;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;
border-bottom:1px solid var(--g200);position:sticky;top:0;background:#fff;z-index:40;margin:-26px -32px 22px;gap:14px;}
.hamburger{display:none;background:none;border:none;font-size:19px;cursor:pointer;color:var(--g900);padding:4px 6px;margin-right:4px;}
.topbar .tb-title{font-size:15px;font-weight:600;color:var(--g900);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .tb-actions{display:flex;align-items:center;gap:14px;position:relative;flex-shrink:0;}
.tb-search{display:flex;align-items:center;gap:6px;background:var(--g50);border:1px solid var(--g200);border-radius:8px;
padding:6px 10px;width:180px;}
.tb-search input{border:none;background:none;outline:none;font-size:12.5px;font-family:inherit;width:100%;color:var(--g900);}
.tb-bellbtn{position:relative;background:none;border:none;cursor:pointer;font-size:17px;padding:4px;line-height:1;}
.tb-dot{position:absolute;top:0;right:0;width:7px;height:7px;background:#C0392B;border-radius:50%;display:none;}
.tb-avatarbtn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;border:none;
cursor:pointer;font-size:13px;font-weight:600;flex-shrink:0;}
.tb-panel{display:none;position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--g200);
border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.16);z-index:50;}
.tb-panel.open{display:block;}
.tb-notifpanel{width:300px;padding:10px;}
.tb-notifpanel .tn-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
padding:4px 6px 8px;border-bottom:1px solid var(--g200);margin-bottom:6px;}
.tb-notifpanel .tn-head a{font-size:11.5px;cursor:pointer;}
.tb-notifitem{padding:8px 6px;border-radius:6px;font-size:12.5px;line-height:1.5;}
.tb-notifitem:hover{background:var(--g50);}
.tb-notifitem.unread{background:#EEF3FA;}
.tb-notifitem .tn-t{color:var(--g500);font-size:11px;margin-top:2px;}
.tb-avatarmenu{width:150px;padding:6px;}
.tb-avatarmenu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.tb-avatarmenu a:hover{background:var(--g50);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:110;}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:16px;flex-wrap:wrap;}
.pagehead h1{font-size:20px;margin:0;}
.pagehead .desc{font-size:12.5px;color:var(--g500);margin-top:5px;line-height:1.6;}
.btn{display:inline-block;background:var(--navy);color:#fff;border:none;padding:8px 14px;
border-radius:6px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit;}
.btn.ghost{background:#fff;border:1px solid var(--g200);color:var(--g900);}
.btn:disabled{background:var(--g200)!important;color:var(--g500)!important;cursor:not-allowed!important;}
.card,.filterband{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
.card h2{font-size:15px;margin:0 0 12px;}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.badge.blue{background:#E7EEF8;color:var(--navy);}
.badge.green{background:#E4F5EE;color:var(--teal);}
.badge.orange{background:#FCE9DA;color:var(--orange);}
.badge.grey{background:var(--g200);color:var(--g500);}
.badge.red{background:#FBE7E7;color:#C0392B;}
.note{font-size:12px;color:#7a5b1f;background:#FFF8EE;border:1px solid #F3DFB8;padding:9px 11px;border-radius:6px;}
.small{font-size:12px;color:var(--g500);}
.hint{font-size:11.5px;color:var(--g500);margin-top:3px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
background:#101828;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:80vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.hidden{display:none!important;}
.orglink{font-size:12px;white-space:nowrap;}
/* ---- 篩選 ---- */
.filterrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.filterrow .ff{min-width:160px;flex:1;}
.filterrow .ff label{display:block;font-size:11.5px;color:var(--g500);margin-bottom:4px;}
.filterrow select,.filterrow input[type=date]{width:100%;padding:7px 10px;border:1px solid var(--g200);border-radius:6px;font-size:13px;font-family:inherit;background:#fff;}
.customrange{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
.customrange .ff{min-width:150px;flex:1;}
.customrange .ff label{display:block;font-size:11.5px;color:var(--g500);margin-bottom:4px;}
.checkrow{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--g900);white-space:nowrap;padding-bottom:7px;}
.periodnote{font-size:12px;color:var(--g500);margin-top:8px;}
/* ---- 員工自動完成（沿用顧問工作台 c04 作法） ---- */
.member-ac{position:relative;}
.member-ac .ac-input-row{position:relative;display:flex;align-items:center;}
.member-ac .ac-input-row input{padding-right:30px;}
.member-ac .ac-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;background:none;color:var(--g500);font-size:16px;line-height:1;cursor:pointer;display:none;border-radius:50%;}
.member-ac .ac-clear:hover{color:var(--g900);background:var(--g50);}
.member-ac .ac-clear.show{display:block;}
.member-ac .ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--g200);border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.14);max-height:280px;overflow-y:auto;z-index:60;display:none;}
.member-ac .ac-list.open{display:block;}
.member-ac .ac-item{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--g50);}
.member-ac .ac-item:last-child{border-bottom:none;}
.member-ac .ac-item:hover,.member-ac .ac-item.active{background:var(--g50);}
.member-ac .ac-item .l1{font-size:13px;font-weight:600;}
.member-ac .ac-item .l2{font-size:11.5px;color:var(--g500);margin-top:2px;}
.member-ac .ac-empty{padding:12px;font-size:12.5px;color:var(--g500);}
/* ---- 評語清單 ---- */
.tcrow{display:flex;align-items:flex-start;gap:14px;padding:12px 4px;border-bottom:1px dashed var(--g200);flex-wrap:wrap;}
.tcrow:last-child{border-bottom:none;}
.tcrow .tc-date{font-size:12px;color:var(--g500);width:88px;flex-shrink:0;}
.tcrow .tc-who{flex-shrink:0;min-width:150px;}
.tcrow .tc-who .tc-name{font-size:13.5px;font-weight:600;}
.tcrow .tc-who .tc-sub{font-size:11.5px;color:var(--g500);}
.tcrow .tc-teacher{font-size:12px;color:var(--g500);width:90px;flex-shrink:0;}
.tcrow .tc-cat{flex-shrink:0;}
.tcrow .tc-text{flex:1;min-width:200px;font-size:13px;line-height:1.6;}
.tcrow .tc-sensitive{width:100%;margin-top:4px;}
.emptylist{padding:20px 4px;font-size:12.5px;color:var(--g500);text-align:center;}
@media (max-width:1023px){
.hamburger{display:inline-flex;}
.sidebar{position:fixed;left:-260px;top:0;height:100vh;width:260px;z-index:120;}
.sidebar.open{left:0;}
.sidebar-backdrop.open{display:block;}
.app{width:100%;}
.main{padding:16px 16px 40px;}
.topbar{padding:0 16px;margin:-16px -16px 18px;}
.tb-search{display:none;}
.tcrow{flex-direction:column;gap:4px;}
.tcrow .tc-date,.tcrow .tc-who,.tcrow .tc-teacher{width:auto;}
}

</style>
</head>

<div class="ff"><label data-i18n="h03.lblSite">廠區</label><select id="fSite" onchange="onFilterChange()"><option value="" data-i18n="h01.optAllSite">全部廠區</option></select></div>

</div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px">

</div>

<button class="btn ghost" onclick="showMoreComments()"><span data-i18n="h07.loadMorePrefix">載入更多（還有</span> <span id="commentMoreCount">0</span> <span data-i18n="h07.loadMoreSuffix">筆）</span></button>
</div>

<script src="../assets/_i18n.js"></script>
<script>
function seededRand(seed){ var x=Math.sin(seed*9301+49297)*233280; return x-Math.floor(x); }
function addDays(baseStr, days){ var d=new Date(baseStr+'T00:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function T(zh, en){ return window.TLI_I18N ? TLI_I18N.t(zh, en) : zh; }
var CAT_EN = {'學習態度':'Attitude','進度':'Progress','出席':'Attendance','建議':'Suggestion'};
function catText(zh){ return T(zh, CAT_EN[zh]||zh); }

/* ===== 員工示範資料（與 h01、h02、h03 共用同一組產生邏輯，確保跨頁資料一致） ===== */
var ORG_SITES = [
  {id:'tw', name:'台灣總部', tz:'UTC+8（台灣標準時間）'},
  {id:'us', name:'美國廠區', tz:'UTC-7（美國西部時間）'},
  {id:'jp', name:'日本廠區', tz:'UTC+9（日本標準時間）'}
];
var ORG_DEPTS = ['業務部','研發部','廠務部','人資部','製造部'];
var TW_NAMES = ['王建宏','林佳蓉','陳志明','張淑芬','李俊傑','黃詩涵','吳承翰','劉美玲','蔡文彬','許雅婷','郭柏翰','楊佩珊'];
var US_NAMES = ['John Miller','Emily Tran','David Park','Rachel Kim','Michael Brown','Sophia Garcia','Kevin Lee','Laura Chen','Daniel Wright','Olivia Martinez','Brian Wu','Natalie Scott'];
var JP_NAMES = ['田中 涼子','佐藤 健一','鈴木 美咲','高橋 大輔','伊藤 由美','渡辺 翔太','中村 直樹','小林 愛','加藤 拓也','山本 麻衣','斉藤 亮','松本 恵'];
var NAME_POOLS = [TW_NAMES, US_NAMES, JP_NAMES];
function makeEmployee(i){
  var siteIdx = i % ORG_SITES.length;
  var site = ORG_SITES[siteIdx];
  var pool = NAME_POOLS[siteIdx];
  var name = pool[Math.floor(i/ORG_SITES.length) % pool.length];
  var dept = ORG_DEPTS[i % ORG_DEPTS.length];
  var emailName = name.toLowerCase().replace(/[^a-z]/g,'').slice(0,10);
  var email = (emailName ? emailName : 'emp'+i) + '@example-semi.com';
  return { id:'emp'+i, name:name, email:email, dept:dept, site:site.name };
}
var EMP_COUNT = 26;
var EMPLOYEES = []; for (var ii=0; ii<EMP_COUNT; ii++) EMPLOYEES.push(makeEmployee(ii));

/* ===== 篩選下拉：部門／廠區 ===== */
(function initFilterOptions(){
  var dsel = document.getElementById('fDept');
  ORG_DEPTS.forEach(function(d){ var o=document.createElement('option'); o.value=d; o.textContent=d; dsel.appendChild(o); });
  var ssel = document.getElementById('fSite');
  ORG_SITES.forEach(function(s){ var o=document.createElement('option'); o.value=s.name; o.textContent=s.name; ssel.appendChild(o); });
})();

/* ===== 期間篩選 ===== */
var PERIOD_LABELS = {
  thismonth:{range:'2026/08/01－2026/08/28'},
  lastmonth:{range:'2026/07/01－2026/07/31'},
  w8:{rangeZh:'近 8 週（2026/07/14－2026/09/08）', rangeEn:'Last 8 weeks (2026/07/14－2026/09/08)'},
  m3:{rangeZh:'近 3 個月（2026/06/09－2026/09/08）', rangeEn:'Last 3 months (2026/06/09－2026/09/08)'},
  term:{rangeZh:'本期（2026/07/01－2026/12/31）', rangeEn:'This term (2026/07/01－2026/12/31)'}
};
function periodLabelText(d){
  if (d.rangeZh) return T('統計區間：','Reporting period: ')+T(d.rangeZh, d.rangeEn);
  var txt = T('統計區間：','Reporting period: ')+d.range;
  if (d.custom) txt += T('（自訂）',' (Custom)');
  return txt;
}
function onPeriodChange(){
  var key = document.getElementById('fPeriod').value;
  document.getElementById('customRangeWrap').classList.toggle('hidden', key!=='custom');
  onFilterChange();
}
function toggleMoreFilters(){
  document.getElementById('moreFiltersWrap').classList.toggle('hidden');
}
function curPeriodNote(){
  var key = document.getElementById('fPeriod').value;
  if (key==='custom'){
    var start = document.getElementById('customStart').value || '2026-08-01';
    var end = document.getElementById('customEnd').value || '2026-08-28';
    return periodLabelText({range:start+'－'+end, custom:true});
  }
  return periodLabelText(PERIOD_LABELS[key]);
}

/* ===== 老師評語示範資料（HR 可見層：分類＋50 字內短文；此頁不顯示學員可見層與老師內部觀察備註） ===== */
var TEACHERS = ['林俊傑老師','陳美惠老師','Michael Turner 老師','王淑芬老師','張惠玲老師'];
var CAT_TEXT = {
  '學習態度': [
    '課前預習確實，課堂主動提問，學習態度積極。',
    '偶有缺交作業，提醒後能補交，仍需加強自主性。',
    '對課程投入度高，會主動整理筆記並複習。'
  ],
  '進度': [
    '單元進度落後，建議增加課後練習時間。',
    '本期進度穩定，句型運用逐漸熟練。',
    '進度超前，可考慮銜接下一階段教材。'
  ],
  '出席': [
    '出席穩定，僅因公務出差請假一次。',
    '近期出席不穩，建議留意排課時段是否合適。',
    '準時出席，課堂參與度良好。'
  ],
  '建議': [
    '建議加強口說練習，聽力與閱讀表現已達標。',
    '建議搭配線上練習題，鞏固文法基礎。',
    '建議安排小組會話課，提升實際應用能力。'
  ]
};
var SENSITIVE_TEXT = {
  '出席': '近期因家人健康因素請假增加，仍努力跟上進度。',
  '學習態度': '提到近期身體不適影響專注度，建議留意出席狀況。',
  '進度': '因申請長期病假，進度暫緩，回歸後將協助安排補課。',
  '建議': '建議留意近期因家庭因素影響出席的狀況，可協助彈性調整排課。'
};
var CATS = ['學習態度','進度','出席','建議'];
function seededPick(arr, seed){ return arr[Math.floor(seededRand(seed)*arr.length)]; }
function makeComments(){
  var list = [];
  var n = 0;
  for (var i=0;i<EMP_COUNT;i++){
    var e = EMPLOYEES[i];
    var commentsForEmp = 1 + Math.floor(seededRand(i*83+5)*2); /* 每位員工 1-2 筆評語，合計可達 30+ 筆 */
    for (var k=0;k<commentsForEmp;k++){
      var seed = i*97 + k*13 + 31;
      var cat = CATS[Math.floor(seededRand(seed)*CATS.length)];
      var isSensitive = (n===4 || n===17); /* 固定安排 2 筆帶敏感詞提醒，供驗收與展示 */
      var text = isSensitive && SENSITIVE_TEXT[cat] ? SENSITIVE_TEXT[cat] : seededPick(CAT_TEXT[cat], seed+1);
      var teacher = TEACHERS[Math.floor(seededRand(seed+2)*TEACHERS.length)];
      var date = addDays('2026-09-08', -Math.floor(seededRand(seed+3)*45));
      list.push({
        id:'tc'+n, empId:e.id, name:e.name, email:e.email, dept:e.dept, site:e.site,
        teacher:teacher, cat:cat, text:text, date:date, sensitive:isSensitive
      });
      n++;
    }
  }
  list.sort(function(a,b){ return b.date.localeCompare(a.date); });
  return list;
}
var COMMENTS = makeComments();

/* ===== 員工自動完成（沿用顧問工作台 c04_new_order.html 的作法：單一欄位輸入姓名或 Email，最多列 8 筆候選）===== */
var empAcSelectedId = '';
var __empAcResults = [];
var __empAcActiveIndex = -1;
function empAcMatch(e,q){
  var n=(e.name||'').toLowerCase(), em=(e.email||'').toLowerCase();
  return n.indexOf(q)>-1 || em.indexOf(q)>-1;
}
function onEmpAcInput(v){
  __empAcActiveIndex = -1;
  var q=(v||'').trim().toLowerCase();
  var list=document.getElementById('empAcList');
  if (!q){ __empAcResults=[]; list.classList.remove('open'); list.innerHTML=''; document.getElementById('empAcInput').setAttribute('aria-expanded','false'); return; }
  __empAcResults = EMPLOYEES.filter(function(e){ return empAcMatch(e,q); }).slice(0,8);
  renderEmpAcList();
}
function onEmpAcFocus(){
  var v = document.getElementById('empAcInput').value.trim();
  if (v) onEmpAcInput(v);
}
function renderEmpAcList(){
  var list=document.getElementById('empAcList');
  var input=document.getElementById('empAcInput');
  if (!__empAcResults.length){
    var q=input.value.trim();
    if (!q){ list.classList.remove('open'); list.innerHTML=''; input.setAttribute('aria-expanded','false'); return; }
    list.innerHTML = '<div class="ac-empty">'+T('查無員工','No employees found')+'</div>';
    list.classList.add('open');
    input.setAttribute('aria-expanded','true');
    return;
  }
  list.innerHTML = __empAcResults.map(function(e,i){
    return '<div class="ac-item'+(i===__empAcActiveIndex?' active':'')+'" onmousedown="event.preventDefault();selectEmpAc('+i+')">'+
      '<div class="l1">'+e.name+'</div><div class="l2">'+e.email+'　'+e.dept+'</div></div>';
  }).join('');
  list.classList.add('open');
  input.setAttribute('aria-expanded','true');
}
function onEmpAcKeydown(ev){
  var list=document.getElementById('empAcList');
  if (!list.classList.contains('open') || !__empAcResults.length){
    if (ev.key==='Escape') list.classList.remove('open');
    return;
  }
  if (ev.key==='ArrowDown'){ ev.preventDefault(); __empAcActiveIndex=Math.min(__empAcActiveIndex+1, __empAcResults.length-1); renderEmpAcList(); }
  else if (ev.key==='ArrowUp'){ ev.preventDefault(); __empAcActiveIndex=Math.max(__empAcActiveIndex-1, 0); renderEmpAcList(); }
  else if (ev.key==='Enter'){ ev.preventDefault(); if (__empAcActiveIndex>-1) selectEmpAc(__empAcActiveIndex); }
  else if (ev.key==='Escape'){ list.classList.remove('open'); }
}
function selectEmpAc(i){
  var e = __empAcResults[i]; if (!e) return;
  empAcSelectedId = e.id;
  document.getElementById('empAcInput').value = e.name+'（'+e.email+'）';
  document.getElementById('empAcList').classList.remove('open');
  document.getElementById('empAcClear').classList.add('show');
  onFilterChange();
}
function clearEmpSelection(){
  empAcSelectedId = '';
  document.getElementById('empAcInput').value = '';
  document.getElementById('empAcClear').classList.remove('show');
  onFilterChange();
  document.getElementById('empAcInput').focus();
}
document.addEventListener('click', function(ev){
  var wrap = document.getElementById('empAcWrap');
  if (wrap && !wrap.contains(ev.target)) document.getElementById('empAcList').classList.remove('open');
});

/* ===== 清單渲染：搜尋條件（期間僅供頁面呈現，示範資料本身不逐期間重算）／部門／廠區／員工／分類／敏感詞 ===== */
var COMMENT_PAGE_SIZE = 10, commentShown = COMMENT_PAGE_SIZE;
function filteredComments(){
  var dept = document.getElementById('fDept').value;
  var site = document.getElementById('fSite').value;
  var cat = document.getElementById('fCat').value;
  var sensOnly = document.getElementById('fSensitive').checked;
  return COMMENTS.filter(function(c){
    if (dept && c.dept!==dept) return false;
    if (site && c.site!==site) return false;
    if (cat && c.cat!==cat) return false;
    if (empAcSelectedId && c.empId!==empAcSelectedId) return false;
    if (sensOnly && !c.sensitive) return false;
    return true;
  });
}
function catBadgeClass(cat){
  return cat==='進度' ? 'badge blue' : cat==='出席' ? 'badge green' : cat==='建議' ? 'badge orange' : 'badge grey';
}
function renderCommentList(){
  document.getElementById('periodNote').textContent = curPeriodNote();
  var full = filteredComments();
  var wrap = document.getElementById('commentList');
  var emptyEl = document.getElementById('commentEmpty');
  var moreWrap = document.getElementById('commentMoreWrap');
  if (!full.length){
    wrap.innerHTML = '';
    emptyEl.classList.remove('hidden');
    moreWrap.classList.add('hidden');
    document.getElementById('commentCountNote').textContent = T('共 0 筆（全部 ','0 (out of ')+COMMENTS.length+T(' 筆）',' total)');
    return;
  }
  emptyEl.classList.add('hidden');
  var list = full.slice(0, commentShown);
  wrap.innerHTML = list.map(function(c){
    return '<div class="tcrow">'+
      '<span class="tc-date">'+c.date+'</span>'+
      '<span class="tc-who"><span class="tc-name">'+c.name+'</span><span class="tc-sub">'+c.dept+'</span></span>'+
      '<span class="tc-teacher">'+c.teacher+'</span>'+
      '<span class="tc-cat"><span class="'+catBadgeClass(c.cat)+'">'+catText(c.cat)+'</span></span>'+
      '<span class="tc-text">'+c.text+'</span>'+
      (c.sensitive ? '<span class="tc-sensitive"><span class="badge red">'+T('含健康／家庭字眼，請留意用詞','Contains health／family-related wording — please review')+'</span></span>' : '')+
      '</div>';
  }).join('');
  var remain = full.length - list.length;
  if (remain>0){ moreWrap.classList.remove('hidden'); document.getElementById('commentMoreCount').textContent = remain; }
  else { moreWrap.classList.add('hidden'); }
  document.getElementById('commentCountNote').textContent = T('共 ','')+full.length+T(' 筆（全部 ',' (out of ')+COMMENTS.length+T(' 筆）',' total)');
}
function showMoreComments(){ commentShown += COMMENT_PAGE_SIZE; renderCommentList(); }
function onFilterChange(){ commentShown = COMMENT_PAGE_SIZE; renderCommentList(); }
function doExportCsv(){ toast(T('已產生 CSV 檔案，欄位包含日期、員工、部門、老師、分類、評語內容，請至下載中心取得','CSV file generated with fields for date, employee, department, teacher, category, and comment text; get it from the Download Center')); }

/* ===== 初始化 ===== */
renderCommentList();

/* ===== 共用：側欄／頂欄／通知／登出／toast ===== */
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarBackdrop').classList.toggle('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarBackdrop').classList.remove('open'); }
function toggleSuMenu(ev){ ev.stopPropagation(); closePanel('notifPanel'); closePanel('avatarMenu'); document.getElementById('suMenu').classList.toggle('open'); }
function closePanel(id){ var el=document.getElementById(id); if (el) el.classList.remove('open'); }
document.addEventListener('click', function(){ closePanel('suMenu'); closePanel('notifPanel'); closePanel('avatarMenu'); });
var NOTIFS = [
  {tzh:'王大明尚未完成本月「廠務部」出勤率確認', ten:'Wang Daming has not completed this month\'s attendance confirmation for the "Manufacturing Dept."', time:'1 小時前', timeEn:'1 hour ago', unread:true},
  {tzh:'「資料串接」申請已受理，TLI 顧問將於 3 個工作日內與您聯繫', ten:'Your "Data Integration" request has been received; a TLI advisor will contact you within 3 business days', time:'今天 08:40', timeEn:'Today 08:40', unread:true},
  {tzh:'系統已產生上月學習報告 PDF，可至「學習報告」下載', ten:'Last month\'s learning report PDF has been generated; download it from "Learning Reports"', time:'昨天', timeEn:'Yesterday', unread:false}
];
function renderNotifPanel(){
  var panel = document.getElementById('notifPanel'); if (!panel) return;
  var unread = NOTIFS.filter(function(n){return n.unread;}).length;
  var dot = document.getElementById('tbDot'); if (dot) dot.style.display = unread ? 'block' : 'none';
  panel.innerHTML = '<div class="tn-head"><span>'+T('通知（','Notifications (')+unread+T(' 則未讀）',' unread)')+'</span><a href="javascript:void(0)" onclick="markAllRead(event)">'+T('全部標為已讀','Mark All as Read')+'</a></div>'+
    NOTIFS.map(function(n){ return '<div class="tb-notifitem'+(n.unread?' unread':'')+'">'+T(n.tzh,n.ten)+'<div class="tn-t">'+T(n.time,n.timeEn)+'</div></div>'; }).join('');
}
function markAllRead(ev){ if (ev) ev.stopPropagation(); NOTIFS.forEach(function(n){n.unread=false;}); renderNotifPanel(); }
function toggleNotif(ev){ ev.stopPropagation(); closePanel('avatarMenu'); closePanel('suMenu'); var p=document.getElementById('notifPanel'); p.classList.toggle('open'); if (p.classList.contains('open')) renderNotifPanel(); }
function toggleAvatarMenu(ev){ ev.stopPropagation(); closePanel('notifPanel'); closePanel('suMenu'); document.getElementById('avatarMenu').classList.toggle('open'); }
function doLogout(){ location.href = '../公開網站/p07_login_register.html'; }
function toast(msg){
  var el = document.getElementById('toastEl');
  if (!el){ el=document.createElement('div'); el.id='toastEl'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2400);
}
if (window.TLI_I18N){
  TLI_I18N.onRefresh(renderNotifPanel);
  TLI_I18N.onRefresh(renderCommentList);
  TLI_I18N.init();
}
renderNotifPanel();
</script>
